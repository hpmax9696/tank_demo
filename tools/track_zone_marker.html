<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金福园小学 — 跑道区域打点工具</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: monospace;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #canvas-wrap {
        flex: 1;
        position: relative;
        cursor: crosshair;
      }
      canvas {
        display: block;
      }
      #panel {
        width: 300px;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h2 {
        font-size: 16px;
        color: #e94560;
        margin-bottom: 4px;
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      .btn-red {
        background: #e94560;
        color: #fff;
      }
      .btn-green {
        background: #1a8a4a;
        color: #fff;
      }
      .btn-gray {
        background: #333;
        color: #aaa;
      }
      #point-list {
        max-height: 260px;
        overflow-y: auto;
        font-size: 12px;
      }
      #point-list .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #222;
      }
      #point-list .row:hover {
        background: #0f3460;
      }
      #point-list .name {
        color: #e94560;
        font-weight: bold;
        width: 20px;
      }
      #point-list .coord {
        color: #aaa;
        flex: 1;
      }
      #point-list .curve {
        color: #f0a500;
        font-size: 10px;
      }
      #point-list .del {
        color: #e94560;
        cursor: pointer;
        padding: 1px 6px;
      }
      #output {
        width: 100%;
        height: 140px;
        background: #0a0a1a;
        color: #0f0;
        border: 1px solid #333;
        padding: 8px;
        font-size: 11px;
        resize: vertical;
        font-family: monospace;
      }
      .legend {
        font-size: 11px;
        color: #888;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        vertical-align: middle;
        margin-right: 4px;
        border-radius: 2px;
      }
      .hint {
        font-size: 11px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="canvas-wrap"><canvas id="c"></canvas></div>
    <div id="panel">
      <h2>塑胶跑道边界打点</h2>
      <div class="legend">
        <span style="background: #666"></span>校园围墙
        <span style="background: #3a5a3a"></span>建筑物
        <span style="background: #4a8c3f"></span>运动场草地
        <span style="background: #e94560"></span>边界点
        <span style="background: #f0a500"></span>曲线控制点 ⊙
      </div>
      <div class="hint">
        🖱️ 左键 = 添加点<br />
        🖱️ 左键拖拽点 = 移动点<br />
        🖱️ 右键点 = 删除该点<br />
        🖱️ 右键线段 = 切换曲线/直线<br />
        🖱️ 左键拖拽 ⊙ = 调曲线弧度<br />
        🔑 Ctrl+Z = 撤销
      </div>
      <button class="btn btn-red" onclick="undoLast()">↩ 撤销最后一点</button>
      <button class="btn btn-gray" onclick="clearAll()">🗑 清空全部</button>
      <div id="point-list"></div>
      <button class="btn btn-green" onclick="exportJSON()">📋 导出 JSON</button>
      <textarea id="output" readonly placeholder="点击导出后出现 JSON..."></textarea>
      <div class="hint" style="margin-top: 8px">
        📐 右键线段变曲线 → 出现橙色 ⊙ 控制点 → 拖拽 ⊙ 调整弧度<br />
        📐 右键曲线线段 → 变回直线
      </div>
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const POINT_R = 8,
        CP_R = 6;

      let campusData = null;
      let points = []; // [{x, z}]
      let curveControls = {}; // { "A-B": {cx, cz} } — 曲线控制点世界坐标
      let dragIdx = -1; // 正在拖拽的点索引
      let dragCP = null; // 正在拖拽的控制点 key "A-B"
      let hoverIdx = -1;
      let hoverSeg = null; // [idxA, idxB]
      let hoverCP = null; // "A-B" 悬停的控制点
      let viewX = 0,
        viewZ = 0,
        scale = 1;

      function nameOf(i) {
        return String.fromCharCode(65 + i);
      }
      function segKey(i, j) {
        return nameOf(i) + '-' + nameOf(j);
      }

      async function loadCampus() {
        try {
          const r = await fetch('../maps/campus.map.json');
          campusData = await r.json();
          fitView();
          draw();
        } catch (e) {
          alert('加载失败: ' + e.message);
        }
      }

      function fitView() {
        const b = campusData.obstacles.boundary;
        let minX = Infinity,
          maxX = -Infinity,
          minZ = Infinity,
          maxZ = -Infinity;
        for (const p of b) {
          if (p[0] < minX) minX = p[0];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] < minZ) minZ = p[1];
          if (p[1] > maxZ) maxZ = p[1];
        }
        const pad = 10,
          w = maxX - minX + pad * 2,
          h = maxZ - minZ + pad * 2;
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        scale = Math.min(cw / w, ch / h);
        viewX = -(minX - pad) * scale;
        viewZ = -(minZ - pad) * scale;
        canvas.width = cw * devicePixelRatio;
        canvas.height = ch * devicePixelRatio;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function w2c(wx, wz) {
        return { x: viewX + wx * scale, y: viewZ + wz * scale };
      }
      function c2w(cx, cy) {
        return { x: (cx - viewX) / scale, z: (cy - viewZ) / scale };
      }

      function drawPoly(poly, fill, stroke, lw) {
        if (!poly || poly.length < 2) return;
        ctx.beginPath();
        const p0 = w2c(poly[0][0], poly[0][1]);
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < poly.length; i++) {
          const p = w2c(poly[i][0], poly[i][1]);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }

      function findNearPoint(cx, cy) {
        for (let i = points.length - 1; i >= 0; i--) {
          const p = w2c(points[i].x, points[i].z);
          if (Math.hypot(cx - p.x, cy - p.y) < POINT_R + 6) return i;
        }
        return -1;
      }

      function findNearSegment(cx, cy) {
        if (points.length < 2) return null;
        const w = c2w(cx, cy);
        for (let i = 0; i < points.length; i++) {
          const j = (i + 1) % points.length,
            a = points[i],
            b = points[j];
          const dx = b.x - a.x,
            dz = b.z - a.z,
            len2 = dx * dx + dz * dz;
          if (len2 < 0.01) continue;
          let t = ((w.x - a.x) * dx + (w.z - a.z) * dz) / len2;
          t = Math.max(0, Math.min(1, t));
          const dist = Math.hypot(w.x - (a.x + t * dx), w.z - (a.z + t * dz));
          if (dist * scale < 12) return [i, j];
        }
        return null;
      }

      function findNearCP(cx, cy) {
        if (!points.length) return null;
        for (let i = 0; i < points.length; i++) {
          const j = (i + 1) % points.length,
            key = segKey(i, j),
            ctrl = curveControls[key];
          if (!ctrl) continue;
          const p = w2c(ctrl.cx, ctrl.cz);
          if (Math.hypot(cx - p.x, cy - p.y) < CP_R + 6) return key;
        }
        return null;
      }

      function defaultCP(i, j) {
        const a = points[i],
          b = points[j];
        const dx = b.x - a.x,
          dz = b.z - a.z;
        const len = Math.sqrt(dx * dx + dz * dz) || 1;
        return {
          cx: (a.x + b.x) / 2 - (dz / len) * len * 0.25,
          cz: (a.z + b.z) / 2 + (dx / len) * len * 0.25,
        };
      }

      function draw() {
        const W = canvas.parentElement.clientWidth,
          H = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, W, H);
        if (!campusData) {
          ctx.fillStyle = '#888';
          ctx.font = '20px monospace';
          ctx.fillText('加载中...', 30, 50);
          return;
        }

        // 地砖背景
        ctx.fillStyle = '#d8d4cc';
        ctx.fillRect(0, 0, W, H);
        // 边界
        drawPoly(campusData.obstacles.boundary, 'rgba(200,200,200,0.4)', '#999', 2.5);
        // 建筑
        const blds = campusData.obstacles.footprintBuildings || [];
        for (const b of blds) drawPoly(b.footprint, '#3a5a3a', '#2a4a2a', 1.5);
        // 运动场草地
        const gnds = campusData.obstacles.grounds || [];
        for (const g of gnds) drawPoly(g.footprint, '#4a8c3f', '#3a7c2f', 1);
        // 围墙
        drawPoly(campusData.obstacles.boundary, null, '#666', 3);

        // 连线+曲线
        if (points.length >= 2) {
          for (let i = 0; i < points.length; i++) {
            const j = (i + 1) % points.length,
              key = segKey(i, j),
              ctrl = curveControls[key];
            const a = w2c(points[i].x, points[i].z),
              b = w2c(points[j].x, points[j].z);
            const isCurve = !!ctrl;
            const isSegHover = hoverSeg && hoverSeg[0] === i && hoverSeg[1] === j;

            ctx.beginPath();
            if (isCurve) {
              const cp = w2c(ctrl.cx, ctrl.cz);
              ctx.moveTo(a.x, a.y);
              ctx.quadraticCurveTo(cp.x, cp.y, b.x, b.y);
            } else {
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
            }
            ctx.strokeStyle = isSegHover ? '#ff6680' : isCurve ? '#f0a500' : '#e94560';
            ctx.lineWidth = 3;
            ctx.setLineDash(isCurve ? [8, 4] : []);
            ctx.stroke();
            ctx.setLineDash([]);

            // 曲线控制手柄
            if (isCurve) {
              const cp = w2c(ctrl.cx, ctrl.cz);
              const isCPActive = dragCP === key || hoverCP === key;
              // 辅助线
              ctx.strokeStyle = 'rgba(240,165,0,0.35)';
              ctx.lineWidth = 1;
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(cp.x, cp.y);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(b.x, b.y);
              ctx.lineTo(cp.x, cp.y);
              ctx.stroke();
              ctx.setLineDash([]);
              // 手柄球
              const rr = isCPActive ? CP_R + 3 : CP_R;
              ctx.beginPath();
              ctx.arc(cp.x, cp.y, rr, 0, Math.PI * 2);
              ctx.fillStyle = isCPActive ? '#ffa000' : '#f0a500';
              ctx.fill();
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2;
              ctx.stroke();
              ctx.fillStyle = '#000';
              ctx.font = 'bold 9px monospace';
              ctx.textAlign = 'center';
              ctx.fillText('⊙', cp.x, cp.y + 4);
            }
          }
        }

        // 边界点
        for (let i = 0; i < points.length; i++) {
          const p = w2c(points[i].x, points[i].z);
          const isH = i === hoverIdx,
            isD = i === dragIdx;
          const r = isD ? POINT_R + 4 : isH ? POINT_R + 2 : POINT_R;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = isD ? '#ff2040' : isH ? '#ff5570' : '#e94560';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(nameOf(i), p.x, p.y - r - 4);
        }
      }

      // ============= 交互 =============
      canvas.addEventListener('mousedown', (e) => {
        if (!campusData) return;
        const rect = canvas.getBoundingClientRect(),
          cx = e.clientX - rect.left,
          cy = e.clientY - rect.top;

        if (e.button === 2) {
          // 右键
          // 右键线段 → 切换曲线
          const seg = findNearSegment(cx, cy);
          if (seg) {
            const key = segKey(seg[0], seg[1]);
            if (curveControls[key]) {
              delete curveControls[key];
            } else {
              curveControls[key] = defaultCP(seg[0], seg[1]);
            }
            updateList();
            draw();
            return;
          }
          // 右键点 → 删除
          const idx = findNearPoint(cx, cy);
          if (idx >= 0) {
            delPoint(idx);
            return;
          }
          return;
        }

        // 左键 — 检查控制点
        const cpKey = findNearCP(cx, cy);
        if (cpKey) {
          dragCP = cpKey;
          canvas.style.cursor = 'grabbing';
          return;
        }

        // 左键 — 检查边界点
        const idx2 = findNearPoint(cx, cy);
        if (idx2 >= 0) {
          dragIdx = idx2;
          canvas.style.cursor = 'grabbing';
          return;
        }

        // 左键 — 添加点
        const w = c2w(cx, cy);
        points.push({ x: w.x, z: w.z });
        updateList();
        draw();
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!campusData) return;
        const rect = canvas.getBoundingClientRect(),
          cx = e.clientX - rect.left,
          cy = e.clientY - rect.top;

        if (dragIdx >= 0) {
          const w = c2w(cx, cy);
          points[dragIdx].x = w.x;
          points[dragIdx].z = w.z;
          updateList();
          draw();
          return;
        }
        if (dragCP) {
          const w = c2w(cx, cy);
          curveControls[dragCP].cx = w.x;
          curveControls[dragCP].cz = w.z;
          updateList();
          draw();
          return;
        }

        hoverIdx = findNearPoint(cx, cy);
        hoverCP = hoverIdx < 0 ? findNearCP(cx, cy) : null;
        hoverSeg = hoverIdx < 0 && !hoverCP ? findNearSegment(cx, cy) : null;
        canvas.style.cursor = hoverIdx >= 0 || hoverCP ? 'grab' : 'crosshair';
        draw();
      });

      canvas.addEventListener('mouseup', () => {
        dragIdx = -1;
        dragCP = null;
        canvas.style.cursor = 'crosshair';
        draw();
      });
      canvas.addEventListener('mouseleave', () => {
        dragIdx = -1;
        dragCP = null;
        hoverIdx = -1;
        hoverCP = null;
        hoverSeg = null;
        canvas.style.cursor = 'crosshair';
        draw();
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'z') {
          e.preventDefault();
          undoLast();
        }
      });

      function undoLast() {
        if (points.length > 0) {
          points.pop();
          updateList();
          draw();
        }
      }
      function clearAll() {
        points = [];
        curveControls = {};
        updateList();
        draw();
      }

      function delPoint(i) {
        points.splice(i, 1);
        const nc = {};
        for (const [k, v] of Object.entries(curveControls)) {
          const [a, b] = k.split('-');
          const ai = a.charCodeAt(0) - 65,
            bi = b.charCodeAt(0) - 65;
          if (ai < i && bi < i) nc[nameOf(ai) + '-' + nameOf(bi)] = v;
          else if (ai > i && bi > i) nc[nameOf(ai - 1) + '-' + nameOf(bi - 1)] = v;
        }
        curveControls = nc;
        updateList();
        draw();
      }

      function updateList() {
        const el = document.getElementById('point-list');
        let h = '';
        for (let i = 0; i < points.length; i++) {
          const j = (i + 1) % points.length,
            key = segKey(i, j),
            ctrl = curveControls[key];
          h += '<div class="row"><span class="name">' + nameOf(i) + '</span>';
          h +=
            '<span class="coord">(' +
            points[i].x.toFixed(1) +
            ', ' +
            points[i].z.toFixed(1) +
            ')</span>';
          if (ctrl)
            h +=
              '<span class="curve">🔵→' +
              nameOf(j) +
              ' cp(' +
              ctrl.cx.toFixed(1) +
              ',' +
              ctrl.cz.toFixed(1) +
              ')</span>';
          h += '<span class="del" onclick="delPoint(' + i + ')">✕</span></div>';
        }
        el.innerHTML = h || '<span style="color:#666;">点击地图添加边界点...</span>';
      }

      function exportJSON() {
        if (points.length < 3) {
          alert('至少需要3个点');
          return;
        }
        const out = {
          description: '金福园小学塑胶跑道边界',
          points: points.map((p, i) => ({
            name: nameOf(i),
            x: +p.x.toFixed(2),
            z: +p.z.toFixed(2),
          })),
          curves: Object.entries(curveControls).map(([k, v]) => ({
            seg: k,
            cx: +v.cx.toFixed(2),
            cz: +v.cz.toFixed(2),
          })),
        };
        const json = JSON.stringify(out, null, 2);
        document.getElementById('output').value = json;
        navigator.clipboard.writeText(json).then(() => {
          const btn = document.querySelector('.btn-green');
          btn.textContent = '✅ 已复制到剪贴板';
          setTimeout(() => (btn.textContent = '📋 导出 JSON'), 2000);
        });
      }

      window.addEventListener('resize', () => {
        if (campusData) {
          fitView();
          draw();
        }
      });
      loadCampus();
    </script>
  </body>
</html>
