<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>建筑边缘标记 — 外廊(红) / 空调(蓝)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: monospace;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #cwrap {
        flex: 1;
        position: relative;
        cursor: pointer;
      }
      canvas {
        display: block;
      }
      #panel {
        width: 300px;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h2 {
        font-size: 15px;
      }
      .btn {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
      }
      .btn-red {
        background: #e94560;
        color: #fff;
      }
      .btn-blue {
        background: #1565c0;
        color: #fff;
      }
      .btn-green {
        background: #1a8a4a;
        color: #fff;
      }
      .btn-gray {
        background: #444;
        color: #aaa;
      }
      .mode-indicator {
        padding: 8px 12px;
        border-radius: 4px;
        font-weight: bold;
        text-align: center;
      }
      #output {
        width: 100%;
        height: 160px;
        background: #0a0a1a;
        color: #0f0;
        border: 1px solid #333;
        padding: 8px;
        font-size: 11px;
        resize: vertical;
        font-family: monospace;
      }
      .legend {
        font-size: 11px;
        color: #888;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        vertical-align: middle;
        margin-right: 4px;
        border-radius: 2px;
      }
      .hint {
        font-size: 11px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="cwrap"><canvas id="c"></canvas></div>
    <div id="panel">
      <h2>🏫 建筑边缘标记</h2>
      <div class="legend">
        <span style="background: #3a5a3a"></span>建筑物
        <span style="background: #e94560"></span>外廊(红线)
        <span style="background: #1565c0"></span>空调(蓝线)
        <span style="background: #666"></span>未标记
      </div>
      <div class="mode-indicator" id="mode-ind" style="background: #e94560">🔴 当前模式: 外廊</div>
      <div class="hint">
        🖱️ 点击线段 = 标记为当前模式<br />
        🖱️ 再次点击 = 取消标记<br />
        🔴 R键 = 切换到外廊模式<br />
        🔵 B键 = 切换到空调模式<br />
        🗑️ C键 = 清除所有标记
      </div>
      <button class="btn btn-red" onclick="setMode('corridor')">🔴 外廊模式</button>
      <button class="btn btn-blue" onclick="setMode('ac')">🔵 空调模式</button>
      <button class="btn btn-green" onclick="toggleNameMode()">🏷 命名模式(N)</button>
      <button class="btn btn-gray" onclick="clearMarks()">🗑 清除全部标记</button>
      <button class="btn btn-green" onclick="saveNames()" style="background: #0d7a3a">
        💾 保存命名到地图
      </button>
      <button class="btn btn-green" onclick="saveEdgeMarks()" style="background: #0d7a3a">
        💾 保存标记到地图
      </button>
      <button class="btn btn-green" onclick="exportJSON()">📋 导出 JSON</button>
      <textarea id="output" readonly placeholder="标记完成后点击导出..."></textarea>
    </div>
    <script>
      const canvas = document.getElementById('c'),
        ctx = canvas.getContext('2d');
      let campusData = null,
        mcx = 0,
        mcz = 0,
        ccx = 0,
        ccy = 0,
        scale = 1;
      let mode = 'corridor'; // 'corridor'|'ac'
      let nameMode = false; // 命名模式开关
      let marks = {}; // { "bldIdx-edgeIdx": "corridor"|"ac" }
      let hoveredKey = null;

      function bldEdgeKey(bi, ei) {
        return bi + '-' + ei;
      }

      async function load() {
        try {
          const r = await fetch('../maps/campus.map.json');
          campusData = await r.json();
          // 回填已有 edgeMarks
          const _blds = campusData.obstacles.footprintBuildings || [];
          for (let _bi = 0; _bi < _blds.length; _bi++) {
            const _em = _blds[_bi].edgeMarks || [];
            for (const _m of _em) {
              if (typeof _m.ei === 'number' && (_m.type === 'corridor' || _m.type === 'ac')) {
                marks[bldEdgeKey(_bi, _m.ei)] = _m.type;
              }
            }
          }
          fitView();
          draw();
        } catch (e) {
          alert('加载失败: ' + e.message);
        }
      }
      function fitView() {
        const b = campusData.obstacles.boundary;
        let mx = Infinity,
          Mx = -Infinity,
          mz = Infinity,
          Mz = -Infinity;
        for (const p of b) {
          if (p[0] < mx) mx = p[0];
          if (p[0] > Mx) Mx = p[0];
          if (p[1] < mz) mz = p[1];
          if (p[1] > Mz) Mz = p[1];
        }
        const pad = 10,
          w = Mx - mx + pad * 2,
          h = Mz - mz + pad * 2;
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        scale = Math.min(cw / w, ch / h);
        mcx = (mx + Mx) / 2;
        mcz = (mz + Mz) / 2;
        ccx = cw / 2;
        ccy = ch / 2;
        canvas.width = cw * devicePixelRatio;
        canvas.height = ch * devicePixelRatio;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      function w2c(wx, wz) {
        return { x: ccx - (wx - mcx) * scale, y: ccy - (wz - mcz) * scale };
      }
      function c2w(cx, cy) {
        return { x: mcx - (cx - ccx) / scale, z: mcz - (cy - ccy) / scale };
      }

      function drawPoly(poly, fill, stroke, lw) {
        if (!poly || poly.length < 2) return;
        ctx.beginPath();
        const p0 = w2c(poly[0][0], poly[0][1]);
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < poly.length; i++) {
          const p = w2c(poly[i][0], poly[i][1]);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }

      function draw() {
        const W = canvas.parentElement.clientWidth,
          H = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, W, H);
        if (!campusData) return;
        ctx.fillStyle = '#d8d4cc';
        ctx.fillRect(0, 0, W, H);
        // 校园边界
        drawPoly(campusData.obstacles.boundary, 'rgba(200,200,200,0.4)', '#999', 2.5);
        // 运动场
        for (const g of campusData.obstacles.grounds || [])
          drawPoly(g.footprint, '#4a8c3f', '#3a7c2f', 1);
        // 跑道
        drawPoly(campusData.obstacles.boundary, null, '#666', 3);

        // 建筑 + 边缘线
        const blds = campusData.obstacles.footprintBuildings || [];
        for (let bi = 0; bi < blds.length; bi++) {
          const b = blds[bi];
          if (!b.footprint || b.footprint.length < 3) continue;
          // 建筑面
          drawPoly(b.footprint, '#3a5a3a', '#2a4a2a', 1.5);
          const fp = b.footprint;
          for (let ei = 0; ei < fp.length; ei++) {
            const a = fp[ei],
              b2 = fp[(ei + 1) % fp.length];
            const dx = b2[0] - a[0],
              dz = b2[1] - a[1];
            const len = Math.sqrt(dx * dx + dz * dz);
            if (len < 1) continue;
            const ca = w2c(a[0], a[1]),
              cb = w2c(b2[0], b2[1]);
            const key = bldEdgeKey(bi, ei);
            const mk = marks[key];
            const isHover = hoveredKey === key;
            let color = '#888',
              lw = 3;
            if (mk === 'corridor') {
              color = '#e94560';
              lw = 5;
            } else if (mk === 'ac') {
              color = '#1565c0';
              lw = 5;
            }
            if (isHover) {
              color = '#fff';
              lw = 7;
            }

            // 画外侧偏移线
            const ux = dx / len,
              uz = dz / len,
              nx = -uz,
              nz = ux;
            const off = isHover ? 8 : 5;
            const aox = ca.x + nx * off,
              aoz = ca.y + nz * off;
            const box = cb.x + nx * off,
              boz = cb.y + nz * off;
            ctx.beginPath();
            ctx.moveTo(aox, aoz);
            ctx.lineTo(box, boz);
            ctx.strokeStyle = color;
            ctx.lineWidth = lw;
            ctx.lineCap = 'round';
            ctx.stroke();
            // 标记圆点
            if (mk) {
              const mx = (aox + box) / 2,
                my = (aoz + boz) / 2;
              ctx.beginPath();
              ctx.arc(mx, my, 5, 0, Math.PI * 2);
              ctx.fillStyle = color;
              ctx.fill();
              ctx.fillStyle = '#fff';
              ctx.font = 'bold 8px monospace';
              ctx.textAlign = 'center';
              ctx.fillText(mk === 'corridor' ? '廊' : '空', mx, my + 3);
            }
          }
          // 楼号
          const cx = fp.reduce((s, p) => s + p[0], 0) / fp.length,
            cz = fp.reduce((s, p) => s + p[1], 0) / fp.length;
          const cc = w2c(cx, cz);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 13px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('B' + (bi + 1), cc.x, cc.y + 5);
        }
        // B7 双栋(b7_buildings) 矩形 + name
        const b7 = campusData.obstacles.b7_buildings || [];
        for (let bi = 0; bi < b7.length; bi++) {
          const w = b7[bi];
          const cs = Math.cos(w.ry),
            sn = Math.sin(w.ry);
          const hw = w.w / 2,
            hd = w.d / 2;
          const corners = [];
          for (let c = 0; c < 4; c++) {
            const sx = c === 0 || c === 3 ? -1 : 1,
              sz = c < 2 ? -1 : 1;
            corners.push([w.cx + sx * hw * cs - sz * hd * sn, w.cz + sx * hw * sn + sz * hd * cs]);
          }
          drawPoly(corners, 'rgba(200,180,160,0.5)', '#c8a060', 2);
          const cc = w2c(w.cx, w.cz);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(w.name || 'B7-' + (bi + 1), cc.x, cc.y);
        }
        // 天桥 footprint(紫色虚线提示, 辅助判断避让)
        const bridges = campusData.obstacles.bridges || [];
        for (let bri = 0; bri < bridges.length; bri++) {
          const br = bridges[bri];
          if (!br.footprint || br.footprint.length < 2) continue;
          ctx.save();
          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = '#b266ff';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          const p0 = w2c(br.footprint[0][0], br.footprint[0][1]);
          ctx.moveTo(p0.x, p0.y);
          for (let pi = 1; pi < br.footprint.length; pi++) {
            const pp = w2c(br.footprint[pi][0], br.footprint[pi][1]);
            ctx.lineTo(pp.x, pp.y);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
          const fp = br.footprint;
          const bcx = fp.reduce((s, p) => s + p[0], 0) / fp.length;
          const bcz = fp.reduce((s, p) => s + p[1], 0) / fp.length;
          const bc = w2c(bcx, bcz);
          ctx.fillStyle = '#b266ff';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(
            (br.name || '天桥') +
              ' y=' +
              (br.floorY || 6) +
              '~' +
              ((br.floorY || 6) + (br.thickness || 3)),
            bc.x,
            bc.y
          );
        }
        // 运动场 name 回显
        for (let gi = 0; gi < (campusData.obstacles.grounds || []).length; gi++) {
          const g = campusData.obstacles.grounds[gi];
          if (!g.name) continue;
          const fp = g.footprint;
          const cx = fp.reduce((s, p) => s + p[0], 0) / fp.length;
          const cz = fp.reduce((s, p) => s + p[1], 0) / fp.length;
          const cc = w2c(cx, cz);
          ctx.fillStyle = '#ffe08a';
          ctx.font = 'bold 10px monospace';
          ctx.fillText(g.name, cc.x, cc.y);
        }
        // 普通建筑 name 回显(替代纯 B 编号)
        for (let bi = 0; bi < blds.length; bi++) {
          const b = blds[bi];
          if (b.roofType === 'dome') continue; // B7 跳过
          if (!b.name) continue;
          const fp = b.footprint;
          const cx = fp.reduce((s, p) => s + p[0], 0) / fp.length;
          const cz = fp.reduce((s, p) => s + p[1], 0) / fp.length;
          const cc = w2c(cx, cz);
          ctx.fillStyle = '#9ff';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(b.name, cc.x, cc.y + 18);
        }
      }
      // 查找鼠标悬停的建筑边
      function findEdge(cx, cy) {
        const blds = campusData.obstacles.footprintBuildings || [];
        const w = c2w(cx, cy);
        let best = null,
          bestDist = Infinity;
        for (let bi = 0; bi < blds.length; bi++) {
          const fp = blds[bi].footprint;
          if (!fp || fp.length < 3) continue;
          for (let ei = 0; ei < fp.length; ei++) {
            const a = fp[ei],
              b2 = fp[(ei + 1) % fp.length];
            const dx = b2[0] - a[0],
              dz = b2[1] - a[1];
            const len2 = dx * dx + dz * dz;
            if (len2 < 1) continue;
            let t = ((w.x - a[0]) * dx + (w.z - a[1]) * dz) / len2;
            t = Math.max(0, Math.min(1, t));
            const px = a[0] + t * dx,
              pz = a[1] + t * dz;
            const dist = Math.hypot(w.x - px, w.z - pz);
            if (dist * scale < 15 && dist < bestDist) {
              bestDist = dist;
              best = { bi, ei };
            }
          }
        }
        return best;
      }
      function pointInPoly(x, z, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i][0],
            zi = poly[i][1],
            xj = poly[j][0],
            zj = poly[j][1];
          if (zi > z !== zj > z && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
        }
        return inside;
      }
      function findEntityAt(wx, wz) {
        // 返回 {kind:'bld'|'b7'|'ground', idx} 或 null
        const blds = campusData.obstacles.footprintBuildings || [];
        for (let i = 0; i < blds.length; i++) {
          if (blds[i].roofType === 'dome') continue;
          if (pointInPoly(wx, wz, blds[i].footprint)) return { kind: 'bld', idx: i };
        }
        const b7 = campusData.obstacles.b7_buildings || [];
        for (let i = 0; i < b7.length; i++) {
          const w = b7[i],
            cs = Math.cos(w.ry),
            sn = Math.sin(w.ry),
            hw = w.w / 2,
            hd = w.d / 2;
          const lx = wx - w.cx,
            lz = wz - w.cz;
          const rlx = lx * cs + lz * sn,
            rlz = -lx * sn + lz * cs;
          if (Math.abs(rlx) <= hw && Math.abs(rlz) <= hd) return { kind: 'b7', idx: i };
        }
        const gnds = campusData.obstacles.grounds || [];
        for (let i = 0; i < gnds.length; i++) {
          if (pointInPoly(wx, wz, gnds[i].footprint)) return { kind: 'ground', idx: i };
        }
        return null;
      }
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const fe = findEdge(e.clientX - rect.left, e.clientY - rect.top);
        const newKey = fe ? bldEdgeKey(fe.bi, fe.ei) : null;
        if (newKey !== hoveredKey) {
          hoveredKey = newKey;
          draw();
        }
      });
      function _currentName(ent) {
        if (ent.kind === 'bld') return campusData.obstacles.footprintBuildings[ent.idx].name || '';
        if (ent.kind === 'b7') return (campusData.obstacles.b7_buildings[ent.idx] || {}).name || '';
        return campusData.obstacles.grounds[ent.idx].name || '';
      }
      function _setName(ent, nv) {
        if (ent.kind === 'bld') campusData.obstacles.footprintBuildings[ent.idx].name = nv;
        else if (ent.kind === 'b7') campusData.obstacles.b7_buildings[ent.idx].name = nv;
        else campusData.obstacles.grounds[ent.idx].name = nv;
        draw();
      }
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const fe = findEdge(e.clientX - rect.left, e.clientY - rect.top);
        if (nameMode) {
          // 命名模式: 面拾取
          const w = c2w(e.clientX - rect.left, e.clientY - rect.top);
          const ent = findEntityAt(w.x, w.z);
          if (!ent) return;
          const cur = _currentName(ent);
          const nv = prompt('命名 (' + ent.kind + ' #' + (ent.idx + 1) + '):', cur);
          if (nv === null) return;
          _setName(ent, nv);
          return;
        }
        if (!fe) return;
        const key = bldEdgeKey(fe.bi, fe.ei);
        if (marks[key] === mode) delete marks[key];
        else marks[key] = mode;
        draw();
      });
      document.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'r') setMode('corridor');
        else if (k === 'b') setMode('ac');
        else if (k === 'n') toggleNameMode();
        else if (k === 'c') clearMarks();
      });
      function toggleNameMode() {
        nameMode = !nameMode;
        const el = document.getElementById('mode-ind');
        if (nameMode) {
          el.textContent = '🏷 当前模式: 命名(点建筑/场地输入)';
          el.style.background = '#1a8a4a';
        } else {
          setMode(mode); // 恢复显示当前标记模式
        }
        draw();
      }
      function setMode(m) {
        mode = m;
        const el = document.getElementById('mode-ind');
        if (m === 'corridor') {
          el.textContent = '🔴 当前模式: 外廊';
          el.style.background = '#e94560';
        } else {
          el.textContent = '🔵 当前模式: 空调';
          el.style.background = '#1565c0';
        }
      }
      function clearMarks() {
        marks = {};
        draw();
      }
      async function saveEdgeMarks() {
        const blds = campusData.obstacles.footprintBuildings || [];
        const edgeMarks = {};
        // 先为所有非 dome 楼初始化(含无标记的, 空数组=显式清除已落盘标记)
        for (let bi = 0; bi < blds.length; bi++) {
          if (blds[bi].roofType !== 'dome') edgeMarks[bi] = [];
        }
        for (const key in marks) {
          const parts = key.split('-');
          const bi = parseInt(parts[0], 10);
          const ei = parseInt(parts[1], 10);
          if (blds[bi] && blds[bi].roofType !== 'dome' && edgeMarks[bi]) {
            edgeMarks[bi].push({ ei: ei, type: marks[key] });
          }
        }
        try {
          const r = await fetch('/api/solidify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'campus', edgeMarks: edgeMarks }),
          });
          const j = await r.json();
          if (j.ok)
            alert(
              '✅ 标记已保存 (' +
                Object.keys(edgeMarks).length +
                ' 栋楼, ' +
                Object.values(edgeMarks).reduce((s, a) => s + a.length, 0) +
                ' 条边)'
            );
          else alert('保存失败: ' + j.error);
        } catch (e) {
          alert('保存失败: ' + e.message);
        }
      }
      function exportJSON() {
        const blds = campusData.obstacles.footprintBuildings || [];
        const out = [];
        for (let bi = 0; bi < blds.length; bi++) {
          const fp = blds[bi].footprint;
          if (!fp || fp.length < 3) continue;
          for (let ei = 0; ei < fp.length; ei++) {
            const key = bldEdgeKey(bi, ei);
            if (marks[key]) {
              const a = fp[ei],
                b2 = fp[(ei + 1) % fp.length];
              const dx = b2[0] - a[0],
                dz = b2[1] - a[1];
              const len = Math.sqrt(dx * dx + dz * dz);
              if (len < 1) continue;
              out.push({
                building: bi + 1,
                edge: ei + 1,
                type: marks[key],
                ax: +a[0].toFixed(2),
                az: +a[1].toFixed(2),
                bx: +b2[0].toFixed(2),
                bz: +b2[1].toFixed(2),
                len: +len.toFixed(1),
              });
            }
          }
        }
        const json = JSON.stringify(out, null, 2);
        document.getElementById('output').value = json;
        navigator.clipboard.writeText(json).then(() => {
          const btn = document.querySelector('.btn-green');
          btn.textContent = '✅ 已复制';
          setTimeout(() => (btn.textContent = '📋 导出 JSON'), 2000);
        });
      }
      async function saveNames() {
        const names = { buildings: {}, grounds: {}, b7: {} };
        const blds = campusData.obstacles.footprintBuildings || [];
        for (let i = 0; i < blds.length; i++) {
          if (blds[i].roofType === 'dome') continue;
          if (blds[i].name) names.buildings[i] = blds[i].name;
        }
        for (let i = 0; i < (campusData.obstacles.grounds || []).length; i++) {
          if (campusData.obstacles.grounds[i].name)
            names.grounds[i] = campusData.obstacles.grounds[i].name;
        }
        for (let i = 0; i < (campusData.obstacles.b7_buildings || []).length; i++) {
          if (campusData.obstacles.b7_buildings[i].name)
            names.b7[i] = campusData.obstacles.b7_buildings[i].name;
        }
        try {
          const r = await fetch('/api/solidify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'campus', names }),
          });
          const j = await r.json();
          if (j.ok) alert('命名已保存到地图');
          else alert('保存失败: ' + j.error);
        } catch (e) {
          alert('保存失败: ' + e.message);
        }
      }
      window.addEventListener('resize', () => {
        if (campusData) {
          fitView();
          draw();
        }
      });
      load();
    </script>
  </body>
</html>
