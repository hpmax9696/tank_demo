<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金福园小学 — 花坛打点工具</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: monospace;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #canvas-wrap {
        flex: 1;
        position: relative;
        cursor: crosshair;
      }
      canvas {
        display: block;
      }
      #panel {
        width: 300px;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h2 {
        font-size: 16px;
        color: #e94560;
        margin-bottom: 4px;
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      .btn-red {
        background: #e94560;
        color: #fff;
      }
      .btn-green {
        background: #1a8a4a;
        color: #fff;
      }
      .btn-gray {
        background: #333;
        color: #aaa;
      }
      #zone-list {
        max-height: 260px;
        overflow-y: auto;
        font-size: 12px;
      }
      #zone-list .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #222;
      }
      #zone-list .row:hover {
        background: #0f3460;
      }
      #zone-list .name {
        color: #f0a500;
        font-weight: bold;
        width: 50px;
      }
      #zone-list .info {
        color: #aaa;
        flex: 1;
      }
      #zone-list .del {
        color: #e94560;
        cursor: pointer;
        padding: 1px 6px;
      }
      #status {
        font-size: 12px;
        color: #888;
      }
      .legend {
        font-size: 11px;
        color: #888;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        vertical-align: middle;
        margin-right: 4px;
        border-radius: 2px;
      }
      .hint {
        font-size: 11px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="canvas-wrap"><canvas id="c"></canvas></div>
    <div id="panel">
      <h2>🌳 花坛标记</h2>
      <div class="legend">
        <span style="background: #666"></span>校园围墙
        <span style="background: #3a5a3a"></span>建筑物
        <span style="background: #4a8c3f"></span>运动场草地
        <span style="background: #f0a500; border-radius: 50%"></span>花坛 (ø2m)
      </div>
      <div class="hint">
        🖱️ 点击空白区域 = 放置花坛<br />
        🖱️ 点击花坛 = 选中(高亮白边)<br />
        🖱️ 拖拽花坛 = 平移<br />
        ⌨️ Delete/Backspace = 删除选中
      </div>
      <button class="btn btn-red" onclick="deleteSelected()">🗑 删除选中</button>
      <button class="btn btn-gray" onclick="clearAll()">🗑 清空全部</button>
      <div id="zone-list"></div>
      <button class="btn btn-green" onclick="saveZones()">💾 保存到地图</button>
      <div id="status">就绪</div>
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const PLANTER_R = 1.0; // 花坛世界半径 (ø2m → r=1m)

      let campusData = null;
      let zones = []; // [{cx, cz}]
      let selIdx = -1;
      let dragMode = null; // 'move'
      let dragStart = { x: 0, z: 0 };
      let dragZoneOrig = null;
      let mcx = 0,
        mcz = 0,
        ccx = 0,
        ccy = 0,
        scale = 1;

      // ---- 加载 ----
      async function loadCampus() {
        try {
          const r = await fetch('../maps/campus.map.json');
          campusData = await r.json();
          zones = campusData.obstacles.planterZones || [];
          fitView();
          draw();
          setStatus('已加载, ' + zones.length + ' 个花坛');
        } catch (e) {
          setStatus('加载失败: ' + e.message);
        }
      }

      function fitView() {
        const b = campusData.obstacles.boundary;
        let minX = Infinity,
          maxX = -Infinity,
          minZ = Infinity,
          maxZ = -Infinity;
        for (const p of b) {
          if (p[0] < minX) minX = p[0];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] < minZ) minZ = p[1];
          if (p[1] > maxZ) maxZ = p[1];
        }
        const pad = 10,
          w = maxX - minX + pad * 2,
          h = maxZ - minZ + pad * 2;
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        scale = Math.min(cw / w, ch / h);
        mcx = (minX + maxX) / 2;
        mcz = (minZ + maxZ) / 2;
        ccx = cw / 2;
        ccy = ch / 2;
        canvas.width = cw * devicePixelRatio;
        canvas.height = ch * devicePixelRatio;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function w2c(wx, wz) {
        return { x: ccx - (wx - mcx) * scale, y: ccy - (wz - mcz) * scale };
      }
      function c2w(cx, cy) {
        return { x: mcx - (cx - ccx) / scale, z: mcz - (cy - ccy) / scale };
      }

      // ---- 渲染 ----
      function draw() {
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, cw, ch);
        if (!campusData) return;
        // 背景
        ctx.fillStyle = '#d8d4cc';
        ctx.fillRect(0, 0, cw, ch);
        // 围墙
        const bdry = campusData.obstacles.boundary;
        drawPoly(bdry, '#ddd', '#666', 2);
        // 建筑物
        const blds = campusData.obstacles.footprintBuildings || [];
        for (const fp of blds) drawPoly(fp.footprint, '#3a5a3a', '#2a4a2a', 1);
        // 运动场
        const gnds = campusData.obstacles.grounds || [];
        for (const gn of gnds) drawPoly(gn.footprint, '#4a8c3f', null, 0);
        // 围墙轮廓最后画(最上层)
        drawPoly(bdry, null, '#666', 2);
        // 花坛
        for (let zi = 0; zi < zones.length; zi++) {
          const z = zones[zi];
          const cp = w2c(z.cx, z.cz);
          const pr = PLANTER_R * scale; // 像素半径
          if (zi === selIdx) {
            // 选中: 白边+亮色填充
            ctx.fillStyle = 'rgba(240,165,0,0.25)';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, pr, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // 十字准心
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            const cl = pr * 0.4;
            ctx.beginPath();
            ctx.moveTo(cp.x - cl, cp.y);
            ctx.lineTo(cp.x + cl, cp.y);
            ctx.moveTo(cp.x, cp.y - cl);
            ctx.lineTo(cp.x, cp.y + cl);
            ctx.stroke();
          } else {
            ctx.fillStyle = 'rgba(139,90,43,0.35)';
            ctx.strokeStyle = '#c08000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, pr, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
        }
        updateZoneList();
      }

      function drawPoly(poly, fill, stroke, lw) {
        if (!poly || poly.length < 2) return;
        ctx.beginPath();
        const p0 = w2c(poly[0][0], poly[0][1]);
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < poly.length; i++) {
          const p = w2c(poly[i][0], poly[i][1]);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }

      function updateZoneList() {
        const el = document.getElementById('zone-list');
        el.innerHTML = zones
          .map((z, i) => {
            const cls = i === selIdx ? ' style="color:#f0a500"' : '';
            return (
              '<div class="row"><span class="name"' +
              cls +
              '>花坛' +
              (i + 1) +
              '</span>' +
              '<span class="info">(' +
              z.cx.toFixed(1) +
              ', ' +
              z.cz.toFixed(1) +
              ')</span>' +
              '<span class="del" onclick="deleteZone(' +
              i +
              ')">✕</span></div>'
            );
          })
          .join('');
      }

      function setStatus(s) {
        document.getElementById('status').textContent = s;
      }

      // ---- 命中检测 ----
      function hitZone(cx, cy) {
        for (let i = zones.length - 1; i >= 0; i--) {
          const z = zones[i];
          const cp = w2c(z.cx, z.cz);
          const pr = PLANTER_R * scale + 4; // 加点击容差
          if (Math.hypot(cx - cp.x, cy - cp.y) < pr) return i;
        }
        return -1;
      }

      // ---- 交互 ----
      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left,
          cy = e.clientY - rect.top;
        const w = c2w(cx, cy);

        // 检查已有花坛
        const zi = hitZone(cx, cy);
        if (zi >= 0) {
          selIdx = zi;
          dragMode = 'move';
          dragStart = { x: w.x, z: w.z };
          dragZoneOrig = { cx: zones[zi].cx, cz: zones[zi].cz };
          setStatus('移动中...');
          draw();
          return;
        }
        // 点击空白 → 放置新花坛
        selIdx = -1;
        dragMode = null;
        zones.push({ cx: w.x, cz: w.z });
        selIdx = zones.length - 1;
        setStatus('放置花坛 #' + zones.length);
        draw();
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left,
          cy = e.clientY - rect.top;
        const w = c2w(cx, cy);

        if (dragMode === 'move' && selIdx >= 0) {
          const dx = w.x - dragStart.x,
            dz = w.z - dragStart.z;
          zones[selIdx].cx = dragZoneOrig.cx + dx;
          zones[selIdx].cz = dragZoneOrig.cz + dz;
          draw();
        }
      });

      canvas.addEventListener('mouseup', (e) => {
        dragMode = null;
        dragZoneOrig = null;
        draw();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (
            document.activeElement.tagName === 'INPUT' ||
            document.activeElement.tagName === 'TEXTAREA'
          )
            return;
          deleteSelected();
        }
      });

      function deleteSelected() {
        if (selIdx < 0) return;
        zones.splice(selIdx, 1);
        selIdx = -1;
        setStatus('已删除');
        draw();
      }

      function deleteZone(i) {
        zones.splice(i, 1);
        if (selIdx === i) selIdx = -1;
        else if (selIdx > i) selIdx--;
        draw();
      }

      function clearAll() {
        zones = [];
        selIdx = -1;
        draw();
        setStatus('已清空');
      }

      // ---- 保存 ----
      async function saveZones() {
        try {
          const r = await fetch('/api/solidify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'planterZones', zones: zones }),
          });
          const j = await r.json();
          if (j.ok) setStatus('✅ 已保存到 campus.map.json (' + zones.length + ' 个花坛)');
          else setStatus('❌ 保存失败: ' + (j.error || ''));
        } catch (e) {
          setStatus('❌ 保存异常: ' + e.message);
        }
      }

      // ---- 窗口适配 ----
      window.addEventListener('resize', () => {
        if (campusData) {
          fitView();
          draw();
        }
      });

      loadCampus();
    </script>
  </body>
</html>
