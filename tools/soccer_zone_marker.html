<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>金福园小学 — 足球场区域打点工具</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: monospace;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #canvas-wrap {
        flex: 1;
        position: relative;
        cursor: crosshair;
      }
      canvas {
        display: block;
      }
      #panel {
        width: 320px;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h2 {
        font-size: 16px;
        color: #4ade80;
        margin-bottom: 4px;
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      .btn-green {
        background: #1a8a4a;
        color: #fff;
      }
      .btn-blue {
        background: #2563eb;
        color: #fff;
      }
      .btn-red {
        background: #e94560;
        color: #fff;
      }
      .btn-gray {
        background: #333;
        color: #aaa;
      }
      .btn-orange {
        background: #f5954a;
        color: #1a1a2e;
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #zone-list {
        max-height: 260px;
        overflow-y: auto;
        font-size: 12px;
      }
      #zone-list .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #222;
      }
      #zone-list .row:hover {
        background: #0f3460;
      }
      #zone-list .name {
        color: #4ade80;
        font-weight: bold;
        width: 55px;
      }
      #zone-list .info {
        color: #aaa;
        flex: 1;
      }
      #zone-list .del {
        color: #e94560;
        cursor: pointer;
        padding: 1px 6px;
      }
      #status {
        font-size: 12px;
        color: #888;
      }
      .legend {
        font-size: 11px;
        color: #888;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        vertical-align: middle;
        margin-right: 4px;
        border-radius: 2px;
      }
      .hint {
        font-size: 11px;
        color: #666;
        line-height: 1.6;
      }
      .goal-opt {
        display: flex;
        gap: 4px;
        margin: 2px 0;
      }
      .goal-opt label {
        font-size: 12px;
        color: #aaa;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="canvas-wrap"><canvas id="c"></canvas></div>
    <div id="panel">
      <h2>⚽ 足球子场标记</h2>
      <div class="legend">
        <span style="background: #666"></span>校园围墙
        <span style="background: #3a5a3a"></span>建筑物
        <span style="background: #4a8c3f"></span>运动场草地
        <span style="background: #4ade80"></span>足球子场<br />
        <span style="background: #f5954a"></span>球门端 &nbsp;<span
          style="background: #ff0; border-radius: 50%"
        ></span
        >球门标记
      </div>
      <div class="hint">
        🖱️ 拖拽对角线 = 新建矩形区域<br />
        🖱️ 点击矩形 = 选中(高亮绿边)<br />
        🖱️ 拖拽矩形内部 = 平移<br />
        🖱️ 拖拽🔲角柄 = 缩放<br />
        🖱️ 拖拽🟠旋转柄 = 旋转<br />
        🟡 球门标记 = 自动标在矩形短边两端<br />
        ⌨️ Delete/Backspace = 删除选中区域
      </div>
      <div class="goal-opt">
        <label
          ><input type="radio" name="goalDir" value="auto" checked /> 球门方向: 自动(短边)</label
        >
        <label><input type="radio" name="goalDir" value="w" /> 沿W轴</label>
        <label><input type="radio" name="goalDir" value="d" /> 沿D轴</label>
      </div>
      <button class="btn btn-blue" onclick="copySelected()">📋 复制选中(创建相邻子场)</button>
      <button class="btn btn-red" onclick="deleteSelected()">🗑 删除选中</button>
      <button class="btn btn-gray" onclick="clearAll()">🗑 清空全部</button>
      <div id="zone-list"></div>
      <button class="btn btn-green" onclick="saveZones()">💾 保存到地图</button>
      <div id="status">加载中...</div>
    </div>

    <script>
      const canvas = document.getElementById('c'),
        ctx = canvas.getContext('2d');
      const HANDLE_R = 7,
        ROT_R = 6;
      let campusData = null,
        zones = [],
        selIdx = -1,
        goalDirMode = 'auto';
      let dragMode = null,
        dragCorner = -1,
        dragStart = { x: 0, z: 0 },
        dragZoneOrig = null;
      let mcx = 0,
        mcz = 0,
        ccx = 0,
        ccy = 0,
        scale = 1;

      // ---- 加载 ----
      async function loadCampus() {
        try {
          const r = await fetch('../maps/campus.map.json');
          campusData = await r.json();
          zones = campusData.obstacles.soccerFields || [];
          fitView();
          draw();
          setStatus('已加载, ' + zones.length + ' 个子场');
        } catch (e) {
          setStatus('加载失败: ' + e.message);
        }
      }
      function fitView() {
        const b = campusData.obstacles.boundary;
        let minX = 1e9,
          maxX = -1e9,
          minZ = 1e9,
          maxZ = -1e9;
        for (const p of b) {
          if (p[0] < minX) minX = p[0];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] < minZ) minZ = p[1];
          if (p[1] > maxZ) maxZ = p[1];
        }
        const pad = 10,
          w = maxX - minX + pad * 2,
          h = maxZ - minZ + pad * 2;
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        scale = Math.min(cw / w, ch / h);
        mcx = (minX + maxX) / 2;
        mcz = (minZ + maxZ) / 2;
        ccx = cw / 2;
        ccy = ch / 2;
        canvas.width = cw * devicePixelRatio;
        canvas.height = ch * devicePixelRatio;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      function w2c(wx, wz) {
        return { x: ccx - (wx - mcx) * scale, y: ccy - (wz - mcz) * scale };
      }
      function c2w(cx, cy) {
        return { x: mcx - (cx - ccx) / scale, z: mcz - (cy - ccy) / scale };
      }

      // ---- goal ends (世界坐标的球门位置) ----
      function getGoalEnds(z) {
        const cr = Math.cos(z.ry),
          sr = Math.sin(z.ry);
        const corners = [
          { lx: -z.w / 2, lz: -z.d / 2 },
          { lx: -z.w / 2, lz: +z.d / 2 },
          { lx: +z.w / 2, lz: +z.d / 2 },
          { lx: +z.w / 2, lz: -z.d / 2 },
        ];
        // 确定球门轴: auto选短边, 或按模式
        let axis = goalDirMode;
        if (axis === 'auto') {
          axis = z.w <= z.d ? 'w' : 'd';
        }
        // 沿该轴的两端中点
        const ends = [];
        if (axis === 'w') {
          // 球门在±lx两端 = corners的左(0,1)和右(2,3)两组的中点
          ends.push({
            x: z.cx + (-z.w / 2) * cr - 0 * sr,
            z: z.cz + (-z.w / 2) * sr + 0 * cr,
            dx: -cr,
            dz: -sr, // 门外法线方向
          });
          ends.push({
            x: z.cx + (+z.w / 2) * cr - 0 * sr,
            z: z.cz + (+z.w / 2) * sr + 0 * cr,
            dx: +cr,
            dz: +sr,
          });
        } else {
          // 球门在±lz两端 = corners的顶(0,3)和底(1,2)两组的中点
          ends.push({
            x: z.cx + 0 * cr - (-z.d / 2) * sr,
            z: z.cz + 0 * sr + (-z.d / 2) * cr,
            dx: +sr,
            dz: -cr,
          });
          ends.push({
            x: z.cx + 0 * cr - (+z.d / 2) * sr,
            z: z.cz + 0 * sr + (+z.d / 2) * cr,
            dx: -sr,
            dz: +cr,
          });
        }
        return ends;
      }

      // ---- 渲染 ----
      function draw() {
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, cw, ch);
        if (!campusData) return;
        ctx.fillStyle = '#d8d4cc';
        ctx.fillRect(0, 0, cw, ch);
        // 围墙
        const bdry = campusData.obstacles.boundary;
        drawPoly(bdry, '#ddd', '#666', 2);
        // 建筑物
        for (const fp of campusData.obstacles.footprintBuildings || [])
          drawPoly(fp.footprint, '#3a5a3a', '#2a4a2a', 1);
        // 运动场
        for (const gn of campusData.obstacles.grounds || [])
          drawPoly(gn.footprint, '#4a8c3f', null, 0);
        drawPoly(bdry, null, '#666', 2);
        // 足球子场
        for (let zi = 0; zi < zones.length; zi++) {
          const z = zones[zi],
            corners = zoneCorners(z);
          const sel = zi === selIdx;
          if (sel) {
            drawRect(corners, 'rgba(74,222,128,0.15)', '#4ade80', 2);
            for (let ci = 0; ci < 4; ci++) {
              const c = w2c(corners[ci].x, corners[ci].z);
              ctx.fillStyle = '#fff';
              ctx.strokeStyle = '#333';
              ctx.beginPath();
              ctx.arc(c.x, c.y, HANDLE_R, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            }
            // 旋转手柄
            const tm = {
              x: (corners[0].x + corners[1].x) / 2,
              z: (corners[0].z + corners[1].z) / 2,
            };
            const nx = -(corners[1].z - corners[0].z),
              nz = corners[1].x - corners[0].x;
            const nl = Math.hypot(nx, nz) || 1;
            const rpW = { x: tm.x + (nx / nl) * 1.5, z: tm.z + (nz / nl) * 1.5 };
            const rp = w2c(rpW.x, rpW.z);
            ctx.fillStyle = '#f0a500';
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.arc(rp.x, rp.y, ROT_R, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            const tmc = w2c(tm.x, tm.z);
            ctx.strokeStyle = '#f0a500';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(tmc.x, tmc.y);
            ctx.lineTo(rp.x, rp.y);
            ctx.stroke();
            ctx.setLineDash([]);
          } else {
            drawRect(corners, 'rgba(74,222,128,0.08)', '#3a7a3a', 1);
          }
          // 球门标记(在所有子场上画)
          const ends = getGoalEnds(z);
          for (const e of ends) {
            const p = w2c(e.x, e.z);
            // 橙色端点标记
            ctx.fillStyle = '#f5954a';
            ctx.strokeStyle = '#e07020';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // 短箭头指示门外方向
            ctx.strokeStyle = '#f5954a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + e.dx * 8 * scale, p.y + e.dz * 8 * scale);
            ctx.stroke();
            ctx.lineWidth = 1;
          }
        }
        updateZoneList();
      }
      function drawPoly(poly, fill, stroke, lw) {
        if (!poly || poly.length < 2) return;
        ctx.beginPath();
        const p0 = w2c(poly[0][0], poly[0][1]);
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < poly.length; i++) {
          const p = w2c(poly[i][0], poly[i][1]);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }
      function drawRect(corners, fill, stroke, lw) {
        ctx.beginPath();
        const c0 = w2c(corners[0].x, corners[0].z);
        ctx.moveTo(c0.x, c0.y);
        for (let i = 1; i < 4; i++) {
          const c = w2c(corners[i].x, corners[i].z);
          ctx.lineTo(c.x, c.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }
      function zoneCorners(z) {
        const cr = Math.cos(z.ry),
          sr = Math.sin(z.ry),
          hw = z.w / 2,
          hd = z.d / 2;
        const lc = [
          [-hw, -hd],
          [-hw, +hd],
          [+hw, +hd],
          [+hw, -hd],
        ];
        return lc.map((c) => ({
          x: z.cx + c[0] * cr - c[1] * sr,
          z: z.cz + c[0] * sr + c[1] * cr,
        }));
      }
      function updateZoneList() {
        const el = document.getElementById('zone-list');
        el.innerHTML = zones
          .map((z, i) => {
            const cls = i === selIdx ? ' style="color:#4ade80"' : '';
            const ends = getGoalEnds(z);
            return (
              '<div class="row"><span class="name"' +
              cls +
              '>子场' +
              (i + 1) +
              '</span>' +
              '<span class="info">' +
              Math.round(z.w * 1.3) +
              '×' +
              Math.round(z.d * 1.3) +
              'm ' +
              Math.round((z.ry * 180) / Math.PI) +
              '°</span>' +
              '<span class="del" onclick="deleteZone(' +
              i +
              ')">✕</span></div>'
            );
          })
          .join('');
      }
      function setStatus(s) {
        document.getElementById('status').textContent = s;
      }

      // ---- 交互 ----
      function hitZone(cx, cy) {
        for (let i = zones.length - 1; i >= 0; i--) {
          if (pointInPoly(cx, cy, zoneCorners(zones[i]))) return i;
        }
        return -1;
      }
      function hitCorner(cx, cy, zi) {
        const corners = zoneCorners(zones[zi]);
        for (let ci = 0; ci < 4; ci++) {
          const c = w2c(corners[ci].x, corners[ci].z);
          if (Math.hypot(cx - c.x, cy - c.y) < HANDLE_R + 6) return ci;
        }
        return -1;
      }
      function hitRotate(cx, cy, zi) {
        const corners = zoneCorners(zones[zi]);
        const tm = { x: (corners[0].x + corners[1].x) / 2, z: (corners[0].z + corners[1].z) / 2 };
        const nx = -(corners[1].z - corners[0].z),
          nz = corners[1].x - corners[0].x;
        const nl = Math.hypot(nx, nz) || 1;
        const rpW = { x: tm.x + (nx / nl) * 1.5, z: tm.z + (nz / nl) * 1.5 };
        const rc = w2c(rpW.x, rpW.z);
        return Math.hypot(cx - rc.x, cy - rc.y) < ROT_R + 6;
      }
      function pointInPoly(cx, cy, corners) {
        let inside = false;
        for (let i = 0, j = corners.length - 1; i < corners.length; j = i++) {
          const ci = w2c(corners[i].x, corners[i].z),
            cj = w2c(corners[j].x, corners[j].z);
          if (ci.y > cy !== cj.y > cy && cx < ((cj.x - ci.x) * (cy - ci.y)) / (cj.y - ci.y) + ci.x)
            inside = !inside;
        }
        return inside;
      }

      canvas.addEventListener('mousedown', (e) => {
        const cr = canvas.getBoundingClientRect(),
          cx = e.clientX - cr.left,
          cy = e.clientY - cr.top,
          w = c2w(cx, cy);
        if (selIdx >= 0 && hitRotate(cx, cy, selIdx)) {
          dragMode = 'rotate';
          dragStart = { x: w.x, z: w.z };
          const z = zones[selIdx];
          dragZoneOrig = { cx: z.cx, cz: z.cz, ry: z.ry };
          return;
        }
        if (selIdx >= 0) {
          const ci = hitCorner(cx, cy, selIdx);
          if (ci >= 0) {
            dragMode = 'corner';
            dragCorner = ci;
            dragStart = { x: w.x, z: w.z };
            const z = zones[selIdx];
            dragZoneOrig = { cx: z.cx, cz: z.cz, w: z.w, d: z.d, ry: z.ry };
            return;
          }
        }
        const zi = hitZone(cx, cy);
        if (zi >= 0) {
          selIdx = zi;
          dragMode = 'move';
          dragStart = { x: w.x, z: w.z };
          const z = zones[zi];
          dragZoneOrig = { cx: z.cx, cz: z.cz };
          draw();
          return;
        }
        selIdx = -1;
        dragMode = 'draw';
        dragStart = { x: w.x, z: w.z };
        draw();
      });
      canvas.addEventListener('mousemove', (e) => {
        const cr = canvas.getBoundingClientRect(),
          cx = e.clientX - cr.left,
          cy = e.clientY - cr.top,
          w = c2w(cx, cy);
        if (dragMode === 'draw') {
          const x0 = Math.min(dragStart.x, w.x),
            x1 = Math.max(dragStart.x, w.x);
          const z0 = Math.min(dragStart.z, w.z),
            z1 = Math.max(dragStart.z, w.z);
          draw();
          ctx.strokeStyle = '#fff';
          ctx.setLineDash([6, 3]);
          ctx.lineWidth = 2;
          const p0 = w2c(x0, z0),
            p1 = w2c(x1, z1);
          ctx.strokeRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
          ctx.setLineDash([]);
        } else if (dragMode === 'move' && selIdx >= 0) {
          const dx = w.x - dragStart.x,
            dz = w.z - dragStart.z;
          zones[selIdx].cx = dragZoneOrig.cx + dx;
          zones[selIdx].cz = dragZoneOrig.cz + dz;
          draw();
        } else if (dragMode === 'corner' && selIdx >= 0) {
          const z = zones[selIdx],
            cr = Math.cos(z.ry),
            sr = Math.sin(z.ry);
          const lx = (w.x - z.cx) * cr + (w.z - z.cz) * sr;
          const lz = -(w.x - z.cx) * sr + (w.z - z.cz) * cr;
          const hwO = dragZoneOrig.w / 2,
            hdO = dragZoneOrig.d / 2;
          let nHW = hwO,
            nHD = hdO;
          if (dragCorner === 0) {
            nHW = -lx;
            nHD = -lz;
          } else if (dragCorner === 1) {
            nHW = -lx;
            nHD = lz;
          } else if (dragCorner === 2) {
            nHW = lx;
            nHD = lz;
          } else {
            nHW = lx;
            nHD = -lz;
          }
          z.w = Math.max(3, nHW * 2);
          z.d = Math.max(3, nHD * 2);
          draw();
        } else if (dragMode === 'rotate' && selIdx >= 0) {
          const z = zones[selIdx];
          const a0 = Math.atan2(dragStart.z - z.cz, dragStart.x - z.cx);
          const a1 = Math.atan2(w.z - z.cz, w.x - z.cx);
          z.ry = dragZoneOrig.ry + (a1 - a0);
          draw();
        }
      });
      canvas.addEventListener('mouseup', (e) => {
        if (dragMode === 'draw') {
          const cr = canvas.getBoundingClientRect(),
            cx = e.clientX - cr.left,
            cy = e.clientY - cr.top,
            w = c2w(cx, cy);
          const x0 = Math.min(dragStart.x, w.x),
            x1 = Math.max(dragStart.x, w.x);
          const z0 = Math.min(dragStart.z, w.z),
            z1 = Math.max(dragStart.z, w.z);
          const rw = x1 - x0,
            rd = z1 - z0;
          if (rw > 2 && rd > 2) {
            zones.push({ cx: (x0 + x1) / 2, cz: (z0 + z1) / 2, w: rw, d: rd, ry: 0 });
            selIdx = zones.length - 1;
            setStatus('新建子场 #' + zones.length);
          }
        }
        dragMode = null;
        dragCorner = -1;
        dragZoneOrig = null;
        draw();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (
            document.activeElement.tagName === 'INPUT' ||
            document.activeElement.tagName === 'TEXTAREA'
          )
            return;
          deleteSelected();
        }
      });
      function deleteSelected() {
        if (selIdx < 0) return;
        zones.splice(selIdx, 1);
        selIdx = -1;
        setStatus('已删除');
        draw();
      }
      function deleteZone(i) {
        zones.splice(i, 1);
        if (selIdx === i) selIdx = -1;
        else if (selIdx > i) selIdx--;
        draw();
      }
      function clearAll() {
        zones = [];
        selIdx = -1;
        draw();
        setStatus('已清空');
      }

      // ---- 复制: 沿短轴方向偏移创建一个相邻子场 ----
      function copySelected() {
        if (selIdx < 0) {
          setStatus('请先选中一个子场');
          return;
        }
        const z = zones[selIdx];
        // 确定短轴(垂直于球门轴的轴)
        let axis = goalDirMode;
        if (axis === 'auto') {
          axis = z.w <= z.d ? 'w' : 'd';
        }
        // 短轴 = 垂直于 ball axis
        const shortIsW = axis === 'd';
        const offsetLen = shortIsW ? z.w + 0.5 : z.d + 0.5; // 原场宽+小间距
        // 偏移方向沿短轴: 尝试正方向和反方向, 选离已有区域更远的方向
        const cr = Math.cos(z.ry),
          sr = Math.sin(z.ry);
        let dx, dz;
        if (shortIsW) {
          dx = cr * offsetLen;
          dz = sr * offsetLen;
        } else {
          dx = -sr * offsetLen;
          dz = cr * offsetLen;
        }
        // 正方向
        const np = { cx: z.cx + dx, cz: z.cz + dz, w: z.w, d: z.d, ry: z.ry };
        // 反方向
        const nn = { cx: z.cx - dx, cz: z.cz - dz, w: z.w, d: z.d, ry: z.ry };
        // 选离已有区域中心"较远"的方向
        const allCenters = zones.map((zz) => [zz.cx, zz.cz]);
        let dPos = 1e9,
          dNeg = 1e9;
        for (const [ox, oz] of allCenters) {
          const dp = Math.hypot(np.cx - ox, np.cz - oz),
            dn = Math.hypot(nn.cx - ox, nn.cz - oz);
          if (dp < dPos) dPos = dp;
          if (dn < dNeg) dNeg = dn;
        }
        const chosen = dPos >= dNeg ? np : nn;
        zones.push(chosen);
        selIdx = zones.length - 1;
        setStatus('已复制子场 #' + zones.length + ' (相邻)');
        draw();
      }

      // ---- 球门方向模式 ----
      document.querySelectorAll('input[name="goalDir"]').forEach((r) =>
        r.addEventListener('change', () => {
          goalDirMode = r.value;
          draw();
        })
      );

      // ---- 保存 ----
      async function saveZones() {
        try {
          const r = await fetch('/api/solidify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'soccerFields', zones }),
          });
          if (r.ok) {
            setStatus('✅ 已保存 ' + zones.length + ' 个子场 → campus.map.json');
          } else {
            setStatus('❌ 保存失败: ' + r.status + ' ' + (await r.text()));
          }
        } catch (e) {
          setStatus('❌ ' + e.message);
        }
      }

      loadCampus();
    </script>
  </body>
</html>
