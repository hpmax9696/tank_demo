<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金福园小学 — 厕所区域打点工具</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: monospace;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #canvas-wrap {
        flex: 1;
        position: relative;
        cursor: crosshair;
      }
      canvas {
        display: block;
      }
      #panel {
        width: 300px;
        padding: 16px;
        background: #16213e;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h2 {
        font-size: 16px;
        color: #e94560;
        margin-bottom: 4px;
      }
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      .btn-red {
        background: #e94560;
        color: #fff;
      }
      .btn-green {
        background: #1a8a4a;
        color: #fff;
      }
      .btn-gray {
        background: #333;
        color: #aaa;
      }
      #zone-list {
        max-height: 260px;
        overflow-y: auto;
        font-size: 12px;
      }
      #zone-list .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        border-bottom: 1px solid #222;
      }
      #zone-list .row:hover {
        background: #0f3460;
      }
      #zone-list .name {
        color: #f0a500;
        font-weight: bold;
        width: 50px;
      }
      #zone-list .info {
        color: #aaa;
        flex: 1;
      }
      #zone-list .del {
        color: #e94560;
        cursor: pointer;
        padding: 1px 6px;
      }
      #status {
        font-size: 12px;
        color: #888;
      }
      .legend {
        font-size: 11px;
        color: #888;
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        vertical-align: middle;
        margin-right: 4px;
        border-radius: 2px;
      }
      .hint {
        font-size: 11px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="canvas-wrap"><canvas id="c"></canvas></div>
    <div id="panel">
      <h2>厕所区域标记</h2>
      <div class="legend">
        <span style="background: #666"></span>校园围墙
        <span style="background: #3a5a3a"></span>建筑物
        <span style="background: #4a8c3f"></span>运动场草地
        <span style="background: #f0a500"></span>厕所区域
      </div>
      <div class="hint">
        🖱️ 拖拽对角线 = 新建矩形区域<br />
        🖱️ 点击矩形 = 选中(高亮白边)<br />
        🖱️ 拖拽矩形内部 = 平移<br />
        🖱️ 拖拽🔲角柄 = 缩放<br />
        🖱️ 拖拽🟠旋转柄 = 旋转<br />
        ⌨️ Delete/Backspace = 删除选中区域
      </div>
      <button class="btn btn-red" onclick="deleteSelected()">🗑 删除选中</button>
      <button class="btn btn-gray" onclick="clearAll()">🗑 清空全部</button>
      <div id="zone-list"></div>
      <button class="btn btn-green" onclick="saveZones()">💾 保存到地图</button>
      <div id="status">就绪</div>
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const HANDLE_R = 7,
        ROT_R = 6;

      let campusData = null;
      let zones = []; // [{cx, cz, w, d, ry, count, name}]
      let selIdx = -1; // 选中区域索引
      let dragMode = null; // 'draw' | 'move' | 'corner' | 'rotate'
      let dragCorner = -1; // 0=NW, 1=NE, 2=SE, 3=SW (for corner drag)
      let dragStart = { x: 0, z: 0 };
      let dragZoneOrig = null; // 拖拽前区域副本
      let mcx = 0,
        mcz = 0,
        ccx = 0,
        ccy = 0,
        scale = 1;

      // ---- 加载 ----
      async function loadCampus() {
        try {
          const r = await fetch('../maps/campus.map.json');
          campusData = await r.json();
          zones = campusData.obstacles.toiletZones || [];
          fitView();
          draw();
          setStatus('已加载, ' + zones.length + ' 个厕所区域');
        } catch (e) {
          setStatus('加载失败: ' + e.message);
        }
      }

      function fitView() {
        const b = campusData.obstacles.boundary;
        let minX = Infinity,
          maxX = -Infinity,
          minZ = Infinity,
          maxZ = -Infinity;
        for (const p of b) {
          if (p[0] < minX) minX = p[0];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] < minZ) minZ = p[1];
          if (p[1] > maxZ) maxZ = p[1];
        }
        const pad = 10,
          w = maxX - minX + pad * 2,
          h = maxZ - minZ + pad * 2;
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        scale = Math.min(cw / w, ch / h);
        mcx = (minX + maxX) / 2;
        mcz = (minZ + maxZ) / 2;
        ccx = cw / 2;
        ccy = ch / 2;
        canvas.width = cw * devicePixelRatio;
        canvas.height = ch * devicePixelRatio;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function w2c(wx, wz) {
        return { x: ccx - (wx - mcx) * scale, y: ccy - (wz - mcz) * scale };
      }
      function c2w(cx, cy) {
        return { x: mcx - (cx - ccx) / scale, z: mcz - (cy - ccy) / scale };
      }

      // ---- 渲染 ----
      function draw() {
        const cw = canvas.parentElement.clientWidth,
          ch = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, cw, ch);
        if (!campusData) return;
        // 背景
        ctx.fillStyle = '#d8d4cc';
        ctx.fillRect(0, 0, cw, ch);
        // 围墙
        const bdry = campusData.obstacles.boundary;
        drawPoly(bdry, '#ddd', '#666', 2);
        // 建筑物
        const blds = campusData.obstacles.footprintBuildings || [];
        for (const fp of blds) drawPoly(fp.footprint, '#3a5a3a', '#2a4a2a', 1);
        // 运动场
        const gnds = campusData.obstacles.grounds || [];
        for (const gn of gnds) drawPoly(gn.footprint, '#4a8c3f', null, 0);
        // 围墙轮廓最后画(最上层)
        drawPoly(bdry, null, '#666', 2);
        // 厕所区域
        for (let zi = 0; zi < zones.length; zi++) {
          const z = zones[zi];
          const corners = zoneCorners(z);
          if (zi === selIdx) {
            // 选中: 白边
            drawRect(corners, 'rgba(240,165,0,0.15)', '#fff', 2);
            // 四角手柄
            for (let ci = 0; ci < 4; ci++) {
              const c = w2c(corners[ci].x, corners[ci].z);
              ctx.fillStyle = '#fff';
              ctx.strokeStyle = '#333';
              ctx.beginPath();
              ctx.arc(c.x, c.y, HANDLE_R, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            }
            // 旋转手柄(顶边中点上方)
            const topMid = {
              x: (corners[0].x + corners[1].x) / 2,
              z: (corners[0].z + corners[1].z) / 2,
            };
            const nx = -(corners[1].z - corners[0].z),
              nz = corners[1].x - corners[0].x;
            const nl = Math.hypot(nx, nz) || 1;
            const rotP = { x: topMid.x + (nx / nl) * 1.5, z: topMid.z + (nz / nl) * 1.5 };
            const rp = w2c(rotP.x, rotP.z);
            ctx.fillStyle = '#f0a500';
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.arc(rp.x, rp.y, ROT_R, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // 旋转连线
            const tm = w2c(topMid.x, topMid.z);
            ctx.strokeStyle = '#f0a500';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(tm.x, tm.y);
            ctx.lineTo(rp.x, rp.y);
            ctx.stroke();
            ctx.setLineDash([]);
          } else {
            drawRect(corners, 'rgba(240,165,0,0.1)', '#c08000', 1);
          }
        }
        updateZoneList();
      }

      function drawPoly(poly, fill, stroke, lw) {
        if (!poly || poly.length < 2) return;
        ctx.beginPath();
        const p0 = w2c(poly[0][0], poly[0][1]);
        ctx.moveTo(p0.x, p0.y);
        for (let i = 1; i < poly.length; i++) {
          const p = w2c(poly[i][0], poly[i][1]);
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }

      function drawRect(corners, fill, stroke, lw) {
        ctx.beginPath();
        const c0 = w2c(corners[0].x, corners[0].z);
        ctx.moveTo(c0.x, c0.y);
        for (let i = 1; i < 4; i++) {
          const c = w2c(corners[i].x, corners[i].z);
          ctx.lineTo(c.x, c.y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lw || 2;
          ctx.stroke();
        }
      }

      // 区域四角(世界坐标, CCW)
      function zoneCorners(z) {
        const cr = Math.cos(z.ry),
          sr = Math.sin(z.ry);
        const hw = z.w / 2,
          hd = z.d / 2;
        const corners = [
          { x: -hw, z: -hd },
          { x: -hw, z: +hd },
          { x: +hw, z: +hd },
          { x: +hw, z: -hd },
        ];
        return corners.map((c) => ({
          x: z.cx + c.x * cr - c.z * sr,
          z: z.cz + c.x * sr + c.z * cr,
        }));
      }

      function updateZoneList() {
        const el = document.getElementById('zone-list');
        el.innerHTML = zones
          .map((z, i) => {
            const cls = i === selIdx ? ' style="color:#f0a500"' : '';
            return (
              '<div class="row"><span class="name"' +
              cls +
              '>厕所' +
              (i + 1) +
              '</span>' +
              '<span class="info">' +
              Math.round(z.w) +
              '×' +
              Math.round(z.d) +
              'm ' +
              Math.round((z.ry * 180) / Math.PI) +
              '°</span>' +
              '<span class="del" onclick="deleteZone(' +
              i +
              ')">✕</span></div>'
            );
          })
          .join('');
      }

      function setStatus(s) {
        document.getElementById('status').textContent = s;
      }

      // ---- 命中检测 ----
      function hitZone(cx, cy) {
        for (let i = zones.length - 1; i >= 0; i--) {
          const z = zones[i],
            corners = zoneCorners(z);
          if (pointInPoly(cx, cy, corners)) return i;
        }
        return -1;
      }

      function hitCorner(cx, cy, zi) {
        const z = zones[zi],
          corners = zoneCorners(z);
        for (let ci = 0; ci < 4; ci++) {
          const c = w2c(corners[ci].x, corners[ci].z);
          if (Math.hypot(cx - c.x, cy - c.y) < HANDLE_R + 6) return ci;
        }
        return -1;
      }

      function hitRotate(cx, cy, zi) {
        const z = zones[zi],
          corners = zoneCorners(z);
        const topMid = {
          x: (corners[0].x + corners[1].x) / 2,
          z: (corners[0].z + corners[1].z) / 2,
        };
        const nx = -(corners[1].z - corners[0].z),
          nz = corners[1].x - corners[0].x;
        const nl = Math.hypot(nx, nz) || 1;
        const rp = { x: topMid.x + (nx / nl) * 1.5, z: topMid.z + (nz / nl) * 1.5 };
        const rc = w2c(rp.x, rp.z);
        return Math.hypot(cx - rc.x, cy - rc.y) < ROT_R + 6;
      }

      function pointInPoly(cx, cy, corners) {
        let inside = false;
        for (let i = 0, j = corners.length - 1; i < corners.length; j = i++) {
          const ci = w2c(corners[i].x, corners[i].z),
            cj = w2c(corners[j].x, corners[j].z);
          if (ci.y > cy !== cj.y > cy && cx < ((cj.x - ci.x) * (cy - ci.y)) / (cj.y - ci.y) + ci.x)
            inside = !inside;
        }
        return inside;
      }

      // ---- 交互 ----
      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left,
          cy = e.clientY - rect.top;
        const w = c2w(cx, cy);

        // 检查旋转手柄
        if (selIdx >= 0 && hitRotate(cx, cy, selIdx)) {
          dragMode = 'rotate';
          dragStart = { x: w.x, z: w.z };
          dragZoneOrig = { cx: zones[selIdx].cx, cz: zones[selIdx].cz, ry: zones[selIdx].ry };
          setStatus('旋转中...');
          return;
        }
        // 检查角手柄
        if (selIdx >= 0) {
          const ci = hitCorner(cx, cy, selIdx);
          if (ci >= 0) {
            dragMode = 'corner';
            dragCorner = ci;
            dragStart = { x: w.x, z: w.z };
            const z = zones[selIdx];
            dragZoneOrig = { cx: z.cx, cz: z.cz, w: z.w, d: z.d, ry: z.ry };
            setStatus('缩放中...');
            return;
          }
        }
        // 检查区域内部
        const zi = hitZone(cx, cy);
        if (zi >= 0) {
          selIdx = zi;
          dragMode = 'move';
          dragStart = { x: w.x, z: w.z };
          const z = zones[zi];
          dragZoneOrig = { cx: z.cx, cz: z.cz };
          setStatus('移动中...');
          draw();
          return;
        }
        // 取消选中, 开始绘制
        selIdx = -1;
        dragMode = 'draw';
        dragStart = { x: w.x, z: w.z };
        setStatus('拖拽画矩形...');
        draw();
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left,
          cy = e.clientY - rect.top;
        const w = c2w(cx, cy);

        if (dragMode === 'draw') {
          // 预览矩形
          const x0 = Math.min(dragStart.x, w.x),
            x1 = Math.max(dragStart.x, w.x);
          const z0 = Math.min(dragStart.z, w.z),
            z1 = Math.max(dragStart.z, w.z);
          draw();
          ctx.strokeStyle = '#fff';
          ctx.setLineDash([6, 3]);
          ctx.lineWidth = 2;
          const p0 = w2c(x0, z0),
            p1 = w2c(x1, z1);
          ctx.strokeRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
          ctx.setLineDash([]);
        } else if (dragMode === 'move' && selIdx >= 0) {
          const dx = w.x - dragStart.x,
            dz = w.z - dragStart.z;
          zones[selIdx].cx = dragZoneOrig.cx + dx;
          zones[selIdx].cz = dragZoneOrig.cz + dz;
          draw();
        } else if (dragMode === 'corner' && selIdx >= 0) {
          const z = zones[selIdx];
          const cr = Math.cos(z.ry),
            sr = Math.sin(z.ry);
          // 转换拖拽位置到局部坐标
          const lx = (w.x - z.cx) * cr + (w.z - z.cz) * sr;
          const lz = -(w.x - z.cx) * sr + (w.z - z.cz) * cr;
          // 根据拖拽的角更新w/d
          const hwO = dragZoneOrig.w / 2,
            hdO = dragZoneOrig.d / 2;
          let nHW = hwO,
            nHD = hdO;
          if (dragCorner === 0) {
            nHW = -lx;
            nHD = -lz;
          } // NW
          else if (dragCorner === 1) {
            nHW = -lx;
            nHD = lz;
          } // NE
          else if (dragCorner === 2) {
            nHW = lx;
            nHD = lz;
          } // SE
          else if (dragCorner === 3) {
            nHW = lx;
            nHD = -lz;
          } // SW
          z.w = Math.max(2, nHW * 2);
          z.d = Math.max(1.5, nHD * 2);
          draw();
        } else if (dragMode === 'rotate' && selIdx >= 0) {
          const z = zones[selIdx];
          const ang0 = Math.atan2(dragStart.z - z.cz, dragStart.x - z.cx);
          const ang1 = Math.atan2(w.z - z.cz, w.x - z.cx);
          z.ry = dragZoneOrig.ry + (ang1 - ang0);
          draw();
        }
      });

      canvas.addEventListener('mouseup', (e) => {
        if (dragMode === 'draw') {
          const rect = canvas.getBoundingClientRect();
          const cx = e.clientX - rect.left,
            cy = e.clientY - rect.top;
          const w = c2w(cx, cy);
          const x0 = Math.min(dragStart.x, w.x),
            x1 = Math.max(dragStart.x, w.x);
          const z0 = Math.min(dragStart.z, w.z),
            z1 = Math.max(dragStart.z, w.z);
          const rw = x1 - x0,
            rd = z1 - z0;
          if (rw > 2 && rd > 1.5) {
            const cz = {
              cx: (x0 + x1) / 2,
              cz: (z0 + z1) / 2,
              w: rw,
              d: rd,
              ry: 0,
              count: Math.max(2, Math.round(rw / 1.5)),
              name: '厕所' + (zones.length + 1),
            };
            zones.push(cz);
            selIdx = zones.length - 1;
            setStatus('新建厕所区域 #' + zones.length);
          }
        }
        dragMode = null;
        dragCorner = -1;
        dragZoneOrig = null;
        draw();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (
            document.activeElement.tagName === 'INPUT' ||
            document.activeElement.tagName === 'TEXTAREA'
          )
            return;
          deleteSelected();
        }
      });

      function deleteSelected() {
        if (selIdx < 0) return;
        zones.splice(selIdx, 1);
        selIdx = -1;
        setStatus('已删除');
        draw();
      }

      function deleteZone(i) {
        zones.splice(i, 1);
        if (selIdx === i) selIdx = -1;
        else if (selIdx > i) selIdx--;
        draw();
      }

      function clearAll() {
        zones = [];
        selIdx = -1;
        draw();
        setStatus('已清空');
      }

      // ---- 保存 ----
      async function saveZones() {
        try {
          const r = await fetch('/api/solidify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'toiletZones', zones: zones }),
          });
          const j = await r.json();
          if (j.ok) setStatus('✅ 已保存到 campus.map.json (' + zones.length + ' 个区域)');
          else setStatus('❌ 保存失败: ' + (j.error || ''));
        } catch (e) {
          setStatus('❌ 保存异常: ' + e.message);
        }
      }

      // ---- 窗口适配 ----
      window.addEventListener('resize', () => {
        if (campusData) {
          fitView();
          draw();
        }
      });

      loadCampus();
    </script>
  </body>
</html>
