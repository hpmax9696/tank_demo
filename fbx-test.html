<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBX 模型验证 - T34-85</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #info {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.75); color: #fff; padding: 12px 18px;
    border-radius: 8px; font-size: 14px; line-height: 1.6;
    pointer-events: none; max-width: 500px;
  }
  #info .ok { color: #4ecdc4; }
  #info .err { color: #ff6b6b; }
  #info .warn { color: #ffe66d; }
</style>
</head>
<body>
<div id="info">
  <div>🔍 <strong>FBX 模型加载测试 — T34-85</strong></div>
  <div id="status">⏳ 正在初始化...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const statusEl = document.getElementById('status');

function log(msg, cls = '') {
  statusEl.innerHTML += `<br><span class="${cls}">${msg}</span>`;
  console.log(msg);
}

// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2d2d3f);
scene.fog = new THREE.Fog(0x2d2d3f, 30, 80);

// 相机
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 200);
camera.position.set(8, 6, 10);
camera.lookAt(0, 1.5, 0);

// 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// OrbitControls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.75;
controls.update();

// 光照
const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3d2b1f, 0.8);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff5e6, 3.5);
sunLight.position.set(15, 20, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 100;
sunLight.shadow.camera.left = -20;
sunLight.shadow.camera.right = 20;
sunLight.shadow.camera.top = 20;
sunLight.shadow.camera.bottom = -20;
sunLight.shadow.bias = -0.0001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x8899cc, 0.6);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

// 地面
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a6741, roughness: 0.9, metalness: 0.1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 网格参考线
const grid = new THREE.GridHelper(40, 40, 0x888888, 0x444444);
scene.add(grid);

// 坐标轴参考
const axesHelper = new THREE.AxesHelper(5);
scene.add(axesHelper);

// 加载 FBX
log('📥 开始加载 FBX 模型...', '');
const loader = new FBXLoader();

loader.load(
  'models/fbx/t34-85_textured.fbx',
  function(fbxGroup) {
    log('✅ FBX 模型加载成功！', 'ok');
    log(`📦 根节点类型: ${fbxGroup.type}`, 'ok');
    log(`📦 子节点数量: ${fbxGroup.children.length}`, 'ok');

    // 遍历层级结构
    const meshes = [];
    fbxGroup.traverse((child) => {
      log(`  └─ "${child.name || '[unnamed]'}" [${child.type}] ${child.isMesh ? 'MESH' : ''} ${child.isBone ? 'BONE' : ''}`, '');
      if (child.isMesh) {
        meshes.push(child);
        // 确保材质设置
        if (child.material) {
          child.material.side = THREE.FrontSide;
          if (Array.isArray(child.material)) {
            child.material.forEach(m => { m.side = THREE.FrontSide; });
          }
        }
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    log(`🎯 网格数量: ${meshes.length}`, 'ok');

    // 计算包围盒
    const bbox = new THREE.Box3().setFromObject(fbxGroup);
    const size = new THREE.Vector3();
    bbox.getSize(size);
    const center = new THREE.Vector3();
    bbox.getCenter(center);

    log(`📐 包围盒尺寸: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`, 'ok');
    log(`📍 包围盒中心: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`, 'ok');

    // 居中模型
    fbxGroup.position.set(-center.x, -bbox.min.y, -center.z);

    // 自适应缩放：让模型最大维度约为6单位
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const targetSize = 6;
      const scale = targetSize / maxDim;
      fbxGroup.scale.setScalar(scale);
      log(`🔧 自适应缩放: ${scale.toFixed(4)} (原始最大维度=${maxDim.toFixed(2)})`, 'ok');
    }

    scene.add(fbxGroup);
    log('🎉 模型已添加到场景中，可以用鼠标旋转/缩放查看！', 'ok');
  },
  function(progress) {
    if (progress.total) {
      const pct = Math.round(progress.loaded / progress.total * 100);
      statusEl.innerHTML = statusEl.innerHTML.replace(/📥.*/, `📥 加载进度: ${pct}%`);
    }
  },
  function(error) {
    log(`❌ FBX 加载失败: ${error.message || error}`, 'err');
    console.error('FBX 加载错误:', error);
  }
);

// 渲染循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// 窗口大小响应
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

log('🚀 初始化完成，等待 FBX 加载...', '');
</script>
</body>
</html>
