            } else if (configNode.type === 'RidgeBox') {
              // size: [底宽, 高, 底深, 顶宽, 顶深, 顶面X偏移, 顶面Z偏移, 脊线高度, 脊线凸出]
              const sz = configNode.size || [0.5, 0.3, 0.5, 0.35, 0.35, 0, 0, 0.15, 0.04];
              const r = {
                bw: sz[0],
                h: sz[1],
                bd: sz[2],
                tw: sz[3] || sz[0] * 0.6,
                td: sz[4] || sz[2] * 0.6,
                ox: sz[5] || 0,
                oz: sz[6] || 0,
                ridgeY: sz[7] != null ? sz[7] : 0.5 * (sz[1] || 1),
                ridgeZ: sz[8] || 0,
              };
              const _mk = (prop, idx, name, undo) =>
                geoF
                  .add(r, prop, 0.01, 10.0, 0.005)
                  .name(name)
                  .onChange((v) => {
                    saveUndo(undo);
                    configNode.size[idx] = v;
                    rebuild();
                  });
              _mk('bw', 0, '底宽', 'RBbw');
              _mk('h', 1, '高度', 'RBh');
              _mk('bd', 2, '底深', 'RBbd');
              _mk('tw', 3, '顶宽', 'RBtw');
              _mk('td', 4, '顶深', 'RBtd');
              const offF = geoF.addFolder('↗ 顶面偏移');
              offF
                .add(r, 'ox', -5, 5, 0.005)
                .name('X偏移')
                .onChange((v) => {
                  saveUndo('RBoxoff');
                  configNode.size[5] = v;
                  rebuild();
                });
              offF
                .add(r, 'oz', -5, 5, 0.005)
                .name('Z偏移')
                .onChange((v) => {
                  saveUndo('RBozoff');
                  configNode.size[6] = v;
                  rebuild();
                });
              const ridgeF = geoF.addFolder('🐻 胸前脊线');
              ridgeF
                .add(r, 'ridgeY', 0, 10.0, 0.005)
                .name('脊线高度')
                .onChange((v) => {
                  saveUndo('RBridgeY');
                  configNode.size[7] = v;
                  rebuild();
                });
              ridgeF
                .add(r, 'ridgeZ', 0, 1, 0.005)
                .name('脊线凸出')
                .onChange((v) => {
                  saveUndo('RBridgeZ');
                  configNode.size[8] = v;
                  rebuild();
                });
            } else if (configNode.type === 'TaperedHex') {
              const sz = configNode.size || [0.5, 0.3, 0.5, 0.35, 0.35];
              const t = {
                bw: sz[0],
                h: sz[1],
                bd: sz[2],
                tw: sz[3] || sz[0] * 0.6,
                td: sz[4] || sz[2] * 0.6,
                ox: sz[5] || 0,
                oz: sz[6] || 0,
              };
              geoF
                .add(t, 'bw', 0.01, 10.0, 0.005)
                .name('底宽')
                .onChange((v) => {
                  saveUndo('THXbw');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(t, 'h', 0.01, 10.0, 0.005)
                .name('高度')
                .onChange((v) => {
                  saveUndo('THXh');
                  configNode.size[1] = v;
                  rebuild();
                });
              geoF
                .add(t, 'bd', 0.01, 10.0, 0.005)
                .name('底深')
                .onChange((v) => {
                  saveUndo('THXbd');
                  configNode.size[2] = v;
                  rebuild();
                });
              geoF
                .add(t, 'tw', 0.01, 10.0, 0.005)
                .name('顶宽')
                .onChange((v) => {
                  saveUndo('THXtw');
                  configNode.size[3] = v;
                  rebuild();
                });
              geoF
                .add(t, 'td', 0.01, 10.0, 0.005)
                .name('顶深')
                .onChange((v) => {
                  saveUndo('THXtd');
                  configNode.size[4] = v;
                  rebuild();
                });
              const offF = geoF.addFolder('↗ 顶面偏移');
              offF
                .add(t, 'ox', -5, 5, 0.005)
                .name('X偏移')
                .onChange((v) => {
                  saveUndo('THXoff');
                  configNode.size[5] = v;
                  rebuild();
                });
              offF
                .add(t, 'oz', -5, 5, 0.005)
                .name('Z偏移')
                .onChange((v) => {
                  saveUndo('THZoff');
                  configNode.size[6] = v;
                  rebuild();
                });
            } else if (configNode.type === 'Cylinder') {
              const sz = configNode.size || [0.5, 1, 0.5];
              const c = { rT: sz[0], h: sz[1], rB: sz[2] };
              geoF
                .add(c, 'rT', 0.005, 5.0, 0.005)
                .name('顶半径')
                .onChange((v) => {
                  saveUndo('CylR');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(c, 'h', 0.01, 10.0, 0.005)
                .name('高度')
                .onChange((v) => {
                  saveUndo('CylH');
                  configNode.size[1] = v;
                  rebuild();
                });
              geoF
                .add(c, 'rB', 0.005, 5.0, 0.005)
                .name('底半径')
                .onChange((v) => {
                  saveUndo('CylRB');
                  configNode.size[2] = v;
                  rebuild();
                });
              const sg = configNode.segments || [6];
              const sm = { seg: sg[0] };
              geoF
                .add(sm, 'seg', 3, 32, 1)
                .name('边数')
                .onChange((v) => {
                  saveUndo('CylSeg');
                  configNode.segments[0] = v;
                  rebuild();
                });
            } else if (configNode.type === 'Sphere') {
              const sz = configNode.size || [0.5];
              const s = { r: sz[0] };
              geoF
                .add(s, 'r', 0.005, 5.0, 0.005)
                .name('半径')
                .onChange((v) => {
                  saveUndo('SphR');
                  configNode.size[0] = v;
                  rebuild();
                });
              const sg = configNode.segments || [8, 6];
              const sm = { w: sg[0], h: sg[1] };
              geoF
                .add(sm, 'w', 3, 32, 1)
                .name('经线')
                .onChange((v) => {
                  saveUndo('SphW');
                  configNode.segments[0] = v;
                  rebuild();
                });
              geoF
                .add(sm, 'h', 2, 32, 1)
                .name('纬线')
                .onChange((v) => {
                  saveUndo('SphH');
                  configNode.segments[1] = v;
                  rebuild();
                });
            } else if (configNode.type === 'Torus') {
              const sz = configNode.size || [0.5, 0.05];
              const t = { R: sz[0], r: sz[1] || 0.05 };
              geoF
                .add(t, 'R', 0.01, 5.0, 0.005)
                .name('主半径')
                .onChange((v) => {
                  saveUndo('TorR');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(t, 'r', 0.005, 0.5, 0.002)
                .name('管半径')
                .onChange((v) => {
                  saveUndo('Torr');
                  configNode.size[1] = v;
                  rebuild();
                });
              const sg = configNode.segments || [8, 12];
              const sm = { rad: sg[0], tub: sg[1] };
              geoF
                .add(sm, 'rad', 4, 32, 1)
                .name('径向段')
                .onChange((v) => {
                  saveUndo('TorRad');
                  configNode.segments[0] = v;
                  rebuild();
                });
              geoF
                .add(sm, 'tub', 6, 48, 1)
                .name('管向段')
                .onChange((v) => {
                  saveUndo('TorTub');
                  configNode.segments[1] = v;
                  rebuild();
                });
            } else if (configNode.type === 'Lathe') {
              const sg = configNode.segments || [24];
              const sm = { seg: sg[0] };
              geoF
                .add(sm, 'seg', 6, 64, 1)
                .name('旋转段数')
                .onChange((v) => {
                  saveUndo('LHseg');
                  configNode.segments[0] = v;
                  rebuild();
                });
              // 半径缩放 & 高度缩放
              const sc = { sR: configNode.scaleR ?? 1, sH: configNode.scaleH ?? 1 };
              geoF
                .add(sc, 'sR', 0.1, 5.0, 0.01)
                .name('半径缩放')
                .onChange((v) => {
                  saveUndo('LHsR');
                  configNode.scaleR = v;
                  rebuild();
                });
              geoF
                .add(sc, 'sH', 0.1, 5.0, 0.01)
                .name('高度缩放')
                .onChange((v) => {
                  saveUndo('LHsH');
                  configNode.scaleH = v;
                  rebuild();
                });
              // 轮廓编辑：JSON 文本输入
              const prof = configNode.profile || [
                [0.5, 0],
                [0.5, 0.3],
                [0.6, 0.4],
                [0.1, 0.4],
              ];
              const pStr = { txt: JSON.stringify(prof) };
              geoF
                .add(pStr, 'txt')
                .name('轮廓 [x,y]')
                .onChange((v) => {
                  try {
                    saveUndo('LHprof');
                    const arr = JSON.parse(v);
                    if (Array.isArray(arr)) configNode.profile = arr;
                    rebuild();
                  } catch (e) {}
                });
            } else if (configNode.type === 'Extrude') {
              const d = {
                depth: configNode.extrudeDepth || 0.5,
                bevel: configNode.bevelThickness || 0.02,
              };
              geoF
                .add(d, 'depth', 0.01, 10.0, 0.01)
                .name('挤出深度')
                .onChange((v) => {
                  saveUndo('ExtD');
                  configNode.extrudeDepth = v;
                  rebuild();
                });
              geoF
                .add(d, 'bevel', 0, 0.1, 0.002)
                .name('倒角')
                .onChange((v) => {
                  saveUndo('ExtB');
                  configNode.bevelThickness = v;
                  rebuild();
                });
              // 形状编辑
              const shp = configNode.shape || [
                [-0.5, -0.2],
                [0.5, -0.2],
                [0.5, 0.2],
                [-0.5, 0.2],
              ];
              const sStr = { txt: JSON.stringify(shp) };
              geoF
                .add(sStr, 'txt')
                .name('形状 [x,y]')
                .onChange((v) => {
                  try {
                    saveUndo('ExtShp');
                    const arr = JSON.parse(v);
                    if (Array.isArray(arr)) configNode.shape = arr;
                    rebuild();
                  } catch (e) {}
                });
            } else if (configNode.type === 'ProfiledExtrude') {
              // 圆弧分段
              const segCtrl = { seg: (configNode.segments && configNode.segments[0]) || 24 };
              geoF
                .add(segCtrl, 'seg', 4, 64, 1)
                .name('圆弧分段')
                .onChange((v) => {
                  saveUndo('PESeg');
                  if (!configNode.segments) configNode.segments = [24];
                  configNode.segments[0] = v;
                  rebuild();
                });
              // 📐 轮廓预设（一键应用俯视形状）
              const presetNames = Object.keys(PE_SHAPE_PRESETS);
              const shpSel = { preset: presetNames[0] };
              geoF
                .add(shpSel, 'preset', presetNames)
                .name('📐 轮廓预设')
                .onChange((name) => {
                  saveUndo('PEShapePreset');
                  configNode.shape = JSON.parse(JSON.stringify(PE_SHAPE_PRESETS[name]));
                  rebuild();
                });
              // 📏 轮廓缩放（整体放大/缩小；arc 半径按 X/Y 平均缩放）
              const sc = configNode.shapeScale || (configNode.shapeScale = [1, 1]);
              const scBox = { x: sc[0], y: sc[1] };
              geoF
                .add(scBox, 'x', 0.1, 5, 0.01)
                .name('📏 轮廓 X缩放')
                .onChange((v) => {
                  sc[0] = v;
                  saveUndo('PEScaleX');
                  rebuild();
                });
              geoF
                .add(scBox, 'y', 0.1, 5, 0.01)
                .name('📏 轮廓 Y缩放')
                .onChange((v) => {
                  sc[1] = v;
                  saveUndo('PEScaleY');
                  rebuild();
                });
              geoF
                .add(
                  {
                    double: () => {
                      sc[0] = +(sc[0] * 2).toFixed(3);
                      sc[1] = +(sc[1] * 2).toFixed(3);
                      saveUndo('PEScale2x');
                      rebuild();
                    },
                  },
                  'double'
                )
                .name('⚡ 一键×2');
              // ✏️ 可视化编辑轮廓（弹出 2D 画布拖拽控制点）
              geoF
                .add(
                  {
                    edit: () => {
                      if (window.PEShapeEditor) window.PEShapeEditor.open(configNode, rebuild);
                    },
                  },
                  'edit'
                )
                .name('✏️ 可视化编辑轮廓');
              // 🔺 屋顶剖面点（可增删的控制点滑块，每个点 [y=前后位置, h=高度]）
              const roofFolder = geoF.addFolder('🔺 屋顶剖面点');
              function rebuildRoofCtrls() {
                roofFolder.controllersRecursive().forEach((c) => c.destroy());
                const rp =
                  configNode.roofProfile ||
                  (configNode.roofProfile = [
                    [0.85, 0.48],
                    [-0.35, 0.65],
                    [-1.1, 0.65],
                  ]);
                rp.forEach((pt, i) => {
                  const box = { y: pt[0], h: pt[1] };
                  roofFolder
                    .add(box, 'y', -2, 2, 0.01)
                    .name('点' + (i + 1) + ' 前后y')
                    .onChange((v) => {
                      pt[0] = v;
                      saveUndo('PERoofY');
                      rebuild();
                    });
                  roofFolder
                    .add(box, 'h', 0, 2.5, 0.01)
                    .name('点' + (i + 1) + ' 高度h')
                    .onChange((v) => {
                      pt[1] = v;
                      saveUndo('PERoofH');
                      rebuild();
                    });
                  roofFolder
                    .add(
                      {
                        del: () => {
                          saveUndo('PERoofDel');
                          configNode.roofProfile.splice(i, 1);
                          rebuild();
                        },
                      },
                      'del'
                    )
                    .name('✖ 删点' + (i + 1));
                });
                roofFolder
                  .add(
                    {
                      add: () => {
                        saveUndo('PERoofAdd');
                        configNode.roofProfile.push([0, 0.5]);
                        rebuild();
                      },
                    },
                    'add'
                  )
                  .name('➕ 添加点');
              }
              rebuildRoofCtrls();
              // ⚙ 高级（原始 JSON，折叠）— 供预设无法覆盖的特殊形状使用
              const advF = geoF.addFolder('⚙ 高级(原始JSON)');
              advF.close();
              const shpPE = configNode.shape || [
                ['line', -0.55, 0.85],
                ['line', -0.75, -0.35],
                ['arc', 0, -0.35, 0.75, Math.PI, 0],
                ['line', 0.75, -0.35],
                ['line', 0.55, 0.85],
              ];
              const sStrPE = { txt: JSON.stringify(shpPE) };
              advF
                .add(sStrPE, 'txt')
                .name('Shape [cmd,...]')
                .onChange((v) => {
                  try {
                    saveUndo('PEShape');
                    const arr = JSON.parse(v);
                    if (Array.isArray(arr)) configNode.shape = arr;
                    rebuild();
                  } catch (e) {}
                });
              const rpPE = configNode.roofProfile || [
                [0.85, 0.48],
                [-0.35, 0.65],
                [-1.1, 0.65],
              ];
              const rpStrPE = { txt: JSON.stringify(rpPE) };
              advF
                .add(rpStrPE, 'txt')
                .name('屋顶剖面 [y,h]')
                .onChange((v) => {
                  try {
                    saveUndo('PERoof');
                    const arr = JSON.parse(v);
                    if (Array.isArray(arr) && arr.length >= 2) configNode.roofProfile = arr;
                    rebuild();
                  } catch (e) {}
                });
            }

            // --- 颜色编辑（hex color picker）---
            if (mesh.material && mesh.material.color) {
              const colF = folder.addFolder('🎨 颜色');
              const hexStr = '#' + mesh.material.color.getHexString();
              const c = { color: hexStr };
              colF
                .addColor(c, 'color')
                .name('颜色')
                .onChange((v) => {
                  saveUndo('color');
                  mesh.material.color.set(v);
                  configNode.color = v;
                });
              // 预设材料
              colF
                .add({ mat: configNode.materialId || 'default' }, 'mat', Object.keys(MATERIAL_DEFS))
                .name('材质预设')
                .onChange((v) => {
                  saveUndo('mat');
                  const def = MATERIAL_DEFS[v];
                  mesh.material.color.set(def.color);
                  mesh.material.roughness = def.roughness;
                  mesh.material.metalness = def.metalness;
                  configNode.materialId = v;
                  configNode.color = undefined;
                });
            }
          }

          // --- 增删改按钮 ---
          const editF = folder.addFolder('✏️ 结构编辑');
          // 重命名（自由输入 + 确认按钮，避免 onChange 导致焦点丢失）
          const rn = { name: configNode.name };
          editF.add(rn, 'name').name('名称');
          editF
            .add(
              {
                applyRename: () => {
                  if (rn.name && rn.name !== configNode.name) renameNode(configNode.name, rn.name);
                },
              },
              'applyRename'
            )
            .name('✅ 确认重命名');
          // 类型切换（仅非 Group）
          if (configNode.type !== 'Group') {
            const typeList = [
              'Box',
              'BentBox',
              'TaperedBox',
              'TaperedHex',
              'RoundedBox',
              'Cylinder',
              'Sphere',
              'Torus',
              'Lathe',
              'Extrude',
              'ProfiledExtrude',
            ];
            editF
              .add({ type: configNode.type }, 'type', typeList)
              .name('形状')
              .onChange((v) => {
                saveUndo('switchType');
                switchType(configNode.name, v);
              });
          }
          editF.add({ add: () => addChildNode(configNode.name) }, 'add').name('➕ 添加子部件');
          if (configNode.name !== cfg.name) {
            editF.add({ del: () => deleteNode(configNode.name) }, 'del').name('🗑 删除此部件');
          }
          editF.open();

          // --- 子节点 ---
          if (configNode.children) {
            for (const child of configNode.children) {
              addPartUI(folder, child);
            }
          }
        }

        // 递归添加
        if (cfg.children) {
          for (const child of cfg.children) {
            addPartUI(gui, child);
          }
        }
        // 默认折叠所有部件文件夹，保持面板整洁
        guiFolderMap.forEach((f) => f.close());
      }

      // ============================================================
      // 11. 构建并初始化（自动加载上次保存）
      // ============================================================
      (function autoLoad() {
        // 只恢复"上次选的模型类型"; 配置内容始终以源文件为准。
        // 源文件经 /api/solidify 固化是 source of truth;
        // 之前用 localStorage 覆盖配置会导致"改了源文件不生效"(localStorage 旧值盖回)。
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        try {
          const data = JSON.parse(raw);
          const mt = data.modelType;
          if (mt && MODEL_CONFIGS[mt]) {
            currentModelType = mt;
            // 恢复模型后同步迷彩默认：虎式→调试色，其他→丛林
            currentCamoType = mt === 'tiger_v16' ? 'debug' : 'jungle';
            console.log('📂 恢复上次模型: ' + mt + ' (配置用源文件)');
          } else {
            localStorage.removeItem(SAVE_KEY);
          }
        } catch (e) {
          localStorage.removeItem(SAVE_KEY);
        }
      })();
      rebuildModel();
      // 激活点击选择
      setupRaycaster();

      // --- 自动快照已集成到每个 onChange 回调中（saveUndo）---

      // ============================================================
      // 12. 辅助框切换
      // ============================================================
      document.getElementById('toggle-helpers').addEventListener('click', () => {
        showHelpersGlobal = !showHelpersGlobal;
        const helpers = modelRoot.userData.helpers || [];
        for (const h of helpers) {
          const info = nodeMap.get(
            h.userData._mesh?.parent?.name || h.userData._mesh?.name?.replace('_mesh', '')
          );
          h.visible = showHelpersGlobal && (info ? info.group.visible : true);
        }
        document.getElementById('toggle-helpers').textContent = showHelpersGlobal
          ? '🔲 隐藏对齐辅助框'
          : '🔲 显示对齐辅助框';
      });

      // --- 坐标轴标识开关 ---
      document.getElementById('toggle-axes').addEventListener('click', () => {
        axesGroup.visible = !axesGroup.visible;
        document.getElementById('toggle-axes').textContent = axesGroup.visible
          ? '🧭 隐藏坐标轴'
          : '🧭 显示坐标轴';
      });

      // ============================================================
      // 13. 窗口缩放
      // ============================================================
      window.addEventListener('resize', () => {
        const w = viewWidth(),
          h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        const aspect = w / h;
        orthoCamera.left = -ORTHO_FRUSTUM * aspect;
        orthoCamera.right = ORTHO_FRUSTUM * aspect;
        orthoCamera.top = ORTHO_FRUSTUM;
        orthoCamera.bottom = -ORTHO_FRUSTUM;
        orthoCamera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      // ============================================================
      // 14. 键盘快捷键
      // ============================================================
      window.addEventListener('keydown', (e) => {
        // 正在输入框中打字时，跳过快捷键拦截
        if (
          e.target.tagName === 'INPUT' ||
          e.target.tagName === 'TEXTAREA' ||
          e.target.isContentEditable
        )
          return;
        if (e.key === 'h' && !e.ctrlKey && !e.metaKey) {
          document.getElementById('toggle-helpers').click();
        }
        if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
          e.preventDefault();
          flushUndo(); // 强制入栈当前待定快照
          if (undoStack.length === 0) {
            console.log('⚠️ 没有可撤销的操作');
            return;
          }
          autoSnapshot = false;
          const prev = undoStack.pop();
          const cfg = MODEL_CONFIGS[currentModelType];
          const fmCur = cfg.children?.[0]?.children?.[0];
          const fmPrev = prev.children?.[0]?.children?.[0];
          console.log(
            '🔙 撤销: 当前 size=' +
              JSON.stringify(fmCur?.size) +
              ' → 快照 size=' +
              JSON.stringify(fmPrev?.size)
          );
          deepRestore(cfg, prev);
          console.log('🔙 恢复后 size=' + JSON.stringify(cfg.children?.[0]?.children?.[0]?.size));
          rebuildModel();
          autoSnapshot = true;
          console.log('↩ 撤销成功 (剩余 ' + undoStack.length + ' 步可撤销)');
        }
        if (e.key === 's' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
          e.preventDefault();
          _doSave();
        }
        // Delete — 隐藏选中部件
        if (e.key === 'Delete' && selectedParts.size > 0) {
          e.preventDefault();
          flushUndo();
          saveUndo('keyDel'); // 操作前保存快照
          for (const name of selectedParts) {
            const info = nodeMap.get(name);
            if (info && info.group) {
              info.group.visible = false;
              const cfg = info.configNode;
              if (cfg) cfg.visible = false;
            }
          }
          const count = selectedParts.size;
          deselectAll();
          updateAllHelpers();
          updateTriCount();
          console.log('🗑 已隐藏 ' + count + ' 个部件');
        }
        // Escape — 取消所有选中
        if (e.key === 'Escape') {
          deselectAll();
        }
      });

      // ============================================================
      // 15. 导出全局
      // ============================================================
      window.MODEL_CONFIGS = MODEL_CONFIGS;
      window.currentModelType = currentModelType;
      window.rebuildModel = rebuildModel;
      window.nodeMap = nodeMap;
      window.modelRoot = modelRoot;
      window._scene = scene;

      // ============================================================
      // 15.5 视图切换系统
      // ============================================================
      const VIEW_PRESETS = {
        persp: { pos: [5.0, 3.5, 6.0], target: [0, 0.8, -0.5] },
        front: { pos: [0, 0.8, 4.0], target: [0, 0.8, 0] },
        back: { pos: [0, 0.8, -4.0], target: [0, 0.8, 0] },
        left: { pos: [-4.0, 0.8, 0], target: [0, 0.8, 0] },
        right: { pos: [4.0, 0.8, 0], target: [0, 0.8, 0] },
        top: { pos: [0, 4.0, 0.01], target: [0, 0.8, 0] },
        bottom: { pos: [0, -3.0, 0.01], target: [0, 0.8, 0] },
      };
      let currentView = 'persp';
      let viewAnim = null; // { startPos, endPos, startTarget, endTarget, startTime, duration }

      function switchView(viewName) {
        // 正交切换按钮特殊处理
        if (viewName === 'ortho') {
          useOrtho = !useOrtho;
          const src = activeCamera();
          // 同步位置
          if (useOrtho) {
            orthoCamera.position.copy(camera.position);
            orthoCamera.quaternion.copy(camera.quaternion);
            orthoCamera.zoom = 1;
            orthoCamera.updateProjectionMatrix();
          } else {
            camera.position.copy(orthoCamera.position);
            camera.quaternion.copy(orthoCamera.quaternion);
          }
          // 切换 OrbitControls 到当前摄像机
          controls.object = activeCamera();
          controls.update();
          document.getElementById('ortho-toggle').classList.toggle('active', useOrtho);
          document.getElementById('ortho-toggle').title = useOrtho
            ? '切换透视 (当前: 正交)'
            : '切换正交 (当前: 透视)';
          return;
        }
        const preset = VIEW_PRESETS[viewName];
        if (!preset) return;
        currentView = viewName;
        // 更新按钮 active 状态
        document
          .querySelectorAll('#view-toolbar button[data-view]:not(#ortho-toggle)')
          .forEach((b) => {
            b.classList.toggle('active', b.dataset.view === viewName);
          });
        const dur = 500; // ms
        const cam = activeCamera();
        viewAnim = {
          startPos: cam.position.clone(),
          endPos: new THREE.Vector3(...preset.pos),
          startTarget: controls.target.clone(),
          endTarget: new THREE.Vector3(...preset.target),
          startTime: performance.now(),
          duration: dur,
        };
      }

      // 绑定按钮事件
      document.querySelectorAll('#view-toolbar button').forEach((btn) => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });
      // 初始高亮 - r19: 默认正交侧视图
      useOrtho = true;
      document.getElementById('ortho-toggle').classList.add('active');
      document.getElementById('ortho-toggle').title = '切换透视 (当前: 正交)';
      controls.object = orthoCamera;
      switchView('right');

      // 背景颜色选择器
      document.getElementById('bg-color').addEventListener('input', (e) => {
        scene.background = new THREE.Color(e.target.value);
      });

      // ============================================================
      // 16. 渲染循环
      // ============================================================
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(0.1, clock.getDelta());
        // 视图动画插值
        if (viewAnim) {
          const elapsed = performance.now() - viewAnim.startTime;
          const t = Math.min(elapsed / viewAnim.duration, 1);
          const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // easeInOutQuad
          const cam = activeCamera();
          cam.position.lerpVectors(viewAnim.startPos, viewAnim.endPos, ease);
          controls.target.lerpVectors(viewAnim.startTarget, viewAnim.endTarget, ease);
          if (t >= 1) viewAnim = null;
        }
        controls.update();
        updateAnimShowcase(dt);
        renderer.render(scene, activeCamera());
      }
      animate();

      // 首次加载后收集动画引用

      console.log('🏭 模型工厂已就绪');
