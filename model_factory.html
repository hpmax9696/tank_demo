<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>🏭 模型工厂 — 通用程序化模型编辑器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #1a1a2e;
      }
      #info {
        position: absolute;
        top: 8px;
        right: 465px;
        color: #ccc;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.7;
        max-width: 290px;
        pointer-events: none;
        z-index: 10;
      }
      #info b {
        color: #ffd866;
      }
      #stats {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: #aaa;
        font-size: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 10px;
        border-radius: 4px;
      }
      #bottom-bar {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 12px;
      }
      #toggle-helpers {
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: 1px solid #888;
        padding: 8px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      #toggle-helpers:hover {
        background: rgba(0, 0, 0, 0.85);
      }
      #toggle-anim {
        background: rgba(0, 0, 0, 0.6);
        color: #4ecdc4;
        border: 1px solid #4ecdc4;
        padding: 8px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      #toggle-anim:hover {
        background: rgba(78, 205, 196, 0.2);
      }
      #toggle-anim.active {
        background: rgba(78, 205, 196, 0.3);
        color: #fff;
        animation: pulse 1.5s infinite;
      }
      #toggle-anim:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        border-color: #555;
        color: #777;
        background: rgba(0, 0, 0, 0.3);
      }
      #toggle-iktest {
        background: rgba(0, 0, 0, 0.6);
        color: #f0a030;
        border: 1px solid #f0a030;
        padding: 8px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        margin-left: 10px;
      }
      #toggle-iktest:hover {
        background: rgba(240, 160, 48, 0.2);
      }
      #toggle-iktest.active {
        background: rgba(240, 160, 48, 0.3);
        color: #fff;
        animation: pulse-ik 1.5s infinite;
      }
      #toggle-iktest:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        border-color: #555;
        color: #777;
        background: rgba(0, 0, 0, 0.3);
      }
      @keyframes pulse-ik {
        0%,
        100% {
          box-shadow: 0 0 5px #f0a030;
        }
        50% {
          box-shadow: 0 0 20px #f0a030;
        }
      }
      #toggle-weaponcal {
        background: rgba(0, 0, 0, 0.6);
        color: #0f0;
        border: 1px solid #0f0;
        padding: 8px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        margin-left: 10px;
      }
      #toggle-weaponcal:hover {
        background: rgba(0, 255, 0, 0.2);
      }
      #toggle-weaponcal.active {
        background: rgba(0, 255, 0, 0.3);
        color: #fff;
      }
      #toggle-weaponcal:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        border-color: #555;
        color: #777;
        background: rgba(0, 0, 0, 0.3);
      }
      #anim-list {
        position: absolute;
        top: 100px;
        left: 60px;
        z-index: 20;
        display: none;
        flex-direction: column;
        gap: 2px;
        max-height: calc(100vh - 180px);
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.85);
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #555;
        min-width: 200px;
      }
      #anim-list::-webkit-scrollbar {
        width: 5px;
      }
      #anim-list::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 3px;
      }
      #anim-list .anim-item {
        background: rgba(255, 255, 255, 0.05);
        color: #aaa;
        border: 1px solid transparent;
        padding: 3px 10px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
        transition: all 0.15s;
      }
      #anim-list .anim-item:hover {
        background: rgba(78, 205, 196, 0.2);
        color: #fff;
        border-color: #4ecdc4;
      }
      #anim-list .anim-item.active {
        background: rgba(78, 205, 196, 0.3);
        color: #fff;
        border-color: #4ecdc4;
        box-shadow: 0 0 6px #4ecdc4;
      }
      #anim-list .anim-separator {
        color: #555;
        font-size: 10px;
        padding: 4px 10px 1px;
        border-top: 1px solid #333;
        margin-top: 4px;
        pointer-events: none;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 5px #4ecdc4;
        }
        50% {
          box-shadow: 0 0 20px #4ecdc4;
        }
      }
      /* lil-gui 覆盖样式 — 深色主题高对比度 */
      .lil-gui {
        --background-color: #1b1b30;
        --text-color: #d4d4d4;
        --title-background-color: #2a2a45;
        --title-color: #ffcc66;
        --widget-color: #3d5068;
        --number-color: #7eb8ff;
        --string-color: #7ee0a0;
        --font-family: 'Segoe UI', Arial, sans-serif;
      }
      .lil-gui.root {
        border-right: 1px solid #333;
      }
      #selection-box {
        position: fixed;
        border: 1px dashed #4ecdc4;
        background: rgba(78, 205, 196, 0.1);
        pointer-events: none;
        display: none;
        z-index: 100;
      }
      /* 视图工具栏 */
      #view-toolbar {
        position: absolute;
        top: 100px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 10;
      }
      #view-toolbar button {
        width: 38px;
        height: 38px;
        background: rgba(0, 0, 0, 0.65);
        color: #aaa;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #view-toolbar button:hover {
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        border-color: #888;
      }
      #view-toolbar button.active {
        background: rgba(78, 205, 196, 0.3);
        color: #4ecdc4;
        border-color: #4ecdc4;
      }
      #view-toolbar .sep {
        height: 1px;
        background: #444;
        margin: 4px 0;
      }
      /* 选中路径面包屑 */
      #path-breadcrumb {
        position: absolute;
        bottom: 20px;
        left: 12px;
        color: #aaa;
        font-size: 12px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 10px;
        border-radius: 4px;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #path-breadcrumb span {
        color: #4ecdc4;
      }
      #path-breadcrumb .sep-arrow {
        color: #666;
        margin: 0 3px;
      }
      /* 部件树面板 — 紧贴编辑面板左侧 */
      #part-tree {
        position: absolute;
        top: 0;
        right: 290px;
        width: 170px;
        height: 100vh;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.75);
        border-right: 1px solid #333;
        border-left: 1px solid #333;
        padding: 8px 0;
        z-index: 10;
        font-size: 12px;
        color: #ccc;
        user-select: none;
      }
      #part-tree::-webkit-scrollbar {
        width: 4px;
      }
      #part-tree::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 2px;
      }
      .pt-item {
        display: flex;
        align-items: center;
        padding: 3px 8px;
        cursor: pointer;
        transition: background 0.1s;
        white-space: nowrap;
      }
      .pt-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .pt-item.selected {
        background: rgba(78, 205, 196, 0.25);
        color: #4ecdc4;
      }
      .pt-item.hidden {
        color: #666;
      }
      .pt-toggle {
        width: 14px;
        height: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 2px;
        font-size: 10px;
        color: #888;
        cursor: pointer;
        flex-shrink: 0;
      }
      .pt-toggle.leaf {
        visibility: hidden;
      }
      .pt-icon {
        margin-right: 4px;
        font-size: 10px;
      }
      .pt-children {
        margin-left: 6px;
        border-left: 1px solid #333;
      }
    </style>
  </head>

    <script type="module">
      // ============================================================
      // 1. 默认材质字典
      // ============================================================
      const MATERIAL_DEFS = {
        steel: { color: 0x6b6b7b, roughness: 0.5, metalness: 0.8 },
        dark_steel: {
          color: 0x4a4a5a,
          roughness: 0.45,

          emissiveIntensity: 0.3,
        },
        barrel_steel: {
          color: 0x3a3a44,
          roughness: 0.35,
          metalness: 0.9,
          emissive: 0x0a0a0a,
          emissiveIntensity: 0.2,
        },
        rubber: {
          color: 0x2a2a2e,
          roughness: 0.9,
          metalness: 0.05,
          emissive: 0x080808,
          emissiveIntensity: 0.25,
        },
        camo_green: { color: 0x4a5c2e, roughness: 0.75, metalness: 0.1 },
        camo_dark: { color: 0x3d4f25, roughness: 0.7, metalness: 0.1 },
        camo_desert: { color: 0x8b7d4a, roughness: 0.75, metalness: 0.1 },
        wood: { color: 0x6b4e3d, roughness: 0.85, metalness: 0.0 },
        armor_dark: { color: 0x3a3a44, roughness: 0.4, metalness: 0.85 },
        armor_light: { color: 0x5a5a6a, roughness: 0.35, metalness: 0.8 },
        warning_yellow: {
          color: 0xe8a820,
          roughness: 0.5,
          metalness: 0.4,
          emissive: 0xc08010,
          emissiveIntensity: 0.15,
        },
        // ── 校园人形丧尸（Canvas 贴图，P6 精修）──
        polo_white: { color: 0xffffff, roughness: 0.7, metalness: 0.0, map: 'polo' },
        teacher_shirt: { color: 0xf2f2ee, roughness: 0.65, metalness: 0.0 },
        blouse_white: { color: 0xf6f6f2, roughness: 0.65, metalness: 0.0 },
        skin_zombie: { color: 0xffffff, roughness: 0.85, metalness: 0.0, map: 'skin' },
        eye_glow: {
          color: 0x110000,
          roughness: 0.4,
          metalness: 0.0,
          emissive: 0xff3300,
          emissiveIntensity: 3,
        },
        hair_black: { color: 0x1a1a1a, roughness: 0.8, metalness: 0.0 },
        scarf_red: { color: 0xc8202a, roughness: 0.7, metalness: 0.0 },
        collar_red: { color: 0xc8202a, roughness: 0.65, metalness: 0.0 },
        button_white: { color: 0xf8f8f8, roughness: 0.5, metalness: 0.0 },
        shorts_red: { color: 0xb81c28, roughness: 0.7, metalness: 0.0 },
        trousers_grey: { color: 0x3a3a42, roughness: 0.7, metalness: 0.0 },
        shoes_blue: { color: 0x22335a, roughness: 0.55, metalness: 0.1 },
        shoes_white: { color: 0xf0f0ec, roughness: 0.55, metalness: 0.1 },
        leather_black: { color: 0x18181c, roughness: 0.4, metalness: 0.1 },
        tie_blue: { color: 0x1f3a6a, roughness: 0.6, metalness: 0.0 },
        frame_dark: { color: 0x222222, roughness: 0.5, metalness: 0.1 },
        briefcase_brown: { color: 0x5a3a22, roughness: 0.55, metalness: 0.0 },
        metal_gold: { color: 0xc8a040, roughness: 0.3, metalness: 0.7 },
        school_badge: {
          color: 0xffffff,
          roughness: 0.7,
          metalness: 0.0,
          map: 'badge',
          transparent: true,
        },
        shoulder_stripes: {
          color: 0xffffff,
          roughness: 0.7,
          metalness: 0.0,
          map: 'stripes',
          transparent: true,
        },
        default: { color: 0x888888, roughness: 0.6, metalness: 0.2 },
      };

      // ── 人形 Canvas 贴图（复刻 enemies.js:createHumanoidMaterials，两侧统一）──
      let _humanoidTexCache = null;
      function createHumanoidTextures() {
        if (_humanoidTexCache) return _humanoidTexCache;
        // polo_white：白底 + 珠地网眼
        const polo = document.createElement('canvas');
        polo.width = polo.height = 128;
        const pctx = polo.getContext('2d');
        pctx.fillStyle = '#f4f4f0';
        pctx.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 1200; i++) {
          pctx.fillStyle = `rgba(210,210,200,${0.15 + Math.random() * 0.25})`;
          pctx.fillRect(Math.random() * 128, Math.random() * 128, 1.5, 1.5);
        }
        // skin_zombie：灰绿 + 斑点 + 暗斑
        const skin = document.createElement('canvas');
        skin.width = skin.height = 128;
        const sctx = skin.getContext('2d');
        sctx.fillStyle = '#c9cfc0';
        sctx.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 400; i++) {
          sctx.fillStyle = `rgba(150,165,140,${0.1 + Math.random() * 0.2})`;
          sctx.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
        }
        for (let i = 0; i < 6; i++) {
          const cx = Math.random() * 128,
            cy = Math.random() * 128,
            r = 4 + Math.random() * 8;
          const g = sctx.createRadialGradient(cx, cy, 0, cx, cy, r);
          g.addColorStop(0, 'rgba(110,120,95,0.4)');
          g.addColorStop(1, 'rgba(110,120,95,0)');
          sctx.fillStyle = g;
          sctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        }
        // school_badge：绿树 + 橙色校名
        const badge = document.createElement('canvas');
        badge.width = badge.height = 128;
        const bctx = badge.getContext('2d');
        bctx.clearRect(0, 0, 128, 128);
        bctx.fillStyle = '#3a8a3a';
        [
          [64, 48, 22],
          [52, 55, 16],
          [76, 55, 16],
        ].forEach(([x, y, r]) => {
          bctx.beginPath();
          bctx.arc(x, y, r, 0, Math.PI * 2);
          bctx.fill();
        });
        bctx.fillStyle = '#6b4a2a';
        bctx.fillRect(60, 60, 8, 22);
        bctx.fillStyle = '#d88a2a';
        bctx.font = 'bold 13px "Microsoft YaHei","PingFang SC","Heiti SC",sans-serif';
        bctx.textAlign = 'center';
        bctx.fillText('金福园小学', 64, 104);
        // shoulder_stripes：红/粉/绿斜条
        const strp = document.createElement('canvas');
        strp.width = strp.height = 128;
        const tctx = strp.getContext('2d');
        tctx.clearRect(0, 0, 128, 128);
        const cols = ['#d83232', '#e88a9a', '#3a8a3a'];
        for (let i = 0; i < 4; i++) {
          tctx.fillStyle = cols[i % 3];
          tctx.save();
          tctx.translate(64, 64);
          tctx.rotate(-0.5);
          tctx.fillRect(-12 + i * 8, -80, 5, 160);
          tctx.restore();
        }
        const make = (cv) => {
          const t = new THREE.CanvasTexture(cv);
          t.colorSpace = THREE.SRGBColorSpace;
          return t;
        };
        _humanoidTexCache = {
          polo: make(polo),
          skin: make(skin),
          badge: make(badge),
          stripes: make(strp),
        };
        return _humanoidTexCache;
      }

      let _camoJungleTex = null,
        _camoDesertTex = null,
        _camoTropicalDesertTex = null;

      function generateCamoTexture(type) {
        if (type === 'jungle' && _camoJungleTex) return _camoJungleTex;
        if (type === 'desert' && _camoDesertTex) return _camoDesertTex;
        if (type === 'tropical_desert' && _camoTropicalDesertTex) return _camoTropicalDesertTex;
        const size = 512;
        const cv = document.createElement('canvas');
        cv.width = size;
        cv.height = size;
        const ctx = cv.getContext('2d');
        var bg, c1, c2, c3;
        if (type === 'desert') {
          bg = '#e8d8b0';
          c1 = '#d4b88e';
          c2 = '#c4a458';
          c3 = '#efe0c0';
        } else if (type === 'tropical_desert') {
          bg = '#e0d898';
          c1 = '#f0e8a8';
          c2 = '#d8d090';
          c3 = '#c8c078';
        } else {
          bg = '#9aab70';
          c1 = '#8c9e66';
          c2 = '#7a8858';
          c3 = '#aabb78';
        }
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, size, size);
        var count = 40 + Math.floor(Math.random() * 20);
        for (var i = 0; i < count; i++) {
          var colors = [c1, c2, c3];
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          ctx.globalAlpha = 0.7 + Math.random() * 0.3;
          ctx.beginPath();
          var cx = Math.random() * size,
            cy = Math.random() * size;
          var rx = 30 + Math.random() * 80,
            ry = 20 + Math.random() * 60;
          var angle = Math.random() * Math.PI * 2;
          ctx.ellipse(cx, cy, rx, ry, angle, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        count = 10 + Math.floor(Math.random() * 10);
        for (var i = 0; i < count; i++) {
          ctx.fillStyle =
            type === 'desert' ? '#b49658' : type === 'tropical_desert' ? '#786050' : '#708048';
          ctx.globalAlpha = 0.5 + Math.random() * 0.3;
          ctx.beginPath();
          var cx = Math.random() * size,
            cy = Math.random() * size;
          var rx = 5 + Math.random() * 25,
            ry = 3 + Math.random() * 15;
          ctx.ellipse(cx, cy, rx, ry, Math.random() * Math.PI * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        var tex = new THREE.CanvasTexture(cv);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        if (type === 'jungle') _camoJungleTex = tex;
        else if (type === 'tropical_desert') _camoTropicalDesertTex = tex;
        else _camoDesertTex = tex;
        return tex;
      }

      let currentCamoType;

      function getMaterial(matId) {
        // 六足战车始终调试色；虎式仅在"调试色"模式下彩色，切入迷彩则走正常材质+纹理
        if (
          currentModelType === 'hexapod' ||
          (currentModelType === 'tiger_v16' && currentCamoType === 'debug')
        ) {
          var hexColors = {
            armor_dark: '#44CC44',
            armor_light: '#66EE66',
            dark_steel: '#4488FF',
            barrel_steel: '#FF3333',
            steel: '#BB44FF',
            warning_yellow: '#FF8800',
            // 虎式坦克专用
            camo_green: '#77DD44',
            camo_dark: '#558833',
            wood: '#DD9944',
          };
          if (hexColors[matId]) {
            return new THREE.MeshStandardMaterial({
              color: hexColors[matId],
              roughness: 0.5,
              metalness: 0.1,
            });
          }
        }
        const def = MATERIAL_DEFS[matId] || MATERIAL_DEFS.default;
        const cfg = Object.assign({}, def);
        if (def.map) {
          const tex = (createHumanoidTextures() || {})[def.map];
          if (tex) cfg.map = tex;
          else delete cfg.map;
        }
        const mat = new THREE.MeshStandardMaterial(cfg);
        if (
          currentCamoType &&
          currentCamoType !== 'debug' &&
          (matId === 'camo_green' || matId === 'camo_dark' || matId === 'camo_desert')
        ) {
          mat.map = generateCamoTexture(currentCamoType);
          mat.color.set(0x808080); // 中间灰，不过亮不过暗
        }
        return mat;
      }

      // ============================================================
      // 1.5 台型几何体（顶底矩形不同大小）
      // ============================================================
      function buildTaperedBox(bw, h, bd, tw, td, ox = 0, oz = 0, bx = 0, bz = 0) {
        const hw = bw / 2,
          hd = bd / 2,
          thw = tw / 2,
          thd = td / 2;
        const verts = [],
          uvs = [],
          indices = [];
        let vi = 0;
        function quad(a, b, c, d) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
          uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
          indices.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          vi += 4;
        }
        quad(
          [-hw + bx, 0, -hd + bz],
          [hw + bx, 0, -hd + bz],
          [hw + bx, 0, hd + bz],
          [-hw + bx, 0, hd + bz]
        );
        quad(
          [-thw + ox, h, -thd + oz],
          [-thw + ox, h, thd + oz],
          [thw + ox, h, thd + oz],
          [thw + ox, h, -thd + oz]
        );
        quad(
          [-hw + bx, 0, -hd + bz],
          [-thw + ox, h, -thd + oz],
          [thw + ox, h, -thd + oz],
          [hw + bx, 0, -hd + bz]
        );
        quad(
          [hw + bx, 0, hd + bz],
          [thw + ox, h, thd + oz],
          [-thw + ox, h, thd + oz],
          [-hw + bx, 0, hd + bz]
        );
        quad(
          [-hw + bx, 0, hd + bz],
          [-thw + ox, h, thd + oz],
          [-thw + ox, h, -thd + oz],
          [-hw + bx, 0, -hd + bz]
        );
        quad(
          [hw + bx, 0, -hd + bz],
          [thw + ox, h, -thd + oz],
          [thw + ox, h, thd + oz],
          [hw + bx, 0, hd + bz]
        );
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      // 脊线盒：五边形截面棱台（胸前一条水平脊线做隆起）
      // size: [底宽, 高, 底深, 顶宽, 顶深, 顶面X偏移, 顶面Z偏移, 脊线高度, 脊线凸出]
      // 脊线长度 = 截面宽度在 ridgeY 处的线性插值；脊线 z = 前面插值 + ridgeZ
      function buildRidgeBox(bw, h, bd, tw, td, ox = 0, oz = 0, ridgeY = 0.5 * h, ridgeZ = 0) {
        const hw = bw / 2,
          hd = bd / 2,
          thw = tw / 2,
          thd = td / 2;
        ridgeY = Math.min(Math.max(ridgeY, 0), h);
        const wRidge = bw + (ridgeY / h) * (tw - bw);
        const hwr = wRidge / 2;
        const zFrontAtRidge = hd + (ridgeY / h) * (thd + oz - hd);
        const zRidge = zFrontAtRidge + ridgeZ;
        const verts = [],
          uvs = [],
          indices = [];
        let vi = 0;
        function quad(a, b, c, d) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
          uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
          indices.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          vi += 4;
        }
        function tri(a, b, c) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
          uvs.push(0, 0, 1, 0, 1, 1);
          indices.push(vi, vi + 1, vi + 2);
          vi += 3;
        }
        // 底面（法线 -y）
        quad([-hw, 0, -hd], [hw, 0, -hd], [hw, 0, hd], [-hw, 0, hd]);
        // 顶面（法线 +y）
        quad(
          [-thw + ox, h, -thd + oz],
          [-thw + ox, h, thd + oz],
          [thw + ox, h, thd + oz],
          [thw + ox, h, -thd + oz]
        );
        // 背面（法线 -z）
        quad([-hw, 0, -hd], [-thw + ox, h, -thd + oz], [thw + ox, h, -thd + oz], [hw, 0, -hd]);
        // 前面下段：底前 → 脊线（法线 +z）
        quad([hw, 0, hd], [hwr, ridgeY, zRidge], [-hwr, ridgeY, zRidge], [-hw, 0, hd]);
        // 前面上段：脊线 → 顶前（法线 +z）
        quad(
          [hwr, ridgeY, zRidge],
          [thw + ox, h, thd + oz],
          [-thw + ox, h, thd + oz],
          [-hwr, ridgeY, zRidge]
        );
        // 左面（5 顶点，法线 -x）
        tri([-hw, 0, hd], [-hwr, ridgeY, zRidge], [-thw + ox, h, thd + oz]);
        tri([-hw, 0, hd], [-thw + ox, h, thd + oz], [-thw + ox, h, -thd + oz]);
        tri([-hw, 0, hd], [-thw + ox, h, -thd + oz], [-hw, 0, -hd]);
        // 右面（5 顶点，法线 +x）
        tri([hw, 0, -hd], [thw + ox, h, -thd + oz], [thw + ox, h, thd + oz]);
        tri([hw, 0, -hd], [thw + ox, h, thd + oz], [hwr, ridgeY, zRidge]);
        tri([hw, 0, -hd], [hwr, ridgeY, zRidge], [hw, 0, hd]);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      // 楔形：底面梯形(bwBottom→bwTop 沿 y 变宽)在 z=0 + 顶线(z=depth 突出)；4 侧面(2 梯形上下 + 2 三角左右)
      // 用于女性胸(底:靠肩宽 bwTop / 靠腰窄 bwBottom)/臀(底:靠腿宽 bwBottom / 靠腰窄 bwTop)
      function buildWedge(bwBottom, bwTop, bh, depth) {
        const hb = bwBottom / 2,
          ht = bwTop / 2,
          hm = (hb + ht) / 2,
          hh = bh / 2;
        const A = [-hb, -hh, 0],
          B = [hb, -hh, 0],
          C = [ht, hh, 0],
          D = [-ht, hh, 0];
        const E = [-hm, 0, depth],
          F = [hm, 0, depth];
        const verts = [],
          idx = [];
        let vi = 0;
        function quad(a, b, c, d) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
          idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          vi += 4;
        }
        function tri(a, b, c) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
          idx.push(vi, vi + 1, vi + 2);
          vi += 3;
        }
        quad(A, B, C, D); // 底面 z=0（法线 -z 朝后）
        quad(A, B, F, E); // 下侧面(梯形，法线朝下前)
        quad(D, E, F, C); // 上侧面(梯形，法线朝上前)
        tri(A, E, D); // 左侧面(三角，法线 -x)
        tri(B, C, F); // 右侧面(三角，法线 +x)
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        return geo;
      }

      // 椭圆六棱台：底面和顶面是压扁的六边形
      // size: [底宽, 高, 底深, 顶宽, 顶深]
      function buildTaperedHex(bw, h, bd, tw, td, ox = 0, oz = 0) {
        const hw = bw / 2,
          hd = bd / 2,
          thw = tw / 2,
          thd = td / 2;
        const S3 = Math.sqrt(3) / 2;
        const verts = [],
          uvs = [],
          indices = [];
        let vi = 0;
        function quad(a, b, c, d) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
          uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
          indices.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          vi += 4;
        }
        function hexFan(p0, p1, p2, p3, p4, p5) {
          verts.push(
            p0[0],
            p0[1],
            p0[2],
            p1[0],
            p1[1],
            p1[2],
            p2[0],
            p2[1],
            p2[2],
            p3[0],
            p3[1],
            p3[2],
            p4[0],
            p4[1],
            p4[2],
            p5[0],
            p5[1],
            p5[2]
          );
          uvs.push(0.5, 0.5, 1, 0.5, 1, 1, 0.5, 1, 0, 1, 0, 0.5);
          indices.push(
            vi,
            vi + 1,
            vi + 2,
            vi,
            vi + 2,
            vi + 3,
            vi,
            vi + 3,
            vi + 4,
            vi,
            vi + 4,
            vi + 5
          );
          vi += 6;
        }
        hexFan(
          [hw, 0, 0],
          [hw / 2, 0, hd * S3],
          [-hw / 2, 0, hd * S3],
          [-hw, 0, 0],
          [-hw / 2, 0, -hd * S3],
          [hw / 2, 0, -hd * S3]
        );
        hexFan(
          [thw + ox, h, 0 + oz],
          [thw / 2 + ox, h, -thd * S3 + oz],
          [-thw / 2 + ox, h, -thd * S3 + oz],
          [-thw + ox, h, 0 + oz],
          [-thw / 2 + ox, h, thd * S3 + oz],
          [thw / 2 + ox, h, thd * S3 + oz]
        );
        quad(
          [hw, 0, 0],
          [thw + ox, h, 0 + oz],
          [thw / 2 + ox, h, thd * S3 + oz],
          [hw / 2, 0, hd * S3]
        );
        quad(
          [hw / 2, 0, hd * S3],
          [thw / 2 + ox, h, thd * S3 + oz],
          [-thw / 2 + ox, h, thd * S3 + oz],
          [-hw / 2, 0, hd * S3]
        );
        quad(
          [-hw / 2, 0, hd * S3],
          [-thw / 2 + ox, h, thd * S3 + oz],
          [-thw + ox, h, 0 + oz],
          [-hw, 0, 0]
        );
        quad(
          [-hw, 0, 0],
          [-thw + ox, h, 0 + oz],
          [-thw / 2 + ox, h, -thd * S3 + oz],
          [-hw / 2, 0, -hd * S3]
        );
        quad(
          [-hw / 2, 0, -hd * S3],
          [-thw / 2 + ox, h, -thd * S3 + oz],
          [thw / 2 + ox, h, -thd * S3 + oz],
          [hw / 2, 0, -hd * S3]
        );
        quad(
          [hw / 2, 0, -hd * S3],
          [thw / 2 + ox, h, -thd * S3 + oz],
          [thw + ox, h, 0 + oz],
          [hw, 0, 0]
        );
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }
      function buildBentBox(w, h, d, bendAngle, segments) {
        const r = d / bendAngle;
        const hw = w / 2;
        const n = segments;

        const bY = [],
          bZ = [],
          tY = [],
          tZ = [];
        for (let i = 0; i <= n; i++) {
          const z = (i / n - 0.5) * d;
          const th = z / r;
          const s = Math.sin(th),
            c = Math.cos(th);
          bY.push(r * (1 - c));
          bZ.push(r * s);
          const rh = r - h;
          tY.push(r - rh * c);
          tZ.push(rh * s);
        }

        const verts = [],
          uvs = [];
        const indices = [];
        let vi = 0;

        function quad(a, b, c, d) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
          uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
          indices.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          vi += 4;
        }

        for (let i = 0; i < n; i++) {
          quad(
            [-hw, bY[i], bZ[i]],
            [hw, bY[i], bZ[i]],
            [hw, bY[i + 1], bZ[i + 1]],
            [-hw, bY[i + 1], bZ[i + 1]]
          );
          quad(
            [-hw, tY[i + 1], tZ[i + 1]],
            [hw, tY[i + 1], tZ[i + 1]],
            [hw, tY[i], tZ[i]],
            [-hw, tY[i], tZ[i]]
          );
          quad(
            [-hw, bY[i], bZ[i]],
            [-hw, tY[i], tZ[i]],
            [-hw, tY[i + 1], tZ[i + 1]],
            [-hw, bY[i + 1], bZ[i + 1]]
          );
          quad(
            [hw, bY[i + 1], bZ[i + 1]],
            [hw, tY[i + 1], tZ[i + 1]],
            [hw, tY[i], tZ[i]],
            [hw, bY[i], bZ[i]]
          );
        }

        quad([-hw, bY[0], bZ[0]], [hw, bY[0], bZ[0]], [hw, tY[0], tZ[0]], [-hw, tY[0], tZ[0]]);
        quad([hw, bY[n], bZ[n]], [-hw, bY[n], bZ[n]], [-hw, tY[n], tZ[n]], [hw, tY[n], tZ[n]]);

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      // ProfiledExtrude 预设形状库（俯视轮廓：x=左右, y=前后；应用后可在"高级 JSON"微调）
      const PE_SHAPE_PRESETS = {
        马蹄形虎式: [
          ['line', -0.55, 0.85],
          ['line', -0.75, -0.35],
          ['arc', 0, -0.35, 0.75, Math.PI, 0],
          ['line', 0.75, -0.35],
          ['line', 0.55, 0.85],
        ],
        矩形: [
          ['line', -0.7, 0.8],
          ['line', -0.7, -0.8],
          ['line', 0.7, -0.8],
          ['line', 0.7, 0.8],
        ],
        梯形前窄后宽: [
          ['line', -0.45, 0.85],
          ['line', -0.75, -0.35],
          ['line', 0.75, -0.35],
          ['line', 0.45, 0.85],
        ],
        半圆前突: [
          ['line', -0.6, -0.4],
          ['arc', 0, -0.4, 0.6, Math.PI, 0],
          ['line', 0.6, -0.4],
        ],
        六边形: [
          ['line', -0.4, 0.8],
          ['line', -0.7, 0],
          ['line', -0.4, -0.5],
          ['line', 0.4, -0.5],
          ['line', 0.7, 0],
          ['line', 0.4, 0.8],
        ],
        扇环尾舱: [
          // 环形扇区：外弧(逆时针)+内弧(顺时针)。两条径向边由 absarc 自动 lineTo + closePath 生成
          ['arc', 0, 0, 0.65, Math.PI * 0.25, Math.PI * 0.75],
          ['arc', 0, 0, 0.42, Math.PI * 0.75, Math.PI * 0.25, true],
        ],
      };

      // ProfiledExtrude — 可变高度拉伸 (XY轮廓 + roofProfile沿Z变高)
      function buildProfiledExtrude(shapeDef, roofProfile, arcSegments) {
        // 1. 构建 THREE.Shape
        const shape = new THREE.Shape();
        let first = true;
        for (const seg of shapeDef) {
          if (seg[0] === 'arc') {
            const [, cx, cy, radius, startAngle, endAngle, clockwise] = seg;
            if (first) {
              shape.moveTo(cx + radius * Math.cos(startAngle), cy + radius * Math.sin(startAngle));
              first = false;
            }
            shape.absarc(cx, cy, radius, startAngle, endAngle, clockwise === true);
          } else if (seg[0] === 'line') {
            const [, x, y] = seg;
            if (first) {
              shape.moveTo(x, y);
              first = false;
            } else shape.lineTo(x, y);
          }
        }
        shape.closePath();

        // 2. roof 高度插值
        function roofH(y) {
          if (!roofProfile || roofProfile.length === 0) return 1.0;
          if (roofProfile.length === 1) return roofProfile[0][1];
          // 按 Y 排序（降序=前到后）
          const sorted = [...roofProfile].sort((a, b) => b[0] - a[0]);
          if (y >= sorted[0][0]) return sorted[0][1];
          if (y <= sorted[sorted.length - 1][0]) return sorted[sorted.length - 1][1];
          for (let i = 0; i < sorted.length - 1; i++) {
            const [y0, h0] = sorted[i];
            const [y1, h1] = sorted[i + 1];
            if ((y <= y0 && y >= y1) || (y >= y0 && y <= y1)) {
              if (Math.abs(y1 - y0) < 1e-9) return h0;
              return h0 + ((y - y0) / (y1 - y0)) * (h1 - h0);
            }
          }
          return sorted[0][1];
        }

        // 3. 边界采样
        const bpts = shape.getPoints(arcSegments);
        const N = bpts.length - 1; // getPoints 返回 divisions+1 个点, 最后一个=第一个

        const verts = [],
          uvs = [],
          idxArr = [];
        let vi = 0;

        // Quad 辅助 — 每个 quad 独立顶点, 不复用, 保证硬边
        function addQuad(a, b, c, d, u0, u1) {
          verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
          uvs.push(u0, 0, u1, 0, u1, 1, u0, 1);
          idxArr.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          vi += 4;
        }

        // 4. 侧面 quad strip — 每个分段独立顶点, UV 沿周长 U + 高度 V
        for (let i = 0; i < N; i++) {
          const j = (i + 1) % N;
          const pi = bpts[i],
            pj = bpts[j];
          const hi = roofH(pi.y),
            hj = roofH(pj.y);
          const u0 = i / N,
            u1 = (i + 1) / N;
          // 四边形: floor_i, floor_j, roof_j, roof_i → 法线朝外 (CCW 从外侧看)
          addQuad([pi.x, pi.y, 0], [pj.x, pj.y, 0], [pj.x, pj.y, hj], [pi.x, pi.y, hi], u0, u1);
        }

        // 5. 底面 cap — ShapeGeometry 三角化, Z 偏移避免与侧面顶点 hash 合并
        const capGeo = new THREE.ShapeGeometry(shape, arcSegments);
        const capPos = capGeo.getAttribute('position');
        const capIdx = capGeo.getIndex();
        const EPS = 0.0001;

        const floorBase = vi;
        for (let i = 0; i < capPos.count; i++) {
          verts.push(capPos.getX(i), capPos.getY(i), -EPS);
          uvs.push(capPos.getX(i), capPos.getY(i));
        }
        // 翻转索引 → 法线朝 -Z (底面外侧朝下)
        for (let i = 0; i < capIdx.count; i += 3) {
          idxArr.push(
            capIdx.getX(i) + floorBase,
            capIdx.getX(i + 2) + floorBase,
            capIdx.getX(i + 1) + floorBase
          );
        }
        vi += capPos.count;

        // 6. 屋顶 cap — 保持原索引(法线朝 +Z 外侧朝上), Z 偏移
        const roofBase = vi;
        for (let i = 0; i < capPos.count; i++) {
          const y = capPos.getY(i);
          verts.push(capPos.getX(i), y, roofH(y) + EPS);
          uvs.push(capPos.getX(i), y);
        }
        for (let i = 0; i < capIdx.count; i++) idxArr.push(capIdx.getX(i) + roofBase);
        vi += capPos.count;
        capGeo.dispose();

        // 7. 组装
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geo.setIndex(idxArr);
        geo.computeVertexNormals();
        return geo;
      }

      function createGeometry(node) {
        const s = node.size || [1, 1, 1];
        const seg = node.segments || [8, 1];
        switch (node.type) {
          case 'Box':
            return new THREE.BoxGeometry(s[0], s[1] || s[0], s[2] || s[0]);
          case 'BentBox':
            return buildBentBox(
              s[0],
              s[1] || 0.3,
              s[2] || s[0],
              s[3] != null ? s[3] : Math.PI / 6,
              seg[0] || 16
            );
          case 'TaperedBox':
            // size: [底部宽, 高, 底部深, 顶部宽, 顶部深, 顶面X偏移, 顶面Z偏移, 底面X偏移, 底面Z偏移]
            return buildTaperedBox(
              s[0],
              s[1] || 1,
              s[2] || s[0],
              s[3] !== undefined ? s[3] : s[0] * 0.6,
              s[4] !== undefined ? s[4] : s[2] * 0.6,
              s[5] || 0,
              s[6] || 0,
              s[7] || 0,
              s[8] || 0
            );
          case 'RidgeBox':
            // size: [底宽, 高, 底深, 顶宽, 顶深, 顶面X偏移, 顶面Z偏移, 脊线高度, 脊线凸出]
            return buildRidgeBox(
              s[0],
              s[1] || 1,
              s[2] || s[0],
              s[3] !== undefined ? s[3] : s[0] * 0.6,
              s[4] !== undefined ? s[4] : s[2] * 0.6,
              s[5] || 0,
              s[6] || 0,
              s[7] != null ? s[7] : 0.5 * (s[1] || 1),
              s[8] || 0
            );
          case 'TaperedHex':
            // size: [底宽, 高, 底深, 顶宽, 顶深, 顶面X偏移, 顶面Z偏移]
            return buildTaperedHex(
              s[0],
              s[1] || 1,
              s[2] || s[0],
              s[3] !== undefined ? s[3] : s[0] * 0.6,
              s[4] !== undefined ? s[4] : s[2] * 0.6,
              s[5] || 0,
              s[6] || 0
            );
          case 'RoundedBox':
            // size: [width, height, depth, radius, segments]
            return new RoundedBoxGeometry(
              s[0],
              s[1] || s[0],
              s[2] || s[0],
              seg[0] || 3,
              s[3] || 0.08
            );
          case 'Cylinder':
            return new THREE.CylinderGeometry(
              s[0],
              s[2] !== undefined ? s[2] : s[0],
              s[1],
              seg[0] || 6
            );
          case 'Sphere': {
            const tl = node.thetaLength != null ? node.thetaLength : Math.PI;
            return new THREE.SphereGeometry(s[0], seg[0] || 8, seg[1] || 6, 0, Math.PI * 2, 0, tl);
          }
          case 'Torus':
            return new THREE.TorusGeometry(s[0], s[1] || 0.05, seg[0] || 8, seg[1] || 12);
          case 'Plane':
            return new THREE.PlaneGeometry(s[0], s[1] || s[0], seg[0] || 1, seg[1] || 1);
          case 'Wedge':
            // size: [底面下宽(bwBottom), 底面上宽(bwTop), 底高, 突出深度]
            return buildWedge(
              s[0],
              s[1] != null ? s[1] : s[0],
              s[2] != null ? s[2] : 0.1,
              s[3] != null ? s[3] : 0.1
            );
          case 'Lathe': {
            const profile = node.profile || [
              [0.5, 0],
              [0.5, 0.3],
              [0.6, 0.3],
              [0.6, 0.35],
              [0.55, 0.4],
              [0.3, 0.45],
              [0.1, 0.4],
            ];
            const sR = node.scaleR ?? 1;
            const sH = node.scaleH ?? 1;
            const pts = profile.map((p) => new THREE.Vector2(p[0] * sR, p[1] * sH));
            return new THREE.LatheGeometry(pts, seg[0] || 24);
          }
          case 'Extrude': {
            const shape = node.shape || [
              [-0.5, -0.2],
              [0.5, -0.2],
              [0.5, 0.2],
              [-0.5, 0.2],
            ];
            const shape2D = new THREE.Shape(shape.map((p) => new THREE.Vector2(p[0], p[1])));
            const depth = node.extrudeDepth !== undefined ? node.extrudeDepth : 0.5;
            const bevel = node.bevelThickness || 0.02;
            return new THREE.ExtrudeGeometry(shape2D, {
              depth,
              bevelThickness: bevel,
              bevelSize: bevel,
              bevelSegments: 2,
            });
          }
          case 'ProfiledExtrude': {
            const rawShape = node.shape || [
              ['line', -0.55, 0.85],
              ['line', -0.75, -0.35],
              ['arc', 0, -0.35, 0.75, Math.PI, 0],
              ['line', 0.75, -0.35],
              ['line', 0.55, 0.85],
            ];
            const sc = node.shapeScale || [1, 1];
            // 应用轮廓缩放：line 坐标×scale，arc 圆心×scale + 半径按 X/Y 平均
            const shape = rawShape.map((s) => {
              if (s[0] === 'line') return ['line', s[1] * sc[0], s[2] * sc[1]];
              if (s[0] === 'arc') {
                const r = s[3] * ((Math.abs(sc[0]) + Math.abs(sc[1])) / 2);
                return ['arc', s[1] * sc[0], s[2] * sc[1], r, s[4], s[5], s[6]];
              }
              return s.slice();
            });
            const roof = node.roofProfile || [
              [0.85, 0.48],
              [-0.35, 0.65],
              [-1.1, 0.65],
            ];
            const segs = (node.segments && node.segments[0]) || 24;
            return buildProfiledExtrude(shape, roof, segs);
          }
          default:
            return null;
        }
      }

      // TrackChain 履带链生成器
      function buildTrackChain(node, parentGroup, pivotComp = [0, 0, 0]) {
        const tp = node.trackParams;
        const g = new THREE.Group();
        g.name = node.name;
        if (node.position) {
          const pos = [
            node.position[0] + pivotComp[0],
            node.position[1] + pivotComp[1],
            node.position[2] + pivotComp[2],
          ];
          g.position.set(...pos);
        }
        if (node.scale) g.scale.set(...node.scale);
        g.visible = node.visible !== false;
        parentGroup.add(g);

        const cyF = tp.wheelCenterYFront,
          cyR = tp.wheelCenterYRear;
        const rF = tp.wheelRadiusFront,
          rR = tp.wheelRadiusRear;
        const zF = tp.wheelCenterZFront,
          zR = tp.wheelCenterZRear;

        // r21: 6点+2弧精确几何模型（用户设计的理想拓扑）
        // 负重轮参数（可配置；缺省=T-34 值，保证 T-34 零回归）
        const zR1 = tp.roadWheelFrontZ !== undefined ? tp.roadWheelFrontZ : 1.4; // 首负重轮 Z
        const zR5 = tp.roadWheelRearZ !== undefined ? tp.roadWheelRearZ : -2.55; // 尾负重轮 Z
        const wheelR = tp.roadWheelRadius !== undefined ? tp.roadWheelRadius : 0.4; // 负重轮半径
        const wheelY = tp.roadWheelY !== undefined ? tp.roadWheelY : 0.4; // 负重轮中心 Y

        // 6个关键点坐标（与 getTrackPlateTransform 保持完全一致）
        // ⚠️ 注意：Z轴在屏幕上方向与数学X轴相反（左=Z+），所以Z分量需取负
        const pA = { z: zR - rR * Math.cos(Math.PI / 2), y: cyR + rR * Math.sin(Math.PI / 2) }; // A: c1轮12点(+90°)
        const pB = { z: zF - rF * Math.cos(Math.PI / 2), y: cyF + rF * Math.sin(Math.PI / 2) }; // B: a1轮12点(+90°)
        const angleC = (-120 * Math.PI) / 180; // -120° (7点钟)
        const pC = { z: zF - rF * Math.cos(angleC), y: cyF + rF * Math.sin(angleC) }; // C: a1轮7点
        // D: b1轮6.5点钟位置(约-105°, 在轮子边沿的6点和7点之间)
        const angleD = (-105 * Math.PI) / 180; // -105° (6点半位置)
        const pD = { z: zR1 - wheelR * Math.cos(angleD), y: wheelY + wheelR * Math.sin(angleD) }; // D: b1轮6.5点(边沿)
        // E: b5轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
        const angleE = (-75 * Math.PI) / 180; // -75° (5点半)
        const pE = { z: zR5 - wheelR * Math.cos(angleE), y: wheelY + wheelR * Math.sin(angleE) }; // E: b5轮5.5点(边沿)
        // F: c1轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
        const angleF = (-75 * Math.PI) / 180; // -75° (5点半)
        const pF = { z: zR - rR * Math.cos(angleF), y: cyR + rR * Math.sin(angleF) }; // F: c1轮5.5点(边沿)

        // 6段长度
        const lenAB = Math.sqrt((pB.z - pA.z) ** 2 + (pB.y - pA.y) ** 2); // AB: 上支路(c1→a1)
        const lenBC = (angleC + 2 * Math.PI - Math.PI / 2) * rF; // BC: 前弧(绕a1, 逆时针短弧 12→11→10→9→8→7 = 150°)
        const lenCD = Math.sqrt((pD.z - pC.z) ** 2 + (pD.y - pC.y) ** 2); // CD: 下前斜线(a1→b1)
        const lenDE = Math.abs(pE.z - pD.z); // DE: 下主干(b1→b5)
        const lenEF = Math.sqrt((pF.z - pE.z) ** 2 + (pF.y - pE.y) ** 2); // EF: 下后斜线(b5→c1)
        const lenFA = (Math.PI / 2 - angleF) * rR; // FA: 后弧(绕c1, -120°→90°=210°)

        const totalLen = lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;
        const spacing = totalLen / (tp.count - 1);

        const matId = node.materialId || 'dark_steel';
        const isCamoTC = matId === 'camo_green' || matId === 'camo_dark' || matId === 'camo_desert';
        const mat =
          node.color && !isCamoTC
            ? new THREE.MeshStandardMaterial({
                color: node.color,
                roughness: 0.65,
                metalness: 0.15,
              })
            : getMaterial(matId);

        for (let i = 0; i < tp.count; i++) {
          const dist = i * spacing;
          const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
          const plate = new THREE.Mesh(
            new THREE.BoxGeometry(tp.plateWidth, tp.plateHeight, tp.plateDepth),
            mat
          );
          plate.position.set(pp.x, pp.y, pp.z);
          plate.rotation.set(rot.x, rot.y, rot.z);
          plate.castShadow = true;
          plate.receiveShadow = true;
          g.add(plate);
        }

        // 🆕 TrackChain 理论路径可视化（调试用，绿色Line）
        if (tp.showPath) {
          const pathPts = [];
          const steps = 200;
          for (let i = 0; i <= steps; i++) {
            const d = (i / steps) * totalLen;
            const { pos: pp } = getTrackPlateTransform(d, tp);
            pathPts.push(new THREE.Vector3(pp.x, pp.y, pp.z));
          }
          const lineGeo = new THREE.BufferGeometry().setFromPoints(pathPts);
          const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
          const line = new THREE.Line(lineGeo, lineMat);
          line.name = node.name + '_path';
          g.add(line);
        }

        nodeMap.set(node.name, { group: g, mesh: null, configNode: node, rotTarget: g });
      }

      function getTrackPlateTransform(dist, tp) {
        // r21: 6点+2弧精确几何模型（用户设计的理想拓扑）
        const cyF = tp.wheelCenterYFront,
          cyR = tp.wheelCenterYRear;
        const rF = tp.wheelRadiusFront,
          rR = tp.wheelRadiusRear;
        const zF = tp.wheelCenterZFront,
          zR = tp.wheelCenterZRear;

        // 负重轮参数（可配置；缺省=T-34 值，保证 T-34 零回归）
        const zR1 = tp.roadWheelFrontZ !== undefined ? tp.roadWheelFrontZ : 1.4; // 首负重轮 Z
        const zR5 = tp.roadWheelRearZ !== undefined ? tp.roadWheelRearZ : -2.55; // 尾负重轮 Z
        const wheelR = tp.roadWheelRadius !== undefined ? tp.roadWheelRadius : 0.4; // 负重轮半径
        const wheelY = tp.roadWheelY !== undefined ? tp.roadWheelY : 0.4; // 负重轮中心 Y

        // ========== 6个关键点的精确坐标（基于用户确认的拓扑）==========
        // ⚠️ Z轴修正：屏幕左边=Z+，所以 Z = center.z - r*cos(angle)
        // A: 主动轮(c1)12点钟位置 (+90°)
        const pA = { z: zR - rR * Math.cos(Math.PI / 2), y: cyR + rR * Math.sin(Math.PI / 2) }; // (-3.30, 0.75)
        // B: 诱导轮(a1)12点钟位置 (+90°)
        const pB = { z: zF - rF * Math.cos(Math.PI / 2), y: cyF + rF * Math.sin(Math.PI / 2) }; // (+2.10, 0.74)
        // C: 诱导轮(a1)7点钟位置 (-120°, 左下方)
        const angleC = (-120 * Math.PI) / 180; // -120° (7点钟)
        const pC = { z: zF - rF * Math.cos(angleC), y: cyF + rF * Math.sin(angleC) };
        // D: 第1负重轮(b1)边沿切点 (6.5点钟位置, -105°)
        const angleD = (-105 * Math.PI) / 180; // -105° (6点半)
        const pD = { z: zR1 - wheelR * Math.cos(angleD), y: wheelY + wheelR * Math.sin(angleD) }; // D: b1轮6.5点(边沿)
        // E: 第5负重轮(b5)底部切点 (6点, 正下方)
        const angleE = (-75 * Math.PI) / 180; // -75° (5点半, 在5-6点之间)
        const pE = { z: zR5 - wheelR * Math.cos(angleE), y: wheelY + wheelR * Math.sin(angleE) }; // E: b5轮5.5点(边沿)
        // F: c1轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
        const angleF = (-75 * Math.PI) / 180; // -75° (5点半)
        const pF = { z: zR - rR * Math.cos(angleF), y: cyR + rR * Math.sin(angleF) }; // F: c1轮5.5点(边沿)

        // ========== 6段长度计算 ==========
        const lenAB = Math.sqrt((pB.z - pA.z) ** 2 + (pB.y - pA.y) ** 2); // AB: 上支路(主动轮顶→诱导轮顶)
        const lenBC = (angleC + 2 * Math.PI - Math.PI / 2) * rF; // BC: 前弧(绕诱导轮, 逆时针短弧 12→11→10→9→8→7 = 150°)
        const lenCD = Math.sqrt((pD.z - pC.z) ** 2 + (pD.y - pC.y) ** 2); // CD: 下前斜线(诱导轮底→轮1底)
        const lenDE = Math.abs(pE.z - pD.z); // DE: 下支路主干(Y恒定=0.20)
        const lenEF = Math.sqrt((pF.z - pE.z) ** 2 + (pF.y - pE.y) ** 2); // EF: 下后斜线(轮5底→主动轮底)
        const lenFA = (Math.PI / 2 - angleF) * rR; // FA: 后弧(绕主动轮, -120°→90°=210°)

        const totalLen = lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;

        // 兜底 pos = 路径终点 pA：最后一块 plate 的 dist=totalLen 经 5 次 d-=lenXX 后浮点累积
        // 误差会略大于 lenFA，6 段条件全不满足而落到此兜底；应回到起点 pA（履带闭合），而非原点
        let pos = { x: 0, y: pA.y, z: pA.z };
        let rot = { x: 0, y: 0, z: 0 };
        let d = dist;

        // 段1: AB 上支路 (线性插值)
        if (d <= lenAB) {
          const t = d / lenAB;
          pos.z = pA.z + t * (pB.z - pA.z);
          pos.y = pA.y + t * (pB.y - pA.y);
          rot.x = 0;
          return { pos, rot };
        }
        d -= lenAB;

        // 段2: BC 前弧 (绕诱导轮, 逆时针短弧: 12→11→10→9→8→7)
        // ⚠️ Z轴修正: Z = centerZ - r*cos(angle)
        // 角度从 +90°(12点) 增加到 +240°(= -120°+360°, 7点的等效角度), 走150°逆时针短弧
        if (d <= lenBC) {
          const angle = Math.PI / 2 + (d / lenBC) * (angleC + 2 * Math.PI - Math.PI / 2); // 90° → 240° (逆时针)
          pos.z = zF - rF * Math.cos(angle);
          pos.y = cyF + rF * Math.sin(angle);
          rot.x = angle - Math.PI / 2;
          return { pos, rot };
        }
        d -= lenBC;

        // 段3: CD 下支路前斜线 (线性插值)
        if (d <= lenCD) {
          const t = d / lenCD;
          pos.z = pC.z + t * (pD.z - pC.z);
          pos.y = pC.y + t * (pD.y - pC.y);
          rot.x = 0;
          return { pos, rot };
        }
        d -= lenCD;

        // 段4: DE 下支路主干 (Y恒定=0.20, 切于各负重轮底部)
        if (d <= lenDE) {
          const t = d / lenDE;
          pos.z = pD.z + t * (pE.z - pD.z);
          pos.y = pD.y;
          rot.x = 0;
          return { pos, rot };
        }
        d -= lenDE;

        // 段5: EF 下支路后斜线 (线性插值)
        if (d <= lenEF) {
          const t = d / lenEF;
          pos.z = pE.z + t * (pF.z - pE.z);
          pos.y = pE.y + t * (pF.y - pE.y);
          rot.x = 0;
          return { pos, rot };
        }
        d -= lenEF;

        // 段6: FA 后弧 (绕主动轮, 标准圆弧 cos/sin)
        // ⚠️ Z轴修正: Z = centerZ - r*cos(angle)
        if (d <= lenFA) {
          const angle = angleF + (d / lenFA) * (Math.PI / 2 - angleF); // -120° → 90°
          pos.z = zR - rR * Math.cos(angle);
          pos.y = cyR + rR * Math.sin(angle);
          rot.x = angle - Math.PI / 2;
          return { pos, rot };
        }

        return { pos, rot };
      }

      // 履带总长（6段：AB上支路 + BC前弧 + CD下前斜 + DE下主干 + EF下后斜 + FA后弧）
      // 与 getTrackPlateTransform / buildTrackChain 的 6 点+6 段公式完全一致
      // （v0.65.13 补回：原仅内联，_tankCollectRefs 调用缺失导致展台不播放）
      function computeTrackTotalLen(tp) {
        const cyF = tp.wheelCenterYFront,
          cyR = tp.wheelCenterYRear;
        const rF = tp.wheelRadiusFront,
          rR = tp.wheelRadiusRear;
        const zF = tp.wheelCenterZFront,
          zR = tp.wheelCenterZRear;
        const zR1 = tp.roadWheelFrontZ !== undefined ? tp.roadWheelFrontZ : 1.4;
        const zR5 = tp.roadWheelRearZ !== undefined ? tp.roadWheelRearZ : -2.55;
        const wheelR = tp.roadWheelRadius !== undefined ? tp.roadWheelRadius : 0.4;
        const wheelY = tp.roadWheelY !== undefined ? tp.roadWheelY : 0.4;
        const pA = { z: zR - rR * Math.cos(Math.PI / 2), y: cyR + rR * Math.sin(Math.PI / 2) };
        const pB = { z: zF - rF * Math.cos(Math.PI / 2), y: cyF + rF * Math.sin(Math.PI / 2) };
        const angleC = (-120 * Math.PI) / 180;
        const pC = { z: zF - rF * Math.cos(angleC), y: cyF + rF * Math.sin(angleC) };
        const angleD = (-105 * Math.PI) / 180;
        const pD = { z: zR1 - wheelR * Math.cos(angleD), y: wheelY + wheelR * Math.sin(angleD) };
        const angleE = (-75 * Math.PI) / 180;
        const pE = { z: zR5 - wheelR * Math.cos(angleE), y: wheelY + wheelR * Math.sin(angleE) };
        const angleF = (-75 * Math.PI) / 180;
        const pF = { z: zR - rR * Math.cos(angleF), y: cyR + rR * Math.sin(angleF) };
        const lenAB = Math.sqrt((pB.z - pA.z) ** 2 + (pB.y - pA.y) ** 2);
        const lenBC = (angleC + 2 * Math.PI - Math.PI / 2) * rF;
        const lenCD = Math.sqrt((pD.z - pC.z) ** 2 + (pD.y - pC.y) ** 2);
        const lenDE = Math.abs(pE.z - pD.z);
        const lenEF = Math.sqrt((pF.z - pE.z) ** 2 + (pF.y - pE.y) ** 2);
        const lenFA = (Math.PI / 2 - angleF) * rR;
        return lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;
      }

      // 沿路径平移所有履带板（前进/后退动画用），环形取模实现无限循环
      function updateTrackPlates(refs, offL, offR) {
        const sides = [
          {
            plates: refs.leftTrackPlates,
            tp: refs.leftTrackParams,
            total: refs.leftTrackTotalLen,
            spacing: refs.leftTrackSpacing,
            off: offL,
          },
          {
            plates: refs.rightTrackPlates,
            tp: refs.rightTrackParams,
            total: refs.rightTrackTotalLen,
            spacing: refs.rightTrackSpacing,
            off: offR,
          },
        ];
        for (const s of sides) {
          if (!s.plates || !s.tp || !s.total) continue;
          for (let i = 0; i < s.plates.length; i++) {
            const dist = (((i * s.spacing + s.off) % s.total) + s.total) % s.total;
            const tr = getTrackPlateTransform(dist, s.tp);
            s.plates[i].position.set(tr.pos.x, tr.pos.y, tr.pos.z);
            s.plates[i].rotation.set(tr.rot.x, tr.rot.y, tr.rot.z);
          }
        }
      }

      // ============================================================
      // 3. 辅助色（BoxHelper 颜色映射）
      // ============================================================
      function helperColor(name) {
        const hash = name.split('').reduce((a, c) => (a << 5) - a + c.charCodeAt(0), 0);
        const hues = [
          0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181, 0xaa96da, 0x88d8b0, 0x70c1b3, 0xff8a5c,
          0xcca000,
        ];
        return hues[Math.abs(hash) % hues.length];
      }

      // ============================================================
      // 4. 递归构建函数 buildFromConfig()
      // ============================================================
      function buildFromConfig(config, parent, showHelpers, nodeMap) {
        const helpers = [];
        function adjustPos(rawPos, comp) {
          return [rawPos[0] + comp[0], rawPos[1] + comp[1], rawPos[2] + comp[2]];
        }

        function buildNode(node, parentObj, pivotComp = [0, 0, 0]) {
          if (node.type === 'Group') {
            const g = new THREE.Group();
            g.name = node.name;
            if (node.position) g.position.set(...adjustPos(node.position, pivotComp));
            if (node.scale) g.scale.set(...node.scale);
            g.visible = node.visible !== false;
            parentObj.add(g);

            let rotTarget = g;
            if (node.pivot) {
              const pivot = new THREE.Group();
              pivot.name = node.name + '_pivot';
              pivot.position.set(node.pivot[0], node.pivot[1], node.pivot[2]);
              g.add(pivot);
              rotTarget = pivot;
              g.userData.pivot = pivot;
            }
            if (node.rotation) rotTarget.rotation.set(...node.rotation);

            // Group也要存入nodeMap，否则GUI面板找不到它
            nodeMap.set(node.name, { group: g, mesh: null, configNode: node, rotTarget });

            const childComp = node.pivot
              ? [-node.pivot[0], -node.pivot[1], -node.pivot[2]]
              : [0, 0, 0];
            g.userData.appliedComp = pivotComp;
            g.userData.childComp = childComp;

            if (node.children) {
              for (const c of node.children) buildNode(c, rotTarget, childComp);
            }
            return;
          }

          if (node.type === 'TrackChain') {
            buildTrackChain(node, parentObj, pivotComp);
            return;
          }

          const geo = createGeometry(node);
          const geo2 = createGeometry(node);
          // NaN 诊断
          if (geo2.attributes && geo2.attributes.position) {
            const p = geo2.attributes.position;
            for (let i = 0; i < Math.min(p.count, 3); i++) {
              if (!isFinite(p.getX(i))) {
                console.warn(
                  '⚠️ NaN geometry from createGeometry:',
                  node.name,
                  node.type,
                  JSON.stringify(node.size)
                );
                break;
              }
            }
          }
          // 安全居中：避免某些几何体 computeBoundingBox 产生 NaN
          geo2.computeBoundingBox();
          const box = geo2.boundingBox;
          if (box && isFinite(box.min.x) && isFinite(box.max.x)) {
            const cx = (box.min.x + box.max.x) / 2;
            const cy = (box.min.y + box.max.y) / 2;
            const cz = (box.min.z + box.max.z) / 2;
            geo2.translate(-cx, -cy, -cz);
          } else {
            console.warn(
              '⚠️ NaN boundingBox for:',
              node.name,
              node.type,
              JSON.stringify(node.size)
            );
          }
          const matId = node.materialId || 'default';
          const isCamo = matId === 'camo_green' || matId === 'camo_dark' || matId === 'camo_desert';
          const mat =
            node.color && !isCamo
              ? new THREE.MeshStandardMaterial({
                  color: node.color,
                  roughness: 0.65,
                  metalness: 0.15,
                })
              : getMaterial(matId);
          if (node.flatShading) {
            mat.flatShading = true;
          }
          if (node.type === 'BentBox') mat.side = THREE.DoubleSide;
          const mesh = new THREE.Mesh(geo2, mat);
          mesh.name = node.name + '_mesh';

          const pos = adjustPos(node.position || [0, 0, 0], pivotComp);
          const group = new THREE.Group();
          group.name = node.name;
          group.position.set(...pos);
          if (node.scale) group.scale.set(...node.scale);
          group.visible = node.visible !== false;
          parentObj.add(group);

          let rotTarget = group;
          if (node.pivot) {
            const pivot = new THREE.Group();
            pivot.name = node.name + '_pivot';
            pivot.position.set(node.pivot[0], node.pivot[1], node.pivot[2]);
            group.add(pivot);
            mesh.position.set(-node.pivot[0], -node.pivot[1], -node.pivot[2]);
            pivot.add(mesh);
            rotTarget = pivot;
            group.userData.pivot = pivot;
          } else {
            group.add(mesh);
          }

          if (node.rotation) rotTarget.rotation.set(...node.rotation);

          // 存储映射
          nodeMap.set(node.name, { group, mesh, configNode: node, rotTarget });

          // BoxHelper
          if (showHelpers) {
            const h = new THREE.BoxHelper(mesh, helperColor(node.name));
            h.update();
            h.visible = node.visible !== false;
            h.userData._mesh = mesh;
            helpers.push(h);
          }

          const childComp = node.pivot
            ? [-node.pivot[0], -node.pivot[1], -node.pivot[2]]
            : [0, 0, 0];
          group.userData.appliedComp = pivotComp;
          group.userData.childComp = childComp;

          if (node.children) {
            for (const child of node.children) {
              buildNode(child, rotTarget, childComp);
            }
          }
        }

        buildNode(config, parent);
        for (const h of helpers) parent.add(h);
        parent.userData.helpers = helpers;
        return parent;
      }

      // ============================================================
      // 5. 统计面数
      // ============================================================
      function countTriangles(obj) {
        let count = 0;
        obj.traverse((child) => {
          if (child.isMesh && child.geometry) {
            const geo = child.geometry;
            count += (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
          }
        });
        return Math.round(count);
      }

      // ============================================================
      // 模型配置已拆分至 models/model_configs.js，通过 window.ModelConfigs 引用
      const T34_85_V16_CONFIG = window.ModelConfigs.T34_85_V16_CONFIG;
      const BUILDING_CONFIG = window.ModelConfigs.BUILDING_CONFIG;
      const ENEMY_CONFIG = window.ModelConfigs.ENEMY_CONFIG;
      const HEXAPOD_CONFIG = window.ModelConfigs.HEXAPOD_CONFIG;
      const MODEL_CONFIGS = window.ModelConfigs.MODEL_CONFIGS;
      let currentModelType = window.ModelConfigs.currentModelType;
      currentCamoType = currentModelType === 'tiger_v16' ? 'debug' : 'jungle';

      // ============================================================
      // 6.5 部件名中文显示映射（仅 UI 显示层，底层 configNode.name 保持英文不动）
      // ============================================================
      // humanoid 骨架英文关节名 → 中文显示名。name 是系统引用键(deriveNode/nodeMap/
      // buildFromConfig/动画 collectRefs 都按英文 name 查找)，绝不可改；这里只在"给人看
      // 的显示层"翻译。非 humanoid 模型(六足/坦克)不命中映射，displayLabel 原样返回 name。
      var HUMANOID_NAME_CN = {
        root: '根',
        pelvis: '骨盆',
        torso: '躯干',
        torso_upper: '上躯干',
        torso_lower: '下躯干',
        neck: '颈',
        head: '头',
        l_eye_glow: '左眼',
        r_eye_glow: '右眼',
        l_upper_arm: '左上臂',
        l_forearm: '左前臂',
        l_hand: '左手',
        r_upper_arm: '右上臂',
        r_forearm: '右前臂',
        r_hand: '右手',
        l_upper_leg: '左大腿',
        l_lower_leg: '左小腿',
        l_foot: '左脚',
        r_upper_leg: '右大腿',
        r_lower_leg: '右小腿',
        r_foot: '右脚',
      };
      function displayLabel(name) {
        return (currentModelType === 'humanoid' && HUMANOID_NAME_CN[name]) || name;
      }

      // ============================================================
      // 7. Three.js 初始化
      // ============================================================
      import * as THREE from 'three';
      window.THREE = THREE; // 供外部模块使用
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
      import GUI from 'lil-gui';

      const clock = new THREE.Clock();

      const RIGHT_PANEL_W = 460; // 右侧面板总宽（部件树170 + 编辑面板290）
      function viewWidth() {
        return window.innerWidth - RIGHT_PANEL_W;
      }
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(viewWidth(), window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x878787); // r19: 默认背景色改为rgb(135,135,135)增强对比度

      const camera = new THREE.PerspectiveCamera(40, viewWidth() / window.innerHeight, 0.05, 50);
      camera.position.set(6.0, 0.8, 0); // r19: 默认右侧视角(侧视图)
      camera.lookAt(0, 0.8, 0);

      // 正交摄像机（工程制图风格，无透视近大远小）
      const ORTHO_FRUSTUM = 3.0; // 半高（世界单位），控制正交视野大小
      function createOrthoCamera() {
        const aspect = viewWidth() / window.innerHeight;
        return new THREE.OrthographicCamera(
          -ORTHO_FRUSTUM * aspect,
          ORTHO_FRUSTUM * aspect,
          ORTHO_FRUSTUM,
          -ORTHO_FRUSTUM,
          0.05,
          50
        );
      }
      let orthoCamera = createOrthoCamera();
      orthoCamera.position.copy(camera.position);
      orthoCamera.lookAt(0, 0.8, 0);

      let useOrtho = true; // r19: 默认正交视图(工程制图风格)
      function activeCamera() {
        return useOrtho ? orthoCamera : camera;
      }

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.8, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.update();

      // 漫反射光照：强环境光+弱方向光，各方向均匀无死黑面
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));
      scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.4));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight.position.set(2, 3, 1);
      scene.add(dirLight);
      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight2.position.set(-1, 2, -2);
      scene.add(dirLight2);

      // 地面
      scene.add(new THREE.GridHelper(5, 10, 0x666688, 0x444466));
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.ShadowMaterial({ opacity: 0.35 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      scene.add(ground);
      // XYZ坐标轴 + 文字标签（红=+X / 绿=+Y / 蓝=+Z 标准Three.js右手系）
      // 注: 曾为适配六足战车做 X↔Z 交换(红标Z/蓝标X), 与部件参数坐标系冲突导致"改z动x"误解, 已改回标准
      let axesGroup = new THREE.Group();
      (function addLabeledAxes() {
        const len = 3.0,
          o = new THREE.Vector3(0, 0.01, 0);
        // 红=X轴(+X世界方向), 绿=Y轴, 蓝=Z轴(+Z世界方向)
        const matXp = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const matXn = new THREE.LineBasicMaterial({ color: 0x880000 });
        const matY = new THREE.LineBasicMaterial({ color: 0x00ff00 });
        const matZp = new THREE.LineBasicMaterial({ color: 0x0000ff });
        const matZn = new THREE.LineBasicMaterial({ color: 0x000088 });
        axesGroup.add(
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([o, new THREE.Vector3(len, 0.01, 0)]),
            matXp
          ),
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([o, new THREE.Vector3(-len, 0.01, 0)]),
            matXn
          ),
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([o, new THREE.Vector3(0, len, 0)]),
            matY
          ),
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([o, new THREE.Vector3(0, 0.01, len)]),
            matZp
          ),
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([o, new THREE.Vector3(0, 0.01, -len)]),
            matZn
          )
        );
        function label(text, pos, color) {
          const cv = document.createElement('canvas');
          cv.width = 128;
          cv.height = 64;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = color;
          ctx.font = 'bold 48px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(text, 64, 48);
          const sp = new THREE.Sprite(
            new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })
          );
          sp.position.copy(pos);
          sp.scale.set(1.2, 0.6, 1);
          axesGroup.add(sp);
        }
        label('+X', new THREE.Vector3(len + 0.5, 0.05, 0), '#ff4444');
        label('-X', new THREE.Vector3(-len - 0.5, 0.05, 0), '#884444');
        label('+Y', new THREE.Vector3(0, len + 0.3, 0), '#44ff44');
        label('+Z', new THREE.Vector3(0, 0.05, len + 0.5), '#4444ff');
        label('-Z', new THREE.Vector3(0, 0.05, -len - 0.5), '#444488');
        scene.add(axesGroup);
      })();

      // ============================================================
      // 8. 构建初始模型
      // ============================================================
      let modelRoot = new THREE.Group();
      let nodeMap = new Map(); // name → {group, mesh, configNode, rotTarget}
      let gui;

      // --- 选择系统（多选支持）---
      let selectedParts = new Set(); // 当前选中的部件名集合
      let highlightLines = new Map(); // name → highlight LineSegments
      let guiFolderMap = new Map(); // 名称→GUI文件夹
      let clickStart = { x: 0, y: 0 }; // 用于区分点击与拖拽

      // --- 部件树面板 ---
      let ptCollapsed = new Set(); // 折叠的节点名称集合
      function refreshPartTree() {
        const container = document.getElementById('part-tree');
        if (!container) return;
        container.innerHTML = '';
        const cfg = MODEL_CONFIGS[currentModelType];
        if (!cfg) return;
        renderPartTree(cfg, container, 0);
      }
      function renderPartTree(cfg, parentEl, depth) {
        const row = document.createElement('div');
        row.className = 'pt-item';
        if (selectedParts.has(cfg.name)) row.classList.add('selected');
        const info = nodeMap.get(cfg.name);
        const isVisible = info ? info.group.visible !== false : cfg.visible !== false;
        if (!isVisible) row.classList.add('hidden');
        const hasChildren = cfg.children && cfg.children.length > 0;
        const collapsed = ptCollapsed.has(cfg.name);
        // 折叠按钮
        const toggle = document.createElement('span');
        toggle.className = 'pt-toggle' + (hasChildren ? '' : ' leaf');
        toggle.textContent = hasChildren ? (collapsed ? '▶' : '▼') : '';
        toggle.onclick = (e) => {
          e.stopPropagation();
          if (collapsed) ptCollapsed.delete(cfg.name);
          else ptCollapsed.add(cfg.name);
          refreshPartTree();
        };
        // 图标
        const icon = document.createElement('span');
        icon.className = 'pt-icon';
        icon.textContent = hasChildren ? (cfg.type === 'Group' ? '⚙' : '📁') : '◼';
        // 名称（显示层：humanoid 显示中文，底层 cfg.name 保持英文不动）
        const name = document.createElement('span');
        name.textContent = displayLabel(cfg.name);
        name.style.overflow = 'hidden';
        name.style.textOverflow = 'ellipsis';
        row.appendChild(toggle);
        row.appendChild(icon);
        row.appendChild(name);
        row.onclick = (e) => {
          e.stopPropagation();
          if (e.ctrlKey || e.metaKey) toggleSelect(cfg.name);
          else selectSingle(cfg.name);
        };
        parentEl.appendChild(row);
        // 子节点
        if (hasChildren && !collapsed) {
          const childWrap = document.createElement('div');
          childWrap.className = 'pt-children';
          for (const c of cfg.children) renderPartTree(c, childWrap, depth + 1);
          parentEl.appendChild(childWrap);
        }
      }

      // --- 撤销系统 ---
      let undoStack = [];
      const MAX_UNDO = 50;
      const SAVE_KEY = 'tank_model_factory_save';

      // 将 nodeMap 中的 3D 实时状态同步回 config 树（position/rotation/visible）
      function syncConfigFromScene(cfg) {
        const n = nodeMap.get(cfg.name);
        if (n) {
          if (cfg.type === 'Group') {
            // Group 也需要同步位置/旋转/可见性
            cfg.position = [n.group.position.x, n.group.position.y, n.group.position.z].map(
              (v) => +v.toFixed(4)
            );
            cfg.rotation = [n.group.rotation.x, n.group.rotation.y, n.group.rotation.z].map(
              (v) => +v.toFixed(4)
            );
            cfg.visible = n.group.visible;
          } else {
            const cc = n.group.userData.appliedComp || [0, 0, 0];
            cfg.position = [
              n.group.position.x - cc[0],
              n.group.position.y - cc[1],
              n.group.position.z - cc[2],
            ].map((v) => +v.toFixed(4));
            cfg.rotation = [
              n.rotTarget.rotation.x,
              n.rotTarget.rotation.y,
              n.rotTarget.rotation.z,
            ].map((v) => +v.toFixed(4));
            cfg.visible = n.group.visible;
          }
        }
        if (cfg.children) for (const c of cfg.children) syncConfigFromScene(c);
      }

      // ── 保存：同步场景→config → POST 固化到源文件 + localStorage 备份
      function _doSave() {
        syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
        var cfg = MODEL_CONFIGS[currentModelType];
        var saveData = {
          modelType: currentModelType,
          config: JSON.parse(JSON.stringify(cfg)),
          timestamp: Date.now(),
        };

        // 始终存 localStorage（离线可用 + 自动加载）
        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));

        // 尝试直接固化到源文件
        var modelLabel =
          currentModelType === 'hexapod'
            ? '六足战车'
            : currentModelType === 'tank_v16'
              ? '坦克v1.6'
              : currentModelType === 'tiger_v16'
                ? '虎式坦克'
                : currentModelType;

        var solidifyPayload;
        if (currentModelType === 'humanoid' && window.HumanoidConfig) {
          if (_humanoidMode === 'skeleton') {
            // 骨架模式：写回 WORKING_SKELETON + 固化骨架构建块（用户微调后保存）
            window.HumanoidConfig.WORKING_SKELETON = JSON.parse(JSON.stringify(cfg));
            solidifyPayload = {
              modelType: 'humanoid_skeleton',
              config: JSON.parse(JSON.stringify(cfg)),
            };
          } else {
            // 变体模式：HUMANOID_VARIANTS（Phase 2/3 改 MODELS[variant].tree）
            solidifyPayload = {
              modelType: 'humanoid:' + _humanoidEdit.variant,
              config: JSON.parse(
                JSON.stringify(window.HumanoidConfig.HUMANOID_VARIANTS[_humanoidEdit.variant])
              ),
            };
          }
        } else {
          solidifyPayload = { modelType: currentModelType, config: saveData.config };
        }
        fetch('/api/solidify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(solidifyPayload),
        })
          .then(function (r) {
            if (r.ok) return r.json();
            throw new Error('HTTP ' + r.status);
          })
          .then(function (result) {
            console.log('✅ 已固化到源文件: ' + result.file);
          })
          .catch(function (err) {
            console.log('⚠️ 固化失败（服务器未运行？已存 localStorage）: ' + err.message);
          });

        console.log(
          '💾 已保存: ' + modelLabel + ' (' + new Date(saveData.timestamp).toLocaleString() + ')'
        );
      }

      // ❄️ 冻结骨架版本：把当前 WORKING_SKELETON 存入 SKELETON_VERSIONS（命名）+ 固化
      function freezeSkeleton() {
        if (currentModelType !== 'humanoid' || _humanoidMode !== 'skeleton') return;
        syncConfigFromScene(MODEL_CONFIGS.humanoid);
        window.HumanoidConfig.WORKING_SKELETON = JSON.parse(JSON.stringify(MODEL_CONFIGS.humanoid));
        var vers = window.HumanoidConfig.getSkeletonList();
        var maxN = 0;
        vers.forEach(function (k) {
          var m = k.match(/^v(\d+)/);
          if (m) maxN = Math.max(maxN, +m[1]);
        });
        var t = new Date();
        var dateStr =
          t.getFullYear() +
          '-' +
          String(t.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(t.getDate()).padStart(2, '0');
        var key = prompt('冻结骨架版本名（可改/加备注）', 'v' + (maxN + 1) + '-' + dateStr);
        if (!key) return;
        var note = prompt('备注（可选）', '') || '';
        window.HumanoidConfig.SKELETON_VERSIONS[key] = {
          date: dateStr,
          note: note,
          tree: JSON.parse(JSON.stringify(window.HumanoidConfig.WORKING_SKELETON)),
        };
        fetch('/api/solidify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            modelType: 'humanoid_versions',
            config: JSON.parse(JSON.stringify(window.HumanoidConfig.SKELETON_VERSIONS)),
          }),
        })
          .then(function (r) {
            return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status));
          })
          .then(function (res) {
            console.log('❄️ 已冻结版本 ' + key + ' → ' + res.file);
          })
          .catch(function (err) {
            console.log('⚠️ 冻结失败: ' + err.message);
          });
      }

      // 快照：先同步 3D→config，再深拷贝 config。一次拖拽只产生一个快照
      let _snapshotLock = false;

      function saveUndo(label) {
        if (!autoSnapshot || !modelRoot) return;
        if (_snapshotLock) return; // 拖拽中，快照已在 pointerdown 时拍过
        syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
        const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
        undoStack.push(clone);
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        console.log('📸 快照 #' + undoStack.length + ' (' + label + ')');
      }

      // pointerdown：操作开始前拍照 + 锁定，拖拽中 onChange 不再重复拍
      document.addEventListener('pointerdown', (e) => {
        if (!modelRoot || !autoSnapshot) return;
        if (e.target.closest('.lil-gui')) {
          syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
          const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
          undoStack.push(clone);
          if (undoStack.length > MAX_UNDO) undoStack.shift();
          console.log('📸 快照 #' + undoStack.length + ' (操作开始)');
          _snapshotLock = true;
        }
      });
      document.addEventListener('pointerup', () => {
        _snapshotLock = false;
      });

      // Shift+拖拽滑块 = 精细微调（速度 1/10）。capture 阶段拦截，阻止 lil-gui 绝对映射改用相对增量
      document.addEventListener(
        'pointerdown',
        (e) => {
          if (!e.shiftKey) return;
          const widget = e.target.closest('.hasSlider');
          if (!widget) return;
          // lazy 反查 controller（rebuild GUI 后旧 domElement 失效，新 widget 自动重填）
          let ctrl = widget.__peCtrl;
          if (!ctrl && gui) {
            ctrl = gui
              .controllersRecursive()
              .find((c) => c.domElement.closest('.hasSlider') === widget);
            if (ctrl) widget.__peCtrl = ctrl;
          }
          if (!ctrl) return;
          const slider = widget.querySelector('.slider');
          if (!slider) return;
          // 操作开始前拍照（capture 阶段 stopImmediatePropagation 会屏蔽下方 bubble 阶段的快照监听，此处补偿）
          if (modelRoot && autoSnapshot) {
            syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
            const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
            undoStack.push(clone);
            if (undoStack.length > MAX_UNDO) undoStack.shift();
            _snapshotLock = true;
          }
          e.stopImmediatePropagation(); // 阻止 lil-gui 的 slider 绝对映射 mouseDown
          e.preventDefault();
          const startX = e.clientX;
          const startVal = ctrl.getValue();
          const rect = slider.getBoundingClientRect();
          const range = ctrl._max - ctrl._min;
          const perPx = (range / rect.width) * 0.1; // 比原生拖动慢 10x
          const move = (ev) => {
            let nv = startVal + (ev.clientX - startX) * perPx;
            nv = Math.max(ctrl._min, Math.min(ctrl._max, nv)); // 手动 clamp
            ctrl.setValue(nv);
          };
          const up = () => {
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
          };
          document.addEventListener('pointermove', move);
          document.addEventListener('pointerup', up);
        },
        true
      ); // capture 阶段，先于 lil-gui（其监听在 .slider 元素 target 阶段）

      function flushUndo() {
        /* 空函数，保留防止调用报错 */
      }

      // 深拷贝恢复
      function deepRestore(target, source) {
        Object.keys(target).forEach((k) => delete target[k]);
