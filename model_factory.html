{

<script type="module">

// ============================================================
// 1. 默认材质字典
// ============================================================
const MATERIAL_DEFS = {
  steel:       { color:0x6b6b7b, roughness:0.5,  metalness:0.8 },
  dark_steel:  { color:0x4a4a5a, roughness:0.45, metalness:0.85, emissive:0x111111, emissiveIntensity:0.30 },
  barrel_steel:{ color:0x3a3a44, roughness:0.35, metalness:0.9,  emissive:0x0a0a0a, emissiveIntensity:0.20 },
  rubber:      { color:0x2a2a2e, roughness:0.9,  metalness:0.05, emissive:0x080808, emissiveIntensity:0.25 },
  camo_green:  { color:0x4a5c2e, roughness:0.75, metalness:0.1 },
  camo_dark:   { color:0x3d4f25, roughness:0.7,  metalness:0.1 },
  camo_desert: { color:0x8b7d4a, roughness:0.75, metalness:0.1 },
  wood:        { color:0x6b4e3d, roughness:0.85, metalness:0.0 },
  armor_dark:  { color:0x3A3A44, roughness:0.40, metalness:0.85 },
  armor_light: { color:0x5A5A6A, roughness:0.35, metalness:0.80 },
  warning_yellow: { color:0xE8A820, roughness:0.50, metalness:0.40, emissive:0xC08010, emissiveIntensity:0.15 },
  default:     { color:0x888888, roughness:0.6,  metalness:0.2 }
};

let _camoJungleTex = null, _camoDesertTex = null;

function generateCamoTexture(type) {
  if (type === 'jungle' && _camoJungleTex) return _camoJungleTex;
  if (type === 'desert' && _camoDesertTex) return _camoDesertTex;
  const size = 512;
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  var bg, c1, c2, c3;
  if (type === 'desert') {
    bg = '#e8d8b0'; c1 = '#d4b88e'; c2 = '#c4a458'; c3 = '#efe0c0';
  } else {
    bg = '#9aab70'; c1 = '#8c9e66'; c2 = '#7a8858'; c3 = '#aabb78';
  }
  ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size);
  var count = 40 + Math.floor(Math.random() * 20);
  for (var i = 0; i < count; i++) {
    var colors = [c1, c2, c3];
    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    ctx.globalAlpha = 0.7 + Math.random() * 0.3;
    ctx.beginPath();
    var cx = Math.random() * size, cy = Math.random() * size;
    var rx = 30 + Math.random() * 80, ry = 20 + Math.random() * 60;
    var angle = Math.random() * Math.PI * 2;
    ctx.ellipse(cx, cy, rx, ry, angle, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  count = 10 + Math.floor(Math.random() * 10);
  for (var i = 0; i < count; i++) {
    ctx.fillStyle = type === 'desert' ? '#b49658' : '#708048';
    ctx.globalAlpha = 0.5 + Math.random() * 0.3;
    ctx.beginPath();
    var cx = Math.random() * size, cy = Math.random() * size;
    var rx = 5 + Math.random() * 25, ry = 3 + Math.random() * 15;
    ctx.ellipse(cx, cy, rx, ry, Math.random() * Math.PI * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  var tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  if (type === 'jungle') _camoJungleTex = tex;
  else _camoDesertTex = tex;
  return tex;
}

let currentCamoType = 'jungle';

function getMaterial(matId) {
  // 六足战车：彩色调试材质，部件清晰可辨
  if (currentModelType === 'hexapod') {
    var hexColors = {
      armor_dark:'#44CC44', armor_light:'#66EE66', dark_steel:'#4488FF',
      barrel_steel:'#FF3333', steel:'#BB44FF', warning_yellow:'#FF8800'
    };
    if (hexColors[matId]) {
      return new THREE.MeshStandardMaterial({ color:hexColors[matId], roughness:0.5, metalness:0.1 });
    }
  }
  const def = MATERIAL_DEFS[matId] || MATERIAL_DEFS.default;
  const mat = new THREE.MeshStandardMaterial({ ...def });
  if (currentCamoType && (matId === 'camo_green' || matId === 'camo_dark' || matId === 'camo_desert')) {
    mat.map = generateCamoTexture(currentCamoType);
  }
  return mat;
}

// ============================================================
// 1.5 台型几何体（顶底矩形不同大小）
// ============================================================
function buildTaperedBox(bw, h, bd, tw, td, ox=0, oz=0) {
  const hw = bw/2, hd = bd/2, thw = tw/2, thd = td/2;
  const verts = [], uvs = [], indices = [];
  let vi = 0;
  function quad(a, b, c, d) {
    verts.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2], d[0],d[1],d[2]);
    uvs.push(0,0, 1,0, 1,1, 0,1);
    indices.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  quad([-hw,0,-hd], [hw,0,-hd], [hw,0,hd], [-hw,0,hd]);
  quad([-thw+ox,h,-thd+oz], [-thw+ox,h,thd+oz], [thw+ox,h,thd+oz], [thw+ox,h,-thd+oz]);
  quad([-hw,0,-hd], [-thw+ox,h,-thd+oz], [thw+ox,h,-thd+oz], [hw,0,-hd]);
  quad([hw,0,hd], [thw+ox,h,thd+oz], [-thw+ox,h,thd+oz], [-hw,0,hd]);
  quad([-hw,0,hd], [-thw+ox,h,thd+oz], [-thw+ox,h,-thd+oz], [-hw,0,-hd]);
  quad([hw,0,-hd], [thw+ox,h,-thd+oz], [thw+ox,h,thd+oz], [hw,0,hd]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// 椭圆六棱台：底面和顶面是压扁的六边形
// size: [底宽, 高, 底深, 顶宽, 顶深]
function buildTaperedHex(bw, h, bd, tw, td, ox=0, oz=0) {
  const hw = bw/2, hd = bd/2, thw = tw/2, thd = td/2;
  const S3 = Math.sqrt(3)/2;
  const verts = [], uvs = [], indices = [];
  let vi = 0;
  function quad(a, b, c, d) {
    verts.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2], d[0],d[1],d[2]);
    uvs.push(0,0, 1,0, 1,1, 0,1);
    indices.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  function hexFan(p0,p1,p2,p3,p4,p5) {
    verts.push(p0[0],p0[1],p0[2],p1[0],p1[1],p1[2],p2[0],p2[1],p2[2],p3[0],p3[1],p3[2],p4[0],p4[1],p4[2],p5[0],p5[1],p5[2]);
    uvs.push(0.5,0.5, 1,0.5, 1,1, 0.5,1, 0,1, 0,0.5);
    indices.push(vi,vi+1,vi+2, vi,vi+2,vi+3, vi,vi+3,vi+4, vi,vi+4,vi+5);
    vi += 6;
  }
  hexFan([hw,0,0],[hw/2,0,hd*S3],[-hw/2,0,hd*S3],[-hw,0,0],[-hw/2,0,-hd*S3],[hw/2,0,-hd*S3]);
  hexFan([thw+ox,h,0+oz],[thw/2+ox,h,-thd*S3+oz],[-thw/2+ox,h,-thd*S3+oz],[-thw+ox,h,0+oz],[-thw/2+ox,h,thd*S3+oz],[thw/2+ox,h,thd*S3+oz]);
  quad([hw,0,0],        [thw+ox,h,0+oz],        [thw/2+ox,h,thd*S3+oz],   [hw/2,0,hd*S3]);
  quad([hw/2,0,hd*S3],  [thw/2+ox,h,thd*S3+oz],  [-thw/2+ox,h,thd*S3+oz], [-hw/2,0,hd*S3]);
  quad([-hw/2,0,hd*S3], [-thw/2+ox,h,thd*S3+oz], [-thw+ox,h,0+oz],        [-hw,0,0]);
  quad([-hw,0,0],       [-thw+ox,h,0+oz],        [-thw/2+ox,h,-thd*S3+oz], [-hw/2,0,-hd*S3]);
  quad([-hw/2,0,-hd*S3],[-thw/2+ox,h,-thd*S3+oz],[thw/2+ox,h,-thd*S3+oz],  [hw/2,0,-hd*S3]);
  quad([hw/2,0,-hd*S3], [thw/2+ox,h,-thd*S3+oz], [thw+ox,h,0+oz],          [hw,0,0]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}
function buildBentBox(w, h, d, bendAngle, segments) {
  const r = d / bendAngle;
  const hw = w / 2;
  const n = segments;

  const bY = [], bZ = [], tY = [], tZ = [];
  for (let i = 0; i <= n; i++) {
    const z = (i / n - 0.5) * d;
    const th = z / r;
    const s = Math.sin(th), c = Math.cos(th);
    bY.push(r * (1 - c));
    bZ.push(r * s);
    const rh = r - h;
    tY.push(r - rh * c);
    tZ.push(rh * s);
  }

  const verts = [], uvs = [];
  const indices = [];
  let vi = 0;

  function quad(a, b, c, d) {
    verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
    uvs.push(0,0, 1,0, 1,1, 0,1);
    indices.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }

  for (let i = 0; i < n; i++) {
    quad([-hw, bY[i], bZ[i]], [hw, bY[i], bZ[i]], [hw, bY[i+1], bZ[i+1]], [-hw, bY[i+1], bZ[i+1]]);
    quad([-hw, tY[i+1], tZ[i+1]], [hw, tY[i+1], tZ[i+1]], [hw, tY[i], tZ[i]], [-hw, tY[i], tZ[i]]);
    quad([-hw, bY[i], bZ[i]], [-hw, tY[i], tZ[i]], [-hw, tY[i+1], tZ[i+1]], [-hw, bY[i+1], bZ[i+1]]);
    quad([hw, bY[i+1], bZ[i+1]], [hw, tY[i+1], tZ[i+1]], [hw, tY[i], tZ[i]], [hw, bY[i], bZ[i]]);
  }

  quad([-hw, bY[0], bZ[0]], [hw, bY[0], bZ[0]], [hw, tY[0], tZ[0]], [-hw, tY[0], tZ[0]]);
  quad([hw, bY[n], bZ[n]], [-hw, bY[n], bZ[n]], [-hw, tY[n], tZ[n]], [hw, tY[n], tZ[n]]);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function createGeometry(node) {
  const s = node.size || [1, 1, 1];
  const seg = node.segments || [8, 1];
  switch (node.type) {
    case 'Box':
      return new THREE.BoxGeometry(s[0], s[1]||s[0], s[2]||s[0]);
    case 'BentBox':
      return buildBentBox(s[0], s[1]||0.3, s[2]||s[0], s[3]!=null?s[3]:Math.PI/6, seg[0]||16);
    case 'TaperedBox':
      // size: [底部宽, 高, 底部深, 顶部宽, 顶部深, 顶面X偏移, 顶面Z偏移]
      return buildTaperedBox(s[0], s[1]||1, s[2]||s[0], s[3]!==undefined?s[3]:s[0]*0.6, s[4]!==undefined?s[4]:s[2]*0.6, s[5]||0, s[6]||0);
    case 'TaperedHex':
      // size: [底宽, 高, 底深, 顶宽, 顶深, 顶面X偏移, 顶面Z偏移]
      return buildTaperedHex(s[0], s[1]||1, s[2]||s[0], s[3]!==undefined?s[3]:s[0]*0.6, s[4]!==undefined?s[4]:s[2]*0.6, s[5]||0, s[6]||0);
    case 'RoundedBox':
      // size: [width, height, depth, radius, segments]
      return new RoundedBoxGeometry(s[0], s[1]||s[0], s[2]||s[0], seg[0]||3, s[3]||0.08);
    case 'Cylinder':
      return new THREE.CylinderGeometry(s[0], s[2]!==undefined ? s[2] : s[0], s[1], seg[0]||6);
    case 'Sphere':
      return new THREE.SphereGeometry(s[0], seg[0]||8, seg[1]||6);
    case 'Torus':
      return new THREE.TorusGeometry(s[0], s[1]||0.05, seg[0]||8, seg[1]||12);
    case 'Lathe': {
      const profile = node.profile || [[0.5,0],[0.5,0.3],[0.6,0.3],[0.6,0.35],[0.55,0.4],[0.3,0.45],[0.1,0.4]];
      const sR = node.scaleR ?? 1;
      const sH = node.scaleH ?? 1;
      const pts = profile.map(p => new THREE.Vector2(p[0] * sR, p[1] * sH));
      return new THREE.LatheGeometry(pts, seg[0]||24);
    }
    case 'Extrude': {
      const shape = node.shape || [[-0.5,-0.2],[0.5,-0.2],[0.5,0.2],[-0.5,0.2]];
      const shape2D = new THREE.Shape(shape.map(p => new THREE.Vector2(p[0], p[1])));
      const depth = node.extrudeDepth !== undefined ? node.extrudeDepth : 0.5;
      const bevel = node.bevelThickness || 0.02;
      return new THREE.ExtrudeGeometry(shape2D, { depth, bevelThickness:bevel, bevelSize:bevel, bevelSegments:2 });
    }
    default: return null;
  }
}

// TrackChain 履带链生成器
function buildTrackChain(node, parentGroup, pivotComp = [0,0,0]) {
  const tp = node.trackParams;
  const g = new THREE.Group();
  g.name = node.name;
  if (node.position) {
    const pos = [node.position[0]+pivotComp[0], node.position[1]+pivotComp[1], node.position[2]+pivotComp[2]];
    g.position.set(...pos);
  }
  if (node.scale) g.scale.set(...node.scale);
  g.visible = node.visible !== false;
  parentGroup.add(g);

  const cyF = tp.wheelCenterYFront, cyR = tp.wheelCenterYRear;
  const rF = tp.wheelRadiusFront, rR = tp.wheelRadiusRear;
  const zF = tp.wheelCenterZFront, zR = tp.wheelCenterZRear;

  // r21: 6点+2弧精确几何模型（用户设计的理想拓扑）
  const zR1 = 1.4;    // 负重轮1 Z (固定)
  const zR2 = 0.39;   // 负重轮2 Z (l1=2份边距: 1.40-0.80-0.214)
  const zR3 = -0.74;  // 负重轮3 Z (l2=3份边距, 最大间隙)
  const zR4 = -1.64;  // 负重轮4 Z (l3=1份边距)
  const zR5 = -2.55;  // 负重轮5 Z (l4=1份边距, 固定)
  const wheelR = 0.40; // ⚠️ 修正：Cylinder size[0]=半径=0.4（不是直径！）

  // 6个关键点坐标（与 getTrackPlateTransform 保持完全一致）
  // ⚠️ 注意：Z轴在屏幕上方向与数学X轴相反（左=Z+），所以Z分量需取负
  const pA = { z: zR - rR * Math.cos(Math.PI/2),           y: cyR + rR * Math.sin(Math.PI/2) };              // A: c1轮12点(+90°)
  const pB = { z: zF - rF * Math.cos(Math.PI/2),           y: cyF + rF * Math.sin(Math.PI/2) };              // B: a1轮12点(+90°)
  const angleC = -120 * Math.PI / 180;  // -120° (7点钟)
  const pC = { z: zF - rF * Math.cos(angleC),             y: cyF + rF * Math.sin(angleC) };                 // C: a1轮7点
  // D: b1轮6.5点钟位置(约-105°, 在轮子边沿的6点和7点之间)
  const angleD = -105 * Math.PI / 180;  // -105° (6点半位置)
  const pD = { z: zR1 - wheelR * Math.cos(angleD),        y: 0.40 + wheelR * Math.sin(angleD) };            // D: b1轮6.5点(边沿)
  // E: b5轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
  const angleE = -75 * Math.PI / 180;   // -75° (5点半)
  const pE = { z: zR5 - wheelR * Math.cos(angleE),        y: 0.40 + wheelR * Math.sin(angleE) };            // E: b5轮5.5点(边沿)
  // F: c1轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
  const angleF = -75 * Math.PI / 180;   // -75° (5点半)
  const pF = { z: zR - rR * Math.cos(angleF),             y: cyR + rR * Math.sin(angleF) };                 // F: c1轮5.5点(边沿)

  // 6段长度
  const lenAB = Math.sqrt((pB.z-pA.z)**2 + (pB.y-pA.y)**2);  // AB: 上支路(c1→a1)
  const lenBC = (angleC + 2*Math.PI - Math.PI/2) * rF;        // BC: 前弧(绕a1, 逆时针短弧 12→11→10→9→8→7 = 150°)
  const lenCD = Math.sqrt((pD.z-pC.z)**2 + (pD.y-pC.y)**2);  // CD: 下前斜线(a1→b1)
  const lenDE = Math.abs(pE.z - pD.z);                         // DE: 下主干(b1→b5)
  const lenEF = Math.sqrt((pF.z-pE.z)**2 + (pF.y-pE.y)**2);  // EF: 下后斜线(b5→c1)
  const lenFA = (Math.PI/2 - angleF) * rR;                     // FA: 后弧(绕c1, -120°→90°=210°)

  const totalLen = lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;
  const spacing = totalLen / (tp.count - 1);

  const matId = node.materialId || 'dark_steel';
  const isCamoTC = (matId === 'camo_green' || matId === 'camo_dark' || matId === 'camo_desert');
  const mat = (node.color && !isCamoTC)
    ? new THREE.MeshStandardMaterial({ color:node.color, roughness:0.65, metalness:0.15 })
    : getMaterial(matId);

  for (let i = 0; i < tp.count; i++) {
    const dist = i * spacing;
    const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(tp.plateWidth, tp.plateHeight, tp.plateDepth),
      mat
    );
    plate.position.set(pp.x, pp.y, pp.z);
    plate.rotation.set(rot.x, rot.y, rot.z);
    plate.castShadow = true;
    plate.receiveShadow = true;
    g.add(plate);
  }

  // 🆕 TrackChain 理论路径可视化（调试用，绿色Line）
  if (tp.showPath) {
    const pathPts = [];
    const steps = 200;
    for (let i = 0; i <= steps; i++) {
      const d = (i / steps) * totalLen;
      const { pos: pp } = getTrackPlateTransform(d, tp);
      pathPts.push(new THREE.Vector3(pp.x, pp.y, pp.z));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pathPts);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
    const line = new THREE.Line(lineGeo, lineMat);
    line.name = node.name + '_path';
    g.add(line);
  }

  nodeMap.set(node.name, { group: g, mesh: null, configNode: node, rotTarget: g });
}

function getTrackPlateTransform(dist, tp) {
  // r21: 6点+2弧精确几何模型（用户设计的理想拓扑）
  const cyF = tp.wheelCenterYFront, cyR = tp.wheelCenterYRear;
  const rF = tp.wheelRadiusFront, rR = tp.wheelRadiusRear;
  const zF = tp.wheelCenterZFront, zR = tp.wheelCenterZRear;

  const zR1 = 1.4;    // 负重轮1 Z
  const zR5 = -2.55;   // 负重轮5 Z
  const wheelR = 0.40; // ⚠️ 修正：Cylinder size[0]=半径=0.4（不是直径！）

  // ========== 6个关键点的精确坐标（基于用户确认的拓扑）==========
  // ⚠️ Z轴修正：屏幕左边=Z+，所以 Z = center.z - r*cos(angle)
  // A: 主动轮(c1)12点钟位置 (+90°)
  const pA = { z: zR - rR * Math.cos(Math.PI/2),           y: cyR + rR * Math.sin(Math.PI/2) };              // (-3.30, 0.75)
  // B: 诱导轮(a1)12点钟位置 (+90°)
  const pB = { z: zF - rF * Math.cos(Math.PI/2),           y: cyF + rF * Math.sin(Math.PI/2) };              // (+2.10, 0.74)
  // C: 诱导轮(a1)7点钟位置 (-120°, 左下方)
  const angleC = -120 * Math.PI / 180;  // -120° (7点钟)
  const pC = { z: zF - rF * Math.cos(angleC),             y: cyF + rF * Math.sin(angleC) };
  // D: 第1负重轮(b1)边沿切点 (6.5点钟位置, -105°)
  const angleD = -105 * Math.PI / 180;  // -105° (6点半)
  const pD = { z: zR1 - wheelR * Math.cos(angleD),        y: 0.40 + wheelR * Math.sin(angleD) };            // D: b1轮6.5点(边沿)
  // E: 第5负重轮(b5)底部切点 (6点, 正下方)
  const angleE = -75 * Math.PI / 180;   // -75° (5点半, 在5-6点之间)
  const pE = { z: zR5 - wheelR * Math.cos(angleE),        y: 0.40 + wheelR * Math.sin(angleE) };            // E: b5轮5.5点(边沿)
  // F: c1轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
  const angleF = -75 * Math.PI / 180;   // -75° (5点半)
  const pF = { z: zR - rR * Math.cos(angleF),             y: cyR + rR * Math.sin(angleF) };                 // F: c1轮5.5点(边沿)

  // ========== 6段长度计算 ==========
  const lenAB = Math.sqrt((pB.z-pA.z)**2 + (pB.y-pA.y)**2);  // AB: 上支路(主动轮顶→诱导轮顶)
  const lenBC = (angleC + 2*Math.PI - Math.PI/2) * rF;        // BC: 前弧(绕诱导轮, 逆时针短弧 12→11→10→9→8→7 = 150°)
  const lenCD = Math.sqrt((pD.z-pC.z)**2 + (pD.y-pC.y)**2);  // CD: 下前斜线(诱导轮底→轮1底)
  const lenDE = Math.abs(pE.z - pD.z);                         // DE: 下支路主干(Y恒定=0.20)
  const lenEF = Math.sqrt((pF.z-pE.z)**2 + (pF.y-pE.y)**2);  // EF: 下后斜线(轮5底→主动轮底)
  const lenFA = (Math.PI/2 - angleF) * rR;                     // FA: 后弧(绕主动轮, -120°→90°=210°)

  const totalLen = lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;

  let pos = { x: 0, y: 0, z: 0 };
  let rot = { x: 0, y: 0, z: 0 };
  let d = dist;

  // 段1: AB 上支路 (线性插值)
  if (d <= lenAB) {
    const t = d / lenAB;
    pos.z = pA.z + t * (pB.z - pA.z);
    pos.y = pA.y + t * (pB.y - pA.y);
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenAB;

  // 段2: BC 前弧 (绕诱导轮, 逆时针短弧: 12→11→10→9→8→7)
  // ⚠️ Z轴修正: Z = centerZ - r*cos(angle)
  // 角度从 +90°(12点) 增加到 +240°(= -120°+360°, 7点的等效角度), 走150°逆时针短弧
  if (d <= lenBC) {
    const angle = Math.PI/2 + (d / lenBC) * (angleC + 2*Math.PI - Math.PI/2);  // 90° → 240° (逆时针)
    pos.z = zF - rF * Math.cos(angle);
    pos.y = cyF + rF * Math.sin(angle);
    rot.x = angle - Math.PI/2;
    return { pos, rot };
  }
  d -= lenBC;

  // 段3: CD 下支路前斜线 (线性插值)
  if (d <= lenCD) {
    const t = d / lenCD;
    pos.z = pC.z + t * (pD.z - pC.z);
    pos.y = pC.y + t * (pD.y - pC.y);
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenCD;

  // 段4: DE 下支路主干 (Y恒定=0.20, 切于各负重轮底部)
  if (d <= lenDE) {
    const t = d / lenDE;
    pos.z = pD.z + t * (pE.z - pD.z);
    pos.y = pD.y;
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenDE;

  // 段5: EF 下支路后斜线 (线性插值)
  if (d <= lenEF) {
    const t = d / lenEF;
    pos.z = pE.z + t * (pF.z - pE.z);
    pos.y = pE.y + t * (pF.y - pE.y);
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenEF;

  // 段6: FA 后弧 (绕主动轮, 标准圆弧 cos/sin)
  // ⚠️ Z轴修正: Z = centerZ - r*cos(angle)
  if (d <= lenFA) {
    const angle = angleF + (d / lenFA) * (Math.PI/2 - angleF);  // -120° → 90°
    pos.z = zR - rR * Math.cos(angle);
    pos.y = cyR + rR * Math.sin(angle);
    rot.x = angle - Math.PI/2;
    return { pos, rot };
  }

  return { pos, rot };
}

// ============================================================
// 3. 辅助色（BoxHelper 颜色映射）
// ============================================================
function helperColor(name) {
  const hash = name.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0);
  const hues = [0xFF6B6B,0x4ECDC4,0xFFE66D,0x95E1D3,0xF38181,0xAA96DA,0x88D8B0,0x70C1B3,0xFF8A5C,0xCCA000];
  return hues[Math.abs(hash) % hues.length];
}

// ============================================================
// 4. 递归构建函数 buildFromConfig()
// ============================================================
function buildFromConfig(config, parent, showHelpers, nodeMap) {
  const helpers = [];
  function adjustPos(rawPos, comp) {
    return [rawPos[0]+comp[0], rawPos[1]+comp[1], rawPos[2]+comp[2]];
  }

  function buildNode(node, parentObj, pivotComp = [0,0,0]) {
    if (node.type === 'Group') {
      const g = new THREE.Group();
      g.name = node.name;
      if (node.position) g.position.set(...adjustPos(node.position, pivotComp));
      if (node.scale) g.scale.set(...node.scale);
      g.visible = node.visible !== false;
      parentObj.add(g);

      let rotTarget = g;
      if (node.pivot) {
        const pivot = new THREE.Group();
        pivot.name = node.name + '_pivot';
        pivot.position.set(node.pivot[0], node.pivot[1], node.pivot[2]);
        g.add(pivot);
        rotTarget = pivot;
        g.userData.pivot = pivot;
      }
      if (node.rotation) rotTarget.rotation.set(...node.rotation);

      // Group也要存入nodeMap，否则GUI面板找不到它
      nodeMap.set(node.name, { group: g, mesh: null, configNode: node, rotTarget });

      const childComp = node.pivot
        ? [-node.pivot[0], -node.pivot[1], -node.pivot[2]]
        : [0, 0, 0];
      g.userData.appliedComp = pivotComp;
      g.userData.childComp = childComp;

      if (node.children) {
        for (const c of node.children) buildNode(c, rotTarget, childComp);
      }
      return;
    }

    if (node.type === 'TrackChain') {
      buildTrackChain(node, parentObj, pivotComp);
      return;
    }

    const geo = createGeometry(node);
    const geo2 = createGeometry(node);
    // NaN 诊断
    if (geo2.attributes && geo2.attributes.position) {
      const p = geo2.attributes.position;
      for (let i = 0; i < Math.min(p.count, 3); i++) {
        if (!isFinite(p.getX(i))) {
          console.warn('⚠️ NaN geometry from createGeometry:', node.name, node.type, JSON.stringify(node.size));
          break;
        }
      }
    }
    // 安全居中：避免某些几何体 computeBoundingBox 产生 NaN
    geo2.computeBoundingBox();
    const box = geo2.boundingBox;
    if (box && isFinite(box.min.x) && isFinite(box.max.x)) {
      const cx = (box.min.x + box.max.x) / 2;
      const cy = (box.min.y + box.max.y) / 2;
      const cz = (box.min.z + box.max.z) / 2;
      geo2.translate(-cx, -cy, -cz);
    } else {
      console.warn('⚠️ NaN boundingBox for:', node.name, node.type, JSON.stringify(node.size));
    }
    const matId = node.materialId || 'default';
    const isCamo = (matId === 'camo_green' || matId === 'camo_dark' || matId === 'camo_desert');
    const mat = (node.color && !isCamo)
      ? new THREE.MeshStandardMaterial({ color:node.color, roughness:0.65, metalness:0.15 })
      : getMaterial(matId);
    if (node.flatShading) {
      mat.flatShading = true;
    }
    if (node.type === 'BentBox') mat.side = THREE.DoubleSide;
    const mesh = new THREE.Mesh(geo2, mat);
    mesh.name = node.name + '_mesh';

    const pos = adjustPos(node.position || [0,0,0], pivotComp);
    const group = new THREE.Group();
    group.name = node.name;
    group.position.set(...pos);
    if (node.scale) group.scale.set(...node.scale);
    group.visible = node.visible !== false;
    parentObj.add(group);

    let rotTarget = group;
    if (node.pivot) {
      const pivot = new THREE.Group();
      pivot.name = node.name + '_pivot';
      pivot.position.set(node.pivot[0], node.pivot[1], node.pivot[2]);
      group.add(pivot);
      mesh.position.set(-node.pivot[0], -node.pivot[1], -node.pivot[2]);
      pivot.add(mesh);
      rotTarget = pivot;
      group.userData.pivot = pivot;
    } else {
      group.add(mesh);
    }

    if (node.rotation) rotTarget.rotation.set(...node.rotation);

    // 存储映射
    nodeMap.set(node.name, { group, mesh, configNode:node, rotTarget });

    // BoxHelper
    if (showHelpers) {
      const h = new THREE.BoxHelper(mesh, helperColor(node.name));
      h.update();
      h.visible = node.visible !== false;
      h.userData._mesh = mesh;
      helpers.push(h);
    }

    const childComp = node.pivot
      ? [-node.pivot[0], -node.pivot[1], -node.pivot[2]]
      : [0,0,0];
    group.userData.appliedComp = pivotComp;
    group.userData.childComp = childComp;

    if (node.children) {
      for (const child of node.children) {
        buildNode(child, rotTarget, childComp);
      }
    }
  }

  buildNode(config, parent);
  for (const h of helpers) parent.add(h);
  parent.userData.helpers = helpers;
  return parent;
}

// ============================================================
// 5. 统计面数
// ============================================================
function countTriangles(obj) {
  let count = 0;
  obj.traverse(child => {
    if (child.isMesh && child.geometry) {
      const geo = child.geometry;
      count += (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
    }
  });
  return Math.round(count);
}

function refreshPartTree() {
  const container = document.getElementById('part-tree');
  if (!container) return;
  container.innerHTML = '';
  const cfg = MODEL_CONFIGS[currentModelType];
  if (!cfg) return;
  renderPartTree(cfg, container, 0);
}
function renderPartTree(cfg, parentEl, depth) {
  const row = document.createElement('div');
  row.className = 'pt-item';
  if (selectedParts.has(cfg.name)) row.classList.add('selected');
  const info = nodeMap.get(cfg.name);
  const isVisible = info ? info.group.visible !== false : (cfg.visible !== false);
  if (!isVisible) row.classList.add('hidden');
  const hasChildren = cfg.children && cfg.children.length > 0;
  const collapsed = ptCollapsed.has(cfg.name);
  // 折叠按钮
  const toggle = document.createElement('span');
  toggle.className = 'pt-toggle' + (hasChildren ? '' : ' leaf');
  toggle.textContent = hasChildren ? (collapsed ? '▶' : '▼') : '';
  toggle.onclick = e => {
    e.stopPropagation();
    if (collapsed) ptCollapsed.delete(cfg.name);
    else ptCollapsed.add(cfg.name);
    refreshPartTree();
  };
  // 图标
  const icon = document.createElement('span');
  icon.className = 'pt-icon';
  icon.textContent = hasChildren ? (cfg.type === 'Group' ? '⚙' : '📁') : '◼';
  // 名称
  const name = document.createElement('span');
  name.textContent = cfg.name;
  name.style.overflow = 'hidden';
  name.style.textOverflow = 'ellipsis';
  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(name);
  row.onclick = e => {
    e.stopPropagation();
    if (e.ctrlKey || e.metaKey) toggleSelect(cfg.name);
    else selectSingle(cfg.name);
  };
  parentEl.appendChild(row);
  // 子节点
  if (hasChildren && !collapsed) {
    const childWrap = document.createElement('div');
    childWrap.className = 'pt-children';
    for (const c of cfg.children) renderPartTree(c, childWrap, depth + 1);
    parentEl.appendChild(childWrap);
  }
}

let undoStack = [];
const MAX_UNDO = 50;
const SAVE_KEY = 'tank_model_factory_save';

// 将 nodeMap 中的 3D 实时状态同步回 config 树（position/rotation/visible）
function syncConfigFromScene(cfg) {
  const n = nodeMap.get(cfg.name);
  if (n) {
    if (cfg.type === 'Group') {
      // Group 也需要同步位置/旋转/可见性
      cfg.position = [n.group.position.x, n.group.position.y, n.group.position.z].map(v=>+v.toFixed(4));
      cfg.rotation = [n.group.rotation.x, n.group.rotation.y, n.group.rotation.z].map(v=>+v.toFixed(4));
      cfg.visible = n.group.visible;
    } else {
      const cc = n.group.userData.appliedComp || [0,0,0];
      cfg.position = [n.group.position.x-cc[0], n.group.position.y-cc[1], n.group.position.z-cc[2]].map(v=>+v.toFixed(4));
      cfg.rotation = [n.rotTarget.rotation.x, n.rotTarget.rotation.y, n.rotTarget.rotation.z].map(v=>+v.toFixed(4));
      cfg.visible = n.group.visible;
    }
  }
  if (cfg.children) for (const c of cfg.children) syncConfigFromScene(c);
}

// 快照：先同步 3D→config，再深拷贝 config。一次拖拽只产生一个快照
let _snapshotLock = false;

function saveUndo(label) {
  if (!autoSnapshot || !modelRoot) return;
  if (_snapshotLock) return;  // 拖拽中，快照已在 pointerdown 时拍过
  syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
  const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
  undoStack.push(clone);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  console.log('📸 快照 #'+undoStack.length+' ('+label+')');
}

// pointerdown：操作开始前拍照 + 锁定，拖拽中 onChange 不再重复拍
document.addEventListener('pointerdown', e => {
  if (!modelRoot || !autoSnapshot) return;
  if (e.target.closest('.lil-gui')) {
    syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
    const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
    undoStack.push(clone);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    console.log('📸 快照 #'+undoStack.length+' (操作开始)');
    _snapshotLock = true;
  }
});
document.addEventListener('pointerup', () => { _snapshotLock = false; });

function deepRestore(target, source) {
  Object.keys(target).forEach(k => delete target[k]);
  const deepCopy = JSON.parse(JSON.stringify(source));
  Object.assign(target, deepCopy);
}

const _tankAnimNames = [
  '1/5 炮塔旋转 360°',
  '2/5 炮管俯仰',
  '3/5 高射机枪 旋转+俯仰',
  '4/5 前进（履带+轮子）',
  '5/5 后退（履带+轮子）'
];
const _tankAnimDurations = [4000, 3000, 4000, 4000, 4000];

function _tankCollectRefs() {
  animRefs = {};

  const turretInfo = nodeMap.get('炮塔总成');
  const ringInfo = nodeMap.get('炮塔座圈');
  if (turretInfo && ringInfo) {
    let pivot = turretInfo.group.userData.animTurretPivot;
    if (!pivot) {
      pivot = new THREE.Group();
      pivot.name = 'animTurretPivot';
      const parent = turretInfo.group.parent;
      const ringWorld = new THREE.Vector3();
      ringInfo.group.getWorldPosition(ringWorld);
      const turretWorld = new THREE.Vector3();
      turretInfo.group.getWorldPosition(turretWorld);
      const ringLocal = parent.worldToLocal(ringWorld.clone());
      const turretLocal = parent.worldToLocal(turretWorld.clone());
      parent.remove(turretInfo.group);
      pivot.position.copy(ringLocal);
      parent.add(pivot);
      turretInfo.group.position.copy(turretLocal).sub(ringLocal);
      pivot.add(turretInfo.group);
      turretInfo.group.userData.animTurretPivot = pivot;
    }
    animRefs.turretPivot = pivot;
  }

  const barrelInfo = nodeMap.get('炮管总成');
  const mantletInfo = nodeMap.get('炮盾');
  if (barrelInfo && mantletInfo) {
    let pivot = barrelInfo.group.userData.animBarrelPivot;
    if (!pivot) {
      pivot = new THREE.Group();
      pivot.name = 'animBarrelPivot';
      const parent = barrelInfo.group.parent;
      const mantletWorld = new THREE.Vector3();
      mantletInfo.group.getWorldPosition(mantletWorld);
      const barrelWorld = new THREE.Vector3();
      barrelInfo.group.getWorldPosition(barrelWorld);
      const mantletLocal = parent.worldToLocal(mantletWorld.clone());
      const barrelLocal = parent.worldToLocal(barrelWorld.clone());
      parent.remove(barrelInfo.group);
      pivot.position.copy(mantletLocal);
      parent.add(pivot);
      barrelInfo.group.position.copy(barrelLocal).sub(mantletLocal);
      pivot.add(barrelInfo.group);
      barrelInfo.group.userData.animBarrelPivot = pivot;
    }
    animRefs.barrelPivot = pivot;
  }

  const mgInfo = nodeMap.get('高射机枪');
  if (mgInfo) {
    const pillarInfo = nodeMap.get('MG枪座支柱');
    if (pillarInfo) {
      const pillarH = ((pillarInfo.configNode.size || [0, 0.25])[1] || 0.25);
      const pivotY = pillarInfo.group.position.y + pillarH * 0.5;
      let pivot = mgInfo.group.userData.animMGPivot;
      if (!pivot) {
        pivot = new THREE.Group();
        pivot.name = 'animMGPivot';
        const mgGroup = mgInfo.group;
        pivot.position.set(0, pivotY, 0);
        mgGroup.add(pivot);
        const rotatingNames = ['MG枪身', 'MG枪管', 'MG枪口制退器', 'MG弹链箱', 'MG准星座'];
        for (const name of rotatingNames) {
          const info = nodeMap.get(name);
          if (info && info.group && info.group.parent === mgGroup) {
            mgGroup.remove(info.group);
            info.group.position.x -= pivot.position.x;
            info.group.position.y -= pivot.position.y;
            info.group.position.z -= pivot.position.z;
            pivot.add(info.group);
          }
        }
        mgGroup.userData.animMGPivot = pivot;
      }
      animRefs.mgPivot = pivot;
    }
  }

  animRefs.leftWheelPairs = [];
  animRefs.rightWheelPairs = [];
  for (let i = 1; i <= 5; i++) {
    const lw = nodeMap.get('左负重轮' + i);
    const rw = nodeMap.get('右负重轮' + i);
    if (lw) animRefs.leftWheelPairs.push(lw);
    if (rw) animRefs.rightWheelPairs.push(rw);
  }
  const lDrive = nodeMap.get('左主动轮');
  const rDrive = nodeMap.get('右主动轮');
  const lIdler = nodeMap.get('左诱导轮');
  const rIdler = nodeMap.get('右诱导轮');
  if (lDrive) animRefs.leftWheelPairs.push(lDrive);
  if (rDrive) animRefs.rightWheelPairs.push(rDrive);
  if (lIdler) animRefs.leftWheelPairs.push(lIdler);
  if (rIdler) animRefs.rightWheelPairs.push(rIdler);

  for (const w of animRefs.leftWheelPairs) {
    if (w._initRotX == null) w._initRotX = w.mesh.rotation.x;
    if (w._initRotY == null) w._initRotY = w.mesh.rotation.y;
    if (w._initRotZ == null) w._initRotZ = w.mesh.rotation.z;
  }
  for (const w of animRefs.rightWheelPairs) {
    if (w._initRotX == null) w._initRotX = w.mesh.rotation.x;
    if (w._initRotY == null) w._initRotY = w.mesh.rotation.y;
    if (w._initRotZ == null) w._initRotZ = w.mesh.rotation.z;
  }

  const leftTrackInfo = nodeMap.get('左履带链');
  const rightTrackInfo = nodeMap.get('右履带链');
  if (leftTrackInfo && leftTrackInfo.configNode && leftTrackInfo.configNode.trackParams) {
    animRefs.leftTrackGroup = leftTrackInfo.group;
    animRefs.leftTrackParams = leftTrackInfo.configNode.trackParams;
    animRefs.leftTrackPlates = leftTrackInfo.group.children.filter(c => c.isMesh);
    const tp = animRefs.leftTrackParams;
    const spacing = computeTrackTotalLen(tp) / (tp.count - 1);
    animRefs.leftTrackSpacing = spacing;
    animRefs.leftTrackTotalLen = computeTrackTotalLen(tp);
  }
  if (rightTrackInfo && rightTrackInfo.configNode && rightTrackInfo.configNode.trackParams) {
    animRefs.rightTrackGroup = rightTrackInfo.group;
    animRefs.rightTrackParams = rightTrackInfo.configNode.trackParams;
    animRefs.rightTrackPlates = rightTrackInfo.group.children.filter(c => c.isMesh);
    const tp = animRefs.rightTrackParams;
    const spacing = computeTrackTotalLen(tp) / (tp.count - 1);
    animRefs.rightTrackSpacing = spacing;
    animRefs.rightTrackTotalLen = computeTrackTotalLen(tp);
  }
}

function _tankUpdateFrame(dt, t, elapsed, duration) {
  switch (animPhase) {
    case 1: {
      if (animRefs.turretPivot) animRefs.turretPivot.rotation.y = t * Math.PI * 2;
      break;
    }
    case 2: {
      if (animRefs.barrelPivot) {
        const maxUp = 25 * Math.PI / 180;
        const maxDown = -10 * Math.PI / 180;
        const pitch = maxDown + (maxUp - maxDown) * ((Math.sin(t * Math.PI * 2.5 - Math.PI/2) + 1) * 0.5);
        animRefs.barrelPivot.rotation.x = -pitch;
      }
      break;
    }
    case 3: {
      if (animRefs.mgPivot) {
        animRefs.mgPivot.rotation.y = t * Math.PI * 3;
        animRefs.mgPivot.rotation.x = Math.sin(t * Math.PI * 3) * 0.35;
      }
      break;
    }
    case 4: {
      const wheelSpeed = dt * 8;
      for (const w of animRefs.leftWheelPairs || []) { if (w.mesh) w.mesh.rotateY(-wheelSpeed); }
      for (const w of animRefs.rightWheelPairs || []) { if (w.mesh) w.mesh.rotateY(-wheelSpeed); }
      trackOffsetL += dt * 2.0; trackOffsetR += dt * 2.0;
      updateTrackPlates(animRefs, trackOffsetL, trackOffsetR);
      break;
    }
    case 5: {
      const wheelSpeed = dt * 8;
      for (const w of animRefs.leftWheelPairs || []) { if (w.mesh) w.mesh.rotateY(wheelSpeed); }
      for (const w of animRefs.rightWheelPairs || []) { if (w.mesh) w.mesh.rotateY(wheelSpeed); }
      trackOffsetL -= dt * 2.0; trackOffsetR -= dt * 2.0;
      updateTrackPlates(animRefs, trackOffsetL, trackOffsetR);
      break;
    }
  }
}

function _tankResetState() {
  if (animRefs.turretPivot) animRefs.turretPivot.rotation.y = 0;
  if (animRefs.barrelPivot) animRefs.barrelPivot.rotation.x = 0;
  if (animRefs.mgPivot) { animRefs.mgPivot.rotation.y = 0; animRefs.mgPivot.rotation.x = 0; }
  for (const w of animRefs.leftWheelPairs || []) {
    if (w.mesh) w.mesh.rotation.set(w._initRotX || 0, w._initRotY || 0, w._initRotZ || 0);
  }
  for (const w of animRefs.rightWheelPairs || []) {
    if (w.mesh) w.mesh.rotation.set(w._initRotX || 0, w._initRotY || 0, w._initRotZ || 0);
  }
}

function _tankDestroyPivots() {
  function restoreChildren(pivot, parent) {
    if (!pivot || !pivot.parent) return;
    while (pivot.children.length > 0) {
      const child = pivot.children[0];
      const worldPos = new THREE.Vector3();
      child.getWorldPosition(worldPos);
      pivot.remove(child);
      const localPos = parent.worldToLocal(worldPos);
      child.position.copy(localPos);
      parent.add(child);
    }
    pivot.parent.remove(pivot);
  }
  const turretInfo = nodeMap.get('炮塔总成');
  if (turretInfo && turretInfo.group.userData.animTurretPivot) {
    restoreChildren(turretInfo.group.userData.animTurretPivot, turretInfo.group.userData.animTurretPivot.parent);
    turretInfo.group.userData.animTurretPivot = null;
  }
  const barrelInfo = nodeMap.get('炮管总成');
  if (barrelInfo && barrelInfo.group.userData.animBarrelPivot) {
    restoreChildren(barrelInfo.group.userData.animBarrelPivot, barrelInfo.group.userData.animBarrelPivot.parent);
    barrelInfo.group.userData.animBarrelPivot = null;
  }
  const mgInfo = nodeMap.get('高射机枪');
  if (mgInfo && mgInfo.group.userData.animMGPivot) {
    restoreChildren(mgInfo.group.userData.animMGPivot, mgInfo.group);
    mgInfo.group.userData.animMGPivot = null;
  }
  animRefs = {};
}

function _tankRestorePlates() {
  if (animRefs.leftTrackPlates && animRefs.leftTrackParams) {
    const tp = animRefs.leftTrackParams;
    const spacing = animRefs.leftTrackSpacing;
    for (let i = 0; i < animRefs.leftTrackPlates.length; i++) {
      const dist = i * spacing;
      const trans = getTrackPlateTransform(dist, tp);
      animRefs.leftTrackPlates[i].position.set(trans.pos.x, trans.pos.y, trans.pos.z);
      animRefs.leftTrackPlates[i].rotation.set(trans.rot.x, trans.rot.y, trans.rot.z);
    }
  }
  if (animRefs.rightTrackPlates && animRefs.rightTrackParams) {
    const tp = animRefs.rightTrackParams;
    const spacing = animRefs.rightTrackSpacing;
    for (let i = 0; i < animRefs.rightTrackPlates.length; i++) {
      const dist = i * spacing;
      const trans = getTrackPlateTransform(dist, tp);
      animRefs.rightTrackPlates[i].position.set(trans.pos.x, trans.pos.y, trans.pos.z);
      animRefs.rightTrackPlates[i].rotation.set(trans.rot.x, trans.rot.y, trans.rot.z);
    }
  }
}

function _doDestroyPivots() { const ma = getModelAnims(); if (ma && ma.destroyPivots) ma.destroyPivots(); else { animRefs = window._animRefs = {}; } }
function _doRestorePlates() { const ma = getModelAnims(); if (ma && ma.restorePlates) ma.restorePlates(); }

// ── 每帧更新 ──
function updateAnimShowcase(dt) {
  if (!animShowcase || animPhase === 0) return;
  const ma = getModelAnims();
  if (!ma || !ma.updateFrame) return;
  const elapsed = performance.now() - animStartTime;
  const duration = (ma.durations || [4000])[animPhase - 1] || 4000;
  const t = Math.min(elapsed / duration, 1);
  ma.updateFrame(dt, t, elapsed, duration, animPhase - 1);
  if (t >= 1) {
    // 受击踉跄: 一次性播放, 完毕后回待机
    if (animPhase - 1 === 21) { jumpToAnim(0); return; }
    // 死亡: 一次性播放, 停留1.5s后回待机(便于观察)
    if (animPhase - 1 === 22) { setTimeout(function() { jumpToAnim(0); }, 1500); return; }
    // 锁定当前动画循环播放（不再自动跳到下一个）
    animStartTime = performance.now();
    trackOffsetL = 0; trackOffsetR = 0;
    _doResetState();
  }
}

// 跳转到指定动画
function jumpToAnim(index) {
  const ma = getModelAnims();
  if (!ma || !ma.names || index < 0 || index >= ma.names.length) return;
  animPhase = index + 1;
  animStartTime = performance.now();
  trackOffsetL = 0; trackOffsetR = 0;
  _doResetState();
  if (animStatusEl && ma.names) animStatusEl.textContent = ma.names[index] || '';
  _updateAnimListHighlight();
}

function _updateAnimListHighlight() {
  var list = document.getElementById('anim-list');
  if (!list) return;
  var items = list.querySelectorAll('.anim-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', i === animPhase - 1);
  }
}

function _buildAnimList() {
  var list = document.getElementById('anim-list');
  if (!list) return;
  list.innerHTML = '';
  var ma = getModelAnims();
  if (!ma || !ma.names) return;
  // 分类标签（索引基于 _hexaAnimNames 顺序, 共21个）
  var categories = [
    { label: '── 待机 ──', at: 0 },
    { label: '── 行进 (前进/后退) ──', at: 1 },
    { label: '── 平移 (步行) ──', at: 5 },
    { label: '── 转弯 (原地) ──', at: 7 },
    { label: '── 转弯 (移动) ──', at: 9 },
    { label: '── 平移 (奔跑) ──', at: 19 },
    { label: '── 受击 ──', at: 21 },
    { label: '── 死亡 ──', at: 22 },
  ];
  var catIdx = 0;
  for (var i = 0; i < ma.names.length; i++) {
    // 在分类点插入分隔符
    while (catIdx < categories.length && categories[catIdx].at === i) {
      var sep = document.createElement('div');
      sep.className = 'anim-separator';
      sep.textContent = categories[catIdx].label;
      list.appendChild(sep);
      catIdx++;
    }
    var item = document.createElement('div');
    item.className = 'anim-item';
    item.textContent = (i + 1) + ' ' + ma.names[i].split(' ').slice(1).join(' ');
    item.onclick = (function(idx) { return function() { jumpToAnim(idx); }; })(i);
    list.appendChild(item);
  }
  list.style.display = 'flex';
}

// ── 开关 ──
function toggleAnimShowcase() {
  const ma = getModelAnims();
  if (!ma) return;
  animShowcase = !animShowcase;
  const btn = document.getElementById('toggle-anim');
  const statusEl = document.getElementById('anim-status');
  const listEl = document.getElementById('anim-list');
  animStatusEl = statusEl;
  if (animShowcase) {
    btn.classList.add('active');
    btn.textContent = '⏹ 停止展台';
    if (ma.collectRefs) ma.collectRefs();
    animPhase = 1;
    animStartTime = performance.now();
    trackOffsetL = 0; trackOffsetR = 0;
    _doResetState();
    statusEl.style.display = 'block';
    statusEl.textContent = (ma.names || [])[0] || '';
    _buildAnimList();
    _updateAnimListHighlight();
  } else {
    btn.classList.remove('active');
    btn.textContent = '\u{1f3ac} 动画展台';
    animPhase = 0;
    _doResetState();
    trackOffsetL = 0; trackOffsetR = 0;
    _doDestroyPivots();

    statusEl.style.display = 'none';
    if (listEl) { listEl.innerHTML = ''; listEl.style.display = 'none'; }

}
