<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.18.0/dist/lil-gui.esm.js"
  }

<script type="module">

// ============================================================
// 1. 默认材质字典
// ============================================================
const MATERIAL_DEFS = {
  steel:       { color:0x6b6b7b, roughness:0.5,  metalness:0.8 },
  dark_steel:  { color:0x4a4a5a, roughness:0.45, metalness:0.85, emissive:0x111111, emissiveIntensity:0.30 },
  barrel_steel:{ color:0x3a3a44, roughness:0.35, metalness:0.9,  emissive:0x0a0a0a, emissiveIntensity:0.20 },
  rubber:      { color:0x2a2a2e, roughness:0.9,  metalness:0.05, emissive:0x080808, emissiveIntensity:0.25 },
  camo_green:  { color:0x4a5c2e, roughness:0.75, metalness:0.1 },
  camo_dark:   { color:0x3d4f25, roughness:0.7,  metalness:0.1 },
  camo_desert: { color:0x8b7d4a, roughness:0.75, metalness:0.1 },
  wood:        { color:0x6b4e3d, roughness:0.85, metalness:0.0 },
  default:     { color:0x888888, roughness:0.6,  metalness:0.2 }
};

function getMaterial(matId) {
  const def = MATERIAL_DEFS[matId] || MATERIAL_DEFS.default;
  return new THREE.MeshStandardMaterial({ ...def });
}

// ============================================================
// 1.5 台型几何体（顶底矩形不同大小）
// ============================================================
function buildTaperedBox(bw, h, bd, tw, td, ox=0, oz=0) {
  const hw = bw/2, hd = bd/2, thw = tw/2, thd = td/2;
  const verts = [], indices = [];
  let vi = 0;
  function quad(a, b, c, d) {
    verts.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2], d[0],d[1],d[2]);
    indices.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  quad([-hw,0,-hd], [hw,0,-hd], [hw,0,hd], [-hw,0,hd]);
  quad([-thw+ox,h,-thd+oz], [-thw+ox,h,thd+oz], [thw+ox,h,thd+oz], [thw+ox,h,-thd+oz]);
  quad([-hw,0,-hd], [-thw+ox,h,-thd+oz], [thw+ox,h,-thd+oz], [hw,0,-hd]);
  quad([hw,0,hd], [thw+ox,h,thd+oz], [-thw+ox,h,thd+oz], [-hw,0,hd]);
  quad([-hw,0,hd], [-thw+ox,h,thd+oz], [-thw+ox,h,-thd+oz], [-hw,0,-hd]);
  quad([hw,0,-hd], [thw+ox,h,-thd+oz], [thw+ox,h,thd+oz], [hw,0,hd]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// 椭圆六棱台：底面和顶面是压扁的六边形
// size: [底宽, 高, 底深, 顶宽, 顶深]
function buildTaperedHex(bw, h, bd, tw, td, ox=0, oz=0) {
  const hw = bw/2, hd = bd/2, thw = tw/2, thd = td/2;
  const S3 = Math.sqrt(3)/2;
  const verts = [], indices = [];
  let vi = 0;
  function quad(a, b, c, d) {
    verts.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2], d[0],d[1],d[2]);
    indices.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  function hexFan(p0,p1,p2,p3,p4,p5) {
    verts.push(p0[0],p0[1],p0[2],p1[0],p1[1],p1[2],p2[0],p2[1],p2[2],p3[0],p3[1],p3[2],p4[0],p4[1],p4[2],p5[0],p5[1],p5[2]);
    indices.push(vi,vi+1,vi+2, vi,vi+2,vi+3, vi,vi+3,vi+4, vi,vi+4,vi+5);
    vi += 6;
  }
  hexFan([hw,0,0],[hw/2,0,hd*S3],[-hw/2,0,hd*S3],[-hw,0,0],[-hw/2,0,-hd*S3],[hw/2,0,-hd*S3]);
  hexFan([thw+ox,h,0+oz],[thw/2+ox,h,-thd*S3+oz],[-thw/2+ox,h,-thd*S3+oz],[-thw+ox,h,0+oz],[-thw/2+ox,h,thd*S3+oz],[thw/2+ox,h,thd*S3+oz]);
  quad([hw,0,0],        [thw+ox,h,0+oz],        [thw/2+ox,h,thd*S3+oz],   [hw/2,0,hd*S3]);
  quad([hw/2,0,hd*S3],  [thw/2+ox,h,thd*S3+oz],  [-thw/2+ox,h,thd*S3+oz], [-hw/2,0,hd*S3]);
  quad([-hw/2,0,hd*S3], [-thw/2+ox,h,thd*S3+oz], [-thw+ox,h,0+oz],        [-hw,0,0]);
  quad([-hw,0,0],       [-thw+ox,h,0+oz],        [-thw/2+ox,h,-thd*S3+oz], [-hw/2,0,-hd*S3]);
  quad([-hw/2,0,-hd*S3],[-thw/2+ox,h,-thd*S3+oz],[thw/2+ox,h,-thd*S3+oz],  [hw/2,0,-hd*S3]);
  quad([hw/2,0,-hd*S3], [thw/2+ox,h,-thd*S3+oz], [thw+ox,h,0+oz],          [hw,0,0]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}
function buildBentBox(w, h, d, bendAngle, segments) {
  const r = d / bendAngle;
  const hw = w / 2;
  const n = segments;

  const bY = [], bZ = [], tY = [], tZ = [];
  for (let i = 0; i <= n; i++) {
    const z = (i / n - 0.5) * d;
    const th = z / r;
    const s = Math.sin(th), c = Math.cos(th);
    bY.push(r * (1 - c));
    bZ.push(r * s);
    const rh = r - h;
    tY.push(r - rh * c);
    tZ.push(rh * s);
  }

  const verts = [];
  const indices = [];
  let vi = 0;

  function quad(a, b, c, d) {
    verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
    indices.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }

  for (let i = 0; i < n; i++) {
    quad([-hw, bY[i], bZ[i]], [hw, bY[i], bZ[i]], [hw, bY[i+1], bZ[i+1]], [-hw, bY[i+1], bZ[i+1]]);
    quad([-hw, tY[i+1], tZ[i+1]], [hw, tY[i+1], tZ[i+1]], [hw, tY[i], tZ[i]], [-hw, tY[i], tZ[i]]);
    quad([-hw, bY[i], bZ[i]], [-hw, tY[i], tZ[i]], [-hw, tY[i+1], tZ[i+1]], [-hw, bY[i+1], bZ[i+1]]);
    quad([hw, bY[i+1], bZ[i+1]], [hw, tY[i+1], tZ[i+1]], [hw, tY[i], tZ[i]], [hw, bY[i], bZ[i]]);
  }

  quad([-hw, bY[0], bZ[0]], [hw, bY[0], bZ[0]], [hw, tY[0], tZ[0]], [-hw, tY[0], tZ[0]]);
  quad([hw, bY[n], bZ[n]], [-hw, bY[n], bZ[n]], [-hw, tY[n], tZ[n]], [hw, tY[n], tZ[n]]);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function createGeometry(node) {
  const s = node.size || [1, 1, 1];
  const seg = node.segments || [8, 1];
  switch (node.type) {
    case 'Box':
      return new THREE.BoxGeometry(s[0], s[1]||s[0], s[2]||s[0]);
    case 'BentBox':
      return buildBentBox(s[0], s[1]||0.3, s[2]||s[0], s[3]!=null?s[3]:Math.PI/6, seg[0]||16);
    case 'TaperedBox':
      // size: [底部宽, 高, 底部深, 顶部宽, 顶部深, 顶面X偏移, 顶面Z偏移]
      return buildTaperedBox(s[0], s[1]||1, s[2]||s[0], s[3]!==undefined?s[3]:s[0]*0.6, s[4]!==undefined?s[4]:s[2]*0.6, s[5]||0, s[6]||0);
    case 'TaperedHex':
      // size: [底宽, 高, 底深, 顶宽, 顶深, 顶面X偏移, 顶面Z偏移]
      return buildTaperedHex(s[0], s[1]||1, s[2]||s[0], s[3]!==undefined?s[3]:s[0]*0.6, s[4]!==undefined?s[4]:s[2]*0.6, s[5]||0, s[6]||0);
    case 'RoundedBox':
      // size: [width, height, depth, radius, segments]
      return new RoundedBoxGeometry(s[0], s[1]||s[0], s[2]||s[0], seg[0]||3, s[3]||0.08);
    case 'Cylinder':
      return new THREE.CylinderGeometry(s[0], s[2]!==undefined ? s[2] : s[0], s[1], seg[0]||6);
    case 'Sphere':
      return new THREE.SphereGeometry(s[0], seg[0]||8, seg[1]||6);
    case 'Torus':
      return new THREE.TorusGeometry(s[0], s[1]||0.05, seg[0]||8, seg[1]||12);
    case 'Lathe': {
      const profile = node.profile || [[0.5,0],[0.5,0.3],[0.6,0.3],[0.6,0.35],[0.55,0.4],[0.3,0.45],[0.1,0.4]];
      const sR = node.scaleR ?? 1;
      const sH = node.scaleH ?? 1;
      const pts = profile.map(p => new THREE.Vector2(p[0] * sR, p[1] * sH));
      return new THREE.LatheGeometry(pts, seg[0]||24);
    }
    case 'Extrude': {
      const shape = node.shape || [[-0.5,-0.2],[0.5,-0.2],[0.5,0.2],[-0.5,0.2]];
      const shape2D = new THREE.Shape(shape.map(p => new THREE.Vector2(p[0], p[1])));
      const depth = node.extrudeDepth !== undefined ? node.extrudeDepth : 0.5;
      const bevel = node.bevelThickness || 0.02;
      return new THREE.ExtrudeGeometry(shape2D, { depth, bevelThickness:bevel, bevelSize:bevel, bevelSegments:2 });
    }
    default: return null;
  }
}

// TrackChain 履带链生成器
function buildTrackChain(node, parentGroup, pivotComp = [0,0,0]) {
  const tp = node.trackParams;
  const g = new THREE.Group();
  g.name = node.name;
  if (node.position) {
    const pos = [node.position[0]+pivotComp[0], node.position[1]+pivotComp[1], node.position[2]+pivotComp[2]];
    g.position.set(...pos);
  }
  if (node.scale) g.scale.set(...node.scale);
  g.visible = node.visible !== false;
  parentGroup.add(g);

  const cyF = tp.wheelCenterYFront, cyR = tp.wheelCenterYRear;
  const rF = tp.wheelRadiusFront, rR = tp.wheelRadiusRear;
  const zF = tp.wheelCenterZFront, zR = tp.wheelCenterZRear;

  // r21: 6点+2弧精确几何模型（用户设计的理想拓扑）
  const zR1 = 1.4;    // 负重轮1 Z (固定)
  const zR2 = 0.39;   // 负重轮2 Z (l1=2份边距: 1.40-0.80-0.214)
  const zR3 = -0.74;  // 负重轮3 Z (l2=3份边距, 最大间隙)
  const zR4 = -1.64;  // 负重轮4 Z (l3=1份边距)
  const zR5 = -2.55;  // 负重轮5 Z (l4=1份边距, 固定)
  const wheelR = 0.40; // ⚠️ 修正：Cylinder size[0]=半径=0.4（不是直径！）

  // 6个关键点坐标（与 getTrackPlateTransform 保持完全一致）
  // ⚠️ 注意：Z轴在屏幕上方向与数学X轴相反（左=Z+），所以Z分量需取负
  const pA = { z: zR - rR * Math.cos(Math.PI/2),           y: cyR + rR * Math.sin(Math.PI/2) };              // A: c1轮12点(+90°)
  const pB = { z: zF - rF * Math.cos(Math.PI/2),           y: cyF + rF * Math.sin(Math.PI/2) };              // B: a1轮12点(+90°)
  const angleC = -120 * Math.PI / 180;  // -120° (7点钟)
  const pC = { z: zF - rF * Math.cos(angleC),             y: cyF + rF * Math.sin(angleC) };                 // C: a1轮7点
  // D: b1轮6.5点钟位置(约-105°, 在轮子边沿的6点和7点之间)
  const angleD = -105 * Math.PI / 180;  // -105° (6点半位置)
  const pD = { z: zR1 - wheelR * Math.cos(angleD),        y: 0.40 + wheelR * Math.sin(angleD) };            // D: b1轮6.5点(边沿)
  // E: b5轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
  const angleE = -75 * Math.PI / 180;   // -75° (5点半)
  const pE = { z: zR5 - wheelR * Math.cos(angleE),        y: 0.40 + wheelR * Math.sin(angleE) };            // E: b5轮5.5点(边沿)
  // F: c1轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
  const angleF = -75 * Math.PI / 180;   // -75° (5点半)
  const pF = { z: zR - rR * Math.cos(angleF),             y: cyR + rR * Math.sin(angleF) };                 // F: c1轮5.5点(边沿)

  // 6段长度
  const lenAB = Math.sqrt((pB.z-pA.z)**2 + (pB.y-pA.y)**2);  // AB: 上支路(c1→a1)
  const lenBC = (angleC + 2*Math.PI - Math.PI/2) * rF;        // BC: 前弧(绕a1, 逆时针短弧 12→11→10→9→8→7 = 150°)
  const lenCD = Math.sqrt((pD.z-pC.z)**2 + (pD.y-pC.y)**2);  // CD: 下前斜线(a1→b1)
  const lenDE = Math.abs(pE.z - pD.z);                         // DE: 下主干(b1→b5)
  const lenEF = Math.sqrt((pF.z-pE.z)**2 + (pF.y-pE.y)**2);  // EF: 下后斜线(b5→c1)
  const lenFA = (Math.PI/2 - angleF) * rR;                     // FA: 后弧(绕c1, -120°→90°=210°)

  const totalLen = lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;
  const spacing = totalLen / (tp.count - 1);

  const mat = (node.color)
    ? new THREE.MeshStandardMaterial({ color:node.color, roughness:0.65, metalness:0.15 })
    : getMaterial(node.materialId || 'dark_steel');

  for (let i = 0; i < tp.count; i++) {
    const dist = i * spacing;
    const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(tp.plateWidth, tp.plateHeight, tp.plateDepth),
      mat
    );
    plate.position.set(pp.x, pp.y, pp.z);
    plate.rotation.set(rot.x, rot.y, rot.z);
    plate.castShadow = true;
    plate.receiveShadow = true;
    g.add(plate);
  }

  // 🆕 TrackChain 理论路径可视化（调试用，绿色Line）
  if (tp.showPath) {
    const pathPts = [];
    const steps = 200;
    for (let i = 0; i <= steps; i++) {
      const d = (i / steps) * totalLen;
      const { pos: pp } = getTrackPlateTransform(d, tp);
      pathPts.push(new THREE.Vector3(pp.x, pp.y, pp.z));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pathPts);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
    const line = new THREE.Line(lineGeo, lineMat);
    line.name = node.name + '_path';
    g.add(line);
  }

  nodeMap.set(node.name, { group: g, mesh: null, configNode: node, rotTarget: g });
}

function getTrackPlateTransform(dist, tp) {
  // r21: 6点+2弧精确几何模型（用户设计的理想拓扑）
  const cyF = tp.wheelCenterYFront, cyR = tp.wheelCenterYRear;
  const rF = tp.wheelRadiusFront, rR = tp.wheelRadiusRear;
  const zF = tp.wheelCenterZFront, zR = tp.wheelCenterZRear;

  const zR1 = 1.4;    // 负重轮1 Z
  const zR5 = -2.55;   // 负重轮5 Z
  const wheelR = 0.40; // ⚠️ 修正：Cylinder size[0]=半径=0.4（不是直径！）

  // ========== 6个关键点的精确坐标（基于用户确认的拓扑）==========
  // ⚠️ Z轴修正：屏幕左边=Z+，所以 Z = center.z - r*cos(angle)
  // A: 主动轮(c1)12点钟位置 (+90°)
  const pA = { z: zR - rR * Math.cos(Math.PI/2),           y: cyR + rR * Math.sin(Math.PI/2) };              // (-3.30, 0.75)
  // B: 诱导轮(a1)12点钟位置 (+90°)
  const pB = { z: zF - rF * Math.cos(Math.PI/2),           y: cyF + rF * Math.sin(Math.PI/2) };              // (+2.10, 0.74)
  // C: 诱导轮(a1)7点钟位置 (-120°, 左下方)
  const angleC = -120 * Math.PI / 180;  // -120° (7点钟)
  const pC = { z: zF - rF * Math.cos(angleC),             y: cyF + rF * Math.sin(angleC) };
  // D: 第1负重轮(b1)边沿切点 (6.5点钟位置, -105°)
  const angleD = -105 * Math.PI / 180;  // -105° (6点半)
  const pD = { z: zR1 - wheelR * Math.cos(angleD),        y: 0.40 + wheelR * Math.sin(angleD) };            // D: b1轮6.5点(边沿)
  // E: 第5负重轮(b5)底部切点 (6点, 正下方)
  const angleE = -75 * Math.PI / 180;   // -75° (5点半, 在5-6点之间)
  const pE = { z: zR5 - wheelR * Math.cos(angleE),        y: 0.40 + wheelR * Math.sin(angleE) };            // E: b5轮5.5点(边沿)
  // F: c1轮5.5点钟位置(约-75°, 在轮子边沿的5点和6点之间)
  const angleF = -75 * Math.PI / 180;   // -75° (5点半)
  const pF = { z: zR - rR * Math.cos(angleF),             y: cyR + rR * Math.sin(angleF) };                 // F: c1轮5.5点(边沿)

  // ========== 6段长度计算 ==========
  const lenAB = Math.sqrt((pB.z-pA.z)**2 + (pB.y-pA.y)**2);  // AB: 上支路(主动轮顶→诱导轮顶)
  const lenBC = (angleC + 2*Math.PI - Math.PI/2) * rF;        // BC: 前弧(绕诱导轮, 逆时针短弧 12→11→10→9→8→7 = 150°)
  const lenCD = Math.sqrt((pD.z-pC.z)**2 + (pD.y-pC.y)**2);  // CD: 下前斜线(诱导轮底→轮1底)
  const lenDE = Math.abs(pE.z - pD.z);                         // DE: 下支路主干(Y恒定=0.20)
  const lenEF = Math.sqrt((pF.z-pE.z)**2 + (pF.y-pE.y)**2);  // EF: 下后斜线(轮5底→主动轮底)
  const lenFA = (Math.PI/2 - angleF) * rR;                     // FA: 后弧(绕主动轮, -120°→90°=210°)

  const totalLen = lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;

  let pos = { x: 0, y: 0, z: 0 };
  let rot = { x: 0, y: 0, z: 0 };
  let d = dist;

  // 段1: AB 上支路 (线性插值)
  if (d <= lenAB) {
    const t = d / lenAB;
    pos.z = pA.z + t * (pB.z - pA.z);
    pos.y = pA.y + t * (pB.y - pA.y);
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenAB;

  // 段2: BC 前弧 (绕诱导轮, 逆时针短弧: 12→11→10→9→8→7)
  // ⚠️ Z轴修正: Z = centerZ - r*cos(angle)
  // 角度从 +90°(12点) 增加到 +240°(= -120°+360°, 7点的等效角度), 走150°逆时针短弧
  if (d <= lenBC) {
    const angle = Math.PI/2 + (d / lenBC) * (angleC + 2*Math.PI - Math.PI/2);  // 90° → 240° (逆时针)
    pos.z = zF - rF * Math.cos(angle);
    pos.y = cyF + rF * Math.sin(angle);
    rot.x = angle - Math.PI/2;
    return { pos, rot };
  }
  d -= lenBC;

  // 段3: CD 下支路前斜线 (线性插值)
  if (d <= lenCD) {
    const t = d / lenCD;
    pos.z = pC.z + t * (pD.z - pC.z);
    pos.y = pC.y + t * (pD.y - pC.y);
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenCD;

  // 段4: DE 下支路主干 (Y恒定=0.20, 切于各负重轮底部)
  if (d <= lenDE) {
    const t = d / lenDE;
    pos.z = pD.z + t * (pE.z - pD.z);
    pos.y = pD.y;
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenDE;

  // 段5: EF 下支路后斜线 (线性插值)
  if (d <= lenEF) {
    const t = d / lenEF;
    pos.z = pE.z + t * (pF.z - pE.z);
    pos.y = pE.y + t * (pF.y - pE.y);
    rot.x = 0;
    return { pos, rot };
  }
  d -= lenEF;

  // 段6: FA 后弧 (绕主动轮, 标准圆弧 cos/sin)
  // ⚠️ Z轴修正: Z = centerZ - r*cos(angle)
  if (d <= lenFA) {
    const angle = angleF + (d / lenFA) * (Math.PI/2 - angleF);  // -120° → 90°
    pos.z = zR - rR * Math.cos(angle);
    pos.y = cyR + rR * Math.sin(angle);
    rot.x = angle - Math.PI/2;
    return { pos, rot };
  }

  return { pos, rot };
}

// ============================================================
// 3. 辅助色（BoxHelper 颜色映射）
// ============================================================
function helperColor(name) {
  const hash = name.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0);
  const hues = [0xFF6B6B,0x4ECDC4,0xFFE66D,0x95E1D3,0xF38181,0xAA96DA,0x88D8B0,0x70C1B3,0xFF8A5C,0xCCA000];
  return hues[Math.abs(hash) % hues.length];
}

// ============================================================
// 4. 递归构建函数 buildFromConfig()
// ============================================================
function buildFromConfig(config, parent, showHelpers, nodeMap) {
  const helpers = [];
  function adjustPos(rawPos, comp) {
    return [rawPos[0]+comp[0], rawPos[1]+comp[1], rawPos[2]+comp[2]];
  }

  function buildNode(node, parentObj, pivotComp = [0,0,0]) {
    if (node.type === 'Group') {
      const g = new THREE.Group();
      g.name = node.name;
      if (node.position) g.position.set(...adjustPos(node.position, pivotComp));
      if (node.rotation) g.rotation.set(...node.rotation);
      if (node.scale) g.scale.set(...node.scale);
      g.visible = node.visible !== false;
      parentObj.add(g);
      // Group也要存入nodeMap，否则GUI面板找不到它
      nodeMap.set(node.name, { group: g, mesh: null, configNode: node, rotTarget: g });
      if (node.children) {
        for (const c of node.children) buildNode(c, g);
      }
      return;
    }

    if (node.type === 'TrackChain') {
      buildTrackChain(node, parentObj, pivotComp);
      return;
    }

    const geo = createGeometry(node);
    const geo2 = createGeometry(node);
    // NaN 诊断
    if (geo2.attributes && geo2.attributes.position) {
      const p = geo2.attributes.position;
      for (let i = 0; i < Math.min(p.count, 3); i++) {
        if (!isFinite(p.getX(i))) {
          console.warn('⚠️ NaN geometry from createGeometry:', node.name, node.type, JSON.stringify(node.size));
          break;
        }
      }
    }
    // 安全居中：避免某些几何体 computeBoundingBox 产生 NaN
    geo2.computeBoundingBox();
    const box = geo2.boundingBox;
    if (box && isFinite(box.min.x) && isFinite(box.max.x)) {
      const cx = (box.min.x + box.max.x) / 2;
      const cy = (box.min.y + box.max.y) / 2;
      const cz = (box.min.z + box.max.z) / 2;
      geo2.translate(-cx, -cy, -cz);
    } else {
      console.warn('⚠️ NaN boundingBox for:', node.name, node.type, JSON.stringify(node.size));
    }
    const mat = (node.color)
      ? new THREE.MeshStandardMaterial({ color:node.color, roughness:0.65, metalness:0.15 })
      : getMaterial(node.materialId || 'default');
    if (node.flatShading) {
      mat.flatShading = true;
    }
    if (node.type === 'BentBox') mat.side = THREE.DoubleSide;
    const mesh = new THREE.Mesh(geo2, mat);
    mesh.name = node.name + '_mesh';

    const pos = adjustPos(node.position || [0,0,0], pivotComp);
    const group = new THREE.Group();
    group.name = node.name;
    group.position.set(...pos);
    if (node.scale) group.scale.set(...node.scale);
    group.visible = node.visible !== false;
    parentObj.add(group);

    let rotTarget = group;
    if (node.pivot) {
      const pivot = new THREE.Group();
      pivot.name = node.name + '_pivot';
      pivot.position.set(node.pivot[0], node.pivot[1], node.pivot[2]);
      group.add(pivot);
      mesh.position.set(-node.pivot[0], -node.pivot[1], -node.pivot[2]);
      pivot.add(mesh);
      rotTarget = pivot;
      group.userData.pivot = pivot;
    } else {
      group.add(mesh);
    }

    if (node.rotation) rotTarget.rotation.set(...node.rotation);

    // 存储映射
    nodeMap.set(node.name, { group, mesh, configNode:node, rotTarget });

    // BoxHelper
    if (showHelpers) {
      const h = new THREE.BoxHelper(mesh, helperColor(node.name));
      h.update();
      h.visible = node.visible !== false;
      h.userData._mesh = mesh;
      helpers.push(h);
    }

    const childComp = node.pivot
      ? [-node.pivot[0], -node.pivot[1], -node.pivot[2]]
      : [0,0,0];
    group.userData.appliedComp = pivotComp;
    group.userData.childComp = childComp;

    if (node.children) {
      for (const child of node.children) {
        buildNode(child, rotTarget, childComp);
      }
    }
  }

  buildNode(config, parent);
  for (const h of helpers) parent.add(h);
  parent.userData.helpers = helpers;
  return parent;
}

// ============================================================
// 5. 统计面数
// ============================================================
function countTriangles(obj) {
  let count = 0;
  obj.traverse(child => {
    if (child.isMesh && child.geometry) {
      const geo = child.geometry;
      count += (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
    }
  });
  return Math.round(count);
}

function refreshPartTree() {
  const container = document.getElementById('part-tree');
  if (!container) return;
  container.innerHTML = '';
  const cfg = MODEL_CONFIGS[currentModelType];
  if (!cfg) return;
  renderPartTree(cfg, container, 0);
}
function renderPartTree(cfg, parentEl, depth) {
  const row = document.createElement('div');
  row.className = 'pt-item';
  if (selectedParts.has(cfg.name)) row.classList.add('selected');
  const info = nodeMap.get(cfg.name);
  const isVisible = info ? info.group.visible !== false : (cfg.visible !== false);
  if (!isVisible) row.classList.add('hidden');
  const hasChildren = cfg.children && cfg.children.length > 0;
  const collapsed = ptCollapsed.has(cfg.name);
  // 折叠按钮
  const toggle = document.createElement('span');
  toggle.className = 'pt-toggle' + (hasChildren ? '' : ' leaf');
  toggle.textContent = hasChildren ? (collapsed ? '▶' : '▼') : '';
  toggle.onclick = e => {
    e.stopPropagation();
    if (collapsed) ptCollapsed.delete(cfg.name);
    else ptCollapsed.add(cfg.name);
    refreshPartTree();
  };
  // 图标
  const icon = document.createElement('span');
  icon.className = 'pt-icon';
  icon.textContent = hasChildren ? (cfg.type === 'Group' ? '⚙' : '📁') : '◼';
  // 名称
  const name = document.createElement('span');
  name.textContent = cfg.name;
  name.style.overflow = 'hidden';
  name.style.textOverflow = 'ellipsis';
  row.appendChild(toggle);
  row.appendChild(icon);
  row.appendChild(name);
  row.onclick = e => {
    e.stopPropagation();
    if (e.ctrlKey || e.metaKey) toggleSelect(cfg.name);
    else selectSingle(cfg.name);
  };
  parentEl.appendChild(row);
  // 子节点
  if (hasChildren && !collapsed) {
    const childWrap = document.createElement('div');
    childWrap.className = 'pt-children';
    for (const c of cfg.children) renderPartTree(c, childWrap, depth + 1);
    parentEl.appendChild(childWrap);
  }
}

let undoStack = [];
const MAX_UNDO = 50;
const SAVE_KEY = 'tank_model_factory_save';

// 将 nodeMap 中的 3D 实时状态同步回 config 树（position/rotation/visible）
function syncConfigFromScene(cfg) {
  const n = nodeMap.get(cfg.name);
  if (n) {
    if (cfg.type === 'Group') {
      // Group 也需要同步位置/旋转/可见性
      cfg.position = [n.group.position.x, n.group.position.y, n.group.position.z].map(v=>+v.toFixed(4));
      cfg.rotation = [n.group.rotation.x, n.group.rotation.y, n.group.rotation.z].map(v=>+v.toFixed(4));
      cfg.visible = n.group.visible;
    } else {
      const cc = n.group.userData.appliedComp || [0,0,0];
      cfg.position = [n.group.position.x-cc[0], n.group.position.y-cc[1], n.group.position.z-cc[2]].map(v=>+v.toFixed(4));
      cfg.rotation = [n.rotTarget.rotation.x, n.rotTarget.rotation.y, n.rotTarget.rotation.z].map(v=>+v.toFixed(4));
      cfg.visible = n.group.visible;
    }
  }
  if (cfg.children) for (const c of cfg.children) syncConfigFromScene(c);
}

// 快照：先同步 3D→config，再深拷贝 config。一次拖拽只产生一个快照
let _snapshotLock = false;

function saveUndo(label) {
  if (!autoSnapshot || !modelRoot) return;
  if (_snapshotLock) return;  // 拖拽中，快照已在 pointerdown 时拍过
  syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
  const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
  undoStack.push(clone);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  console.log('📸 快照 #'+undoStack.length+' ('+label+')');
}

// pointerdown：操作开始前拍照 + 锁定，拖拽中 onChange 不再重复拍
document.addEventListener('pointerdown', e => {
  if (!modelRoot || !autoSnapshot) return;
  if (e.target.closest('.lil-gui')) {
    syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
    const clone = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
    undoStack.push(clone);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    console.log('📸 快照 #'+undoStack.length+' (操作开始)');
    _snapshotLock = true;
  }
});
document.addEventListener('pointerup', () => { _snapshotLock = false; });

  Object.keys(target).forEach(k => delete target[k]);
  const deepCopy = JSON.parse(JSON.stringify(source));
  Object.assign(target, deepCopy);
}

      turretInfo.group.position.copy(turretLocal).sub(ringLocal);
      pivot.add(turretInfo.group);
      turretInfo.group.userData.animTurretPivot = pivot;
    }
    animRefs.turretPivot = pivot;
  }

  // --- 炮管Pivot：放在炮盾圆心 ---
  const barrelInfo = nodeMap.get('炮管总成');
  const mantletInfo = nodeMap.get('炮盾');
  if (barrelInfo && mantletInfo) {
    let pivot = barrelInfo.group.userData.animBarrelPivot;
    if (!pivot) {
      pivot = new THREE.Group();
      pivot.name = 'animBarrelPivot';
      const parent = barrelInfo.group.parent;
      const mantletWorld = new THREE.Vector3();
      mantletInfo.group.getWorldPosition(mantletWorld);
      const barrelWorld = new THREE.Vector3();
      barrelInfo.group.getWorldPosition(barrelWorld);
      const mantletLocal = parent.worldToLocal(mantletWorld.clone());
      const barrelLocal = parent.worldToLocal(barrelWorld.clone());
      parent.remove(barrelInfo.group);
      pivot.position.copy(mantletLocal);
      parent.add(pivot);
      barrelInfo.group.position.copy(barrelLocal).sub(mantletLocal);
      pivot.add(barrelInfo.group);
      barrelInfo.group.userData.animBarrelPivot = pivot;
    }
    animRefs.barrelPivot = pivot;
  }

  // --- 高射机枪Pivot：放在支柱顶面圆心，只包裹上部可动件 ---
  const mgInfo = nodeMap.get('高射机枪');
  if (mgInfo) {
    const pillarInfo = nodeMap.get('MG枪座支柱');
    if (pillarInfo) {
      const pillarH = ((pillarInfo.configNode.size || [0, 0.25])[1] || 0.25);
      const pivotY = pillarInfo.group.position.y + pillarH * 0.5;
      let pivot = mgInfo.group.userData.animMGPivot;
      if (!pivot) {
        pivot = new THREE.Group();
        pivot.name = 'animMGPivot';
        const mgGroup = mgInfo.group;
        pivot.position.set(0, pivotY, 0);
        mgGroup.add(pivot);
        const rotatingNames = ['MG枪身', 'MG枪管', 'MG枪口制退器', 'MG弹链箱', 'MG准星座'];
        for (const name of rotatingNames) {
          const info = nodeMap.get(name);
          if (info && info.group && info.group.parent === mgGroup) {
            mgGroup.remove(info.group);
            info.group.position.x -= pivot.position.x;
            info.group.position.y -= pivot.position.y;
            info.group.position.z -= pivot.position.z;
            pivot.add(info.group);
          }
        }
        mgGroup.userData.animMGPivot = pivot;
      }
      animRefs.mgPivot = pivot;
    }
  }

  // --- 轮子：直接用 mesh.rotateX（绕车轮自身高度轴旋转） ---
  animRefs.leftWheelPairs = [];
  animRefs.rightWheelPairs = [];
  for (let i = 1; i <= 5; i++) {
    const lw = nodeMap.get('左负重轮' + i);
    const rw = nodeMap.get('右负重轮' + i);
    if (lw) animRefs.leftWheelPairs.push(lw);
    if (rw) animRefs.rightWheelPairs.push(rw);
  }
  const lDrive = nodeMap.get('左主动轮');
  const rDrive = nodeMap.get('右主动轮');
  const lIdler = nodeMap.get('左诱导轮');
  const rIdler = nodeMap.get('右诱导轮');
  if (lDrive) animRefs.leftWheelPairs.push(lDrive);
  if (rDrive) animRefs.rightWheelPairs.push(rDrive);
  if (lIdler) animRefs.leftWheelPairs.push(lIdler);
  if (rIdler) animRefs.rightWheelPairs.push(rIdler);

  for (const w of animRefs.leftWheelPairs) {
    if (w._initRotX == null) w._initRotX = w.mesh.rotation.x;
    if (w._initRotY == null) w._initRotY = w.mesh.rotation.y;
    if (w._initRotZ == null) w._initRotZ = w.mesh.rotation.z;
  }
  for (const w of animRefs.rightWheelPairs) {
    if (w._initRotX == null) w._initRotX = w.mesh.rotation.x;
    if (w._initRotY == null) w._initRotY = w.mesh.rotation.y;
    if (w._initRotZ == null) w._initRotZ = w.mesh.rotation.z;
  }

  // --- 履带 ---
  const leftTrackInfo = nodeMap.get('左履带链');
  const rightTrackInfo = nodeMap.get('右履带链');
  if (leftTrackInfo && leftTrackInfo.configNode && leftTrackInfo.configNode.trackParams) {
    animRefs.leftTrackGroup = leftTrackInfo.group;
    animRefs.leftTrackParams = leftTrackInfo.configNode.trackParams;
    animRefs.leftTrackPlates = leftTrackInfo.group.children.filter(c => c.isMesh);
    const tp = animRefs.leftTrackParams;
    const spacing = computeTrackTotalLen(tp) / (tp.count - 1);
    animRefs.leftTrackSpacing = spacing;
    animRefs.leftTrackTotalLen = computeTrackTotalLen(tp);
  }
  if (rightTrackInfo && rightTrackInfo.configNode && rightTrackInfo.configNode.trackParams) {
    animRefs.rightTrackGroup = rightTrackInfo.group;
    animRefs.rightTrackParams = rightTrackInfo.configNode.trackParams;
    animRefs.rightTrackPlates = rightTrackInfo.group.children.filter(c => c.isMesh);
    const tp = animRefs.rightTrackParams;
    const spacing = computeTrackTotalLen(tp) / (tp.count - 1);
    animRefs.rightTrackSpacing = spacing;
    animRefs.rightTrackTotalLen = computeTrackTotalLen(tp);
  }
}

function computeTrackTotalLen(tp) {
  const cyF = tp.wheelCenterYFront, cyR = tp.wheelCenterYRear;
  const rF = tp.wheelRadiusFront, rR = tp.wheelRadiusRear;
  const zF = tp.wheelCenterZFront, zR = tp.wheelCenterZRear;
  const zR1 = 1.4, zR5 = -2.55, wheelR = 0.40;
  const pA = { z: zR - rR * Math.cos(Math.PI/2), y: cyR + rR * Math.sin(Math.PI/2) };
  const pB = { z: zF - rF * Math.cos(Math.PI/2), y: cyF + rF * Math.sin(Math.PI/2) };
  const angleC = -120 * Math.PI / 180;
  const pC = { z: zF - rF * Math.cos(angleC), y: cyF + rF * Math.sin(angleC) };
  const angleD = -105 * Math.PI / 180;
  const pD = { z: zR1 - wheelR * Math.cos(angleD), y: 0.40 + wheelR * Math.sin(angleD) };
  const angleE = -75 * Math.PI / 180;
  const pE = { z: zR5 - wheelR * Math.cos(angleE), y: 0.40 + wheelR * Math.sin(angleE) };
  const angleF = -75 * Math.PI / 180;
  const pF = { z: zR - rR * Math.cos(angleF), y: cyR + rR * Math.sin(angleF) };
  const lenAB = Math.sqrt((pB.z-pA.z)**2 + (pB.y-pA.y)**2);
  const lenBC = (angleC + 2*Math.PI - Math.PI/2) * rF;
  const lenCD = Math.sqrt((pD.z-pC.z)**2 + (pD.y-pC.y)**2);
  const lenDE = Math.abs(pE.z - pD.z);
  const lenEF = Math.sqrt((pF.z-pE.z)**2 + (pF.y-pE.y)**2);
  const lenFA = (Math.PI/2 - angleF) * rR;
  return lenAB + lenBC + lenCD + lenDE + lenEF + lenFA;
}

function updateAnimShowcase(dt) {
  if (!animShowcase || animPhase === 0) return;
  const elapsed = performance.now() - animStartTime;
  const duration = ANIM_DURATIONS[animPhase - 1];
  const t = Math.min(elapsed / duration, 1);

  switch (animPhase) {
    case 1: { // 炮塔旋转 360° — 绕座圈圆心
      if (animRefs.turretPivot) {
        animRefs.turretPivot.rotation.y = t * Math.PI * 2;
      }
      break;
    }
    case 2: { // 炮管俯仰 (+25°上仰 ~ -10°下垂) — 绕炮盾圆心, +X旋转=下垂
      if (animRefs.barrelPivot) {
        const maxUp = 25 * Math.PI / 180;
        const maxDown = -10 * Math.PI / 180;
        const pitch = maxDown + (maxUp - maxDown) * ((Math.sin(t * Math.PI * 2.5 - Math.PI/2) + 1) * 0.5);
        animRefs.barrelPivot.rotation.x = -pitch;
      }
      break;
    }
    case 3: { // 高射机枪旋转+俯仰 — 绕支柱顶面圆心
      if (animRefs.mgPivot) {
        animRefs.mgPivot.rotation.y = t * Math.PI * 3;
        animRefs.mgPivot.rotation.x = Math.sin(t * Math.PI * 3) * 0.35;
      }
      break;
    }
    case 4: { // 前进
      const wheelSpeed = dt * 8;
      for (const w of animRefs.leftWheelPairs || []) {
        if (w.mesh) w.mesh.rotateY(-wheelSpeed);
      }
      for (const w of animRefs.rightWheelPairs || []) {
        if (w.mesh) w.mesh.rotateY(-wheelSpeed);
      }
      trackOffsetL += dt * 2.0;
      trackOffsetR += dt * 2.0;
      updateTrackPlates(animRefs, trackOffsetL, trackOffsetR);
      break;
    }
    case 5: { // 后退
      const wheelSpeed = dt * 8;
      for (const w of animRefs.leftWheelPairs || []) {
        if (w.mesh) w.mesh.rotateY(wheelSpeed);
      }
      for (const w of animRefs.rightWheelPairs || []) {
        if (w.mesh) w.mesh.rotateY(wheelSpeed);
      }
      trackOffsetL -= dt * 2.0;
      trackOffsetR -= dt * 2.0;
      updateTrackPlates(animRefs, trackOffsetL, trackOffsetR);
      break;
    }
  }

  if (t >= 1) {
    animPhase++;
    if (animPhase > 5) animPhase = 1;
    animStartTime = performance.now();
    trackOffsetL = 0; trackOffsetR = 0;
    resetAnimState();
    if (animStatusEl) {
      animStatusEl.textContent = ANIM_NAMES[animPhase - 1];
    }
  }
}

function resetAnimState() {
  if (animRefs.turretPivot) animRefs.turretPivot.rotation.y = 0;
  if (animRefs.barrelPivot) animRefs.barrelPivot.rotation.x = 0;
  if (animRefs.mgPivot) { animRefs.mgPivot.rotation.y = 0; animRefs.mgPivot.rotation.x = 0; }
  for (const w of animRefs.leftWheelPairs || []) {
    if (w.mesh) w.mesh.rotation.set(w._initRotX || 0, w._initRotY || 0, w._initRotZ || 0);
  }
  for (const w of animRefs.rightWheelPairs || []) {
    if (w.mesh) w.mesh.rotation.set(w._initRotX || 0, w._initRotY || 0, w._initRotZ || 0);
  }
}

function updateTrackPlates(refs, offsetL, offsetR) {
  if (refs.leftTrackPlates && refs.leftTrackParams) {
    const tp = refs.leftTrackParams;
    const spacing = refs.leftTrackSpacing;
    const totalLen = refs.leftTrackTotalLen;
    for (let i = 0; i < refs.leftTrackPlates.length; i++) {
      const dist = ((i * spacing + offsetL) % totalLen + totalLen) % totalLen;
      const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
      refs.leftTrackPlates[i].position.set(pp.x, pp.y, pp.z);
      refs.leftTrackPlates[i].rotation.set(rot.x, rot.y, rot.z);
    }
  }
  if (refs.rightTrackPlates && refs.rightTrackParams) {
    const tp = refs.rightTrackParams;
    const spacing = refs.rightTrackSpacing;
    const totalLen = refs.rightTrackTotalLen;
    for (let i = 0; i < refs.rightTrackPlates.length; i++) {
      const dist = ((i * spacing + offsetR) % totalLen + totalLen) % totalLen;
      const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
      refs.rightTrackPlates[i].position.set(pp.x, pp.y, pp.z);
      refs.rightTrackPlates[i].rotation.set(rot.x, rot.y, rot.z);
    }
  }
}

function toggleAnimShowcase() {
  animShowcase = !animShowcase;
  const btn = document.getElementById('toggle-anim');
  const statusEl = document.getElementById('anim-status');
  animStatusEl = statusEl;

  if (animShowcase) {
    btn.classList.add('active');
    btn.textContent = '⏹ 停止展台';
    collectAnimRefs();
    animPhase = 1;
    animStartTime = performance.now();
    trackOffsetL = 0; trackOffsetR = 0;
    resetAnimState();
    statusEl.style.display = 'block';
    statusEl.textContent = ANIM_NAMES[0];
  } else {
    btn.classList.remove('active');
    btn.textContent = '🎬 动画展台';
    animPhase = 0;
    resetAnimState();
    trackOffsetL = 0; trackOffsetR = 0;
    destroyAnimPivots();
    if (animRefs.leftTrackPlates && animRefs.leftTrackParams) {
      const tp = animRefs.leftTrackParams;
      const spacing = animRefs.leftTrackSpacing;
      for (let i = 0; i < animRefs.leftTrackPlates.length; i++) {
        const dist = i * spacing;
        const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
        animRefs.leftTrackPlates[i].position.set(pp.x, pp.y, pp.z);
        animRefs.leftTrackPlates[i].rotation.set(rot.x, rot.y, rot.z);
      }
    }
    if (animRefs.rightTrackPlates && animRefs.rightTrackParams) {
      const tp = animRefs.rightTrackParams;
      const spacing = animRefs.rightTrackSpacing;
      for (let i = 0; i < animRefs.rightTrackPlates.length; i++) {
        const dist = i * spacing;
        const { pos: pp, rot } = getTrackPlateTransform(dist, tp);
        animRefs.rightTrackPlates[i].position.set(pp.x, pp.y, pp.z);
        animRefs.rightTrackPlates[i].rotation.set(rot.x, rot.y, rot.z);
      }
    }
    statusEl.style.display = 'none';
  }
}

function destroyAnimPivots() {
  function restoreChildren(pivot, parent) {
    if (!pivot || !pivot.parent) return;
    while (pivot.children.length > 0) {
      const child = pivot.children[0];
      const worldPos = new THREE.Vector3();
      child.getWorldPosition(worldPos);
      pivot.remove(child);
      const localPos = parent.worldToLocal(worldPos);
      child.position.copy(localPos);
      parent.add(child);
    }
    pivot.parent.remove(pivot);
  }

  const turretInfo = nodeMap.get('炮塔总成');
  if (turretInfo && turretInfo.group.userData.animTurretPivot) {
    const pivot = turretInfo.group.userData.animTurretPivot;
    restoreChildren(pivot, pivot.parent);
    turretInfo.group.userData.animTurretPivot = null;
  }

  const barrelInfo = nodeMap.get('炮管总成');
  if (barrelInfo && barrelInfo.group.userData.animBarrelPivot) {
    const pivot = barrelInfo.group.userData.animBarrelPivot;
    restoreChildren(pivot, pivot.parent);
    barrelInfo.group.userData.animBarrelPivot = null;
  }

  const mgInfo = nodeMap.get('高射机枪');
  if (mgInfo && mgInfo.group.userData.animMGPivot) {
    const pivot = mgInfo.group.userData.animMGPivot;
    restoreChildren(pivot, mgInfo.group);
    mgInfo.group.userData.animMGPivot = null;
  }

  animRefs = {};
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('toggle-anim');
  if (btn) btn.addEventListener('click', toggleAnimShowcase);
});

// 确保按钮事件在 DOM 就绪后绑定（脚本在 body 底部，DOM 已解析）
setTimeout(() => {
  const btn = document.getElementById('toggle-anim');
  if (btn) btn.addEventListener('click', toggleAnimShowcase);
}, 0);

function addWheelBolts() {
  const boltMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.35, metalness: 0.8 });

  function addBolts(wheelInfo, count) {
    if (!wheelInfo) return;
    const mesh = wheelInfo.mesh;
    if (!mesh) return;

    const toRemove = [];
    mesh.traverse(c => { if (c.userData && c.userData.isBolt) toRemove.push(c); });
    for (const b of toRemove) {
      b.parent.remove(b);
      if (b.geometry) b.geometry.dispose();
    }

    const size = wheelInfo.configNode.size;
    const radius = size[0] || 0.4;
    const thickness = size[1] || 0.12;
    const isLeft = wheelInfo.group.position.x < 0;
    const boltR = radius * 0.55;
    const boltY = isLeft ? (thickness / 2 + 0.015) : -(thickness / 2 + 0.015);

    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const boltGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.035, 6);
      const bolt = new THREE.Mesh(boltGeo, boltMat);
      bolt.userData = { isBolt: true };
      bolt.position.set(
        Math.cos(angle) * boltR,
        boltY,
        Math.sin(angle) * boltR
      );
      mesh.add(bolt);
    }
  }

  addBolts(nodeMap.get('左诱导轮'), 5);
  addBolts(nodeMap.get('右诱导轮'), 5);
  for (let i = 1; i <= 5; i++) {
    addBolts(nodeMap.get('左负重轮' + i), 7);
    addBolts(nodeMap.get('右负重轮' + i), 7);
  }
  addBolts(nodeMap.get('左主动轮'), 7);
  addBolts(nodeMap.get('右主动轮'), 7);
}

function rebuildModel() {
  // 关闭动画展台
  if (animShowcase) toggleAnimShowcase();

  // 清理旧模型
  if (modelRoot) {
    modelRoot.traverse(c => { if (c.geometry && c !== modelRoot) c.geometry.dispose(); });
    scene.remove(modelRoot);
  }
  // 清理选择
  deselectAll();
  nodeMap.clear();
  guiFolderMap.clear();
  modelRoot = new THREE.Group();

  const cfg = MODEL_CONFIGS[currentModelType];
  if (cfg) {
    buildFromConfig(cfg, modelRoot, showHelpersGlobal, nodeMap);
  }

  scene.add(modelRoot);
  modelRoot.updateMatrixWorld();
  addWheelBolts();
  updateTriCount();
  if (gui) { gui.destroy(); gui = null; }
  buildGUI();
  refreshPartTree();
}

// ============================================================
// 选择系统 v2：单选/多选(Ctrl)/框选 + 批量编辑
// ============================================================
function createHighlight(_name) {
  // 先清除全部旧高亮
  for (const [n, hl] of highlightLines) {
    if (hl) { hl.parent?.remove(hl); }
  }
  highlightLines.clear();
  // 遍历 selectedParts 为每个选中部件创建高亮
  const color = selectedParts.size > 1 ? 0x4ecdc4 : 0xffd700; // 多选青色，单选金色
  for (const n of selectedParts) {
    const inf = nodeMap.get(n);
    if (inf && inf.mesh && inf.mesh.geometry) {
      const geo = inf.mesh.geometry;
      // 检查几何体是否有效（避免 NaN 几何体导致 EdgesGeometry 崩溃）
      if (!geo.attributes.position || geo.attributes.position.count === 0) continue;
      const e = new THREE.EdgesGeometry(geo);
      const h = new THREE.LineSegments(e, new THREE.LineBasicMaterial({ color, linewidth:1, depthTest:false }));
      inf.rotTarget.add(h);
      highlightLines.set(n, h);
    }
  }
}

function removeHighlight(name) {
  const hl = highlightLines.get(name);
  if (hl) { hl.parent?.remove(hl); highlightLines.delete(name); }
}

function expandPath(cfg, targetName, ancestors) {
  if (cfg.name === targetName) { ancestors.push(cfg.name); return true; }
  if (cfg.children) {
    for (const c of cfg.children) {
      if (expandPath(c, targetName, ancestors)) { ancestors.push(cfg.name); return true; }
    }
  }
  return false;
}

function buildPath(cfg, targetName, parts) {
  if (cfg.name === targetName) { parts.push(cfg.name); return true; }
  if (cfg.children) {
    for (const c of cfg.children) {
      if (buildPath(c, targetName, parts)) { parts.push(cfg.name); return true; }
    }
  }
  return false;
}

function updateBreadcrumb() {
  const el = document.getElementById('path-breadcrumb');
  if (selectedParts.size === 0) {
    el.innerHTML = '📍 未选中';
    return;
  }
  if (selectedParts.size === 1) {
    const paths = [];
    buildPath(MODEL_CONFIGS[currentModelType], [...selectedParts][0], paths);
    paths.reverse();
    el.innerHTML = '📍 ' + paths.map((p,i) => `<span>${p}</span>`).join('<span class="sep-arrow">→</span>');
  } else {
    el.innerHTML = `📍 已选 <span>${selectedParts.size}</span> 个部件`;
  }
}

function updateBatchPanel() {
  if (!batchGuiFolder) return;
  const count = selectedParts.size;
  // 更新计数显示
  if (batchInfoObj) batchInfoObj.count = count;
  if (count >= 2) {
    batchGuiFolder.open();
  } else {
    batchGuiFolder.close();
  }
}

// 单选模式
function selectSingle(name) {
  removeAllHighlights();
  selectedParts.clear();
  selectedParts.add(name);
  createHighlight(name);
  focusPanel(name);
  updateBatchPanel();
  updateBreadcrumb();
  refreshPartTree();
}

// 多选模式（切换）
function toggleSelect(name) {
  if (selectedParts.has(name)) {
    removeHighlight(name);
    selectedParts.delete(name);
  } else {
    selectedParts.add(name);
  }
  createHighlight(name);
  if (selectedParts.size === 1) {
    focusPanel([...selectedParts][0]);
  }
  updateBatchPanel();
  updateBreadcrumb();
  refreshPartTree();
}

function removeAllHighlights() {
  for (const [n, hl] of highlightLines) {
    if (hl) hl.parent?.remove(hl);
  }
  highlightLines.clear();
}

function deselectAll() {
  removeAllHighlights();
  selectedParts.clear();
  updateBatchPanel();
  updateBreadcrumb();
  refreshPartTree();
}

function focusPanel(name) {
  // 1. 先关闭所有文件夹
  guiFolderMap.forEach(f => f.close());
  // 2. 展开祖先路径
  const ancestors = [];
  expandPath(MODEL_CONFIGS[currentModelType], name, ancestors);
  for (const a of ancestors) { const f = guiFolderMap.get(a); if (f) f.open(); }
  // 3. 只展开选中节点本身（不展开子孙）
  const targetFolder = guiFolderMap.get(name);
  if (targetFolder) targetFolder.open();
  // 4. 滚动到选中位置
  if (targetFolder) {
    try {
      const el = targetFolder.domElement || targetFolder._title;
      if (el && el.scrollIntoView) {
        setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
      }
    } catch(e) {}
  }
}

// 获取mesh的屏幕空间包围盒
function getScreenBBox(mesh) {
  if (!mesh.geometry) return null;
  mesh.geometry.computeBoundingBox();
  const box = mesh.geometry.boundingBox.clone();
  const mat = mesh.matrixWorld.clone();
  const corners = [
    new THREE.Vector3(box.min.x, box.min.y, box.min.z),
    new THREE.Vector3(box.min.x, box.min.y, box.max.z),
    new THREE.Vector3(box.min.x, box.max.y, box.min.z),
    new THREE.Vector3(box.min.x, box.max.y, box.max.z),
    new THREE.Vector3(box.max.x, box.min.y, box.min.z),
    new THREE.Vector3(box.max.x, box.min.y, box.max.z),
    new THREE.Vector3(box.max.x, box.max.y, box.min.z),
    new THREE.Vector3(box.max.x, box.max.y, box.max.z),
  ];
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const c of corners) {
    const w = c.applyMatrix4(mat).project(activeCamera());
    const sx = (w.x*0.5+0.5)*viewWidth();
    const sy = (-w.y*0.5+0.5)*window.innerHeight;
    if (sx<minX) minX=sx; if (sy<minY) minY=sy;
    if (sx>maxX) maxX=sx; if (sy>maxY) maxY=sy;
  }
  if (!isFinite(minX)) return null;
  return { minX, minY, maxX, maxY };
}

// 框选检测：屏幕矩形与部件屏幕包围盒是否重叠
function rectsOverlap(a, b) {
  return !(a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY);
}

function boxSelect(sx, sy, ex, ey) {
  const selRect = {
    minX: Math.min(sx, ex), minY: Math.min(sy, ey),
    maxX: Math.max(sx, ex), maxY: Math.max(sy, ey),
  };
  const names = [];
  nodeMap.forEach((info, name) => {
    if (!info.mesh || !info.group.visible) return;
    const bbox = getScreenBBox(info.mesh);
    if (bbox && rectsOverlap(selRect, bbox)) names.push(name);
  });
  // 清空旧选择，添加新选择
  removeAllHighlights();
  selectedParts.clear();
  for (const n of names) {
    selectedParts.add(n);
  }
  createHighlight('');
  updateBatchPanel();
  console.log('📦 框选了 ' + selectedParts.size + ' 个部件');
}

// 点击选择
function onClickSelect(e) {
  if (!modelRoot) return;
  const mouse = new THREE.Vector2();
  mouse.x = (e.clientX / viewWidth()) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, activeCamera());
  const targets = [];
  nodeMap.forEach((info, name) => {
    if (info.mesh && info.group.visible) targets.push(info.mesh);
  });
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) {
    const name = hits[0].object.name.replace('_mesh', '');
    if (e.ctrlKey || e.metaKey) {
      // Ctrl+点击：切换多选
      toggleSelect(name);
    } else {
      // 普通点击：单选
      selectSingle(name);
    }
  } else {
    // 点击空白取消全部
    deselectAll();
  }
}

// 点击选择（不拦截拖拽，OrbitControls 正常旋转场景）
function setupRaycaster() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    clickStart = { x:e.clientX, y:e.clientY };
  });
  canvas.addEventListener('pointerup', e => {
    const dx = e.clientX - clickStart.x;
    const dy = e.clientY - clickStart.y;
    if (Math.sqrt(dx*dx+dy*dy) < 4) {
      // 这是点击而非拖拽
      onClickSelect(e);
    }
  });
}

let showHelpersGlobal = true;

function updateTriCount() {
  document.getElementById('triCount').textContent = countTriangles(modelRoot);
}

function updateAllHelpers() {
  const helpers = modelRoot.userData.helpers || [];
  for (const h of helpers) {
    const m = h.userData._mesh;
    if (m && m.geometry && m.geometry.attributes.position) {
      const pos = m.geometry.attributes.position;
      // 跳过NaN几何体，避免BoxHelper.update崩溃
      let hasNaN = false;
      for (let i = 0; i < Math.min(pos.count, 3); i++) {
        if (!isFinite(pos.getX(i))) { hasNaN = true; break; }
      }
      if (!hasNaN) {
        try { h.update(); } catch(e) {}
      }
    }
    h.visible = showHelpersGlobal;
  }
}

// ============================================================
// 9. 重建单个 mesh（几何参数变化时）
// ============================================================
function rebuildMesh(nodeName) {
  const info = nodeMap.get(nodeName);
  if (!info || !info.configNode) return;
  const { mesh, configNode } = info;
  if (!mesh || mesh.type === 'Group') return;

  // 重建几何体
  mesh.geometry.dispose();
  const geo = createGeometry(configNode);
  geo.computeBoundingBox();
  const bbox = geo.boundingBox;
  if (bbox && isFinite(bbox.min.x) && isFinite(bbox.max.x)) {
    const cx = (bbox.min.x + bbox.max.x) / 2;
    const cy = (bbox.min.y + bbox.max.y) / 2;
    const cz = (bbox.min.z + bbox.max.z) / 2;
    geo.translate(-cx, -cy, -cz);
  }
  mesh.geometry = geo;

  // 重建材质（如果颜色参数在 configNode.color 中）
  if (!mesh.material._factoryColor) {
    // 保持原有材质引用，仅更新 color
    if (configNode.color) {
      mesh.material.color.set(configNode.color);
    }
  }

  // 更新 BoxHelper（如果有引用该 mesh 的 helper）
  const helpers = modelRoot.userData.helpers || [];
  for (const h of helpers) {
    if (h.userData._mesh === mesh) h.update();
  }
  updateTriCount();
  // 如果选中的部件几何变化，刷新高亮
  if (selectedParts.has(nodeName)) {
    removeHighlight(nodeName);
    createHighlight(nodeName);
  }
}

// ============================================================
// 9.5 树编辑工具：查找父节点 / 添加子节点 / 删除节点
// ============================================================
function findParentNode(cfg, targetName) {
  if (!cfg.children) return null;
  for (const c of cfg.children) {
    if (c.name === targetName) return cfg;
    const found = findParentNode(c, targetName);
    if (found) return found;
  }
  return null;
}

function generateName(cfg, prefix) {
  let maxN = 0;
  function scan(node) {
    if (node.name && node.name.startsWith(prefix + '_')) {
      const n = parseInt(node.name.split('_').pop());
      if (!isNaN(n) && n > maxN) maxN = n;
    }
    if (node.children) for (const c of node.children) scan(c);
  }
  scan(cfg);
  return prefix + '_' + String(maxN + 1).padStart(2, '0');
}

function addChildNode(parentName) {
  flushUndo(); saveUndo('addChild'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  function findNode(n, target) {
    if (n.name === target) return n;
    if (n.children) for (const c of n.children) { const f = findNode(c, target); if (f) return f; }
    return null;
  }
  const parent = findNode(cfg, parentName);
  if (!parent) return;
  if (!parent.children) parent.children = [];
  const newNode = {
    name: generateName(cfg, 'part'),
    type: 'Box',
    size: [0.3, 0.3, 0.3],
    position: [0, 0.15, 0],
    materialId: 'default',
  };
  parent.children.push(newNode);
  rebuildModel();
  console.log('➕ 已添加子部件: ' + newNode.name + ' → ' + parentName);
}

function deleteNode(targetName) {
  flushUndo(); saveUndo('deleteNode'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  const parent = findParentNode(cfg, targetName);
  if (!parent || !parent.children) { console.log('⚠️ 无法删除根节点'); return; }
  const idx = parent.children.findIndex(c => c.name === targetName);
  if (idx === -1) return;
  parent.children.splice(idx, 1);
  rebuildModel();
  console.log('🗑 已删除部件: ' + targetName);
}

function renameNode(oldName, newName) {
  if (!newName || newName === oldName) return;
  flushUndo(); saveUndo('renameNode'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  function findNode(n, target) {
    if (n.name === target) return n;
    if (n.children) for (const c of n.children) { const f = findNode(c, target); if (f) return f; }
    return null;
  }
  const node = findNode(cfg, oldName);
  if (!node) return;
  node.name = newName;
  deselectAll();
  rebuildModel();
  console.log('✏️ 已重命名: ' + oldName + ' → ' + newName);
}

const TYPE_DEFAULTS = {
  Box: { size:[0.3,0.3,0.3] },
  BentBox: { size:[0.3,0.08,1.2,0.4], segments:[16] },
  TaperedBox: { size:[0.5,0.3,0.5,0.35,0.35] },
  TaperedHex: { size:[0.5,0.3,0.5,0.35,0.35] },
  RoundedBox: { size:[0.3,0.3,0.3,0.06], segments:[3] },
  Cylinder: { size:[0.15,0.3,0.15], segments:[6] },
  Sphere: { size:[0.2], segments:[8,6] },
  Torus: { size:[0.3,0.05], segments:[8,12] },
  Lathe: { size:[1], segments:[24], profile:[[0.2,0],[0.3,0.2],[0.3,0.3],[0.15,0.35],[0.05,0.3]] },
  Extrude: { size:[1], shape:[[-0.15,-0.1],[0.15,-0.1],[0.15,0.1],[-0.15,0.1]], extrudeDepth:0.3, bevelThickness:0.02 },
  Group: {},
};

function switchType(nodeName, newType) {
  flushUndo(); saveUndo('switchType'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  function findNode(n, target) {
    if (n.name === target) return n;
    if (n.children) for (const c of n.children) { const f = findNode(c, target); if (f) return f; }
    return null;
  }
  const node = findNode(cfg, nodeName);
  if (!node || node.type === newType) return;
  node.type = newType;
  const d = TYPE_DEFAULTS[newType] || {};
  if (d.size) node.size = [...d.size];
  if (d.segments) node.segments = [...d.segments];
  if (d.profile !== undefined) node.profile = [...(d.profile || [[0.3,0],[0.3,0.3],[0.1,0.3]])];
  if (d.shape !== undefined) node.shape = [...(d.shape || [[-0.15,-0.1],[0.15,-0.1],[0.15,0.1],[-0.15,0.1]])];
  if (d.extrudeDepth !== undefined) node.extrudeDepth = d.extrudeDepth;
  if (d.bevelThickness !== undefined) node.bevelThickness = d.bevelThickness;
  // 清理旧类型的专属字段
  if (newType !== 'Lathe') delete node.profile;
  if (newType !== 'Extrude') { delete node.shape; delete node.extrudeDepth; delete node.bevelThickness; }
  deselectAll();
  rebuildModel();
  console.log('🔄 已切换: ' + nodeName + ' → ' + newType);
}

// 10. GUI 构建

function buildGUI() {

    });

  // --- 全选（独立按钮）---
  const selectAllFolder = gui.addFolder('✅ 全选部件');

  }}, 'selectAll').name('✅ 全选可见部件');
  selectAllFolder.open();

  // --- 批量编辑（多选 ≥2 时自动展开）---
  batchGuiFolder = gui.addFolder('📦 批量编辑 (选中≥2时展开)');
  batchInfoObj = { count:selectedParts.size };
  batchGuiFolder.add(batchInfoObj, 'count').name('已选部件数').disable();
  // 位置偏移（累积式：滑块不归零，数值显示累计偏移）
  const batchPos = { dx:0, dy:0, dz:0 };
  const _prevBatch = { dx:0, dy:0, dz:0 };
  function applyDelta(axis, batchKey, newValue) {
    if (!isFinite(newValue)) return;
    const delta = newValue - _prevBatch[batchKey];
    if (!isFinite(delta) || Math.abs(delta) < 1e-6) return;
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      const pos = info?.group?.position;
      if (pos && isFinite(pos[axis])) pos[axis] += delta;
    }
    _prevBatch[batchKey] = newValue;
    updateAllHelpers();
  }
  batchGuiFolder.add(batchPos, 'dx', -2, 2, 0.001).name('ΔX').onChange(v => { saveUndo('batchDX'); applyDelta('x', 'dx', v); });
  batchGuiFolder.add(batchPos, 'dy', -2, 2, 0.001).name('ΔY').onChange(v => { saveUndo('batchDY'); applyDelta('y', 'dy', v); });
  batchGuiFolder.add(batchPos, 'dz', -2, 2, 0.001).name('ΔZ').onChange(v => { saveUndo('batchDZ'); applyDelta('z', 'dz', v); });
  // 重置偏移
  batchGuiFolder.add({ resetOffset:()=>{
    batchPos.dx=0; batchPos.dy=0; batchPos.dz=0;
    _prevBatch.dx=0; _prevBatch.dy=0; _prevBatch.dz=0;
  }}, 'resetOffset').name('🔄 重置偏移零点');
  // 颜色批量
  const batchColor = { color:'#4a5c2e' };
  batchGuiFolder.addColor(batchColor, 'color').name('颜色').onChange(v => {
    saveUndo('batchColor');
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.mesh && info.mesh.material) {
        info.mesh.material.color.set(v);
        const cfg = info.configNode;
        if (cfg) cfg.color = v;
      }
    }
  });
  // 材质预设批量
  batchGuiFolder.add({ mat:'default' }, 'mat', Object.keys(MATERIAL_DEFS)).name('材质').onChange(v => {
    saveUndo('batchMat');
    const def = MATERIAL_DEFS[v];
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.mesh && info.mesh.material) {
        info.mesh.material.color.set(def.color);
        info.mesh.material.roughness = def.roughness;
        info.mesh.material.metalness = def.metalness;
        const cfg = info.configNode;
        if (cfg) { cfg.materialId = v; cfg.color = undefined; }
      }
    }
  });
  // 隐藏选中
  batchGuiFolder.add({ del:()=>{
    flushUndo(); saveUndo('batchHide'); // 操作前保存快照
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.group) {
        info.group.visible = false;
        const cfg = info.configNode;
        if (cfg) cfg.visible = false;
      }
    }
    deselectAll();
    updateAllHelpers();
    updateTriCount();
    console.log('🗑 已隐藏 ' + selectedParts.size + ' 个部件（可重新打开可见性恢复）');
  }}, 'del').name('🗑 隐藏选中');
  batchGuiFolder.close();

  // --- 全局操作 ---
  const globalF = gui.addFolder('🛠 全局操作');
  // 撤销
  globalF.add({ undo:()=>{
    flushUndo(); // 强制入栈当前待定快照
    if (undoStack.length === 0) { console.log('⚠️ 没有可撤销的操作'); return; }
    autoSnapshot = false;
    const prev = undoStack.pop();
    const cfg = MODEL_CONFIGS[currentModelType];
    const fmCur2 = cfg.children?.[0]?.children?.[0];
    const fmPrev2 = prev.children?.[0]?.children?.[0];
    console.log('🔙 撤销: 当前 size=' + JSON.stringify(fmCur2?.size) + ' → 快照 size=' + JSON.stringify(fmPrev2?.size));
    deepRestore(cfg, prev);
    console.log('🔙 恢复后 size=' + JSON.stringify(cfg.children?.[0]?.children?.[0]?.size));
    rebuildModel();
    autoSnapshot = true;
    console.log('↩ 撤销成功 (剩余 ' + undoStack.length + ' 步可撤销)');
  }}, 'undo').name('↩ 撤销 (Ctrl+Z)');
  // 保存
  globalF.add({ save:()=>{
    const cfg = MODEL_CONFIGS[currentModelType];
    const saveData = { modelType:currentModelType, config:JSON.parse(JSON.stringify(cfg)), timestamp:Date.now() };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    console.log('💾 已保存到本地存储 (' + new Date(saveData.timestamp).toLocaleString() + ')');
  }}, 'save').name('💾 保存 (Ctrl+S)');
  // 加载
  globalF.add({ load:()=>{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { console.log('⚠️ 没有找到已保存的数据'); return; }
    try {
      const data = JSON.parse(raw);
      currentModelType = data.modelType || 'tank_v16';
      if (!MODEL_CONFIGS[currentModelType]) { console.warn('⚠️ 不支持的模型类型:' + data.modelType + '，已删除旧数据'); currentModelType = 'tank_v16'; localStorage.removeItem(SAVE_KEY); rebuildModel(); return; }
      const cfg = MODEL_CONFIGS[currentModelType];
      deepRestore(cfg, data.config);
      rebuildModel();
      console.log('📂 已从本地存储加载 (' + new Date(data.timestamp).toLocaleString() + ')');
    } catch(e) { console.error('加载失败:', e); }
  }}, 'load').name('📂 加载');
  // 重置
  globalF.add({ reset:()=>{ location.reload(); } }, 'reset').name('🔄 重置');
  // 输出
  globalF.add({ log:()=>{

          name:cfg.name, type:cfg.type,
          position:[n.group.position.x-cc[0],n.group.position.y-cc[1],n.group.position.z-cc[2]].map(v=>+v.toFixed(4)),
          rotation:[n.rotTarget.rotation.x,n.rotTarget.rotation.y,n.rotTarget.rotation.z].map(v=>+v.toFixed(4)),
          size:cfg.size?.map(v=>+v.toFixed(4)),
          segments:cfg.segments, materialId:cfg.materialId, color:cfg.color
        });
      }
      if (cfg.children) for (const c of cfg.children) r.push(...collect(c));
      return r;
    }
    const parts = collect(MODEL_CONFIGS[currentModelType]);
    console.log('📋 === 当前模型姿态 ===');
    console.log(JSON.stringify(parts, null, 2));
    console.log('%c💡 推荐: 点"📥 导出JSON固化"下载文件，然后把文件路径告诉Trae固化','background:#333;color:#ffd;padding:2px 8px;border-radius:3px');
  }}, 'log').name('📋 输出姿态');
  // 应用到Config
  globalF.add({ apply:()=>{
    function applyState(cfg) {

      if (n && cfg.type!=='Group') {
        const cc = n.group.userData.appliedComp || [0,0,0];
        cfg.position = [n.group.position.x-cc[0],n.group.position.y-cc[1],n.group.position.z-cc[2]].map(v=>+v.toFixed(4));

      }

    applyState(MODEL_CONFIGS[currentModelType]);
    const json = JSON.stringify(MODEL_CONFIGS[currentModelType], null, 2);

    const url = URL.createObjectURL(blob);

    console.log('📥 配置JSON已下载: ' + a.download);
  }}, 'export').name('📥 导出JSON固化');
  globalF.open();

  // --- 递归添加部件 UI ---
  function addPartUI(parentGui, configNode) {
    if (!configNode || !configNode.name) return;
    const info = nodeMap.get(configNode.name);
    if (!info) return;
    const { group, mesh, rotTarget } = info;

    const folder = parentGui.addFolder(`🔧 ${configNode.name}`);
    guiFolderMap.set(configNode.name, folder);
    // 全部默认展开，方便编辑

    // --- 可见性 ---
    const vis = { v:group.visible };
    folder.add(vis, 'v').name('👁 可见').onChange(v => {
      saveUndo('vis');
      group.visible = v;
      configNode.visible = v;
      // 更新 BoxHelper
      const helpers = modelRoot.userData.helpers || [];
      for (const h of helpers) {
        if (h.userData._mesh === mesh) h.visible = v && showHelpersGlobal;
      }
      refreshPartTree();
    });

    // --- 位置 (x,y,z) ---
    const p = { x:group.position.x, y:group.position.y, z:group.position.z };
    const posF = folder.addFolder('📍 位置');

    posF.add(p, 'y', -10, 10, 0.005).name('Y').onChange(v => { saveUndo('posY'); group.position.y=v; updateAllHelpers(); });
    posF.add(p, 'z', -10, 10, 0.005).name('Z').onChange(v => { saveUndo('posZ'); group.position.z=v; updateAllHelpers(); });

    // --- 旋转 (x,y,z) — 度数显示 ---
    if (configNode.type !== 'Group') {
      const DEG = 180 / Math.PI;
      const r = { x: rotTarget.rotation.x * DEG, y: rotTarget.rotation.y * DEG, z: rotTarget.rotation.z * DEG };
      const rotF = folder.addFolder('🔄 旋转');
      rotF.add(r, 'x', -180, 180, 1).name('X (°)').onChange(v => { saveUndo('rotX'); rotTarget.rotation.x = v / DEG; updateAllHelpers(); });
      rotF.add(r, 'y', -180, 180, 1).name('Y (°)').onChange(v => { saveUndo('rotY'); rotTarget.rotation.y = v / DEG; updateAllHelpers(); });
      rotF.add(r, 'z', -180, 180, 1).name('Z (°)').onChange(v => { saveUndo('rotZ'); rotTarget.rotation.z = v / DEG; updateAllHelpers(); });
    }

    // --- 几何参数编辑（按类型区分）---
    if (configNode.type !== 'Group' && mesh) {
      const geoF = folder.addFolder('📐 几何体 ' + configNode.type);
      const rebuild = () => rebuildMesh(configNode.name);

      if (configNode.type === 'Box') {
        const sz = configNode.size || [1,1,1];
        const b = { w:sz[0], h:sz[1], d:sz[2] };
        geoF.add(b, 'w', 0.01, 10.0, 0.005).name('宽 (W)').onChange(v=>{saveUndo('BoxW');configNode.size[0]=v;rebuild();});
        geoF.add(b, 'h', 0.01, 10.0, 0.005).name('高 (H)').onChange(v=>{saveUndo('BoxH');configNode.size[1]=v;rebuild();});
        geoF.add(b, 'd', 0.01, 10.0, 0.005).name('深 (D)').onChange(v=>{saveUndo('BoxD');configNode.size[2]=v;rebuild();});
      }
      else if (configNode.type === 'BentBox') {
        const sz = configNode.size || [0.3,0.08,1.2,0.4];
        const b = { w:sz[0], h:sz[1], d:sz[2], a:sz[3]!=null?sz[3]:0.4 };
        geoF.add(b, 'w', 0.01, 10.0, 0.005).name('宽 (W)').onChange(v=>{saveUndo('BBw');configNode.size[0]=v;rebuild();});
        geoF.add(b, 'h', 0.005, 5.0, 0.002).name('厚 (H)').onChange(v=>{saveUndo('BBh');configNode.size[1]=v;rebuild();});
        geoF.add(b, 'd', 0.01, 10.0, 0.005).name('弧长 (D)').onChange(v=>{saveUndo('BBd');configNode.size[2]=v;rebuild();});
        geoF.add(b, 'a', 0.05, Math.PI, 0.01).name('弯曲角 (rad)').onChange(v=>{saveUndo('BBa');configNode.size[3]=v;rebuild();});
        const sg = configNode.segments || [16];
        geoF.add({ s:sg[0] }, 's', 4, 64, 1).name('弯曲分段').onChange(v=>{saveUndo('BBseg');configNode.segments[0]=v;rebuild();});
      }
      else if (configNode.type === 'RoundedBox') {
        const sz = configNode.size || [1,1,1,0.08];
        const b = { w:sz[0], h:sz[1], d:sz[2], r:sz[3]||0.08 };
        geoF.add(b, 'w', 0.01, 10.0, 0.005).name('宽 (W)').onChange(v=>{saveUndo('RBoxW');configNode.size[0]=v;rebuild();});
        geoF.add(b, 'h', 0.01, 10.0, 0.005).name('高 (H)').onChange(v=>{saveUndo('RBoxH');configNode.size[1]=v;rebuild();});
        geoF.add(b, 'd', 0.01, 10.0, 0.005).name('深 (D)').onChange(v=>{saveUndo('RBoxD');configNode.size[2]=v;rebuild();});
        geoF.add(b, 'r', 0.01, 0.5, 0.005).name('圆角').onChange(v=>{saveUndo('RBoxR');configNode.size[3]=v;rebuild();});
        const sg = configNode.segments || [3];
        geoF.add({ s:sg[0] }, 's', 1, 6, 1).name('圆角段').onChange(v=>{saveUndo('RBoxSeg');configNode.segments[0]=v;rebuild();});
      }
      else if (configNode.type === 'TaperedBox') {
        // size: [底部宽, 高, 底部深, 顶部宽, 顶部深, 顶面X偏移, 顶面Z偏移]
        const sz = configNode.size || [0.5,0.3,0.5,0.35,0.35];
        const t = { bw:sz[0], h:sz[1], bd:sz[2], tw:sz[3]||sz[0]*0.6, td:sz[4]||sz[2]*0.6, ox:sz[5]||0, oz:sz[6]||0 };
        geoF.add(t, 'bw', 0.01, 10.0, 0.005).name('底宽').onChange(v=>{saveUndo('TBw');configNode.size[0]=v;rebuild();});
        geoF.add(t, 'h', 0.01, 10.0, 0.005).name('高度').onChange(v=>{saveUndo('TH');configNode.size[1]=v;rebuild();});
        geoF.add(t, 'bd', 0.01, 10.0, 0.005).name('底深').onChange(v=>{saveUndo('TBd');configNode.size[2]=v;rebuild();});
        geoF.add(t, 'tw', 0.01, 10.0, 0.005).name('顶宽').onChange(v=>{saveUndo('TTw');configNode.size[3]=v;rebuild();});
        geoF.add(t, 'td', 0.01, 10.0, 0.005).name('顶深').onChange(v=>{saveUndo('TTd');configNode.size[4]=v;rebuild();});
        const offF = geoF.addFolder('↗ 顶面偏移');
        offF.add(t, 'ox', -5, 5, 0.005).name('X偏移').onChange(v=>{saveUndo('TBXoff');configNode.size[5]=v;rebuild();});
        offF.add(t, 'oz', -5, 5, 0.005).name('Z偏移').onChange(v=>{saveUndo('TBZoff');configNode.size[6]=v;rebuild();});
      }
      else if (configNode.type === 'TaperedHex') {
        const sz = configNode.size || [0.5,0.3,0.5,0.35,0.35];
        const t = { bw:sz[0], h:sz[1], bd:sz[2], tw:sz[3]||sz[0]*0.6, td:sz[4]||sz[2]*0.6, ox:sz[5]||0, oz:sz[6]||0 };
        geoF.add(t, 'bw', 0.01, 10.0, 0.005).name('底宽').onChange(v=>{saveUndo('THXbw');configNode.size[0]=v;rebuild();});
        geoF.add(t, 'h', 0.01, 10.0, 0.005).name('高度').onChange(v=>{saveUndo('THXh');configNode.size[1]=v;rebuild();});
        geoF.add(t, 'bd', 0.01, 10.0, 0.005).name('底深').onChange(v=>{saveUndo('THXbd');configNode.size[2]=v;rebuild();});
        geoF.add(t, 'tw', 0.01, 10.0, 0.005).name('顶宽').onChange(v=>{saveUndo('THXtw');configNode.size[3]=v;rebuild();});
        geoF.add(t, 'td', 0.01, 10.0, 0.005).name('顶深').onChange(v=>{saveUndo('THXtd');configNode.size[4]=v;rebuild();});
        const offF = geoF.addFolder('↗ 顶面偏移');
        offF.add(t, 'ox', -5, 5, 0.005).name('X偏移').onChange(v=>{saveUndo('THXoff');configNode.size[5]=v;rebuild();});
        offF.add(t, 'oz', -5, 5, 0.005).name('Z偏移').onChange(v=>{saveUndo('THZoff');configNode.size[6]=v;rebuild();});
      }
      else if (configNode.type === 'Cylinder') {
        const sz = configNode.size || [0.5,1,0.5];
        const c = { rT:sz[0], h:sz[1], rB:sz[2] };
        geoF.add(c, 'rT', 0.005, 5.0, 0.005).name('顶半径').onChange(v=>{saveUndo('CylR');configNode.size[0]=v;rebuild();});
        geoF.add(c, 'h', 0.01, 10.0, 0.005).name('高度').onChange(v=>{saveUndo('CylH');configNode.size[1]=v;rebuild();});
        geoF.add(c, 'rB', 0.005, 5.0, 0.005).name('底半径').onChange(v=>{saveUndo('CylRB');configNode.size[2]=v;rebuild();});
        const sg = configNode.segments || [6];
        const sm = { seg:sg[0] };
        geoF.add(sm, 'seg', 3, 32, 1).name('边数').onChange(v=>{saveUndo('CylSeg');configNode.segments[0]=v;rebuild();});
      }
      else if (configNode.type === 'Sphere') {
        const sz = configNode.size || [0.5];
        const s = { r:sz[0] };
        geoF.add(s, 'r', 0.005, 5.0, 0.005).name('半径').onChange(v=>{saveUndo('SphR');configNode.size[0]=v;rebuild();});
        const sg = configNode.segments || [8,6];
        const sm = { w:sg[0], h:sg[1] };
        geoF.add(sm, 'w', 3, 32, 1).name('经线').onChange(v=>{saveUndo('SphW');configNode.segments[0]=v;rebuild();});
        geoF.add(sm, 'h', 2, 32, 1).name('纬线').onChange(v=>{saveUndo('SphH');configNode.segments[1]=v;rebuild();});
      }
      else if (configNode.type === 'Torus') {
        const sz = configNode.size || [0.5,0.05];
        const t = { R:sz[0], r:sz[1]||0.05 };
        geoF.add(t, 'R', 0.01, 5.0, 0.005).name('主半径').onChange(v=>{saveUndo('TorR');configNode.size[0]=v;rebuild();});
        geoF.add(t, 'r', 0.005, 0.5, 0.002).name('管半径').onChange(v=>{saveUndo('Torr');configNode.size[1]=v;rebuild();});
        const sg = configNode.segments || [8,12];
        const sm = { rad:sg[0], tub:sg[1] };
        geoF.add(sm, 'rad', 4, 32, 1).name('径向段').onChange(v=>{saveUndo('TorRad');configNode.segments[0]=v;rebuild();});
        geoF.add(sm, 'tub', 6, 48, 1).name('管向段').onChange(v=>{saveUndo('TorTub');configNode.segments[1]=v;rebuild();});
      }
      else if (configNode.type === 'Lathe') {
        const sg = configNode.segments || [24];
        const sm = { seg:sg[0] };
        geoF.add(sm, 'seg', 6, 64, 1).name('旋转段数').onChange(v=>{saveUndo('LHseg');configNode.segments[0]=v;rebuild();});
        // 半径缩放 & 高度缩放
        const sc = { sR: configNode.scaleR ?? 1, sH: configNode.scaleH ?? 1 };
        geoF.add(sc, 'sR', 0.1, 5.0, 0.01).name('半径缩放').onChange(v=>{saveUndo('LHsR');configNode.scaleR=v;rebuild();});
        geoF.add(sc, 'sH', 0.1, 5.0, 0.01).name('高度缩放').onChange(v=>{saveUndo('LHsH');configNode.scaleH=v;rebuild();});
        // 轮廓编辑：JSON 文本输入
        const prof = configNode.profile || [[0.5,0],[0.5,0.3],[0.6,0.4],[0.1,0.4]];
        const pStr = { txt: JSON.stringify(prof) };
        geoF.add(pStr, 'txt').name('轮廓 [x,y]').onChange(v => {
          try { saveUndo('LHprof'); const arr = JSON.parse(v); if (Array.isArray(arr)) configNode.profile = arr; rebuild(); }
          catch(e) {}
        });
      }
      else if (configNode.type === 'Extrude') {
        const d = { depth:configNode.extrudeDepth||0.5, bevel:configNode.bevelThickness||0.02 };
        geoF.add(d, 'depth', 0.01, 10.0, 0.01).name('挤出深度').onChange(v=>{saveUndo('ExtD');configNode.extrudeDepth=v;rebuild();});
        geoF.add(d, 'bevel', 0, 0.1, 0.002).name('倒角').onChange(v=>{saveUndo('ExtB');configNode.bevelThickness=v;rebuild();});
        // 形状编辑
        const shp = configNode.shape || [[-0.5,-0.2],[0.5,-0.2],[0.5,0.2],[-0.5,0.2]];
        const sStr = { txt: JSON.stringify(shp) };
        geoF.add(sStr, 'txt').name('形状 [x,y]').onChange(v => {
          try { saveUndo('ExtShp'); const arr = JSON.parse(v); if (Array.isArray(arr)) configNode.shape = arr; rebuild(); }
          catch(e) {}
        });
      }

      // --- 颜色编辑（hex color picker）---
      if (mesh.material && mesh.material.color) {
        const colF = folder.addFolder('🎨 颜色');
        const hexStr = '#' + mesh.material.color.getHexString();
        const c = { color:hexStr };
        colF.addColor(c, 'color').name('颜色').onChange(v => {
          saveUndo('color');
          mesh.material.color.set(v);
          configNode.color = v;
        });
        // 预设材料
        colF.add({ mat:configNode.materialId||'default' }, 'mat', Object.keys(MATERIAL_DEFS))
          .name('材质预设').onChange(v => {
            saveUndo('mat');
            const def = MATERIAL_DEFS[v];
            mesh.material.color.set(def.color);
            mesh.material.roughness = def.roughness;
            mesh.material.metalness = def.metalness;
            configNode.materialId = v;
            configNode.color = undefined;
          });
      }
    }

    // --- 增删改按钮 ---
    const editF = folder.addFolder('✏️ 结构编辑');
    // 重命名（自由输入 + 确认按钮，避免 onChange 导致焦点丢失）
    const rn = { name: configNode.name };
    editF.add(rn, 'name').name('名称');
    editF.add({ applyRename:()=>{
      if (rn.name && rn.name !== configNode.name) renameNode(configNode.name, rn.name);
    }}, 'applyRename').name('✅ 确认重命名');
    // 类型切换（仅非 Group）
    if (configNode.type !== 'Group') {
      const typeList = ['Box','BentBox','TaperedBox','TaperedHex','RoundedBox','Cylinder','Sphere','Torus','Lathe','Extrude'];
      editF.add({ type:configNode.type }, 'type', typeList).name('形状').onChange(v => {
        saveUndo('switchType');
        switchType(configNode.name, v);
      });
    }
    editF.add({ add:()=>addChildNode(configNode.name) }, 'add').name('➕ 添加子部件');
    if (configNode.name !== cfg.name) {
      editF.add({ del:()=>deleteNode(configNode.name) }, 'del').name('🗑 删除此部件');
    }
    editF.open();

    // --- 子节点 ---
    if (configNode.children) {
      for (const child of configNode.children) {
        addPartUI(folder, child);
      }
    }
  }

  // 递归添加
  if (cfg.children) {
    for (const child of cfg.children) {
      addPartUI(gui, child);
    }
  }
}

// ============================================================
// 11. 构建并初始化（自动加载上次保存）
// ============================================================
(function autoLoad() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    currentModelType = data.modelType || 'tank_v16';
    if (!MODEL_CONFIGS[currentModelType]) { console.warn('⚠️ 自动加载: 不支持的类型 ' + data.modelType + '，已清除旧数据'); localStorage.removeItem(SAVE_KEY); currentModelType = 'tank_v16'; return; }
    const cfg = MODEL_CONFIGS[currentModelType];
    Object.keys(cfg).forEach(k => delete cfg[k]);
    Object.assign(cfg, data.config);
    console.log('📂 自动加载上次保存 (' + new Date(data.timestamp).toLocaleString() + ')');
  } catch(e) {}
})();
rebuildModel();
// 激活点击选择
setupRaycaster();

// --- 自动快照已集成到每个 onChange 回调中（saveUndo）---

// ============================================================
// 12. 辅助框切换
// ============================================================
document.getElementById('toggle-helpers').addEventListener('click', () => {
  showHelpersGlobal = !showHelpersGlobal;
  const helpers = modelRoot.userData.helpers || [];
  for (const h of helpers) {
    const info = nodeMap.get(h.userData._mesh?.parent?.name || h.userData._mesh?.name?.replace('_mesh',''));
    h.visible = showHelpersGlobal && (info ? info.group.visible : true);
  }
  document.getElementById('toggle-helpers').textContent =
    showHelpersGlobal ? '🔲 隐藏对齐辅助框' : '🔲 显示对齐辅助框';
});

// ============================================================
// 13. 窗口缩放
// ============================================================
window.addEventListener('resize', () => {
  const w = viewWidth(), h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const aspect = w / h;
  orthoCamera.left = -ORTHO_FRUSTUM * aspect;
  orthoCamera.right = ORTHO_FRUSTUM * aspect;
  orthoCamera.top = ORTHO_FRUSTUM;
  orthoCamera.bottom = -ORTHO_FRUSTUM;
  orthoCamera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ============================================================
// 14. 键盘快捷键
// ============================================================
window.addEventListener('keydown', e => {
  // 正在输入框中打字时，跳过快捷键拦截
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === 'h' && !e.ctrlKey && !e.metaKey) {
    document.getElementById('toggle-helpers').click();
  }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
    e.preventDefault();
    flushUndo(); // 强制入栈当前待定快照
    if (undoStack.length === 0) { console.log('⚠️ 没有可撤销的操作'); return; }
    autoSnapshot = false;
    const prev = undoStack.pop();
    const cfg = MODEL_CONFIGS[currentModelType];
    const fmCur = cfg.children?.[0]?.children?.[0];
    const fmPrev = prev.children?.[0]?.children?.[0];
    console.log('🔙 撤销: 当前 size=' + JSON.stringify(fmCur?.size) + ' → 快照 size=' + JSON.stringify(fmPrev?.size));
    deepRestore(cfg, prev);
    console.log('🔙 恢复后 size=' + JSON.stringify(cfg.children?.[0]?.children?.[0]?.size));
    rebuildModel();
    autoSnapshot = true;
    console.log('↩ 撤销成功 (剩余 ' + undoStack.length + ' 步可撤销)');
  }
  if (e.key === 's' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
    e.preventDefault();
    const cfg = MODEL_CONFIGS[currentModelType];
    const saveData = { modelType:currentModelType, config:JSON.parse(JSON.stringify(cfg)), timestamp:Date.now() };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    console.log('💾 已保存 (' + new Date(saveData.timestamp).toLocaleString() + ')');
  }
  // Delete — 隐藏选中部件
  if (e.key === 'Delete' && selectedParts.size > 0) {
    e.preventDefault();
    flushUndo(); saveUndo('keyDel'); // 操作前保存快照
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.group) {
        info.group.visible = false;
        const cfg = info.configNode;
        if (cfg) cfg.visible = false;
      }
    }
    const count = selectedParts.size;
    deselectAll();
    updateAllHelpers();
    updateTriCount();
    console.log('🗑 已隐藏 ' + count + ' 个部件');
  }
  // Escape — 取消所有选中
  if (e.key === 'Escape') {
    deselectAll();
  }
});

// ============================================================
// 15. 导出全局
// ============================================================
window.MODEL_CONFIGS = MODEL_CONFIGS;
window.currentModelType = currentModelType;
window.rebuildModel = rebuildModel;
window.nodeMap = nodeMap;
window.modelRoot = modelRoot;

// ============================================================
// 15.5 视图切换系统
// ============================================================
const VIEW_PRESETS = {
  persp:  { pos:[5.0, 3.5, 6.0], target:[0, 0.8, -0.5] },
  front:  { pos:[0, 0.8, 4.0],  target:[0, 0.8, 0] },
  back:   { pos:[0, 0.8, -4.0], target:[0, 0.8, 0] },
  left:   { pos:[-4.0, 0.8, 0], target:[0, 0.8, 0] },
  right:  { pos:[4.0, 0.8, 0],  target:[0, 0.8, 0] },
  top:    { pos:[0, 4.0, 0.01], target:[0, 0.8, 0] },
  bottom: { pos:[0, -3.0, 0.01], target:[0, 0.8, 0] },
};
let currentView = 'persp';
let viewAnim = null; // { startPos, endPos, startTarget, endTarget, startTime, duration }

function switchView(viewName) {
  // 正交切换按钮特殊处理
  if (viewName === 'ortho') {
    useOrtho = !useOrtho;
    const src = activeCamera();
    // 同步位置
    if (useOrtho) {
      orthoCamera.position.copy(camera.position);
      orthoCamera.quaternion.copy(camera.quaternion);
      orthoCamera.zoom = 1;
      orthoCamera.updateProjectionMatrix();
    } else {
      camera.position.copy(orthoCamera.position);
      camera.quaternion.copy(orthoCamera.quaternion);
    }
    // 切换 OrbitControls 到当前摄像机
    controls.object = activeCamera();
    controls.update();
    document.getElementById('ortho-toggle').classList.toggle('active', useOrtho);
    document.getElementById('ortho-toggle').title = useOrtho ? '切换透视 (当前: 正交)' : '切换正交 (当前: 透视)';
    return;
  }
  const preset = VIEW_PRESETS[viewName];
  if (!preset) return;
  currentView = viewName;
  // 更新按钮 active 状态
  document.querySelectorAll('#view-toolbar button[data-view]:not(#ortho-toggle)').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewName);
  });
  const dur = 500; // ms
  const cam = activeCamera();
  viewAnim = {
    startPos: cam.position.clone(),
    endPos: new THREE.Vector3(...preset.pos),
    startTarget: controls.target.clone(),
    endTarget: new THREE.Vector3(...preset.target),
    startTime: performance.now(),
    duration: dur,
  };
}

// 绑定按钮事件
document.querySelectorAll('#view-toolbar button').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
// 初始高亮 - r19: 默认正交侧视图
useOrtho = true;
document.getElementById('ortho-toggle').classList.add('active');
document.getElementById('ortho-toggle').title = '切换透视 (当前: 正交)';
controls.object = orthoCamera;
switchView('right');

// 背景颜色选择器
document.getElementById('bg-color').addEventListener('input', e => {
  scene.background = new THREE.Color(e.target.value);
});

// ============================================================
// 16. 渲染循环
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.1, clock.getDelta());
  // 视图动画插值
  if (viewAnim) {
    const elapsed = performance.now() - viewAnim.startTime;
    const t = Math.min(elapsed / viewAnim.duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOutQuad
    const cam = activeCamera();
    cam.position.lerpVectors(viewAnim.startPos, viewAnim.endPos, ease);
    controls.target.lerpVectors(viewAnim.startTarget, viewAnim.endTarget, ease);
    if (t >= 1) viewAnim = null;
  }
  controls.update();
  updateAnimShowcase(dt);
  renderer.render(scene, activeCamera());
}
animate();

// 首次加载后收集动画引用
setTimeout(() => collectAnimRefs(), 100);

console.log('🏭 模型工厂已就绪');
console.log('💡 可用全局变量: MODEL_CONFIGS, rebuildModel, nodeMap, modelRoot');
console.log('💡 快捷键: H=切换辅助框');
console.log('💡 右侧面板拖拽滑动条实时编辑坦克模型');
