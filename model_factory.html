function addWheelBolts() {
  const boltMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.35, metalness: 0.8 });

  function addBolts(wheelInfo, count) {
    if (!wheelInfo) return;
    const mesh = wheelInfo.mesh;
    if (!mesh) return;

    const toRemove = [];
    mesh.traverse(c => { if (c.userData && c.userData.isBolt) toRemove.push(c); });
    for (const b of toRemove) {
      b.parent.remove(b);
      if (b.geometry) b.geometry.dispose();
    }

    const size = wheelInfo.configNode.size;
    const radius = size[0] || 0.4;
    const thickness = size[1] || 0.12;
    const isLeft = wheelInfo.configNode && wheelInfo.configNode.name && wheelInfo.configNode.name.indexOf('左') === 0;
    const boltR = radius * 0.55;
    const boltY = isLeft ? (thickness / 2 + 0.015) : -(thickness / 2 + 0.015);

    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const boltGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.035, 6);
      const bolt = new THREE.Mesh(boltGeo, boltMat);
      bolt.userData = { isBolt: true };
      bolt.position.set(
        Math.cos(angle) * boltR,
        boltY,
        Math.sin(angle) * boltR
      );
      mesh.add(bolt);
    }
  }

  addBolts(nodeMap.get('左诱导轮'), 5);
  addBolts(nodeMap.get('右诱导轮'), 5);
  for (let i = 1; i <= 5; i++) {
    addBolts(nodeMap.get('左负重轮' + i), 7);
    addBolts(nodeMap.get('右负重轮' + i), 7);
  }
  addBolts(nodeMap.get('左主动轮'), 7);
  addBolts(nodeMap.get('右主动轮'), 7);
}

function rebuildModel() {
  _camoJungleTex = null; _camoDesertTex = null;
  // 关闭动画展台
  if (animShowcase) toggleAnimShowcase();
  // 关闭IK测试（模块管理）
  if (window._hexIKActive && window._hexIKActive()) window.toggleHexIKTest();

  // 清理旧模型
  if (modelRoot) {
    modelRoot.traverse(c => { if (c.geometry && c !== modelRoot) c.geometry.dispose(); });
    scene.remove(modelRoot);
  }
  // 清理选择
  deselectAll();
  nodeMap.clear();
  guiFolderMap.clear();
  modelRoot = new THREE.Group();

  MODEL_CONFIGS[currentModelType] = JSON.parse(JSON.stringify(MODEL_CONFIGS[currentModelType]));
  const cfg = MODEL_CONFIGS[currentModelType];
  if (cfg) {
    buildFromConfig(cfg, modelRoot, showHelpersGlobal, nodeMap);
  }

  scene.add(modelRoot);
  modelRoot.updateMatrixWorld(true);

  // 六足战车：贴地+线框+彩色部件
  if (currentModelType === 'hexapod') {
    // 找到六足战车的根Group（modelRoot的直接子节点）
    var hexRoot = null;
    modelRoot.children.forEach(function(c) { if (c.name === '六足战车') hexRoot = c; });
    if (hexRoot) {
      // 先重置根节点位置，用局部包围盒算偏移
      hexRoot.position.y = 0;
      hexRoot.updateMatrixWorld(true);
      var hbox = new THREE.Box3().setFromObject(hexRoot);
      // 把六足战车根节点上移，使脚底贴地
      hexRoot.position.y = -hbox.min.y;
      hexRoot.updateMatrixWorld(true);
    }
    // 线框
    modelRoot.traverse(function(ch) {
      if (ch.isMesh && ch.geometry && ch.parent) {
        try {
          var eg = new THREE.EdgesGeometry(ch.geometry, 15);
          var ln = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color:0x111111}));
          ch.add(ln);
          ch.userData._wireLine = ln;
        } catch(e) {}
      }
    });
  }

  addWheelBolts();
  updateTriCount();
  if (gui) { gui.destroy(); gui = null; }
  buildGUI();
  // 默认折叠所有顶层节点，保持面板整洁
  ptCollapsed.clear();
  var topCfg = MODEL_CONFIGS[currentModelType];
  if (topCfg && topCfg.children) {
    for (var ci = 0; ci < topCfg.children.length; ci++) ptCollapsed.add(topCfg.children[ci].name);
  }
  refreshPartTree();
  updateAnimButton();
}

// ============================================================
// 选择系统 v2：单选/多选(Ctrl)/框选 + 批量编辑
// ============================================================
function createHighlight(_name) {
  // 先清除全部旧高亮
  for (const [n, hl] of highlightLines) {
    if (hl) { hl.parent?.remove(hl); }
  }
  highlightLines.clear();
  // 遍历 selectedParts 为每个选中部件创建高亮
  const color = selectedParts.size > 1 ? 0x4ecdc4 : 0xffd700; // 多选青色，单选金色
  for (const n of selectedParts) {
    const inf = nodeMap.get(n);
    if (inf && inf.mesh && inf.mesh.geometry) {
      const geo = inf.mesh.geometry;
      // 检查几何体是否有效（避免 NaN 几何体导致 EdgesGeometry 崩溃）
      if (!geo.attributes.position || geo.attributes.position.count === 0) continue;
      const e = new THREE.EdgesGeometry(geo);
      const h = new THREE.LineSegments(e, new THREE.LineBasicMaterial({ color, linewidth:1, depthTest:false }));
      inf.mesh.add(h);
      highlightLines.set(n, h);
    }
  }
}

function removeHighlight(name) {
  const hl = highlightLines.get(name);
  if (hl) { hl.parent?.remove(hl); highlightLines.delete(name); }
}

function expandPath(cfg, targetName, ancestors) {
  if (cfg.name === targetName) { ancestors.push(cfg.name); return true; }
  if (cfg.children) {
    for (const c of cfg.children) {
      if (expandPath(c, targetName, ancestors)) { ancestors.push(cfg.name); return true; }
    }
  }
  return false;
}

function buildPath(cfg, targetName, parts) {
  if (cfg.name === targetName) { parts.push(cfg.name); return true; }
  if (cfg.children) {
    for (const c of cfg.children) {
      if (buildPath(c, targetName, parts)) { parts.push(cfg.name); return true; }
    }
  }
  return false;
}

function updateBreadcrumb() {
  const el = document.getElementById('path-breadcrumb');
  if (selectedParts.size === 0) {
    el.innerHTML = '📍 未选中';
    return;
  }
  if (selectedParts.size === 1) {
    const paths = [];
    buildPath(MODEL_CONFIGS[currentModelType], [...selectedParts][0], paths);
    paths.reverse();
    el.innerHTML = '📍 ' + paths.map((p,i) => `<span>${p}</span>`).join('<span class="sep-arrow">→</span>');
  } else {
    el.innerHTML = `📍 已选 <span>${selectedParts.size}</span> 个部件`;
  }
}

function updateBatchPanel() {
  if (!batchGuiFolder) return;
  const count = selectedParts.size;
  // 更新计数显示
  if (batchInfoObj) batchInfoObj.count = count;
  if (count >= 2) {
    batchGuiFolder.open();
  } else {
    batchGuiFolder.close();
  }
}

// 单选模式
function selectSingle(name) {
  removeAllHighlights();
  selectedParts.clear();
  selectedParts.add(name);
  createHighlight(name);
  // 展开选中节点到根节点的路径
  expandToNode(name);
  focusPanel(name);
  updateBatchPanel();
  updateBreadcrumb();
  refreshPartTree();
}
function expandToNode(name) {
  function findAndExpand(cfg, target) {
    if (cfg.name === target) return true;
    if (cfg.children) {
      for (var ci = 0; ci < cfg.children.length; ci++) {
        if (findAndExpand(cfg.children[ci], target)) { ptCollapsed.delete(cfg.name); return true; }
      }
    }
    return false;
  }
  var topCfg = MODEL_CONFIGS[currentModelType];
  if (topCfg) findAndExpand(topCfg, name);
}

// 多选模式（切换）
function toggleSelect(name) {
  if (selectedParts.has(name)) {
    removeHighlight(name);
    selectedParts.delete(name);
  } else {
    selectedParts.add(name);
  }
  createHighlight(name);
  if (selectedParts.size === 1) {
    focusPanel([...selectedParts][0]);
  }
  updateBatchPanel();
  updateBreadcrumb();
  refreshPartTree();
}

function removeAllHighlights() {
  for (const [n, hl] of highlightLines) {
    if (hl) hl.parent?.remove(hl);
  }
  highlightLines.clear();
}

function deselectAll() {
  removeAllHighlights();
  selectedParts.clear();
  updateBatchPanel();
  updateBreadcrumb();
  refreshPartTree();
}

function focusPanel(name) {
  // 1. 先关闭所有文件夹
  guiFolderMap.forEach(f => f.close());
  // 2. 展开祖先路径
  const ancestors = [];
  expandPath(MODEL_CONFIGS[currentModelType], name, ancestors);
  for (const a of ancestors) { const f = guiFolderMap.get(a); if (f) f.open(); }
  // 3. 只展开选中节点本身（不展开子孙）
  const targetFolder = guiFolderMap.get(name);
  if (targetFolder) targetFolder.open();
  // 4. 滚动到选中位置
  if (targetFolder) {
    try {
      const el = targetFolder.domElement || targetFolder._title;
      if (el && el.scrollIntoView) {
        setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
      }
    } catch(e) {}
  }
}

// 获取mesh的屏幕空间包围盒
function getScreenBBox(mesh) {
  if (!mesh.geometry) return null;
  mesh.geometry.computeBoundingBox();
  const box = mesh.geometry.boundingBox.clone();
  const mat = mesh.matrixWorld.clone();
  const corners = [
    new THREE.Vector3(box.min.x, box.min.y, box.min.z),
    new THREE.Vector3(box.min.x, box.min.y, box.max.z),
    new THREE.Vector3(box.min.x, box.max.y, box.min.z),
    new THREE.Vector3(box.min.x, box.max.y, box.max.z),
    new THREE.Vector3(box.max.x, box.min.y, box.min.z),
    new THREE.Vector3(box.max.x, box.min.y, box.max.z),
    new THREE.Vector3(box.max.x, box.max.y, box.min.z),
    new THREE.Vector3(box.max.x, box.max.y, box.max.z),
  ];
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const c of corners) {
    const w = c.applyMatrix4(mat).project(activeCamera());
    const sx = (w.x*0.5+0.5)*viewWidth();
    const sy = (-w.y*0.5+0.5)*window.innerHeight;
    if (sx<minX) minX=sx; if (sy<minY) minY=sy;
    if (sx>maxX) maxX=sx; if (sy>maxY) maxY=sy;
  }
  if (!isFinite(minX)) return null;
  return { minX, minY, maxX, maxY };
}

// 框选检测：屏幕矩形与部件屏幕包围盒是否重叠
function rectsOverlap(a, b) {
  return !(a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY);
}

function boxSelect(sx, sy, ex, ey) {
  const selRect = {
    minX: Math.min(sx, ex), minY: Math.min(sy, ey),
    maxX: Math.max(sx, ex), maxY: Math.max(sy, ey),
  };
  const names = [];
  nodeMap.forEach((info, name) => {
    if (!info.mesh || !info.group.visible) return;
    const bbox = getScreenBBox(info.mesh);
    if (bbox && rectsOverlap(selRect, bbox)) names.push(name);
  });
  // 清空旧选择，添加新选择
  removeAllHighlights();
  selectedParts.clear();
  for (const n of names) {
    selectedParts.add(n);
  }
  createHighlight('');
  updateBatchPanel();
  console.log('📦 框选了 ' + selectedParts.size + ' 个部件');
}

// 点击选择
function onClickSelect(e) {
  if (!modelRoot) return;
  const mouse = new THREE.Vector2();
  mouse.x = (e.clientX / viewWidth()) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, activeCamera());
  const targets = [];
  nodeMap.forEach((info, name) => {
    if (info.mesh && info.group.visible) targets.push(info.mesh);
  });
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) {
    const name = hits[0].object.name.replace('_mesh', '');
    if (e.ctrlKey || e.metaKey) {
      // Ctrl+点击：切换多选
      toggleSelect(name);
    } else {
      // 普通点击：单选
      selectSingle(name);
    }
  } else {
    // 点击空白取消全部
    deselectAll();
  }
}

// 点击选择（不拦截拖拽，OrbitControls 正常旋转场景）
function setupRaycaster() {
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', e => {
    clickStart = { x:e.clientX, y:e.clientY };
  });
  canvas.addEventListener('pointerup', e => {
    const dx = e.clientX - clickStart.x;
    const dy = e.clientY - clickStart.y;
    if (Math.sqrt(dx*dx+dy*dy) < 4) {
      // 这是点击而非拖拽
      onClickSelect(e);
    }
  });
}

let showHelpersGlobal = true;

function updateTriCount() {
  document.getElementById('triCount').textContent = countTriangles(modelRoot);
}

function updateAllHelpers() {
  const helpers = modelRoot.userData.helpers || [];
  for (const h of helpers) {
    const m = h.userData._mesh;
    if (m && m.geometry && m.geometry.attributes.position) {
      const pos = m.geometry.attributes.position;
      // 跳过NaN几何体，避免BoxHelper.update崩溃
      let hasNaN = false;
      for (let i = 0; i < Math.min(pos.count, 3); i++) {
        if (!isFinite(pos.getX(i))) { hasNaN = true; break; }
      }
      if (!hasNaN) {
        try { h.update(); } catch(e) {}
      }
    }
    h.visible = showHelpersGlobal;
  }
}

// ============================================================
// 9. 重建单个 mesh（几何参数变化时）
// ============================================================
function rebuildMesh(nodeName) {
  const info = nodeMap.get(nodeName);
  if (!info || !info.configNode) return;
  const { mesh, configNode } = info;
  if (!mesh || mesh.type === 'Group') return;

  // 重建几何体
  mesh.geometry.dispose();
  const geo = createGeometry(configNode);
  geo.computeBoundingBox();
  const bbox = geo.boundingBox;
  if (bbox && isFinite(bbox.min.x) && isFinite(bbox.max.x)) {
    const cx = (bbox.min.x + bbox.max.x) / 2;
    const cy = (bbox.min.y + bbox.max.y) / 2;
    const cz = (bbox.min.z + bbox.max.z) / 2;
    geo.translate(-cx, -cy, -cz);
  }
  mesh.geometry = geo;

  // 更新六足战车线框
  if (mesh.userData._wireLine) {
    mesh.userData._wireLine.geometry.dispose();
    mesh.remove(mesh.userData._wireLine);
    mesh.userData._wireLine = null;
  }
  if (currentModelType === 'hexapod') {
    try {
      var _eg = new THREE.EdgesGeometry(geo, 15);
      var _ln = new THREE.LineSegments(_eg, new THREE.LineBasicMaterial({color:0x111111}));
      mesh.add(_ln);
      mesh.userData._wireLine = _ln;
    } catch(_e) {}
  }

  // 重建材质（如果颜色参数在 configNode.color 中）
  if (!mesh.material._factoryColor) {
    // 保持原有材质引用，仅更新 color
    if (configNode.color) {
      mesh.material.color.set(configNode.color);
    }
  }

  // 更新 BoxHelper（如果有引用该 mesh 的 helper）
  const helpers = modelRoot.userData.helpers || [];
  for (const h of helpers) {
    if (h.userData._mesh === mesh) h.update();
  }
  updateTriCount();
  // 如果选中的部件几何变化，刷新高亮
  if (selectedParts.has(nodeName)) {
    removeHighlight(nodeName);
    createHighlight(nodeName);
  }
}

// ============================================================
// 9.5 树编辑工具：查找父节点 / 添加子节点 / 删除节点
// ============================================================
function findParentNode(cfg, targetName) {
  if (!cfg.children) return null;
  for (const c of cfg.children) {
    if (c.name === targetName) return cfg;
    const found = findParentNode(c, targetName);
    if (found) return found;
  }
  return null;
}

function generateName(cfg, prefix) {
  let maxN = 0;
  function scan(node) {
    if (node.name && node.name.startsWith(prefix + '_')) {
      const n = parseInt(node.name.split('_').pop());
      if (!isNaN(n) && n > maxN) maxN = n;
    }
    if (node.children) for (const c of node.children) scan(c);
  }
  scan(cfg);
  return prefix + '_' + String(maxN + 1).padStart(2, '0');
}

function addChildNode(parentName) {
  flushUndo(); saveUndo('addChild'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  function findNode(n, target) {
    if (n.name === target) return n;
    if (n.children) for (const c of n.children) { const f = findNode(c, target); if (f) return f; }
    return null;
  }
  const parent = findNode(cfg, parentName);
  if (!parent) return;
  if (!parent.children) parent.children = [];
  const newNode = {
    name: generateName(cfg, 'part'),
    type: 'Box',
    size: [0.3, 0.3, 0.3],
    position: [0, 0.15, 0],
    materialId: 'default',
  };
  parent.children.push(newNode);
  rebuildModel();
  console.log('➕ 已添加子部件: ' + newNode.name + ' → ' + parentName);
}

function deleteNode(targetName) {
  flushUndo(); saveUndo('deleteNode'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  const parent = findParentNode(cfg, targetName);
  if (!parent || !parent.children) { console.log('⚠️ 无法删除根节点'); return; }
  const idx = parent.children.findIndex(c => c.name === targetName);
  if (idx === -1) return;
  parent.children.splice(idx, 1);
  rebuildModel();
  console.log('🗑 已删除部件: ' + targetName);
}

function renameNode(oldName, newName) {
  if (!newName || newName === oldName) return;
  flushUndo(); saveUndo('renameNode'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  function findNode(n, target) {
    if (n.name === target) return n;
    if (n.children) for (const c of n.children) { const f = findNode(c, target); if (f) return f; }
    return null;
  }
  const node = findNode(cfg, oldName);
  if (!node) return;
  node.name = newName;
  deselectAll();
  rebuildModel();
  console.log('✏️ 已重命名: ' + oldName + ' → ' + newName);
}

const TYPE_DEFAULTS = {
  Box: { size:[0.3,0.3,0.3] },
  BentBox: { size:[0.3,0.08,1.2,0.4], segments:[16] },
  TaperedBox: { size:[0.5,0.3,0.5,0.35,0.35] },
  TaperedHex: { size:[0.5,0.3,0.5,0.35,0.35] },
  RoundedBox: { size:[0.3,0.3,0.3,0.06], segments:[3] },
  Cylinder: { size:[0.15,0.3,0.15], segments:[6] },
  Sphere: { size:[0.2], segments:[8,6] },
  Torus: { size:[0.3,0.05], segments:[8,12] },
  Lathe: { size:[1], segments:[24], profile:[[0.2,0],[0.3,0.2],[0.3,0.3],[0.15,0.35],[0.05,0.3]] },
  Extrude: { size:[1], shape:[[-0.15,-0.1],[0.15,-0.1],[0.15,0.1],[-0.15,0.1]], extrudeDepth:0.3, bevelThickness:0.02 },
  Group: {},
};

function switchType(nodeName, newType) {
  flushUndo(); saveUndo('switchType'); // 操作前保存快照
  const cfg = MODEL_CONFIGS[currentModelType];
  function findNode(n, target) {
    if (n.name === target) return n;
    if (n.children) for (const c of n.children) { const f = findNode(c, target); if (f) return f; }
    return null;
  }
  const node = findNode(cfg, nodeName);
  if (!node || node.type === newType) return;
  node.type = newType;
  const d = TYPE_DEFAULTS[newType] || {};
  if (d.size) node.size = [...d.size];
  if (d.segments) node.segments = [...d.segments];
  if (d.profile !== undefined) node.profile = [...(d.profile || [[0.3,0],[0.3,0.3],[0.1,0.3]])];
  if (d.shape !== undefined) node.shape = [...(d.shape || [[-0.15,-0.1],[0.15,-0.1],[0.15,0.1],[-0.15,0.1]])];
  if (d.extrudeDepth !== undefined) node.extrudeDepth = d.extrudeDepth;
  if (d.bevelThickness !== undefined) node.bevelThickness = d.bevelThickness;
  // 清理旧类型的专属字段
  if (newType !== 'Lathe') delete node.profile;
  if (newType !== 'Extrude') { delete node.shape; delete node.extrudeDepth; delete node.bevelThickness; }
  deselectAll();
  rebuildModel();
  console.log('🔄 已切换: ' + nodeName + ' → ' + newType);
}

// ============================================================
// 10. GUI 构建
// ============================================================
function buildGUI() {
  const cfg = MODEL_CONFIGS[currentModelType];
  gui = new GUI({ title:'🏭 模型工厂', width:310 });

  // --- 模型切换 ---
  const modelFolder = gui.addFolder('📦 模型切换');
  const modelOptions = { 'T-34/85 (v1.6 AI版)':'tank_v16', '🏠 建筑':'building', '👾 敌人':'enemy', '🦗 六足战车':'hexapod' };
  modelFolder.add({ model: currentModelType }, 'model', modelOptions)
    .name('选择模型')
    .onChange(v => {
      saveUndo('model');
      currentModelType = v;
      rebuildModel();
    });
  modelFolder.open();

  modelFolder.add({ camo: currentCamoType }, 'camo', { '🌿 丛林迷彩':'jungle', '🏜 沙漠迷彩':'desert' })
    .name('迷彩类型')
    .onChange(v => {
      currentCamoType = v;
      _camoJungleTex = null; _camoDesertTex = null;
      rebuildModel();
    });

  // --- 全选（独立按钮）---
  const selectAllFolder = gui.addFolder('✅ 全选部件');
  selectAllFolder.add({ selectAll:()=>{
    removeAllHighlights();
    selectedParts.clear();
    nodeMap.forEach((info, name) => {
      if (info.mesh && info.group.visible) selectedParts.add(name);
    });
    createHighlight('');
    updateBatchPanel();
    console.log('✅ 全选 ' + selectedParts.size + ' 个部件');
  }}, 'selectAll').name('✅ 全选可见部件');
  selectAllFolder.open();

  // --- 批量编辑（多选 ≥2 时自动展开）---
  batchGuiFolder = gui.addFolder('📦 批量编辑 (选中≥2时展开)');
  batchInfoObj = { count:selectedParts.size };
  batchGuiFolder.add(batchInfoObj, 'count').name('已选部件数').disable();
  // 位置偏移（累积式：滑块不归零，数值显示累计偏移）
  const batchPos = { dx:0, dy:0, dz:0 };
  const _prevBatch = { dx:0, dy:0, dz:0 };
  function applyDelta(axis, batchKey, newValue) {
    if (!isFinite(newValue)) return;
    const delta = newValue - _prevBatch[batchKey];
    if (!isFinite(delta) || Math.abs(delta) < 1e-6) return;
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      const pos = info?.group?.position;
      if (pos && isFinite(pos[axis])) pos[axis] += delta;
    }
    _prevBatch[batchKey] = newValue;
    updateAllHelpers();
  }
  batchGuiFolder.add(batchPos, 'dx', -2, 2, 0.001).name('ΔX').onChange(v => { saveUndo('batchDX'); applyDelta('x', 'dx', v); });
  batchGuiFolder.add(batchPos, 'dy', -2, 2, 0.001).name('ΔY').onChange(v => { saveUndo('batchDY'); applyDelta('y', 'dy', v); });
  batchGuiFolder.add(batchPos, 'dz', -2, 2, 0.001).name('ΔZ').onChange(v => { saveUndo('batchDZ'); applyDelta('z', 'dz', v); });
  // 重置偏移
  batchGuiFolder.add({ resetOffset:()=>{
    batchPos.dx=0; batchPos.dy=0; batchPos.dz=0;
    _prevBatch.dx=0; _prevBatch.dy=0; _prevBatch.dz=0;
  }}, 'resetOffset').name('🔄 重置偏移零点');
  // 批量旋转
  const DEG = 180 / Math.PI;
  const batchRot = { drx:0, dry:0, drz:0 };
  const _prevRot = { drx:0, dry:0, drz:0 };
  function applyRotDelta(axis, batchKey, newValue) {
    if (!isFinite(newValue)) return;
    const delta = (newValue - _prevRot[batchKey]) / DEG;
    if (!isFinite(delta) || Math.abs(delta) < 1e-6) return;
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      const rt = info?.rotTarget;
      if (rt && isFinite(rt.rotation[axis])) rt.rotation[axis] += delta;
    }
    _prevRot[batchKey] = newValue;
    updateAllHelpers();
  }
  batchGuiFolder.add(batchRot, 'drx', -180, 180, 1).name('ΔRX (°)').onChange(v => { saveUndo('batchRX'); applyRotDelta('x', 'drx', v); });
  batchGuiFolder.add(batchRot, 'dry', -180, 180, 1).name('ΔRY (°)').onChange(v => { saveUndo('batchRY'); applyRotDelta('y', 'dry', v); });
  batchGuiFolder.add(batchRot, 'drz', -180, 180, 1).name('ΔRZ (°)').onChange(v => { saveUndo('batchRZ'); applyRotDelta('z', 'drz', v); });
  batchGuiFolder.add({ resetRot:()=>{ batchRot.drx=0;batchRot.dry=0;batchRot.drz=0;_prevRot.drx=0;_prevRot.dry=0;_prevRot.drz=0; }}, 'resetRot').name('🔄 重置旋转零点');
  // 颜色批量
  const batchColor = { color:'#4a5c2e' };
  batchGuiFolder.addColor(batchColor, 'color').name('颜色').onChange(v => {
    saveUndo('batchColor');
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.mesh && info.mesh.material) {
        info.mesh.material.color.set(v);
        const cfg = info.configNode;
        if (cfg) cfg.color = v;
      }
    }
  });
  // 材质预设批量
  batchGuiFolder.add({ mat:'default' }, 'mat', Object.keys(MATERIAL_DEFS)).name('材质').onChange(v => {
    saveUndo('batchMat');
    const def = MATERIAL_DEFS[v];
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.mesh && info.mesh.material) {
        info.mesh.material.color.set(def.color);
        info.mesh.material.roughness = def.roughness;
        info.mesh.material.metalness = def.metalness;
        const cfg = info.configNode;
        if (cfg) { cfg.materialId = v; cfg.color = undefined; }
      }
    }
  });
  // 隐藏选中
  batchGuiFolder.add({ del:()=>{
    flushUndo(); saveUndo('batchHide'); // 操作前保存快照
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.group) {
        info.group.visible = false;
        const cfg = info.configNode;
        if (cfg) cfg.visible = false;
      }
    }
    deselectAll();
    updateAllHelpers();
    updateTriCount();
    console.log('🗑 已隐藏 ' + selectedParts.size + ' 个部件（可重新打开可见性恢复）');
  }}, 'del').name('🗑 隐藏选中');
  batchGuiFolder.close();

  // --- 全局操作 ---
  const globalF = gui.addFolder('🛠 全局操作');
  // 撤销
  globalF.add({ undo:()=>{
    flushUndo(); // 强制入栈当前待定快照
    if (undoStack.length === 0) { console.log('⚠️ 没有可撤销的操作'); return; }
    autoSnapshot = false;
    const prev = undoStack.pop();
    const cfg = MODEL_CONFIGS[currentModelType];
    const fmCur2 = cfg.children?.[0]?.children?.[0];
    const fmPrev2 = prev.children?.[0]?.children?.[0];
    console.log('🔙 撤销: 当前 size=' + JSON.stringify(fmCur2?.size) + ' → 快照 size=' + JSON.stringify(fmPrev2?.size));
    deepRestore(cfg, prev);
    console.log('🔙 恢复后 size=' + JSON.stringify(cfg.children?.[0]?.children?.[0]?.size));
    rebuildModel();
    autoSnapshot = true;
    console.log('↩ 撤销成功 (剩余 ' + undoStack.length + ' 步可撤销)');
  }}, 'undo').name('↩ 撤销 (Ctrl+Z)');
  // 保存
  globalF.add({ save:()=>{
    const cfg = MODEL_CONFIGS[currentModelType];
    const saveData = { modelType:currentModelType, config:JSON.parse(JSON.stringify(cfg)), timestamp:Date.now() };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    console.log('💾 已保存到本地存储 (' + new Date(saveData.timestamp).toLocaleString() + ')');
  }}, 'save').name('💾 保存 (Ctrl+S)');
  // 加载
  globalF.add({ load:()=>{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { console.log('⚠️ 没有找到已保存的数据'); return; }
    try {
      const data = JSON.parse(raw);
      currentModelType = data.modelType || 'hexapod';
      if (!MODEL_CONFIGS[currentModelType]) { console.warn('⚠️ 不支持的模型类型:' + data.modelType + '，已删除旧数据'); currentModelType = 'hexapod'; localStorage.removeItem(SAVE_KEY); rebuildModel(); return; }
      const cfg = MODEL_CONFIGS[currentModelType];
      deepRestore(cfg, data.config);
      rebuildModel();
      console.log('📂 已从本地存储加载 (' + new Date(data.timestamp).toLocaleString() + ')');
    } catch(e) { console.error('加载失败:', e); }
  }}, 'load').name('📂 加载');
  // 重置
  globalF.add({ reset:()=>{ location.reload(); } }, 'reset').name('🔄 重置');
  // 输出
  globalF.add({ log:()=>{
    function collect(cfg) {
      const r = [];
      const n = nodeMap.get(cfg.name);
      if (n && cfg.type!=='Group') {
        const cc = n.group.userData.appliedComp || [0,0,0];
        r.push({
          name:cfg.name, type:cfg.type,
          position:[n.group.position.x-cc[0],n.group.position.y-cc[1],n.group.position.z-cc[2]].map(v=>+v.toFixed(4)),
          rotation:[n.rotTarget.rotation.x,n.rotTarget.rotation.y,n.rotTarget.rotation.z].map(v=>+v.toFixed(4)),
          size:cfg.size?.map(v=>+v.toFixed(4)),
          segments:cfg.segments, materialId:cfg.materialId, color:cfg.color
        });
      }
      if (cfg.children) for (const c of cfg.children) r.push(...collect(c));
      return r;
    }
    const parts = collect(MODEL_CONFIGS[currentModelType]);
    console.log('📋 === 当前模型姿态 ===');
    console.log(JSON.stringify(parts, null, 2));
    console.log('%c💡 推荐: 点"📥 导出JSON固化"下载文件，然后把文件路径告诉Trae固化','background:#333;color:#ffd;padding:2px 8px;border-radius:3px');
  }}, 'log').name('📋 输出姿态');
  // 应用到Config
  globalF.add({ apply:()=>{
    function applyState(cfg) {
      const n = nodeMap.get(cfg.name);
      if (n && cfg.type!=='Group') {
        const cc = n.group.userData.appliedComp || [0,0,0];
        cfg.position = [n.group.position.x-cc[0],n.group.position.y-cc[1],n.group.position.z-cc[2]].map(v=>+v.toFixed(4));
        cfg.rotation = [n.rotTarget.rotation.x,n.rotTarget.rotation.y,n.rotTarget.rotation.z].map(v=>+v.toFixed(4));
        cfg.visible = n.group.visible;
      }
      if (cfg.children) for (const c of cfg.children) applyState(c);
    }
    applyState(MODEL_CONFIGS[currentModelType]);
    console.log('✅ Config 已应用');
  }}, 'apply').name('💾 应用到 Config');
  // 导出完整配置到JSON文件
  globalF.add({ export:()=>{
    function applyState(cfg) {
      const n = nodeMap.get(cfg.name);
      if (n && cfg.type!=='Group') {
        const cc = n.group.userData.appliedComp || [0,0,0];
        cfg.position = [n.group.position.x-cc[0],n.group.position.y-cc[1],n.group.position.z-cc[2]].map(v=>+v.toFixed(4));
        cfg.rotation = [n.rotTarget.rotation.x,n.rotTarget.rotation.y,n.rotTarget.rotation.z].map(v=>+v.toFixed(4));
        cfg.visible = n.group.visible;
      }
      if (cfg.children) for (const c of cfg.children) applyState(c);
    }
    applyState(MODEL_CONFIGS[currentModelType]);
    // 先同步3D状态到config，防止丢失未保存的调整
    syncConfigFromScene(MODEL_CONFIGS[currentModelType]);
    const json = JSON.stringify(MODEL_CONFIGS[currentModelType], null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    var modelLabel = currentModelType === 'hexapod' ? '六足战车' : (currentModelType === 'tank_v16' ? '坦克v1.6' : currentModelType);
    a.download = modelLabel + '_配置_固化.json';
    a.click();
    URL.revokeObjectURL(url);
    console.log('📥 配置JSON已下载: ' + a.download);
  }}, 'export').name('📥 导出JSON固化');
  globalF.open();

  // --- 递归添加部件 UI ---
  function addPartUI(parentGui, configNode) {
    if (!configNode || !configNode.name) return;
    const info = nodeMap.get(configNode.name);
    if (!info) return;
    const { group, mesh, rotTarget } = info;

    const folder = parentGui.addFolder(`🔧 ${configNode.name}`);
    guiFolderMap.set(configNode.name, folder);
    // 全部默认展开，方便编辑

    // --- 可见性 ---
    const vis = { v:group.visible };
    folder.add(vis, 'v').name('👁 可见').onChange(v => {
      saveUndo('vis');
      group.visible = v;
      configNode.visible = v;
      // 更新 BoxHelper
      const helpers = modelRoot.userData.helpers || [];
      for (const h of helpers) {
        if (h.userData._mesh === mesh) h.visible = v && showHelpersGlobal;
      }
      refreshPartTree();
    });

    // --- 位置 (x,y,z) ---
    const p = { x:group.position.x, y:group.position.y, z:group.position.z };
    const posF = folder.addFolder('📍 位置');
    posF.add(p, 'x', -10, 10, 0.005).name('X').onChange(v => { saveUndo('posX'); group.position.x=v; updateAllHelpers(); });
    posF.add(p, 'y', -10, 10, 0.005).name('Y').onChange(v => { saveUndo('posY'); group.position.y=v; updateAllHelpers(); });
    posF.add(p, 'z', -10, 10, 0.005).name('Z').onChange(v => { saveUndo('posZ'); group.position.z=v; updateAllHelpers(); });

    // --- 旋转 (x,y,z) — 度数显示 ---
    if (true) { // 含Group也显示旋转
      const DEG = 180 / Math.PI;
      const r = { x: rotTarget.rotation.x * DEG, y: rotTarget.rotation.y * DEG, z: rotTarget.rotation.z * DEG };
      const rotF = folder.addFolder('🔄 旋转');
      rotF.add(r, 'x', -180, 180, 1).name('X (°)').onChange(v => { saveUndo('rotX'); rotTarget.rotation.x = v / DEG; updateAllHelpers(); });
      rotF.add(r, 'y', -180, 180, 1).name('Y (°)').onChange(v => { saveUndo('rotY'); rotTarget.rotation.y = v / DEG; updateAllHelpers(); });
      rotF.add(r, 'z', -180, 180, 1).name('Z (°)').onChange(v => { saveUndo('rotZ'); rotTarget.rotation.z = v / DEG; updateAllHelpers(); });
    }

    // --- 几何参数编辑（按类型区分）---
    if (configNode.type !== 'Group' && mesh) {
      const geoF = folder.addFolder('📐 几何体 ' + configNode.type);
      const rebuild = () => rebuildMesh(configNode.name);

      if (configNode.type === 'Box') {
        const sz = configNode.size || [1,1,1];
        const b = { w:sz[0], h:sz[1], d:sz[2] };
        geoF.add(b, 'w', 0.01, 10.0, 0.005).name('宽 (W)').onChange(v=>{saveUndo('BoxW');configNode.size[0]=v;rebuild();});
        geoF.add(b, 'h', 0.01, 10.0, 0.005).name('高 (H)').onChange(v=>{saveUndo('BoxH');configNode.size[1]=v;rebuild();});
        geoF.add(b, 'd', 0.01, 10.0, 0.005).name('深 (D)').onChange(v=>{saveUndo('BoxD');configNode.size[2]=v;rebuild();});
      }
      else if (configNode.type === 'BentBox') {
        const sz = configNode.size || [0.3,0.08,1.2,0.4];
        const b = { w:sz[0], h:sz[1], d:sz[2], a:sz[3]!=null?sz[3]:0.4 };
        geoF.add(b, 'w', 0.01, 10.0, 0.005).name('宽 (W)').onChange(v=>{saveUndo('BBw');configNode.size[0]=v;rebuild();});
        geoF.add(b, 'h', 0.005, 5.0, 0.002).name('厚 (H)').onChange(v=>{saveUndo('BBh');configNode.size[1]=v;rebuild();});
        geoF.add(b, 'd', 0.01, 10.0, 0.005).name('弧长 (D)').onChange(v=>{saveUndo('BBd');configNode.size[2]=v;rebuild();});
        geoF.add(b, 'a', 0.05, Math.PI, 0.01).name('弯曲角 (rad)').onChange(v=>{saveUndo('BBa');configNode.size[3]=v;rebuild();});
        const sg = configNode.segments || [16];
        geoF.add({ s:sg[0] }, 's', 4, 64, 1).name('弯曲分段').onChange(v=>{saveUndo('BBseg');configNode.segments[0]=v;rebuild();});
      }
      else if (configNode.type === 'RoundedBox') {
        const sz = configNode.size || [1,1,1,0.08];
        const b = { w:sz[0], h:sz[1], d:sz[2], r:sz[3]||0.08 };
        geoF.add(b, 'w', 0.01, 10.0, 0.005).name('宽 (W)').onChange(v=>{saveUndo('RBoxW');configNode.size[0]=v;rebuild();});
        geoF.add(b, 'h', 0.01, 10.0, 0.005).name('高 (H)').onChange(v=>{saveUndo('RBoxH');configNode.size[1]=v;rebuild();});
        geoF.add(b, 'd', 0.01, 10.0, 0.005).name('深 (D)').onChange(v=>{saveUndo('RBoxD');configNode.size[2]=v;rebuild();});
        geoF.add(b, 'r', 0.01, 0.5, 0.005).name('圆角').onChange(v=>{saveUndo('RBoxR');configNode.size[3]=v;rebuild();});
        const sg = configNode.segments || [3];
        geoF.add({ s:sg[0] }, 's', 1, 6, 1).name('圆角段').onChange(v=>{saveUndo('RBoxSeg');configNode.segments[0]=v;rebuild();});
      }
      else if (configNode.type === 'TaperedBox') {
        // size: [底部宽, 高, 底部深, 顶部宽, 顶部深, 顶面X偏移, 顶面Z偏移]
        const sz = configNode.size || [0.5,0.3,0.5,0.35,0.35];
        const t = { bw:sz[0], h:sz[1], bd:sz[2], tw:sz[3]||sz[0]*0.6, td:sz[4]||sz[2]*0.6, ox:sz[5]||0, oz:sz[6]||0 };
        geoF.add(t, 'bw', 0.01, 10.0, 0.005).name('底宽').onChange(v=>{saveUndo('TBw');configNode.size[0]=v;rebuild();});
        geoF.add(t, 'h', 0.01, 10.0, 0.005).name('高度').onChange(v=>{saveUndo('TH');configNode.size[1]=v;rebuild();});
        geoF.add(t, 'bd', 0.01, 10.0, 0.005).name('底深').onChange(v=>{saveUndo('TBd');configNode.size[2]=v;rebuild();});
        geoF.add(t, 'tw', 0.01, 10.0, 0.005).name('顶宽').onChange(v=>{saveUndo('TTw');configNode.size[3]=v;rebuild();});
        geoF.add(t, 'td', 0.01, 10.0, 0.005).name('顶深').onChange(v=>{saveUndo('TTd');configNode.size[4]=v;rebuild();});
        const offF = geoF.addFolder('↗ 顶面偏移');
        offF.add(t, 'ox', -5, 5, 0.005).name('X偏移').onChange(v=>{saveUndo('TBXoff');configNode.size[5]=v;rebuild();});
        offF.add(t, 'oz', -5, 5, 0.005).name('Z偏移').onChange(v=>{saveUndo('TBZoff');configNode.size[6]=v;rebuild();});
      }
      else if (configNode.type === 'TaperedHex') {
        const sz = configNode.size || [0.5,0.3,0.5,0.35,0.35];
        const t = { bw:sz[0], h:sz[1], bd:sz[2], tw:sz[3]||sz[0]*0.6, td:sz[4]||sz[2]*0.6, ox:sz[5]||0, oz:sz[6]||0 };
        geoF.add(t, 'bw', 0.01, 10.0, 0.005).name('底宽').onChange(v=>{saveUndo('THXbw');configNode.size[0]=v;rebuild();});
        geoF.add(t, 'h', 0.01, 10.0, 0.005).name('高度').onChange(v=>{saveUndo('THXh');configNode.size[1]=v;rebuild();});
        geoF.add(t, 'bd', 0.01, 10.0, 0.005).name('底深').onChange(v=>{saveUndo('THXbd');configNode.size[2]=v;rebuild();});
        geoF.add(t, 'tw', 0.01, 10.0, 0.005).name('顶宽').onChange(v=>{saveUndo('THXtw');configNode.size[3]=v;rebuild();});
        geoF.add(t, 'td', 0.01, 10.0, 0.005).name('顶深').onChange(v=>{saveUndo('THXtd');configNode.size[4]=v;rebuild();});
        const offF = geoF.addFolder('↗ 顶面偏移');
        offF.add(t, 'ox', -5, 5, 0.005).name('X偏移').onChange(v=>{saveUndo('THXoff');configNode.size[5]=v;rebuild();});
        offF.add(t, 'oz', -5, 5, 0.005).name('Z偏移').onChange(v=>{saveUndo('THZoff');configNode.size[6]=v;rebuild();});
      }
      else if (configNode.type === 'Cylinder') {
        const sz = configNode.size || [0.5,1,0.5];
        const c = { rT:sz[0], h:sz[1], rB:sz[2] };
        geoF.add(c, 'rT', 0.005, 5.0, 0.005).name('顶半径').onChange(v=>{saveUndo('CylR');configNode.size[0]=v;rebuild();});
        geoF.add(c, 'h', 0.01, 10.0, 0.005).name('高度').onChange(v=>{saveUndo('CylH');configNode.size[1]=v;rebuild();});
        geoF.add(c, 'rB', 0.005, 5.0, 0.005).name('底半径').onChange(v=>{saveUndo('CylRB');configNode.size[2]=v;rebuild();});
        const sg = configNode.segments || [6];
        const sm = { seg:sg[0] };
        geoF.add(sm, 'seg', 3, 32, 1).name('边数').onChange(v=>{saveUndo('CylSeg');configNode.segments[0]=v;rebuild();});
      }
      else if (configNode.type === 'Sphere') {
        const sz = configNode.size || [0.5];
        const s = { r:sz[0] };
        geoF.add(s, 'r', 0.005, 5.0, 0.005).name('半径').onChange(v=>{saveUndo('SphR');configNode.size[0]=v;rebuild();});
        const sg = configNode.segments || [8,6];
        const sm = { w:sg[0], h:sg[1] };
        geoF.add(sm, 'w', 3, 32, 1).name('经线').onChange(v=>{saveUndo('SphW');configNode.segments[0]=v;rebuild();});
        geoF.add(sm, 'h', 2, 32, 1).name('纬线').onChange(v=>{saveUndo('SphH');configNode.segments[1]=v;rebuild();});
      }
      else if (configNode.type === 'Torus') {
        const sz = configNode.size || [0.5,0.05];
        const t = { R:sz[0], r:sz[1]||0.05 };
        geoF.add(t, 'R', 0.01, 5.0, 0.005).name('主半径').onChange(v=>{saveUndo('TorR');configNode.size[0]=v;rebuild();});
        geoF.add(t, 'r', 0.005, 0.5, 0.002).name('管半径').onChange(v=>{saveUndo('Torr');configNode.size[1]=v;rebuild();});
        const sg = configNode.segments || [8,12];
        const sm = { rad:sg[0], tub:sg[1] };
        geoF.add(sm, 'rad', 4, 32, 1).name('径向段').onChange(v=>{saveUndo('TorRad');configNode.segments[0]=v;rebuild();});
        geoF.add(sm, 'tub', 6, 48, 1).name('管向段').onChange(v=>{saveUndo('TorTub');configNode.segments[1]=v;rebuild();});
      }
      else if (configNode.type === 'Lathe') {
        const sg = configNode.segments || [24];
        const sm = { seg:sg[0] };
        geoF.add(sm, 'seg', 6, 64, 1).name('旋转段数').onChange(v=>{saveUndo('LHseg');configNode.segments[0]=v;rebuild();});
        // 半径缩放 & 高度缩放
        const sc = { sR: configNode.scaleR ?? 1, sH: configNode.scaleH ?? 1 };
        geoF.add(sc, 'sR', 0.1, 5.0, 0.01).name('半径缩放').onChange(v=>{saveUndo('LHsR');configNode.scaleR=v;rebuild();});
        geoF.add(sc, 'sH', 0.1, 5.0, 0.01).name('高度缩放').onChange(v=>{saveUndo('LHsH');configNode.scaleH=v;rebuild();});
        // 轮廓编辑：JSON 文本输入
        const prof = configNode.profile || [[0.5,0],[0.5,0.3],[0.6,0.4],[0.1,0.4]];
        const pStr = { txt: JSON.stringify(prof) };
        geoF.add(pStr, 'txt').name('轮廓 [x,y]').onChange(v => {
          try { saveUndo('LHprof'); const arr = JSON.parse(v); if (Array.isArray(arr)) configNode.profile = arr; rebuild(); }
          catch(e) {}
        });
      }
      else if (configNode.type === 'Extrude') {
        const d = { depth:configNode.extrudeDepth||0.5, bevel:configNode.bevelThickness||0.02 };
        geoF.add(d, 'depth', 0.01, 10.0, 0.01).name('挤出深度').onChange(v=>{saveUndo('ExtD');configNode.extrudeDepth=v;rebuild();});
        geoF.add(d, 'bevel', 0, 0.1, 0.002).name('倒角').onChange(v=>{saveUndo('ExtB');configNode.bevelThickness=v;rebuild();});
        // 形状编辑
        const shp = configNode.shape || [[-0.5,-0.2],[0.5,-0.2],[0.5,0.2],[-0.5,0.2]];
        const sStr = { txt: JSON.stringify(shp) };
        geoF.add(sStr, 'txt').name('形状 [x,y]').onChange(v => {
          try { saveUndo('ExtShp'); const arr = JSON.parse(v); if (Array.isArray(arr)) configNode.shape = arr; rebuild(); }
          catch(e) {}
        });
      }

      // --- 颜色编辑（hex color picker）---
      if (mesh.material && mesh.material.color) {
        const colF = folder.addFolder('🎨 颜色');
        const hexStr = '#' + mesh.material.color.getHexString();
        const c = { color:hexStr };
        colF.addColor(c, 'color').name('颜色').onChange(v => {
          saveUndo('color');
          mesh.material.color.set(v);
          configNode.color = v;
        });
        // 预设材料
        colF.add({ mat:configNode.materialId||'default' }, 'mat', Object.keys(MATERIAL_DEFS))
          .name('材质预设').onChange(v => {
            saveUndo('mat');
            const def = MATERIAL_DEFS[v];
            mesh.material.color.set(def.color);
            mesh.material.roughness = def.roughness;
            mesh.material.metalness = def.metalness;
            configNode.materialId = v;
            configNode.color = undefined;
          });
      }
    }

    // --- 增删改按钮 ---
    const editF = folder.addFolder('✏️ 结构编辑');
    // 重命名（自由输入 + 确认按钮，避免 onChange 导致焦点丢失）
    const rn = { name: configNode.name };
    editF.add(rn, 'name').name('名称');
    editF.add({ applyRename:()=>{
      if (rn.name && rn.name !== configNode.name) renameNode(configNode.name, rn.name);
    }}, 'applyRename').name('✅ 确认重命名');
    // 类型切换（仅非 Group）
    if (configNode.type !== 'Group') {
      const typeList = ['Box','BentBox','TaperedBox','TaperedHex','RoundedBox','Cylinder','Sphere','Torus','Lathe','Extrude'];
      editF.add({ type:configNode.type }, 'type', typeList).name('形状').onChange(v => {
        saveUndo('switchType');
        switchType(configNode.name, v);
      });
    }
    editF.add({ add:()=>addChildNode(configNode.name) }, 'add').name('➕ 添加子部件');
    if (configNode.name !== cfg.name) {
      editF.add({ del:()=>deleteNode(configNode.name) }, 'del').name('🗑 删除此部件');
    }
    editF.open();

    // --- 子节点 ---
    if (configNode.children) {
      for (const child of configNode.children) {
        addPartUI(folder, child);
      }
    }
  }

  // 递归添加
  if (cfg.children) {
    for (const child of cfg.children) {
      addPartUI(gui, child);
    }
  }
  // 默认折叠所有部件文件夹，保持面板整洁
  guiFolderMap.forEach(f => f.close());
}

// ============================================================
// 11. 构建并初始化（自动加载上次保存）
// ============================================================
(function autoLoad() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    currentModelType = data.modelType || 'hexapod';
    if (!MODEL_CONFIGS[currentModelType]) { console.warn('⚠️ 自动加载: 不支持的类型 ' + data.modelType + '，已清除旧数据'); localStorage.removeItem(SAVE_KEY); currentModelType = 'hexapod'; return; }
    const cfg = MODEL_CONFIGS[currentModelType];
    Object.keys(cfg).forEach(k => delete cfg[k]);
    Object.assign(cfg, data.config);
    console.log('📂 自动加载上次保存 (' + new Date(data.timestamp).toLocaleString() + ')');
  } catch(e) {}
})();
rebuildModel();
// 激活点击选择
setupRaycaster();

// --- 自动快照已集成到每个 onChange 回调中（saveUndo）---

// ============================================================
// 12. 辅助框切换
// ============================================================
document.getElementById('toggle-helpers').addEventListener('click', () => {
  showHelpersGlobal = !showHelpersGlobal;
  const helpers = modelRoot.userData.helpers || [];
  for (const h of helpers) {
    const info = nodeMap.get(h.userData._mesh?.parent?.name || h.userData._mesh?.name?.replace('_mesh',''));
    h.visible = showHelpersGlobal && (info ? info.group.visible : true);
  }
  document.getElementById('toggle-helpers').textContent =
    showHelpersGlobal ? '🔲 隐藏对齐辅助框' : '🔲 显示对齐辅助框';
});

// ============================================================
// 13. 窗口缩放
// ============================================================
window.addEventListener('resize', () => {
  const w = viewWidth(), h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const aspect = w / h;
  orthoCamera.left = -ORTHO_FRUSTUM * aspect;
  orthoCamera.right = ORTHO_FRUSTUM * aspect;
  orthoCamera.top = ORTHO_FRUSTUM;
  orthoCamera.bottom = -ORTHO_FRUSTUM;
  orthoCamera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ============================================================
// 14. 键盘快捷键
// ============================================================
window.addEventListener('keydown', e => {
  // 正在输入框中打字时，跳过快捷键拦截
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === 'h' && !e.ctrlKey && !e.metaKey) {
    document.getElementById('toggle-helpers').click();
  }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
    e.preventDefault();
    flushUndo(); // 强制入栈当前待定快照
    if (undoStack.length === 0) { console.log('⚠️ 没有可撤销的操作'); return; }
    autoSnapshot = false;
    const prev = undoStack.pop();
    const cfg = MODEL_CONFIGS[currentModelType];
    const fmCur = cfg.children?.[0]?.children?.[0];
    const fmPrev = prev.children?.[0]?.children?.[0];
    console.log('🔙 撤销: 当前 size=' + JSON.stringify(fmCur?.size) + ' → 快照 size=' + JSON.stringify(fmPrev?.size));
    deepRestore(cfg, prev);
    console.log('🔙 恢复后 size=' + JSON.stringify(cfg.children?.[0]?.children?.[0]?.size));
    rebuildModel();
    autoSnapshot = true;
    console.log('↩ 撤销成功 (剩余 ' + undoStack.length + ' 步可撤销)');
  }
  if (e.key === 's' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
    e.preventDefault();
    const cfg = MODEL_CONFIGS[currentModelType];
    const saveData = { modelType:currentModelType, config:JSON.parse(JSON.stringify(cfg)), timestamp:Date.now() };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    console.log('💾 已保存 (' + new Date(saveData.timestamp).toLocaleString() + ')');
  }
  // Delete — 隐藏选中部件
  if (e.key === 'Delete' && selectedParts.size > 0) {
    e.preventDefault();
    flushUndo(); saveUndo('keyDel'); // 操作前保存快照
    for (const name of selectedParts) {
      const info = nodeMap.get(name);
      if (info && info.group) {
        info.group.visible = false;
        const cfg = info.configNode;
        if (cfg) cfg.visible = false;
      }
    }
    const count = selectedParts.size;
    deselectAll();
    updateAllHelpers();
    updateTriCount();
    console.log('🗑 已隐藏 ' + count + ' 个部件');
  }
  // Escape — 取消所有选中
  if (e.key === 'Escape') {
    deselectAll();
  }
});

// ============================================================
// 15. 导出全局
// ============================================================
window.MODEL_CONFIGS = MODEL_CONFIGS;
window.currentModelType = currentModelType;
window.rebuildModel = rebuildModel;
window.nodeMap = nodeMap;
window.modelRoot = modelRoot;
window._scene = scene;

// ============================================================
// 15.5 视图切换系统
// ============================================================
const VIEW_PRESETS = {
  persp:  { pos:[5.0, 3.5, 6.0], target:[0, 0.8, -0.5] },
  front:  { pos:[0, 0.8, 4.0],  target:[0, 0.8, 0] },
  back:   { pos:[0, 0.8, -4.0], target:[0, 0.8, 0] },
  left:   { pos:[-4.0, 0.8, 0], target:[0, 0.8, 0] },
  right:  { pos:[4.0, 0.8, 0],  target:[0, 0.8, 0] },
  top:    { pos:[0, 4.0, 0.01], target:[0, 0.8, 0] },
  bottom: { pos:[0, -3.0, 0.01], target:[0, 0.8, 0] },
};
let currentView = 'persp';
let viewAnim = null; // { startPos, endPos, startTarget, endTarget, startTime, duration }

function switchView(viewName) {
  // 正交切换按钮特殊处理
  if (viewName === 'ortho') {
    useOrtho = !useOrtho;
    const src = activeCamera();
    // 同步位置
    if (useOrtho) {
      orthoCamera.position.copy(camera.position);
      orthoCamera.quaternion.copy(camera.quaternion);
      orthoCamera.zoom = 1;
      orthoCamera.updateProjectionMatrix();
    } else {
      camera.position.copy(orthoCamera.position);
      camera.quaternion.copy(orthoCamera.quaternion);
    }
    // 切换 OrbitControls 到当前摄像机
    controls.object = activeCamera();
    controls.update();
    document.getElementById('ortho-toggle').classList.toggle('active', useOrtho);
    document.getElementById('ortho-toggle').title = useOrtho ? '切换透视 (当前: 正交)' : '切换正交 (当前: 透视)';
    return;
  }
  const preset = VIEW_PRESETS[viewName];
  if (!preset) return;
  currentView = viewName;
  // 更新按钮 active 状态
  document.querySelectorAll('#view-toolbar button[data-view]:not(#ortho-toggle)').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewName);
  });
  const dur = 500; // ms
  const cam = activeCamera();
  viewAnim = {
    startPos: cam.position.clone(),
    endPos: new THREE.Vector3(...preset.pos),
    startTarget: controls.target.clone(),
    endTarget: new THREE.Vector3(...preset.target),
    startTime: performance.now(),
    duration: dur,
  };
}

// 绑定按钮事件
document.querySelectorAll('#view-toolbar button').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
// 初始高亮 - r19: 默认正交侧视图
useOrtho = true;
document.getElementById('ortho-toggle').classList.add('active');
document.getElementById('ortho-toggle').title = '切换透视 (当前: 正交)';
controls.object = orthoCamera;
switchView('right');

// 背景颜色选择器
document.getElementById('bg-color').addEventListener('input', e => {
  scene.background = new THREE.Color(e.target.value);
});

// ============================================================
// 16. 渲染循环
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.1, clock.getDelta());
  // 视图动画插值
  if (viewAnim) {
    const elapsed = performance.now() - viewAnim.startTime;
    const t = Math.min(elapsed / viewAnim.duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // easeInOutQuad
    const cam = activeCamera();
    cam.position.lerpVectors(viewAnim.startPos, viewAnim.endPos, ease);
    controls.target.lerpVectors(viewAnim.startTarget, viewAnim.endTarget, ease);
    if (t >= 1) viewAnim = null;
  }
  controls.update();
  updateAnimShowcase(dt);
  renderer.render(scene, activeCamera());
}
animate();

// 首次加载后收集动画引用

console.log('💡 可用全局变量: MODEL_CONFIGS, rebuildModel, nodeMap, modelRoot');
console.log('💡 快捷键: H=切换辅助框');
