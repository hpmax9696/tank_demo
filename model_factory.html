        const deepCopy = JSON.parse(JSON.stringify(source));
        Object.assign(target, deepCopy);
      }
      let batchGuiFolder = null; // 批量编辑面板引用
      let batchInfoObj = null; // 批量编辑计数对象引用
      let batchState = null; // 批量滑块状态(累积式偏移/旋转): {batchPos,_prevBatch,batchRot,_prevRot,ctrls}

      // --- 自动快照（参数变化前保存）---
      let autoSnapshot = true;

      // --- 动画展台（按模型类型分发）---
      let animShowcase = false;
      let animPhase = 0;
      let animStartTime = 0;
      let animStatusEl = null;
      let animRefs = (window._animRefs = {});
      let trackOffsetL = 0,
        trackOffsetR = 0;

      // ── 获取当前模型的动画定义 ──
      function getModelAnims() {
        const map = {
          tank_v16: {
            names: _tankAnimNames,
            durations: _tankAnimDurations,
            collectRefs: _tankCollectRefs,
            updateFrame: _tankUpdateFrame,
            resetState: _tankResetState,
            destroyPivots: _tankDestroyPivots,
            restorePlates: _tankRestorePlates,
          },

          tiger_v16: {
            names: _tankAnimNames,
            durations: _tankAnimDurations,
            collectRefs: _tankCollectRefs,
            updateFrame: _tankUpdateFrame,
            resetState: _tankResetState,
            destroyPivots: _tankDestroyPivots,
            restorePlates: _tankRestorePlates,
          },

          hexapod: window.HexapodAnims || null,
          humanoid: window.HumanoidAnims || null,

          building: null,
          enemy: null,
        };
        return map[currentModelType] || null;
      }

      // ── 更新按钮状态 ──
      function updateAnimButton() {
        const btn = document.getElementById('toggle-anim');
        if (btn) {
          const hasAnims = getModelAnims() !== null;
          btn.disabled = !hasAnims;
          if (!hasAnims) {
            if (animShowcase) {
              animShowcase = false;
              btn.classList.remove('active');
              btn.textContent = '\u{1f3ac} 动画展台';
              animPhase = 0;
              _doResetState();
              trackOffsetL = 0;
              trackOffsetR = 0;
              _doDestroyPivots();
              const st = document.getElementById('anim-status');
              if (st) st.style.display = 'none';
            }
            btn.title = '当前模型暂无动画';
          } else {
            btn.title = '';
          }
        }
        // IK测试+转弯验证+射击校准按钮：仅六足战车可用
        ['toggle-iktest', 'toggle-turntest', 'toggle-weaponcal'].forEach(function (id) {
          var b = document.getElementById(id);
          if (b) b.disabled = currentModelType !== 'hexapod';
        });
        if (currentModelType !== 'hexapod') {
          if (window.toggleHexIKTest && window._hexIKActive && window._hexIKActive())
            window.toggleHexIKTest();
          if (window.toggleHexTurnTest && window._hexTurnActive && window._hexTurnActive())
            window.toggleHexTurnTest();
          if (window.toggleWeaponCalibrate) window.toggleWeaponCalibrate();
          // 隐藏六足专用面板（防止toggle函数因modelType守卫未执行清理）
          var wcp = document.getElementById('weaponcal-panel');
          if (wcp) wcp.style.display = 'none';
          var al = document.getElementById('anim-list');
          if (al) {
            al.innerHTML = '';
            al.style.display = 'none';
          }
          var ast = document.getElementById('anim-status');
          if (ast) ast.style.display = 'none';
        }
      }

      // ── 坦克 profile（v0.65.13）：T-34/虎式 共用 _tank* 框架，按模型差异化命名/参数 ──
      const _TANK_PROFILE = {
        tank_v16: {
          trackL: '左履带链',
          trackR: '右履带链',
          mgPillar: 'MG枪座支柱',
          mgParts: ['MG枪身', 'MG枪管', 'MG枪口制退器', 'MG弹链箱', 'MG准星座'],
          gunUpDeg: 25,
          gunDownDeg: -10, // T-34 保留原值
          mgYawTurns: 1.5, // 水平旋转圈数
          mgPitchUpDeg: 20,
          mgPitchDownDeg: -20, // 双向摆动 ±20°（T-34 原状）
        },
        tiger_v16: {
          trackL: '左履带',
          trackR: '右履带',
          mgPillar: 'MG枢轴支柱',
          mgParts: [
            'MG机匣',
            'MG散热套管',
            'MG枪管尖',
            'MG左弹鼓',
            'MG右弹鼓',
            'MG握把',
            'MG环形瞄具',
            'MG枪托',
          ],
          gunUpDeg: 15,
          gunDownDeg: -8, // 真实虎式 88mm KwK 36 L/56
          mgYawTurns: 1.0, // 水平 360° 一圈
          mgPitchUpDeg: 80,
          mgPitchDownDeg: -5, // 防空扫射，能朝天
        },
      };
      const _tankProfile = function () {
        return _TANK_PROFILE[currentModelType] || _TANK_PROFILE.tank_v16;
      };

      // ── 坦克动画 ──
      const _tankAnimNames = [
        '1/5 炮塔旋转 360°',
        '2/5 炮管俯仰',
        '3/5 高射机枪 旋转+俯仰',
        '4/5 前进（履带+轮子）',
        '5/5 后退（履带+轮子）',
      ];
      const _tankAnimDurations = [4000, 3000, 4000, 4000, 4000];

      function _tankCollectRefs() {
        animRefs = {};
        const prof = _tankProfile();

        const turretInfo = nodeMap.get('炮塔总成');
        const ringInfo = nodeMap.get('炮塔座圈');
        if (turretInfo && ringInfo) {
          let pivot = turretInfo.group.userData.animTurretPivot;
          if (!pivot) {
            pivot = new THREE.Group();
            pivot.name = 'animTurretPivot';
            const parent = turretInfo.group.parent;
            const ringWorld = new THREE.Vector3();
            ringInfo.group.getWorldPosition(ringWorld);
            const turretWorld = new THREE.Vector3();
            turretInfo.group.getWorldPosition(turretWorld);
            const ringLocal = parent.worldToLocal(ringWorld.clone());
            const turretLocal = parent.worldToLocal(turretWorld.clone());
            parent.remove(turretInfo.group);
            pivot.position.copy(ringLocal);
            parent.add(pivot);
            turretInfo.group.position.copy(turretLocal).sub(ringLocal);
            pivot.add(turretInfo.group);
            turretInfo.group.userData.animTurretPivot = pivot;
          }
          animRefs.turretPivot = pivot;
        }

        const barrelInfo = nodeMap.get('炮管总成');
        const mantletInfo = nodeMap.get('炮盾');
        if (barrelInfo && mantletInfo) {
          let pivot = barrelInfo.group.userData.animBarrelPivot;
          if (!pivot) {
            pivot = new THREE.Group();
            pivot.name = 'animBarrelPivot';
            const parent = barrelInfo.group.parent;
            const mantletWorld = new THREE.Vector3();
            mantletInfo.group.getWorldPosition(mantletWorld);
            const barrelWorld = new THREE.Vector3();
            barrelInfo.group.getWorldPosition(barrelWorld);
            const mantletLocal = parent.worldToLocal(mantletWorld.clone());
            const barrelLocal = parent.worldToLocal(barrelWorld.clone());
            // 炮管俯仰轴心 = 炮盾与炮塔前板的接触面中心（虎式:炮塔前板前端面; T-34无"炮塔前板"→炮盾中心,零回归）
            const frontInfo = nodeMap.get('炮塔前板');
            let pivotLocal = mantletLocal;
            if (frontInfo && frontInfo.group && frontInfo.configNode) {
              const fWorld = new THREE.Vector3();
              frontInfo.group.getWorldPosition(fWorld);
              const fLocal = parent.worldToLocal(fWorld.clone());
              const fThick = (frontInfo.configNode.size || [0, 0, 0.06])[2] || 0.06;
              pivotLocal = new THREE.Vector3(fLocal.x, fLocal.y, fLocal.z + fThick * 0.5);
            }
            parent.remove(barrelInfo.group);
            pivot.position.copy(pivotLocal);
            parent.add(pivot);
            barrelInfo.group.position.copy(barrelLocal).sub(pivotLocal);
            pivot.add(barrelInfo.group);
            barrelInfo.group.userData.animBarrelPivot = pivot;
          }
          animRefs.barrelPivot = pivot;
        }

        const mgInfo = nodeMap.get('高射机枪');
        if (mgInfo) {
          const pillarInfo = nodeMap.get(prof.mgPillar);
          if (pillarInfo) {
            const pillarH = (pillarInfo.configNode.size || [0, 0.25])[1] || 0.25;
            let pivot = mgInfo.group.userData.animMGPivot;
            if (!pivot) {
              pivot = new THREE.Group();
              pivot.name = 'animMGPivot';
              const mgGroup = mgInfo.group;
              // 以支柱顶端中心为轴心：虎式支柱偏离 mgGroup 原点(0.68,_,-0.81)，必须用完整坐标；
              // T-34 支柱在原点，pPos.x/z=0，与旧 set(0,pivotY,0) 完全等价（零回归）
              const pPos = pillarInfo.group.position;
              pivot.position.set(pPos.x, pPos.y + pillarH * 0.5, pPos.z);
              mgGroup.add(pivot);
              for (const name of prof.mgParts) {
                const info = nodeMap.get(name);
                if (info && info.group && info.group.parent === mgGroup) {
                  mgGroup.remove(info.group);
                  info.group.position.x -= pivot.position.x;
                  info.group.position.y -= pivot.position.y;
                  info.group.position.z -= pivot.position.z;
                  pivot.add(info.group);
                }
              }
              mgGroup.userData.animMGPivot = pivot;
            }
            animRefs.mgPivot = pivot;
          }
        }

        animRefs.leftWheelPairs = [];
        animRefs.rightWheelPairs = [];
        for (let i = 1; i <= 5; i++) {
          const lw = nodeMap.get('左负重轮' + i);
          const rw = nodeMap.get('右负重轮' + i);
          if (lw) animRefs.leftWheelPairs.push(lw);
          if (rw) animRefs.rightWheelPairs.push(rw);
        }
        const lDrive = nodeMap.get('左主动轮');
        const rDrive = nodeMap.get('右主动轮');
        const lIdler = nodeMap.get('左诱导轮');
        const rIdler = nodeMap.get('右诱导轮');
        if (lDrive) animRefs.leftWheelPairs.push(lDrive);
        if (rDrive) animRefs.rightWheelPairs.push(rDrive);
        if (lIdler) animRefs.leftWheelPairs.push(lIdler);
        if (rIdler) animRefs.rightWheelPairs.push(rIdler);

        for (const w of animRefs.leftWheelPairs) {
          if (w._initRotX == null) w._initRotX = w.mesh.rotation.x;
          if (w._initRotY == null) w._initRotY = w.mesh.rotation.y;
          if (w._initRotZ == null) w._initRotZ = w.mesh.rotation.z;
        }
        for (const w of animRefs.rightWheelPairs) {
          if (w._initRotX == null) w._initRotX = w.mesh.rotation.x;
          if (w._initRotY == null) w._initRotY = w.mesh.rotation.y;
          if (w._initRotZ == null) w._initRotZ = w.mesh.rotation.z;
        }

        const leftTrackInfo = nodeMap.get(prof.trackL);
        const rightTrackInfo = nodeMap.get(prof.trackR);
        if (leftTrackInfo && leftTrackInfo.configNode && leftTrackInfo.configNode.trackParams) {
          animRefs.leftTrackGroup = leftTrackInfo.group;
          animRefs.leftTrackParams = leftTrackInfo.configNode.trackParams;
          animRefs.leftTrackPlates = leftTrackInfo.group.children.filter((c) => c.isMesh);
          const tp = animRefs.leftTrackParams;
          const spacing = computeTrackTotalLen(tp) / (tp.count - 1);
          animRefs.leftTrackSpacing = spacing;
          animRefs.leftTrackTotalLen = computeTrackTotalLen(tp);
        }
        if (rightTrackInfo && rightTrackInfo.configNode && rightTrackInfo.configNode.trackParams) {
          animRefs.rightTrackGroup = rightTrackInfo.group;
          animRefs.rightTrackParams = rightTrackInfo.configNode.trackParams;
          animRefs.rightTrackPlates = rightTrackInfo.group.children.filter((c) => c.isMesh);
          const tp = animRefs.rightTrackParams;
          const spacing = computeTrackTotalLen(tp) / (tp.count - 1);
          animRefs.rightTrackSpacing = spacing;
          animRefs.rightTrackTotalLen = computeTrackTotalLen(tp);
        }
      }

      function _tankUpdateFrame(dt, t, elapsed, duration) {
        const prof = _tankProfile();
        switch (animPhase) {
          case 1: {
            if (animRefs.turretPivot) animRefs.turretPivot.rotation.y = t * Math.PI * 2;
            break;
          }
          case 2: {
            if (animRefs.barrelPivot) {
              const maxUp = (prof.gunUpDeg * Math.PI) / 180;
              const maxDown = (prof.gunDownDeg * Math.PI) / 180;
              const pitch =
                maxDown +
                (maxUp - maxDown) * ((Math.sin(t * Math.PI * 2.5 - Math.PI / 2) + 1) * 0.5);
              animRefs.barrelPivot.rotation.x = -pitch;
            }
            break;
          }
          case 3: {
            if (animRefs.mgPivot) {
              // 水平 360° 自由旋转 + 俯仰扫射（虎式防空 -5~80°；T-34 ±20° 摆动）
              animRefs.mgPivot.rotation.y = t * Math.PI * 2 * prof.mgYawTurns;
              const pitchDeg =
                prof.mgPitchDownDeg +
                (prof.mgPitchUpDeg - prof.mgPitchDownDeg) *
                  ((Math.sin(t * Math.PI * 3 - Math.PI / 2) + 1) * 0.5);
              animRefs.mgPivot.rotation.x = (-pitchDeg * Math.PI) / 180;
            }
            break;
          }
          case 4: {
            const wheelSpeed = dt * 8;
            for (const w of animRefs.leftWheelPairs || []) {
              if (w.mesh) w.mesh.rotateY(-wheelSpeed);
            }
            for (const w of animRefs.rightWheelPairs || []) {
              if (w.mesh) w.mesh.rotateY(-wheelSpeed);
            }
            trackOffsetL += dt * 2.0;
            trackOffsetR += dt * 2.0;
            updateTrackPlates(animRefs, trackOffsetL, trackOffsetR);
            break;
          }
          case 5: {
            const wheelSpeed = dt * 8;
            for (const w of animRefs.leftWheelPairs || []) {
              if (w.mesh) w.mesh.rotateY(wheelSpeed);
            }
            for (const w of animRefs.rightWheelPairs || []) {
              if (w.mesh) w.mesh.rotateY(wheelSpeed);
            }
            trackOffsetL -= dt * 2.0;
            trackOffsetR -= dt * 2.0;
            updateTrackPlates(animRefs, trackOffsetL, trackOffsetR);
            break;
          }
        }
      }

      function _tankResetState() {
        if (animRefs.turretPivot) animRefs.turretPivot.rotation.y = 0;
        if (animRefs.barrelPivot) animRefs.barrelPivot.rotation.x = 0;
        if (animRefs.mgPivot) {
          animRefs.mgPivot.rotation.y = 0;
          animRefs.mgPivot.rotation.x = 0;
        }
        for (const w of animRefs.leftWheelPairs || []) {
          if (w.mesh) w.mesh.rotation.set(w._initRotX || 0, w._initRotY || 0, w._initRotZ || 0);
        }
        for (const w of animRefs.rightWheelPairs || []) {
          if (w.mesh) w.mesh.rotation.set(w._initRotX || 0, w._initRotY || 0, w._initRotZ || 0);
        }
      }

      function _tankDestroyPivots() {
        function restoreChildren(pivot, parent) {
          if (!pivot || !pivot.parent) return;
          while (pivot.children.length > 0) {
            const child = pivot.children[0];
            const worldPos = new THREE.Vector3();
            child.getWorldPosition(worldPos);
            pivot.remove(child);
            const localPos = parent.worldToLocal(worldPos);
            child.position.copy(localPos);
            parent.add(child);
          }
          pivot.parent.remove(pivot);
        }
        const turretInfo = nodeMap.get('炮塔总成');
        if (turretInfo && turretInfo.group.userData.animTurretPivot) {
          restoreChildren(
            turretInfo.group.userData.animTurretPivot,
            turretInfo.group.userData.animTurretPivot.parent
          );
          turretInfo.group.userData.animTurretPivot = null;
        }
        const barrelInfo = nodeMap.get('炮管总成');
        if (barrelInfo && barrelInfo.group.userData.animBarrelPivot) {
          restoreChildren(
            barrelInfo.group.userData.animBarrelPivot,
            barrelInfo.group.userData.animBarrelPivot.parent
          );
          barrelInfo.group.userData.animBarrelPivot = null;
        }
        const mgInfo = nodeMap.get('高射机枪');
        if (mgInfo && mgInfo.group.userData.animMGPivot) {
          restoreChildren(mgInfo.group.userData.animMGPivot, mgInfo.group);
          mgInfo.group.userData.animMGPivot = null;
        }
        animRefs = {};
      }

      function _tankRestorePlates() {
        if (animRefs.leftTrackPlates && animRefs.leftTrackParams) {
          const tp = animRefs.leftTrackParams;
          const spacing = animRefs.leftTrackSpacing;
          for (let i = 0; i < animRefs.leftTrackPlates.length; i++) {
            const dist = i * spacing;
            const trans = getTrackPlateTransform(dist, tp);
            animRefs.leftTrackPlates[i].position.set(trans.pos.x, trans.pos.y, trans.pos.z);
            animRefs.leftTrackPlates[i].rotation.set(trans.rot.x, trans.rot.y, trans.rot.z);
          }
        }
        if (animRefs.rightTrackPlates && animRefs.rightTrackParams) {
          const tp = animRefs.rightTrackParams;
          const spacing = animRefs.rightTrackSpacing;
          for (let i = 0; i < animRefs.rightTrackPlates.length; i++) {
            const dist = i * spacing;
            const trans = getTrackPlateTransform(dist, tp);
            animRefs.rightTrackPlates[i].position.set(trans.pos.x, trans.pos.y, trans.pos.z);
            animRefs.rightTrackPlates[i].rotation.set(trans.rot.x, trans.rot.y, trans.rot.z);
          }
        }
      }

      // ── 调度 ──
      function _doResetState() {
        const ma = getModelAnims();
        if (ma && ma.resetState) ma.resetState();
        else {
          animRefs = window._animRefs = {};
        }
      }
      function _doDestroyPivots() {
        const ma = getModelAnims();
        if (ma && ma.destroyPivots) ma.destroyPivots();
        else {
          animRefs = window._animRefs = {};
        }
      }
      function _doRestorePlates() {
        const ma = getModelAnims();
        if (ma && ma.restorePlates) ma.restorePlates();
      }

      // ── 每帧更新 ──
      function updateAnimShowcase(dt) {
        if (!animShowcase || animPhase === 0) return;
        const ma = getModelAnims();
        if (!ma || !ma.updateFrame) return;
        const elapsed = performance.now() - animStartTime;
        const duration = (ma.durations || [4000])[animPhase - 1] || 4000;
        const t = Math.min(elapsed / duration, 1);
        ma.updateFrame(dt, t, elapsed, duration, animPhase - 1);
        // 校园丧尸展台每帧动态贴地：Die 躺倒/骨盆波动/动画切换后 root.position.y 都会偏，
        // 统一按当前姿态包围盒贴地（先归零测 bbox，再抬升到脚底 y=0）
        if (currentModelType === 'humanoid') {
          var _hr = modelRoot.getObjectByName('root');
          if (_hr) {
            _hr.position.y = 0;
            _hr.updateMatrixWorld(true);
            var _hb = new THREE.Box3().setFromObject(_hr);
            _hr.position.y = -_hb.min.y;
            _hr.updateMatrixWorld(true);
          }
        }
        if (t >= 1) {
          // 受击踉跄: 一次性播放, 完毕后回待机
          if (animPhase - 1 === 21) {
            jumpToAnim(0);
            return;
          }
          // 死亡: 一次性播放, 停留1.5s后回待机(便于观察)
          if (animPhase - 1 === 22 || (currentModelType === 'humanoid' && animPhase - 1 === 5)) {
            setTimeout(function () {
              jumpToAnim(0);
            }, 1500);
            return;
          }
          // 锁定当前动画循环播放（不再自动跳到下一个）
          animStartTime = performance.now();
          trackOffsetL = 0;
          trackOffsetR = 0;
          _doResetState();
        }
      }

      // 跳转到指定动画
      function jumpToAnim(index) {
        const ma = getModelAnims();
        if (!ma || !ma.names || index < 0 || index >= ma.names.length) return;
        animPhase = index + 1;
        animStartTime = performance.now();
        trackOffsetL = 0;
        trackOffsetR = 0;
        _doResetState();
        if (animStatusEl && ma.names) animStatusEl.textContent = ma.names[index] || '';
        _updateAnimListHighlight();
      }

      function _updateAnimListHighlight() {
        var list = document.getElementById('anim-list');
        if (!list) return;
        var items = list.querySelectorAll('.anim-item');
        for (var i = 0; i < items.length; i++) {
          items[i].classList.toggle('active', i === animPhase - 1);
        }
      }

      function _buildAnimList() {
        var list = document.getElementById('anim-list');
        if (!list) return;
        list.innerHTML = '';
        var ma = getModelAnims();
        if (!ma || !ma.names) return;
        // 分类标签（索引基于 _hexaAnimNames 顺序, 共21个）
        var categories = (ma && ma.categories) || [
          { label: '── 待机 ──', at: 0 },
          { label: '── 行进 (前进/后退) ──', at: 1 },
          { label: '── 平移 (步行) ──', at: 5 },
          { label: '── 转弯 (原地) ──', at: 7 },
          { label: '── 转弯 (移动) ──', at: 9 },
          { label: '── 平移 (奔跑) ──', at: 19 },
          { label: '── 受击 ──', at: 21 },
          { label: '── 死亡 ──', at: 22 },
        ];
        var catIdx = 0;
        for (var i = 0; i < ma.names.length; i++) {
          // 在分类点插入分隔符
          while (catIdx < categories.length && categories[catIdx].at === i) {
            var sep = document.createElement('div');
            sep.className = 'anim-separator';
            sep.textContent = categories[catIdx].label;
            list.appendChild(sep);
            catIdx++;
          }
          var item = document.createElement('div');
          item.className = 'anim-item';
          item.textContent = i + 1 + ' ' + ma.names[i].split(' ').slice(1).join(' ');
          item.onclick = (function (idx) {
            return function () {
              jumpToAnim(idx);
            };
          })(i);
          list.appendChild(item);
        }
        list.style.display = 'flex';
      }

      // ── 开关 ──
      function toggleAnimShowcase() {
        const ma = getModelAnims();
        if (!ma) return;
        animShowcase = !animShowcase;
        const btn = document.getElementById('toggle-anim');
        const statusEl = document.getElementById('anim-status');
        const listEl = document.getElementById('anim-list');
        animStatusEl = statusEl;
        if (animShowcase) {
          btn.classList.add('active');
          btn.textContent = '⏹ 停止展台';
          if (ma.collectRefs) ma.collectRefs();
          animPhase = 1;
          animStartTime = performance.now();
          trackOffsetL = 0;
          trackOffsetR = 0;
          _doResetState();
          statusEl.style.display = 'block';
          statusEl.textContent = (ma.names || [])[0] || '';
          _buildAnimList();
          _updateAnimListHighlight();
        } else {
          btn.classList.remove('active');
          btn.textContent = '\u{1f3ac} 动画展台';
          animPhase = 0;
          _doResetState();
          trackOffsetL = 0;
          trackOffsetR = 0;
          _doDestroyPivots();
          _doRestorePlates();
          statusEl.style.display = 'none';
          if (listEl) {
            listEl.innerHTML = '';
            listEl.style.display = 'none';
          }
        }
      }

      // ── 事件 ──
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('toggle-anim');
        if (btn) btn.addEventListener('click', toggleAnimShowcase);
      });
      setTimeout(() => {
        const btn = document.getElementById('toggle-anim');
        if (btn) btn.addEventListener('click', toggleAnimShowcase);
      }, 0);

      function addWheelBolts() {
        const boltMat = new THREE.MeshStandardMaterial({
          color: 0x999999,
          roughness: 0.35,
          metalness: 0.8,
        });

        function addBolts(wheelInfo, count) {
          if (!wheelInfo) return;
          const mesh = wheelInfo.mesh;
          if (!mesh) return;

          const toRemove = [];
          mesh.traverse((c) => {
            if (c.userData && c.userData.isBolt) toRemove.push(c);
          });
          for (const b of toRemove) {
            b.parent.remove(b);
            if (b.geometry) b.geometry.dispose();
          }

          const size = wheelInfo.configNode.size;
          const radius = size[0] || 0.4;
          const thickness = size[1] || 0.12;
          // 按世界 X 判左右（驾驶员视角 x>0=左），不依赖 name — name 调换后螺栓方向仍正确
          const _boltWP = new THREE.Vector3();
          mesh.getWorldPosition(_boltWP);
          const isLeft = _boltWP.x > 0;
          const boltR = radius * 0.55;
          // 轮子 rotation.z=π/2，局部+Y→世界-X；isLeft(左轮 x>0)螺栓朝外侧(+X)需局部-Y，故反号
          const boltY = isLeft ? -(thickness / 2 + 0.015) : thickness / 2 + 0.015;

          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const boltGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.035, 6);
            const bolt = new THREE.Mesh(boltGeo, boltMat);
            bolt.userData = { isBolt: true };
            bolt.position.set(Math.cos(angle) * boltR, boltY, Math.sin(angle) * boltR);
            mesh.add(bolt);
          }
        }

        addBolts(nodeMap.get('左诱导轮'), 5);
        addBolts(nodeMap.get('右诱导轮'), 5);
        for (let i = 1; i <= 5; i++) {
          addBolts(nodeMap.get('左负重轮' + i), 7);
          addBolts(nodeMap.get('右负重轮' + i), 7);
        }
        addBolts(nodeMap.get('左主动轮'), 7);
        addBolts(nodeMap.get('右主动轮'), 7);
      }

      // ── 人形体型编辑状态（工厂专用）──
      var _humanoidEdit = {
        variant: 'student_m',
        params: { height: 1.3, build: 0.5, hunch: 0.2, curves: 0 },
      };
      var _humanoidMode = 'variant'; // 'skeleton' | 'variant'（Task 3 工厂骨架/变体模式切换）
      var _humanoidSkelVer = null; // 骨架模式选的版本：null=WORKING_SKELETON，或 SKELETON_VERSIONS key
      function _applyHumanoidEdit() {
        if (currentModelType !== 'humanoid' || !window.HumanoidConfig) return;
        var tree = window.HumanoidConfig.buildHumanoid(_humanoidEdit.variant, _humanoidEdit.params);
        if (tree) {
          MODEL_CONFIGS.humanoid = tree;
          // skipGUI: 滑块拖动时只重建模型几何，不销毁 GUI（避免打断拖动）
          // height 归一已统一移入 rebuildModel humanoid 分支（_params 存在时每次执行）
          rebuildModel(true);
        }
      }
      window._applyHumanoidEdit = _applyHumanoidEdit;
      window._humanoidEdit = _humanoidEdit; // 暴露编辑状态供 CDP/测试

      function rebuildModel(skipGUI) {
        _camoJungleTex = null;
        _camoDesertTex = null;
        _camoTropicalDesertTex = null;
        // 关闭动画展台
        if (animShowcase) toggleAnimShowcase();
        // 关闭六足专用功能（必须在清理旧模型之前，确保 pivot/nodeMap 引用有效）
        if (window._hexIKActive && window._hexIKActive()) window.toggleHexIKTest();
        if (window._hexTurnActive && window._hexTurnActive()) window.toggleHexTurnTest();
        if (window.toggleWeaponCalibrate) window.toggleWeaponCalibrate();

        // 清理旧模型
        if (modelRoot) {
          modelRoot.traverse((c) => {
            if (c.geometry && c !== modelRoot) c.geometry.dispose();
          });
          scene.remove(modelRoot);
        }
        // 清理选择
        deselectAll();
        nodeMap.clear();
        guiFolderMap.clear();
        modelRoot = new THREE.Group();
        window.modelRoot = modelRoot; // P4: 每次 rebuild 保持 fresh（humanoid_factory.collectRefs 依赖）

        MODEL_CONFIGS[currentModelType] = JSON.parse(
          JSON.stringify(MODEL_CONFIGS[currentModelType])
        );
        // 校园丧尸：按编辑模式加载配置树
        //   skeleton → 深拷贝 WORKING_SKELETON（骨架白模，无 _params，跳过 height 归一仅贴地）
        //   variant  → 深拷贝 MODELS[当前变体].tree（Phase 2 烘焙；不存在时兜底 buildHumanoid）
        if (currentModelType === 'humanoid' && window.HumanoidConfig) {
          if (_humanoidMode === 'skeleton') {
            var _skelSrc = _humanoidSkelVer
              ? window.HumanoidConfig.SKELETON_VERSIONS[_humanoidSkelVer].tree
              : window.HumanoidConfig.WORKING_SKELETON;
            MODEL_CONFIGS.humanoid = JSON.parse(JSON.stringify(_skelSrc));
          } else {
            var _hm = window.HumanoidConfig.MODELS[_humanoidEdit.variant];
            MODEL_CONFIGS.humanoid = _hm
              ? JSON.parse(JSON.stringify(_hm.tree))
              : window.HumanoidConfig.buildHumanoid(_humanoidEdit.variant, _humanoidEdit.params);
          }
        }
        const cfg = MODEL_CONFIGS[currentModelType];
        if (cfg) {
          buildFromConfig(cfg, modelRoot, showHelpersGlobal, nodeMap);
        }

        scene.add(modelRoot);
        modelRoot.updateMatrixWorld(true);

        // 六足战车：贴地
        if (currentModelType === 'hexapod') {
          var hexRoot = null;
          modelRoot.children.forEach(function (c) {
            if (c.name === '六足战车') hexRoot = c;
          });
          if (hexRoot) {
            hexRoot.position.y = 0;
            hexRoot.updateMatrixWorld(true);
            var hbox = new THREE.Box3().setFromObject(hexRoot);
            hexRoot.position.y = -hbox.min.y;
            hexRoot.updateMatrixWorld(true);
          }
        }
        // 校园丧尸：贴地（脚底 y=0）+ 体型 height 归一（height/1.3 单位，自 _applyHumanoidEdit 移入统一处理）
        if (currentModelType === 'humanoid') {
          var humRoot = null;
          modelRoot.children.forEach(function (c) {
            if (c.name === 'root') humRoot = c;
          });
          if (humRoot) {
            humRoot.position.y = 0;
            humRoot.updateMatrixWorld(true);
            // 身高归一 + 贴地：按头顶到脚底（排除下垂手臂指尖，防臂长致身高虚高/脚悬浮）
            var _headTop = -Infinity,
              _footBottom = Infinity;
            humRoot.traverse(function (c) {
              if (!c.isMesh) return;
              var nn = c.name || '';
              if (nn.indexOf('upper_arm') >= 0 || nn.indexOf('forearm') >= 0) return; // 排除手臂
              var bb = new THREE.Box3().setFromObject(c);
              if (!isFinite(bb.min.x)) return;
              if (bb.max.y > _headTop) _headTop = bb.max.y;
              if (bb.min.y < _footBottom) _footBottom = bb.min.y;
            });
            if (MODEL_CONFIGS.humanoid._params) {
              var curH = _headTop - _footBottom;
              var targetUnits = MODEL_CONFIGS.humanoid._params.height / 1.3;
              var hScale = curH > 0 ? targetUnits / curH : 1;
              humRoot.scale.setScalar(hScale);
              humRoot.updateMatrixWorld(true);
            }
            // scale 后按脚底重测贴地（仍排除手臂）
            _footBottom = Infinity;
            humRoot.traverse(function (c) {
              if (!c.isMesh) return;
              var nn = c.name || '';
              if (nn.indexOf('upper_arm') >= 0 || nn.indexOf('forearm') >= 0) return;
              var bb = new THREE.Box3().setFromObject(c);
              if (isFinite(bb.min.x) && bb.min.y < _footBottom) _footBottom = bb.min.y;
            });
            humRoot.position.y = -_footBottom;
            humRoot.updateMatrixWorld(true);
          }
        }
        // 六足战车始终线框；虎式仅在调试色模式显示轮廓线
        if (
          currentModelType === 'hexapod' ||
          (currentModelType === 'tiger_v16' && currentCamoType === 'debug')
        ) {
          modelRoot.traverse(function (ch) {
            if (ch.isMesh && ch.geometry && ch.parent) {
              try {
                var eg = new THREE.EdgesGeometry(ch.geometry, 15);
                var ln = new THREE.LineSegments(
                  eg,
                  new THREE.LineBasicMaterial({ color: 0x111111 })
                );
                ch.add(ln);
                ch.userData._wireLine = ln;
              } catch (e) {}
            }
          });
        }

        addWheelBolts();
        updateTriCount();
        if (!skipGUI) {
          if (gui) {
            gui.destroy();
            gui = null;
          }
          buildGUI();
          // 默认折叠所有顶层节点，保持面板整洁
          ptCollapsed.clear();
          var topCfg = MODEL_CONFIGS[currentModelType];
          if (topCfg && topCfg.children) {
            for (var ci = 0; ci < topCfg.children.length; ci++)
              ptCollapsed.add(topCfg.children[ci].name);
          }
          refreshPartTree();
          updateAnimButton();
        }
      }

      // ============================================================
      // 选择系统 v2：单选/多选(Ctrl)/框选 + 批量编辑
      // ============================================================
      function createHighlight(_name) {
        // 先清除全部旧高亮
        for (const [n, hl] of highlightLines) {
          if (hl) {
            hl.parent?.remove(hl);
          }
        }
        highlightLines.clear();
        // 遍历 selectedParts 为每个选中部件创建高亮
        const color = selectedParts.size > 1 ? 0x4ecdc4 : 0xffd700; // 多选青色，单选金色
        for (const n of selectedParts) {
          const inf = nodeMap.get(n);
          if (inf && inf.mesh && inf.mesh.geometry) {
            const geo = inf.mesh.geometry;
            // 检查几何体是否有效（避免 NaN 几何体导致 EdgesGeometry 崩溃）
            if (!geo.attributes.position || geo.attributes.position.count === 0) continue;
            const e = new THREE.EdgesGeometry(geo);
            const h = new THREE.LineSegments(
              e,
              new THREE.LineBasicMaterial({ color, linewidth: 1, depthTest: false })
            );
            inf.mesh.add(h);
            highlightLines.set(n, h);
          }
        }
      }

      function removeHighlight(name) {
        const hl = highlightLines.get(name);
        if (hl) {
          hl.parent?.remove(hl);
          highlightLines.delete(name);
        }
      }

      function expandPath(cfg, targetName, ancestors) {
        if (cfg.name === targetName) {
          ancestors.push(cfg.name);
          return true;
        }
        if (cfg.children) {
          for (const c of cfg.children) {
            if (expandPath(c, targetName, ancestors)) {
              ancestors.push(cfg.name);
              return true;
            }
          }
        }
        return false;
      }

      function buildPath(cfg, targetName, parts) {
        if (cfg.name === targetName) {
          parts.push(cfg.name);
          return true;
        }
        if (cfg.children) {
          for (const c of cfg.children) {
            if (buildPath(c, targetName, parts)) {
              parts.push(cfg.name);
              return true;
            }
          }
        }
        return false;
      }

      function updateBreadcrumb() {
        const el = document.getElementById('path-breadcrumb');
        if (selectedParts.size === 0) {
          el.innerHTML = '📍 未选中';
          return;
        }
        if (selectedParts.size === 1) {
          const paths = [];
          buildPath(MODEL_CONFIGS[currentModelType], [...selectedParts][0], paths);
          paths.reverse();
          el.innerHTML =
            '📍 ' +
            paths
              .map((p, i) => `<span>${displayLabel(p)}</span>`)
              .join('<span class="sep-arrow">→</span>');
        } else {
          el.innerHTML = `📍 已选 <span>${selectedParts.size}</span> 个部件`;
        }
      }

      function updateBatchPanel() {
        if (!batchGuiFolder) return;
        const count = selectedParts.size;
        // 更新计数显示
        if (batchInfoObj) batchInfoObj.count = count;
        if (count >= 2) {
          batchGuiFolder.open();
          // 多选时自动滚动到批量面板，免手动翻找
          try {
            const el = batchGuiFolder.domElement;
            if (el && el.scrollIntoView) {
              setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
            }
          } catch (e) {}
        } else {
          batchGuiFolder.close();
        }
      }

      // 单选模式
      function selectSingle(name) {
        removeAllHighlights();
        selectedParts.clear();
        selectedParts.add(name);
        createHighlight(name);
        // 展开选中节点到根节点的路径
        expandToNode(name);
        focusPanel(name);
        resetBatchSliders();
        updateBatchPanel();
        updateBreadcrumb();
        refreshPartTree();
      }
      function expandToNode(name) {
        function findAndExpand(cfg, target) {
          if (cfg.name === target) return true;
          if (cfg.children) {
            for (var ci = 0; ci < cfg.children.length; ci++) {
              if (findAndExpand(cfg.children[ci], target)) {
                ptCollapsed.delete(cfg.name);
                return true;
              }
            }
          }
          return false;
        }
        var topCfg = MODEL_CONFIGS[currentModelType];
        if (topCfg) findAndExpand(topCfg, name);
      }

      // 多选模式（切换）
      function toggleSelect(name) {
        if (selectedParts.has(name)) {
          removeHighlight(name);
          selectedParts.delete(name);
        } else {
          selectedParts.add(name);
        }
        createHighlight(name);
        if (selectedParts.size === 1) {
          focusPanel([...selectedParts][0]);
        }
        updateBatchPanel();
        updateBreadcrumb();
        refreshPartTree();
      }

      function removeAllHighlights() {
        for (const [n, hl] of highlightLines) {
          if (hl) hl.parent?.remove(hl);
        }
        highlightLines.clear();
      }

      function deselectAll() {
        removeAllHighlights();
        selectedParts.clear();
        resetBatchSliders();
        updateBatchPanel();
        updateBreadcrumb();
        refreshPartTree();
      }

      // 选择切换(换一批部件)时重置批量编辑的累积滑块, 避免上一批的 ΔX/ΔY/ΔZ/旋转残留到新批次
      // 注意: toggleSelect(追加/移除单个) 不调用, 保留对同一批的连续编辑
      function resetBatchSliders() {
        if (!batchState) return;
        const s = batchState;
        s.batchPos.dx = s.batchPos.dy = s.batchPos.dz = 0;
        s._prevBatch.dx = s._prevBatch.dy = s._prevBatch.dz = 0;
        s.batchRot.drx = s.batchRot.dry = s.batchRot.drz = 0;
        s._prevRot.drx = s._prevRot.dry = s._prevRot.drz = 0;
        s.ctrls.forEach((c) => c.updateDisplay());
      }

      function focusPanel(name) {
        // 1. 先关闭所有文件夹
        guiFolderMap.forEach((f) => f.close());
        // 2. 展开祖先路径
        const ancestors = [];
        expandPath(MODEL_CONFIGS[currentModelType], name, ancestors);
        for (const a of ancestors) {
          const f = guiFolderMap.get(a);
          if (f) f.open();
        }
        // 3. 只展开选中节点本身（不展开子孙）
        const targetFolder = guiFolderMap.get(name);
        if (targetFolder) targetFolder.open();
        // 4. 滚动到选中位置
        if (targetFolder) {
          try {
            const el = targetFolder.domElement || targetFolder._title;
            if (el && el.scrollIntoView) {
              setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
            }
          } catch (e) {}
        }
      }

      // 获取mesh的屏幕空间包围盒
      function getScreenBBox(mesh) {
        if (!mesh.geometry) return null;
        mesh.geometry.computeBoundingBox();
        const box = mesh.geometry.boundingBox.clone();
        const mat = mesh.matrixWorld.clone();
        const corners = [
          new THREE.Vector3(box.min.x, box.min.y, box.min.z),
          new THREE.Vector3(box.min.x, box.min.y, box.max.z),
          new THREE.Vector3(box.min.x, box.max.y, box.min.z),
          new THREE.Vector3(box.min.x, box.max.y, box.max.z),
          new THREE.Vector3(box.max.x, box.min.y, box.min.z),
          new THREE.Vector3(box.max.x, box.min.y, box.max.z),
          new THREE.Vector3(box.max.x, box.max.y, box.min.z),
          new THREE.Vector3(box.max.x, box.max.y, box.max.z),
        ];
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const c of corners) {
          const w = c.applyMatrix4(mat).project(activeCamera());
          const sx = (w.x * 0.5 + 0.5) * viewWidth();
          const sy = (-w.y * 0.5 + 0.5) * window.innerHeight;
          if (sx < minX) minX = sx;
          if (sy < minY) minY = sy;
          if (sx > maxX) maxX = sx;
          if (sy > maxY) maxY = sy;
        }
        if (!isFinite(minX)) return null;
        return { minX, minY, maxX, maxY };
      }

      // 框选检测：屏幕矩形与部件屏幕包围盒是否重叠
      function rectsOverlap(a, b) {
        return !(a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY);
      }

      function boxSelect(sx, sy, ex, ey, additive) {
        const selRect = {
          minX: Math.min(sx, ex),
          minY: Math.min(sy, ey),
          maxX: Math.max(sx, ex),
          maxY: Math.max(sy, ey),
        };
        const names = [];
        nodeMap.forEach((info, name) => {
          if (!info.mesh || !info.group.visible) return;
          const bbox = getScreenBBox(info.mesh);
          if (bbox && rectsOverlap(selRect, bbox)) names.push(name);
        });
        removeAllHighlights();
        if (!additive) {
          // 替换模式: 清空旧选择 + 重置累积滑块(增选模式保留连续编辑)
          selectedParts.clear();
          resetBatchSliders();
        }
        for (const n of names) {
          selectedParts.add(n);
        }
        createHighlight('');
        updateBatchPanel();
        console.log(
          '📦 框选 ' +
            names.length +
            ' 个部件' +
            (additive ? ' (增选, 共 ' + selectedParts.size + ' 个)' : '')
        );
      }

      // 点击选择
      function onClickSelect(e) {
        if (!modelRoot) return;
        const mouse = new THREE.Vector2();
        mouse.x = (e.clientX / viewWidth()) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, activeCamera());
        const targets = [];
        nodeMap.forEach((info, name) => {
          if (info.mesh && info.group.visible) targets.push(info.mesh);
        });
        const hits = raycaster.intersectObjects(targets, false);
        if (hits.length > 0) {
          const name = hits[0].object.name.replace('_mesh', '');
          if (e.ctrlKey || e.metaKey) {
            // Ctrl+点击：切换多选
            toggleSelect(name);
          } else {
            // 普通点击：单选
            selectSingle(name);
          }
        } else {
          // 点击空白取消全部
          deselectAll();
        }
      }

      // 点击选择 + Ctrl+左键框选 / Shift+Ctrl+左键增选（不拦截普通拖拽，OrbitControls 正常旋转场景）
      function setupRaycaster() {
        const canvas = renderer.domElement;
        let boxEl = null; // 选择框 div
        let boxStart = null; // 框选起点 {x,y}
        let boxActive = false; // 已进入框选(拖拽超过阈值)
        let maybeBox = false; // Ctrl+左键按下, 待判定是点击还是框选
        let boxAdditive = false; // Shift+Ctrl = 增选(追加不清空)

        canvas.addEventListener('pointerdown', (e) => {
          clickStart = { x: e.clientX, y: e.clientY };
          if (e.button === 0 && (e.ctrlKey || e.metaKey)) {
            // Ctrl+左键: 可能框选, 立即暂停 OrbitControls 防止旋转
            maybeBox = true;
            boxAdditive = !!e.shiftKey; // Shift+Ctrl = 增选模式
            boxStart = { x: e.clientX, y: e.clientY };
            if (controls) controls.enabled = false;
          }
        });

        canvas.addEventListener('pointermove', (e) => {
          // 超过 4px 阈值: 从"可能的点击"转为框选, 创建选择框 div
          if (maybeBox && !boxActive && boxStart) {
            const dx = e.clientX - boxStart.x;
            const dy = e.clientY - boxStart.y;
            if (dx * dx + dy * dy > 16) {
              boxActive = true;
              boxEl = document.createElement('div');
              boxEl.id = '_boxselect_rect';
              // 增选=橙色, 普通框选=青色
              const col = boxAdditive ? '#ffa94d' : '#4ecdc4';
              boxEl.style.cssText =
                'position:fixed;border:1px solid ' +
                col +
                ';background:' +
                col +
                '22;pointer-events:none;z-index:9999;' +
                'font-size:11px;color:' +
                col +
                ';padding:1px 4px;';
              boxEl.textContent = boxAdditive ? '增选 (Shift+Ctrl)' : '框选 (Ctrl)';
              document.body.appendChild(boxEl);
            }
          }
          if (boxActive && boxEl) {
            boxEl.style.left = Math.min(boxStart.x, e.clientX) + 'px';
            boxEl.style.top = Math.min(boxStart.y, e.clientY) + 'px';
            boxEl.style.width = Math.abs(e.clientX - boxStart.x) + 'px';
            boxEl.style.height = Math.abs(e.clientY - boxStart.y) + 'px';
          }
        });

        const cleanupBox = () => {
          if (boxEl) {
            boxEl.remove();
            boxEl = null;
          }
          if (controls) controls.enabled = true;
          boxActive = false;
          maybeBox = false;
          boxAdditive = false;
          boxStart = null;
        };

        canvas.addEventListener('pointerup', (e) => {
          if (boxActive) {
            // 框选完成: 用起止点调用 boxSelect
            const sx = boxStart.x,
              sy = boxStart.y,
              ex = e.clientX,
              ey = e.clientY,
              additive = boxAdditive;
            cleanupBox();
            boxSelect(sx, sy, ex, ey, additive);
            return;
          }
          cleanupBox();
          // 这是点击而非拖拽(普通点击单选 / Ctrl+点击切换多选)
          const dx = e.clientX - clickStart.x;
          const dy = e.clientY - clickStart.y;
          if (Math.sqrt(dx * dx + dy * dy) < 4) onClickSelect(e);
        });

        // 框选中鼠标移出 canvas: 取消(避免挂起 controls.enabled=false)
        canvas.addEventListener('pointerleave', () => {
          if (boxActive || maybeBox) cleanupBox();
        });
      }

      let showHelpersGlobal = false;

      function updateTriCount() {
        document.getElementById('triCount').textContent = countTriangles(modelRoot);
      }

      function updateAllHelpers() {
        const helpers = modelRoot.userData.helpers || [];
        for (const h of helpers) {
          const m = h.userData._mesh;
          if (m && m.geometry && m.geometry.attributes.position) {
            const pos = m.geometry.attributes.position;
            // 跳过NaN几何体，避免BoxHelper.update崩溃
            let hasNaN = false;
            for (let i = 0; i < Math.min(pos.count, 3); i++) {
              if (!isFinite(pos.getX(i))) {
                hasNaN = true;
                break;
              }
            }
            if (!hasNaN) {
              try {
                h.update();
              } catch (e) {}
            }
          }
          h.visible = showHelpersGlobal;
        }
      }

      // ============================================================
      // 9. 重建单个 mesh（几何参数变化时）
      // ============================================================
      function rebuildMesh(nodeName) {
        const info = nodeMap.get(nodeName);
        if (!info || !info.configNode) return;
        const { mesh, configNode } = info;
        if (!mesh || mesh.type === 'Group') return;

        // 重建几何体
        mesh.geometry.dispose();
        const geo = createGeometry(configNode);
        geo.computeBoundingBox();
        const bbox = geo.boundingBox;
        if (bbox && isFinite(bbox.min.x) && isFinite(bbox.max.x)) {
          const cx = (bbox.min.x + bbox.max.x) / 2;
          const cy = (bbox.min.y + bbox.max.y) / 2;
          const cz = (bbox.min.z + bbox.max.z) / 2;
          geo.translate(-cx, -cy, -cz);
        }
        mesh.geometry = geo;

        // 更新部件轮廓线框（六足+虎式）
        if (mesh.userData._wireLine) {
          mesh.userData._wireLine.geometry.dispose();
          mesh.remove(mesh.userData._wireLine);
          mesh.userData._wireLine = null;
        }
        if (
          currentModelType === 'hexapod' ||
          (currentModelType === 'tiger_v16' && currentCamoType === 'debug')
        ) {
          try {
            var _eg = new THREE.EdgesGeometry(geo, 15);
            var _ln = new THREE.LineSegments(_eg, new THREE.LineBasicMaterial({ color: 0x111111 }));
            mesh.add(_ln);
            mesh.userData._wireLine = _ln;
          } catch (_e) {}
        }

        // 重建材质（如果颜色参数在 configNode.color 中）
        if (!mesh.material._factoryColor) {
          // 保持原有材质引用，仅更新 color
          if (configNode.color) {
            mesh.material.color.set(configNode.color);
          }
        }

        // 更新 BoxHelper（如果有引用该 mesh 的 helper）
        const helpers = modelRoot.userData.helpers || [];
        for (const h of helpers) {
          if (h.userData._mesh === mesh) h.update();
        }
        updateTriCount();
        // 如果选中的部件几何变化，刷新高亮
        if (selectedParts.has(nodeName)) {
          removeHighlight(nodeName);
          createHighlight(nodeName);
        }
      }

      // ============================================================
      // 9.5 树编辑工具：查找父节点 / 添加子节点 / 删除节点
      // ============================================================
      function findParentNode(cfg, targetName) {
        if (!cfg.children) return null;
        for (const c of cfg.children) {
          if (c.name === targetName) return cfg;
          const found = findParentNode(c, targetName);
          if (found) return found;
        }
        return null;
      }

      function generateName(cfg, prefix) {
        let maxN = 0;
        function scan(node) {
          if (node.name && node.name.startsWith(prefix + '_')) {
            const n = parseInt(node.name.split('_').pop());
            if (!isNaN(n) && n > maxN) maxN = n;
          }
          if (node.children) for (const c of node.children) scan(c);
        }
        scan(cfg);
        return prefix + '_' + String(maxN + 1).padStart(2, '0');
      }

      function addChildNode(parentName) {
        flushUndo();
        saveUndo('addChild'); // 操作前保存快照
        const cfg = MODEL_CONFIGS[currentModelType];
        function findNode(n, target) {
          if (n.name === target) return n;
          if (n.children)
            for (const c of n.children) {
              const f = findNode(c, target);
              if (f) return f;
            }
          return null;
        }
        const parent = findNode(cfg, parentName);
        if (!parent) return;
        if (!parent.children) parent.children = [];
        const newNode = {
          name: generateName(cfg, 'part'),
          type: 'Box',
          size: [0.3, 0.3, 0.3],
          position: [0, 0.15, 0],
          materialId: 'default',
        };
        parent.children.push(newNode);
        rebuildModel();
        console.log('➕ 已添加子部件: ' + newNode.name + ' → ' + parentName);
      }

      function deleteNode(targetName) {
        flushUndo();
        saveUndo('deleteNode'); // 操作前保存快照
        const cfg = MODEL_CONFIGS[currentModelType];
        const parent = findParentNode(cfg, targetName);
        if (!parent || !parent.children) {
          console.log('⚠️ 无法删除根节点');
          return;
        }
        const idx = parent.children.findIndex((c) => c.name === targetName);
        if (idx === -1) return;
        parent.children.splice(idx, 1);
        rebuildModel();
        console.log('🗑 已删除部件: ' + targetName);
      }

      function renameNode(oldName, newName) {
        if (!newName || newName === oldName) return;
        flushUndo();
        saveUndo('renameNode'); // 操作前保存快照
        const cfg = MODEL_CONFIGS[currentModelType];
        function findNode(n, target) {
          if (n.name === target) return n;
          if (n.children)
            for (const c of n.children) {
              const f = findNode(c, target);
              if (f) return f;
            }
          return null;
        }
        const node = findNode(cfg, oldName);
        if (!node) return;
        node.name = newName;
        deselectAll();
        rebuildModel();
        console.log('✏️ 已重命名: ' + oldName + ' → ' + newName);
      }

      const TYPE_DEFAULTS = {
        Box: { size: [0.3, 0.3, 0.3] },
        BentBox: { size: [0.3, 0.08, 1.2, 0.4], segments: [16] },
        TaperedBox: { size: [0.5, 0.3, 0.5, 0.35, 0.35] },
        TaperedHex: { size: [0.5, 0.3, 0.5, 0.35, 0.35] },
        RoundedBox: { size: [0.3, 0.3, 0.3, 0.06], segments: [3] },
        Cylinder: { size: [0.15, 0.3, 0.15], segments: [6] },
        Sphere: { size: [0.2], segments: [8, 6] },
        Torus: { size: [0.3, 0.05], segments: [8, 12] },
        Lathe: {
          size: [1],
          segments: [24],
          profile: [
            [0.2, 0],
            [0.3, 0.2],
            [0.3, 0.3],
            [0.15, 0.35],
            [0.05, 0.3],
          ],
        },
        Extrude: {
          size: [1],
          shape: [
            [-0.15, -0.1],
            [0.15, -0.1],
            [0.15, 0.1],
            [-0.15, 0.1],
          ],
          extrudeDepth: 0.3,
          bevelThickness: 0.02,
        },
        ProfiledExtrude: {
          size: [1],
          shape: [
            ['line', -0.4, 0.4],
            ['line', -0.4, -0.4],
            ['line', 0.4, -0.4],
            ['line', 0.4, 0.4],
          ],
          roofProfile: [
            [0.4, 0.3],
            [-0.4, 0.3],
          ],
          segments: [24],
        },
        Group: {},
      };

      function switchType(nodeName, newType) {
        flushUndo();
        saveUndo('switchType'); // 操作前保存快照
        const cfg = MODEL_CONFIGS[currentModelType];
        function findNode(n, target) {
          if (n.name === target) return n;
          if (n.children)
            for (const c of n.children) {
              const f = findNode(c, target);
              if (f) return f;
            }
          return null;
        }
        const node = findNode(cfg, nodeName);
        if (!node || node.type === newType) return;
        node.type = newType;
        const d = TYPE_DEFAULTS[newType] || {};
        if (d.size) node.size = [...d.size];
        if (d.segments) node.segments = [...d.segments];
        if (d.profile !== undefined)
          node.profile = [
            ...(d.profile || [
              [0.3, 0],
              [0.3, 0.3],
              [0.1, 0.3],
            ]),
          ];
        if (d.shape !== undefined)
          // 深拷贝（PE shape 是命令数组，浅拷贝会污染 TYPE_DEFAULTS）
          node.shape = JSON.parse(
            JSON.stringify(
              d.shape || [
                [-0.15, -0.1],
                [0.15, -0.1],
                [0.15, 0.1],
                [-0.15, 0.1],
              ]
            )
          );
        if (d.extrudeDepth !== undefined) node.extrudeDepth = d.extrudeDepth;
        if (d.bevelThickness !== undefined) node.bevelThickness = d.bevelThickness;
        if (d.roofProfile !== undefined)
          node.roofProfile = JSON.parse(JSON.stringify(d.roofProfile));
        // 清理旧类型的专属字段
        if (newType !== 'Lathe') delete node.profile;
        if (newType !== 'Extrude' && newType !== 'ProfiledExtrude') {
          delete node.shape;
          delete node.extrudeDepth;
          delete node.bevelThickness;
        }
        if (newType !== 'ProfiledExtrude') delete node.roofProfile;
        deselectAll();
        rebuildModel();
        console.log('🔄 已切换: ' + nodeName + ' → ' + newType);
      }

      // ============================================================
      // 10. GUI 构建
      // ============================================================
      function buildGUI() {
        const cfg = MODEL_CONFIGS[currentModelType];
        gui = new GUI({ title: '🏭 模型工厂', width: 310 });

        // --- 模型切换 ---
        const modelFolder = gui.addFolder('📦 模型切换');
        const modelOptions = {
          'T-34/85 (v1.6 AI版)': 'tank_v16',
          '🐅 虎式坦克 (v1.0)': 'tiger_v16',
          '🏠 建筑': 'building',
          '👾 敌人': 'enemy',
          '🦗 六足战车': 'hexapod',
          '🧟 校园丧尸': 'humanoid',
        };
        let _camoCtrl = null;
        function _buildCamoCtrl(folder) {
          if (_camoCtrl) {
            _camoCtrl.destroy();
            _camoCtrl = null;
          }
          // 虎式：调试色默认 + 热带沙漠；其他：丛林 + 沙漠
          var camoOpts =
            currentModelType === 'tiger_v16'
              ? { '🔧 调试色（高亮轮廓）': 'debug', '🏜 热带沙漠迷彩': 'tropical_desert' }
              : { '🌿 丛林迷彩': 'jungle', '🏜 沙漠迷彩': 'desert' };
          // 切模型时重置为对应默认
          if (
            currentModelType === 'tiger_v16' &&
            currentCamoType !== 'debug' &&
            currentCamoType !== 'tropical_desert'
          ) {
            currentCamoType = 'debug';
          } else if (
            currentModelType !== 'tiger_v16' &&
            (currentCamoType === 'debug' || currentCamoType === 'tropical_desert')
          ) {
            currentCamoType = 'jungle';
          }
          _camoCtrl = folder
            .add({ camo: currentCamoType }, 'camo', camoOpts)
            .name('迷彩类型')
            .onChange((v) => {
              currentCamoType = v;
              _camoJungleTex = null;
              _camoDesertTex = null;
              _camoTropicalDesertTex = null;
              rebuildModel();
            });
        }

        modelFolder
          .add({ model: currentModelType }, 'model', modelOptions)
          .name('选择模型')
          .onChange((v) => {
            saveUndo('model');
            currentModelType = v;
            _buildCamoCtrl(modelFolder);
            rebuildModel();
          });
        modelFolder.open();

        _buildCamoCtrl(modelFolder);

        // 人形编辑模式切换（仅 humanoid 显示；骨架模式加载 WORKING_SKELETON，变体模式加载 MODELS[variant].tree）
        if (currentModelType === 'humanoid' && window.HumanoidConfig) {
          var modeF = gui.addFolder('🔀 编辑模式');
          modeF
            .add({ mode: _humanoidMode }, 'mode', {
              '🧍 变体(特色)': 'variant',
              '🦴 骨架(共通)': 'skeleton',
            })
            .name('模式')
            .onChange(function (v) {
              _humanoidMode = v;
              rebuildModel();
            });
          modeF.add({ freeze: freezeSkeleton }, 'freeze').name('❄️ 冻结版本(骨架模式)');
          function refreshVerOptions() {
            var opts = { '(工作骨架)': null };
            window.HumanoidConfig.getSkeletonList().forEach(function (k) {
              opts[k] = k;
            });
            if (_verCtrl) _verCtrl.options(opts).setValue(_humanoidSkelVer);
          }
          var _verOpts = { '(工作骨架)': null };
          window.HumanoidConfig.getSkeletonList().forEach(function (k) {
            _verOpts[k] = k;
          });
          var _verCtrl = modeF
            .add({ ver: _humanoidSkelVer }, 'ver', _verOpts)
            .name('骨架版本(review)')
            .onChange(function (v) {
              _humanoidSkelVer = v;
              if (_humanoidMode === 'skeleton') rebuildModel();
            });
          function deleteSkeletonVersion(key) {
            if (currentModelType !== 'humanoid' || _humanoidMode !== 'skeleton') return;
            var k = key || _humanoidSkelVer;
            if (!k) {
              alert('当前是工作骨架（无版本），无可删除的版本');
              return;
            }
            if (!confirm('确定删除骨架版本「' + k + '」？此操作不可撤销。')) return;
            delete window.HumanoidConfig.SKELETON_VERSIONS[k];
            if (_humanoidSkelVer === k) {
              _humanoidSkelVer = null;
              rebuildModel();
            }
            refreshVerOptions();
            fetch('/api/solidify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                modelType: 'humanoid_versions',
                config: JSON.parse(JSON.stringify(window.HumanoidConfig.SKELETON_VERSIONS)),
              }),
            })
              .then(function (r) {
                return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status));
              })
              .then(function (res) {
                console.log('🗑️ 已删除骨架版本 ' + k + ' → ' + res.file);
              })
              .catch(function (err) {
                console.log('⚠️ 删除固化失败: ' + err.message);
              });
          }
          window._deleteSkeletonVersion = deleteSkeletonVersion;
          modeF.add({ del: deleteSkeletonVersion }, 'del').name('🗑️ 删除当前版本');
          modeF.open();
        }

        // 人形体型参数（仅 humanoid 显示）
        if (currentModelType === 'humanoid' && window.HumanoidConfig) {
          var bodyF = gui.addFolder('🧍 体型参数');
          var BP = window.HumanoidConfig.BODY_PARAMS;
          var variantOptions = {};
          Object.keys(window.HumanoidConfig.HUMANOID_VARIANTS).forEach(function (k) {
            variantOptions[window.HumanoidConfig.HUMANOID_VARIANTS[k].name] = k;
          });
          bodyF
            .add(_humanoidEdit, 'variant', variantOptions)
            .name('变体')
            .onChange(function (v) {
              // 切变体重置曲线：女教师 0.7（S 曲线基准），其他 0
              _humanoidEdit.params.curves = v === 'teacher_f' ? 0.7 : 0;
              _applyHumanoidEdit();
            });
          var _bodyNameMap = { height: '身高', build: '体型', hunch: '驼背', curves: '曲线' };
          Object.keys(BP).forEach(function (k) {
            _humanoidEdit.params[k] = BP[k].default;
            bodyF
              .add(_humanoidEdit.params, k, BP[k].range[0], BP[k].range[1], 0.01)
              .name(_bodyNameMap[k] || k)
              .onChange(function () {
                _applyHumanoidEdit();
              });
          });
          bodyF.open();
        }

        // --- 全选（独立按钮）---
        const selectAllFolder = gui.addFolder('✅ 全选部件');
        selectAllFolder
          .add(
            {
              selectAll: () => {
                removeAllHighlights();
                selectedParts.clear();
                resetBatchSliders();
                nodeMap.forEach((info, name) => {
                  if (info.mesh && info.group.visible) selectedParts.add(name);
                });
                createHighlight('');
                updateBatchPanel();
                console.log('✅ 全选 ' + selectedParts.size + ' 个部件');
              },
            },
            'selectAll'
          )
          .name('✅ 全选可见部件');
        selectAllFolder.open();

        // --- 批量编辑（多选 ≥2 时自动展开）---
        batchGuiFolder = gui.addFolder('📦 批量编辑 (选中≥2时展开)');
        batchInfoObj = { count: selectedParts.size };
        batchGuiFolder.add(batchInfoObj, 'count').name('已选部件数').disable();
        // 位置偏移（累积式：滑块当摇杆, 拖动增量应用到选中部件）
        const batchPos = { dx: 0, dy: 0, dz: 0 };
        const _prevBatch = { dx: 0, dy: 0, dz: 0 };
        const _batchCtrls = []; // 累积滑块 controller 引用(选择切换时重置用)
        function applyDelta(axis, batchKey, newValue) {
          if (!isFinite(newValue)) return;
          const delta = newValue - _prevBatch[batchKey];
          if (!isFinite(delta) || Math.abs(delta) < 1e-6) return;
          for (const name of selectedParts) {
            const info = nodeMap.get(name);
            const pos = info?.group?.position;
            if (pos && isFinite(pos[axis])) pos[axis] += delta;
          }
          _prevBatch[batchKey] = newValue;
          updateAllHelpers();
        }
        _batchCtrls.push(
          batchGuiFolder
            .add(batchPos, 'dx', -2, 2, 0.001)
            .name('ΔX')
            .onChange((v) => {
              saveUndo('batchDX');
              applyDelta('x', 'dx', v);
            })
        );
        _batchCtrls.push(
          batchGuiFolder
            .add(batchPos, 'dy', -2, 2, 0.001)
            .name('ΔY')
            .onChange((v) => {
              saveUndo('batchDY');
              applyDelta('y', 'dy', v);
            })
        );
        _batchCtrls.push(
          batchGuiFolder
            .add(batchPos, 'dz', -2, 2, 0.001)
            .name('ΔZ')
            .onChange((v) => {
              saveUndo('batchDZ');
              applyDelta('z', 'dz', v);
            })
        );
        // 重置偏移零点
        batchGuiFolder
          .add(
            {
              resetOffset: () => {
                batchPos.dx = 0;
                batchPos.dy = 0;
                batchPos.dz = 0;
                _prevBatch.dx = 0;
                _prevBatch.dy = 0;
                _prevBatch.dz = 0;
                _batchCtrls.forEach((c) => c.updateDisplay());
              },
            },
            'resetOffset'
          )
          .name('🔄 重置偏移零点');
        // 批量旋转
        const DEG = 180 / Math.PI;
        const batchRot = { drx: 0, dry: 0, drz: 0 };
        const _prevRot = { drx: 0, dry: 0, drz: 0 };
        function applyRotDelta(axis, batchKey, newValue) {
          if (!isFinite(newValue)) return;
          const delta = (newValue - _prevRot[batchKey]) / DEG;
          if (!isFinite(delta) || Math.abs(delta) < 1e-6) return;
          for (const name of selectedParts) {
            const info = nodeMap.get(name);
            const rt = info?.rotTarget;
            if (rt && isFinite(rt.rotation[axis])) rt.rotation[axis] += delta;
          }
          _prevRot[batchKey] = newValue;
          updateAllHelpers();
        }
        _batchCtrls.push(
          batchGuiFolder
            .add(batchRot, 'drx', -180, 180, 1)
            .name('ΔRX (°)')
            .onChange((v) => {
              saveUndo('batchRX');
              applyRotDelta('x', 'drx', v);
            })
        );
        _batchCtrls.push(
          batchGuiFolder
            .add(batchRot, 'dry', -180, 180, 1)
            .name('ΔRY (°)')
            .onChange((v) => {
              saveUndo('batchRY');
              applyRotDelta('y', 'dry', v);
            })
        );
        _batchCtrls.push(
          batchGuiFolder
            .add(batchRot, 'drz', -180, 180, 1)
            .name('ΔRZ (°)')
            .onChange((v) => {
              saveUndo('batchRZ');
              applyRotDelta('z', 'drz', v);
            })
        );
        batchGuiFolder
          .add(
            {
              resetRot: () => {
                batchRot.drx = 0;
                batchRot.dry = 0;
                batchRot.drz = 0;
                _prevRot.drx = 0;
                _prevRot.dry = 0;
                _prevRot.drz = 0;
                _batchCtrls.forEach((c) => c.updateDisplay());
              },
            },
            'resetRot'
          )
          .name('🔄 重置旋转零点');
        // 暴露给 resetBatchSliders(选择切换时重置累积滑块, 避免上一批的偏移残留到新批次)
        batchState = { batchPos, _prevBatch, batchRot, _prevRot, ctrls: _batchCtrls };
        // 颜色批量
        const batchColor = { color: '#4a5c2e' };
        batchGuiFolder
          .addColor(batchColor, 'color')
          .name('颜色')
          .onChange((v) => {
            saveUndo('batchColor');
            for (const name of selectedParts) {
              const info = nodeMap.get(name);
              if (info && info.mesh && info.mesh.material) {
                info.mesh.material.color.set(v);
                const cfg = info.configNode;
                if (cfg) cfg.color = v;
              }
            }
          });
        // 材质预设批量
        batchGuiFolder
          .add({ mat: 'default' }, 'mat', Object.keys(MATERIAL_DEFS))
          .name('材质')
          .onChange((v) => {
            saveUndo('batchMat');
            const def = MATERIAL_DEFS[v];
            for (const name of selectedParts) {
              const info = nodeMap.get(name);
              if (info && info.mesh && info.mesh.material) {
                info.mesh.material.color.set(def.color);
                info.mesh.material.roughness = def.roughness;
                info.mesh.material.metalness = def.metalness;
                const cfg = info.configNode;
                if (cfg) {
                  cfg.materialId = v;
                  cfg.color = undefined;
                }
              }
            }
          });
        // 隐藏选中
        batchGuiFolder
          .add(
            {
              del: () => {
                flushUndo();
                saveUndo('batchHide'); // 操作前保存快照
                for (const name of selectedParts) {
                  const info = nodeMap.get(name);
                  if (info && info.group) {
                    info.group.visible = false;
                    const cfg = info.configNode;
                    if (cfg) cfg.visible = false;
                  }
                }
                deselectAll();
                updateAllHelpers();
                updateTriCount();
                console.log('🗑 已隐藏 ' + selectedParts.size + ' 个部件（可重新打开可见性恢复）');
              },
            },
            'del'
          )
          .name('🗑 隐藏选中');
        batchGuiFolder.close();

        // --- 全局操作 ---
        const globalF = gui.addFolder('🛠 全局操作');
        // 撤销
        globalF
          .add(
            {
              undo: () => {
                flushUndo(); // 强制入栈当前待定快照
                if (undoStack.length === 0) {
                  console.log('⚠️ 没有可撤销的操作');
                  return;
                }
                autoSnapshot = false;
                const prev = undoStack.pop();
                const cfg = MODEL_CONFIGS[currentModelType];
                const fmCur2 = cfg.children?.[0]?.children?.[0];
                const fmPrev2 = prev.children?.[0]?.children?.[0];
                console.log(
                  '🔙 撤销: 当前 size=' +
                    JSON.stringify(fmCur2?.size) +
                    ' → 快照 size=' +
                    JSON.stringify(fmPrev2?.size)
                );
                deepRestore(cfg, prev);
                console.log(
                  '🔙 恢复后 size=' + JSON.stringify(cfg.children?.[0]?.children?.[0]?.size)
                );
                rebuildModel();
                autoSnapshot = true;
                console.log('↩ 撤销成功 (剩余 ' + undoStack.length + ' 步可撤销)');
              },
            },
            'undo'
          )
          .name('↩ 撤销 (Ctrl+Z)');
        // 保存
        globalF.add({ save: _doSave }, 'save').name('💾 保存并固化 (Ctrl+S)');
        // 重置
        globalF
          .add(
            {
              reset: () => {
                location.reload();
              },
            },
            'reset'
          )
          .name('🔄 重置');
        globalF.open();

        // --- 递归添加部件 UI ---
        function addPartUI(parentGui, configNode) {
          if (!configNode || !configNode.name) return;
          const info = nodeMap.get(configNode.name);
          if (!info) return;
          const { group, mesh, rotTarget } = info;

          const folder = parentGui.addFolder(`🔧 ${displayLabel(configNode.name)}`);
          guiFolderMap.set(configNode.name, folder);
          // 全部默认展开，方便编辑

          // --- 可见性 ---
          const vis = { v: group.visible };
          folder
            .add(vis, 'v')
            .name('👁 可见')
            .onChange((v) => {
              saveUndo('vis');
              group.visible = v;
              configNode.visible = v;
              // 更新 BoxHelper
              const helpers = modelRoot.userData.helpers || [];
              for (const h of helpers) {
                if (h.userData._mesh === mesh) h.visible = v && showHelpersGlobal;
              }
              refreshPartTree();
            });

          // --- 位置 (x,y,z) ---
          const p = { x: group.position.x, y: group.position.y, z: group.position.z };
          const posF = folder.addFolder('📍 位置');
          posF
            .add(p, 'x', -10, 10, 0.005)
            .name('X')
            .onChange((v) => {
              saveUndo('posX');
              group.position.x = v;
              updateAllHelpers();
            });
          posF
            .add(p, 'y', -10, 10, 0.005)
            .name('Y')
            .onChange((v) => {
              saveUndo('posY');
              group.position.y = v;
              updateAllHelpers();
            });
          posF
            .add(p, 'z', -10, 10, 0.005)
            .name('Z')
            .onChange((v) => {
              saveUndo('posZ');
              group.position.z = v;
              updateAllHelpers();
            });

          // --- 旋转 (x,y,z) — 度数显示 ---
          if (true) {
            // 含Group也显示旋转
            const DEG = 180 / Math.PI;
            const r = {
              x: rotTarget.rotation.x * DEG,
              y: rotTarget.rotation.y * DEG,
              z: rotTarget.rotation.z * DEG,
            };
            const rotF = folder.addFolder('🔄 旋转');
            rotF
              .add(r, 'x', -180, 180, 1)
              .name('X (°)')
              .onChange((v) => {
                saveUndo('rotX');
                rotTarget.rotation.x = v / DEG;
                updateAllHelpers();
              });
            rotF
              .add(r, 'y', -180, 180, 1)
              .name('Y (°)')
              .onChange((v) => {
                saveUndo('rotY');
                rotTarget.rotation.y = v / DEG;
                updateAllHelpers();
              });
            rotF
              .add(r, 'z', -180, 180, 1)
              .name('Z (°)')
              .onChange((v) => {
                saveUndo('rotZ');
                rotTarget.rotation.z = v / DEG;
                updateAllHelpers();
              });
          }

          // --- 几何参数编辑（按类型区分）---
          if (configNode.type !== 'Group' && mesh) {
            const geoF = folder.addFolder('📐 几何体 ' + configNode.type);
            const rebuild = () => rebuildMesh(configNode.name);

            if (configNode.type === 'Box') {
              const sz = configNode.size || [1, 1, 1];
              const b = { w: sz[0], h: sz[1], d: sz[2] };
              geoF
                .add(b, 'w', 0.01, 10.0, 0.005)
                .name('宽 (W)')
                .onChange((v) => {
                  saveUndo('BoxW');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(b, 'h', 0.01, 10.0, 0.005)
                .name('高 (H)')
                .onChange((v) => {
                  saveUndo('BoxH');
                  configNode.size[1] = v;
                  rebuild();
                });
              geoF
                .add(b, 'd', 0.01, 10.0, 0.005)
                .name('深 (D)')
                .onChange((v) => {
                  saveUndo('BoxD');
                  configNode.size[2] = v;
                  rebuild();
                });
            } else if (configNode.type === 'BentBox') {
              const sz = configNode.size || [0.3, 0.08, 1.2, 0.4];
              const b = { w: sz[0], h: sz[1], d: sz[2], a: sz[3] != null ? sz[3] : 0.4 };
              geoF
                .add(b, 'w', 0.01, 10.0, 0.005)
                .name('宽 (W)')
                .onChange((v) => {
                  saveUndo('BBw');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(b, 'h', 0.005, 5.0, 0.002)
                .name('厚 (H)')
                .onChange((v) => {
                  saveUndo('BBh');
                  configNode.size[1] = v;
                  rebuild();
                });
              geoF
                .add(b, 'd', 0.01, 10.0, 0.005)
                .name('弧长 (D)')
                .onChange((v) => {
                  saveUndo('BBd');
                  configNode.size[2] = v;
                  rebuild();
                });
              geoF
                .add(b, 'a', 0.05, Math.PI, 0.01)
                .name('弯曲角 (rad)')
                .onChange((v) => {
                  saveUndo('BBa');
                  configNode.size[3] = v;
                  rebuild();
                });
              const sg = configNode.segments || [16];
              geoF
                .add({ s: sg[0] }, 's', 4, 64, 1)
                .name('弯曲分段')
                .onChange((v) => {
                  saveUndo('BBseg');
                  configNode.segments[0] = v;
                  rebuild();
                });
            } else if (configNode.type === 'RoundedBox') {
              const sz = configNode.size || [1, 1, 1, 0.08];
              const b = { w: sz[0], h: sz[1], d: sz[2], r: sz[3] || 0.08 };
              geoF
                .add(b, 'w', 0.01, 10.0, 0.005)
                .name('宽 (W)')
                .onChange((v) => {
                  saveUndo('RBoxW');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(b, 'h', 0.01, 10.0, 0.005)
                .name('高 (H)')
                .onChange((v) => {
                  saveUndo('RBoxH');
                  configNode.size[1] = v;
                  rebuild();
                });
              geoF
                .add(b, 'd', 0.01, 10.0, 0.005)
                .name('深 (D)')
                .onChange((v) => {
                  saveUndo('RBoxD');
                  configNode.size[2] = v;
                  rebuild();
                });
              geoF
                .add(b, 'r', 0.01, 0.5, 0.005)
                .name('圆角')
                .onChange((v) => {
                  saveUndo('RBoxR');
                  configNode.size[3] = v;
                  rebuild();
                });
              const sg = configNode.segments || [3];
              geoF
                .add({ s: sg[0] }, 's', 1, 6, 1)
                .name('圆角段')
                .onChange((v) => {
                  saveUndo('RBoxSeg');
                  configNode.segments[0] = v;
                  rebuild();
                });
            } else if (configNode.type === 'TaperedBox') {
              // size: [底部宽, 高, 底部深, 顶部宽, 顶部深, 顶面X偏移, 顶面Z偏移, 底面X偏移, 底面Z偏移]
              const sz = configNode.size || [0.5, 0.3, 0.5, 0.35, 0.35];
              const t = {
                bw: sz[0],
                h: sz[1],
                bd: sz[2],
                tw: sz[3] || sz[0] * 0.6,
                td: sz[4] || sz[2] * 0.6,
                ox: sz[5] || 0,
                oz: sz[6] || 0,
                bx: sz[7] || 0,
                bz: sz[8] || 0,
              };
              geoF
                .add(t, 'bw', 0.01, 10.0, 0.005)
                .name('底宽')
                .onChange((v) => {
                  saveUndo('TBw');
                  configNode.size[0] = v;
                  rebuild();
                });
              geoF
                .add(t, 'h', 0.01, 10.0, 0.005)
                .name('高度')
                .onChange((v) => {
                  saveUndo('TH');
                  configNode.size[1] = v;
                  rebuild();
                });
              geoF
                .add(t, 'bd', 0.01, 10.0, 0.005)
                .name('底深')
                .onChange((v) => {
                  saveUndo('TBd');
                  configNode.size[2] = v;
                  rebuild();
                });
              geoF
                .add(t, 'tw', 0.01, 10.0, 0.005)
                .name('顶宽')
                .onChange((v) => {
                  saveUndo('TTw');
                  configNode.size[3] = v;
                  rebuild();
                });
              geoF
                .add(t, 'td', 0.01, 10.0, 0.005)
                .name('顶深')
                .onChange((v) => {
                  saveUndo('TTd');
                  configNode.size[4] = v;
                  rebuild();
                });
              const offF = geoF.addFolder('↗ 顶面偏移');
              offF
                .add(t, 'ox', -5, 5, 0.005)
                .name('X偏移')
                .onChange((v) => {
                  saveUndo('TBXoff');
                  configNode.size[5] = v;
                  rebuild();
                });
              offF
                .add(t, 'oz', -5, 5, 0.005)
                .name('Z偏移')
                .onChange((v) => {
                  saveUndo('TBZoff');
                  configNode.size[6] = v;
                  rebuild();
                });
              const offF2 = geoF.addFolder('↙ 底面偏移');
              offF2
                .add(t, 'bx', -5, 5, 0.005)
                .name('X偏移')
                .onChange((v) => {
                  saveUndo('TBBXoff');
                  configNode.size[7] = v;
                  rebuild();

              offF2
                .add(t, 'bz', -5, 5, 0.005)
                .name('Z偏移')
                .onChange((v) => {
                  saveUndo('TBBZoff');
                  configNode.size[8] = v;
                  rebuild();
