<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB 模型验证 — T34-85</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #info {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.78); color: #fff; padding: 14px 20px;
    border-radius: 8px; font-size: 13.5px; line-height: 1.7;
    pointer-events: none; max-width: 520px; max-height: 80vh; overflow-y: auto;
    border-left: 3px solid #4ecdc4;
  }
  #info .ok { color: #4ecdc4; }
  #info .err { color: #ff6b6b; }
  #info .warn { color: #ffe66d; }
  #info .dim { color: #aaa; font-size: 12px; }
</style>
</head>
<body>
<div id="info">
  <div style="font-size:16px;font-weight:700;margin-bottom:4px;">🔍 GLB 模型加载测试 — T34-85</div>
  <div id="status">⏳ 正在初始化...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const statusEl = document.getElementById('status');

function log(msg, cls = '') {
  statusEl.innerHTML += `<br><span class="${cls}">${msg}</span>`;
  console.log(msg);
}

// ========== 场景 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2d2d3f);
scene.fog = new THREE.Fog(0x2d2d3f, 40, 120);

// ========== 相机 ==========
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.3, 300);
camera.position.set(10, 7, 12);
camera.lookAt(0, 1.5, 0);

// ========== 渲染器 ==========
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ========== OrbitControls ==========
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI * 0.78;
controls.update();

// ========== 光照 ==========
scene.add(new THREE.AmbientLight(0x404060, 0.6));
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3d2b1f, 1.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff5e6, 4);
sun.position.set(15, 25, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = -25;
sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;
sun.shadow.camera.bottom = -25;
sun.shadow.bias = -0.0001;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8899cc, 0.8);
fill.position.set(-8, 4, -8);
scene.add(fill);

// ========== 地面 ==========
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a6741, roughness: 0.85, metalness: 0.05 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 网格
const grid = new THREE.GridHelper(60, 60, 0x777777, 0x3a3a3a);
scene.add(grid);

// 坐标轴
scene.add(new THREE.AxesHelper(6));

// ========== 加载 GLB ==========
log('📥 加载 GLB: models/glb/t34-85_textured.glb', '');
const loader = new GLTFLoader();

loader.load(
  'models/glb/t34-85_textured.glb',
  function(gltf) {
    log('✅ GLB 加载成功！', 'ok');
    const model = gltf.scene;
    log(`📦 根节点: "${model.name || '[unnamed]'}" [${model.type}]`, 'ok');

    // 遍历层级
    const meshes = [];
    const bones = [];
    const animations = gltf.animations || [];

    model.traverse((child) => {
      const flags = [];
      if (child.isMesh) { meshes.push(child); flags.push('MESH'); }
      if (child.isBone) { bones.push(child); flags.push('BONE'); }
      if (child.isSkinnedMesh) flags.push('SKINNED');
      const flagStr = flags.length > 0 ? ` [${flags.join(',')}]` : '';
      log(`  └─ "${child.name || '[unnamed]'}" ${child.type}${flagStr}`, 'dim');

      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    log('', '');
    log(`🎯 网格(Mesh): ${meshes.length} 个`, 'ok');
    log(`🦴 骨骼(Bone): ${bones.length} 个`, 'ok');
    log(`🎬 动画(Animation): ${animations.length} 个`, 'ok');

    // 列出纹理信息
    const textures = new Set();
    model.traverse(c => {
      if (c.material) {
        const mats = Array.isArray(c.material) ? c.material : [c.material];
        mats.forEach(m => {
          ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap'].forEach(k => {
            if (m[k]) textures.add(`${k}=${m[k].name || m[k].uuid}`);
          });
        });
      }
    });
    if (textures.size > 0) {
      log(`🖼️ 纹理: ${textures.size} 个`, 'ok');
      textures.forEach(t => log(`    ${t}`, 'dim'));
    }

    // 包围盒
    const bbox = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    bbox.getSize(size);
    const center = new THREE.Vector3();
    bbox.getCenter(center);

    log('', '');
    log(`📐 包围盒: ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)}`, 'ok');
    log(`📍 中心: (${center.x.toFixed(3)}, ${center.y.toFixed(3)}, ${center.z.toFixed(3)})`, 'ok');

    // 居中 + 自适应缩放
    model.position.set(-center.x, -bbox.min.y, -center.z);
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
      const targetSize = 7;
      const s = targetSize / maxDim;
      model.scale.setScalar(s);
      log(`🔧 自适应缩放: ×${s.toFixed(4)} (原始最大维度=${maxDim.toFixed(3)})`, 'ok');
    }

    scene.add(model);
    log('🎉 模型已就位，可旋转/缩放查看！', 'ok');
  },
  function(progress) {
    if (progress.total) {
      const pct = Math.round(progress.loaded / progress.total * 100);
      const lines = statusEl.innerHTML.split('<br>');
      for (let i = lines.length - 1; i >= 0; i--) {
        if (lines[i].includes('📥')) {
          lines[i] = `<span>📥 加载中: ${pct}%</span>`;
          statusEl.innerHTML = lines.join('<br>');
          break;
        }
      }
    }
  },
  function(error) {
    log(`❌ 加载失败: ${error.message || error}`, 'err');
    console.error('GLB 加载错误:', error);
  }
);

// ========== 渲染循环 ==========
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

log('🚀 就绪，等待 GLB 加载...', '');
</script>
</body>
</html>
