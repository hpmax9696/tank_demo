<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>人形敌人调试</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #8090a0;
        font-family: sans-serif;
      }
      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px;
        border-radius: 6px;
      }
      #ui button {
        display: block;
        margin: 3px 0;
        padding: 6px 12px;
        cursor: pointer;
        width: 110px;
      }
      #ui button.active {
        background: #4a8;
        color: #fff;
      }
      #info {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 10;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <button data-v="student_m">学生(男)</button>
      <button data-v="student_f">学生(女)</button>
      <button data-v="teacher_m">教师(男)</button>
      <button data-v="teacher_f">教师(女)</button>
    </div>
    <div id="info">拖拽旋转视角 | 单实例调试页（供 MCP 连接）</div>
    <script src="js/three.min.js"></script>
    <script src="models/modelRegistry.js"></script>
    <script src="models/humanoid_config.js"></script>
    <script src="models/enemies.js"></script>
    <script>
      // 单一 Three.js 实例（MCP scene/截图一致）
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x708090);

      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      // 光照
      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const dir = new THREE.DirectionalLight(0xffffff, 1.3);
      dir.position.set(3, 6, 4);
      dir.castShadow = true;
      dir.shadow.mapSize.set(1024, 1024);
      dir.shadow.camera.left = -3;
      dir.shadow.camera.right = 3;
      dir.shadow.camera.top = 3;
      dir.shadow.camera.bottom = -3;
      scene.add(dir);

      // 地面 + 网格
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: 0x6a7a5a, roughness: 0.9 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      scene.add(new THREE.GridHelper(20, 20, 0x333333, 0x555555));

      // 丧尸容器
      let zombie = null;
      function showVariant(variant) {
        if (zombie) {
          scene.remove(zombie);
          zombie.traverse((o) => {
            if (o.geometry && o.geometry.dispose && o.material !== ground.material) {
            }
          });
        }
        zombie = window.EnemyModels.createCampusZombie({ variant, heightM: 1.4, seed: 1001 });
        zombie.position.set(0, 0, 0);
        scene.add(zombie);
        window._zombie = zombie; // 供 MCP 访问
        document
          .querySelectorAll('#ui button')
          .forEach((b) => b.classList.toggle('active', b.dataset.v === variant));
      }
      showVariant('student_m');

      document
        .querySelectorAll('#ui button')
        .forEach((b) => b.addEventListener('click', () => showVariant(b.dataset.v)));

      // 鼠标拖拽旋转视角
      let yaw = 0,
        pitch = 0.25,
        dragging = false,
        lastX = 0,
        lastY = 0;
      renderer.domElement.addEventListener('mousedown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      window.addEventListener('mouseup', () => (dragging = false));
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        yaw -= (e.clientX - lastX) * 0.01;
        pitch = Math.max(-0.3, Math.min(0.8, pitch + (e.clientY - lastY) * 0.01));
        lastX = e.clientX;
        lastY = e.clientY;
      });

      // 渲染循环（相机绕丧尸轨道）
      let lastT = performance.now();
      function loop() {
        requestAnimationFrame(loop);
        const now = performance.now();
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        const r = 2.4;
        camera.position.x = Math.sin(yaw) * Math.cos(pitch) * r;
        camera.position.z = Math.cos(yaw) * Math.cos(pitch) * r;
        camera.position.y = Math.sin(pitch) * r + 0.9;
        camera.lookAt(0, 1.05, 0);
        if (zombie && zombie.userData._animSystem) zombie.userData._animSystem.update(dt);
        renderer.render(scene, camera);
      }
      loop();

      // 暴露给 MCP
      window._scene = scene;
      window._camera = camera;
      window._renderer = renderer;
      window._showVariant = showVariant;
      console.log('调试页就绪: window._scene/_camera/_zombie/_showVariant');
    </script>
  </body>
</html>
