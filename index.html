<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克运动demo v0.22.1</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #1a1a2e;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ========== 主菜单 ========== */
        #menu-overlay {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1e 100%);
            z-index: 100;
            transition: opacity 0.5s, visibility 0.5s;
        }
        #menu-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        #menu-overlay .menu-title {
            font-size: 3rem; font-weight: bold;
            color: #f5954a;
            text-shadow: 0 0 30px rgba(245,149,74,0.4);
            margin-bottom: 0.5rem;
        }
        #menu-overlay .menu-version {
            font-size: 1rem;
            color: #888;
            margin-bottom: 3rem;
            letter-spacing: 0.15em;
        }
        #menu-overlay .menu-btn {
            width: 240px; padding: 14px 0;
            margin: 8px 0;
            font-size: 1.15rem; font-weight: bold;
            border: none; border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            letter-spacing: 0.05em;
        }
        #menu-overlay .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        #menu-overlay .menu-btn:active {
            transform: translateY(0);
        }
        #btn-enter {
            background: linear-gradient(135deg, #f5954a, #e07020);
            color: #fff;
        }
        #btn-exit {
            background: rgba(255,255,255,0.08);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.12);
        }
        #menu-overlay .menu-hint {
            margin-top: 2.5rem;
            color: #555;
            font-size: 0.85rem;
        }

        /* 地图选择面板 */
        #map-selector {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 6px 0;
        }
        #map-selector.active { display: flex; }
        #map-selector .map-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            width: 280px;
        }
        #map-selector .map-item {
            padding: 10px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #aaa;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.15s;
        }
        #map-selector .map-item:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }
        #map-selector .map-item.selected {
            background: rgba(245,149,74,0.2);
            border-color: #f5954a;
            color: #f5954a;
        }
        #map-selector .map-item .map-name {
            font-weight: bold;
            margin-bottom: 2px;
        }
        #map-selector .map-item .map-desc {
            font-size: 0.7rem;
            color: #666;
        }
        #map-selector .map-btn-row {
            display: flex;
            gap: 10px;
        }
        #map-selector .map-btn {
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #map-selector .map-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }
        #btn-start-game {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: #fff;
        }
        #btn-cancel-map {
            background: rgba(255,255,255,0.08);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.12);
        }

        /* ========== 游戏画面 ========== */
        #game-container {
            position: fixed; inset: 0;
            visibility: hidden; pointer-events: none;
        }
        #game-container.active {
            visibility: visible; pointer-events: auto;
        }

        /* ========== 模型预览 ========== */
        #preview-container {
            position: fixed; inset: 0;
            visibility: hidden; pointer-events: none;
            background: #1a1a2e;
            z-index: 90;
        }
        #preview-container.active {
            visibility: visible; pointer-events: auto;
        }
        #preview-hud {
            position: fixed; top: 20px; left: 20px;
            z-index: 95;
            display: flex; gap: 12px; align-items: flex-start;
        }
        #btn-preview-back {
            padding: 8px 18px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.55);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            backdrop-filter: blur(6px);
            flex-shrink: 0;
        }
        #btn-preview-back:hover {
            background: rgba(0,0,0,0.75);
            color: #fff;
        }
        /* 分类导航 */
        #preview-nav {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 75vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #preview-nav::-webkit-scrollbar { display: none; }
        #preview-cat-tabs {
            display: flex; gap: 4px; flex-wrap: wrap;
        }
        .preview-cat-tab {
            padding: 6px 14px;
            font-size: 0.82rem;
            color: #888;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            backdrop-filter: blur(6px);
            user-select: none;
        }
        .preview-cat-tab:hover {
            color: #ccc;
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }
        .preview-cat-tab.active {
            color: #fff;
            background: rgba(74,144,217,0.35);
            border-color: rgba(74,144,217,0.5);
        }
        #preview-model-list {
            display: flex; gap: 4px; flex-wrap: wrap;
        }
        .preview-model-btn {
            padding: 5px 12px;
            font-size: 0.78rem;
            color: #999;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            backdrop-filter: blur(6px);
            user-select: none;
        }
        .preview-model-btn:hover {
            color: #ddd;
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .preview-model-btn.active {
            color: #fff;
            background: rgba(74,144,217,0.3);
            border-color: rgba(74,144,217,0.4);
        }
        #preview-label {
            color: #666;
            font-size: 0.8rem;
            padding-top: 8px;
        }

        /* HUD */
        #hud {
            position: fixed; top: 20px; left: 20px;
            z-index: 50;
            display: flex; gap: 12px;
            align-items: center;
        }
        #btn-back {
            padding: 8px 18px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.55);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            backdrop-filter: blur(6px);
        }
        #btn-back:hover {
            background: rgba(0,0,0,0.75);
            color: #fff;
        }
        #controls-hint {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            padding: 10px 22px;
            background: rgba(0,0,0,0.55);
            color: #aaa;
            font-size: 0.8rem;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            pointer-events: none;
            letter-spacing: 0.03em;
        }

        /* ========== 对方指向箭头（杆+三角头） ========== */
        .arrow-ui {
            position: fixed;
            width: 3px;
            height: 28px;
            background: #ff4444;
            z-index: 56;
            pointer-events: none;
            border-radius: 2px;
            transform-origin: 50% 0%;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
        }
        .arrow-ui::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 14px solid #ff4444;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
        }
        #arrow-p1 { background: #ff4444; }
        #arrow-p1::after { border-top-color: #ff4444; }
        #arrow-p2 { background: #ffaa00; }
        #arrow-p2::after { border-top-color: #ffaa00; }

        /* ========== 版本更新Tips ========== */
        .changelog {

            font-size: 0.82rem;

        }
        .changelog .cl-item::before {
            content: '•';
            position: absolute;
            left: 4px;
            color: #555;
        }
    </style>
</head>
<body>

    <script src="models/buildings.js"></script>

    <script>
        // ==================== DOM 引用 ====================
        const menuOverlay = document.getElementById('menu-overlay');
        const gameContainer = document.getElementById('game-container');
        const btnEnter = document.getElementById('btn-enter');
        const btnVersus = document.getElementById('btn-versus');
        const btnExit = document.getElementById('btn-exit');
        const btnBack = document.getElementById('btn-back');
        const hintBar = document.getElementById('controls-hint');
        const splitLine = document.getElementById('split-line');
        const arrowP1 = document.getElementById('arrow-p1');
        const arrowP2 = document.getElementById('arrow-p2');
        const versusResult = document.getElementById('versus-result');
        const resultP1 = document.getElementById('result-p1');
        const resultP2 = document.getElementById('result-p2');

        // ── 地图选择器 DOM ──
        const mapSelector = document.getElementById('map-selector');
        const mapList = document.getElementById('map-list');
        const btnStartGame = document.getElementById('btn-start-game');
        const btnCancelMap = document.getElementById('btn-cancel-map');
        const menuButtons = document.getElementById('menu-overlay').querySelectorAll('.menu-btn');

        // ==================== 地图系统 ====================
        // 地图配置（内联数据，测试地图01a/01b与maps/*.map.json内容一致）
        const MAP_CONFIGS = {
            'test_map_01a': {
                version: '1.0', name: '测试地图01a', size: 200, type: 'single',
                desc: '池塘+蛇形河流+高地盆地，完整地形',
                spawnPoints: { p1: [0, 0, 1.57] },
                terrain: {
                    pond: { cx: 0, cz: 50, rx: 4.5, rz: 6, depth: 5 },
                    river: { zc: -60, amp: 8, period: 30, hwBase: 6.25, hwVar: 1.25, hwPeriod: 20, hwPhase: 1.5, depth: 5 },
                    hill: { cx: 40, cz: -30, height: 4, radius: 8 },
                    basin: { cx: 48, cz: -25, depth: 3, radius: 5 }
                },
                terrainTypes: {
                    default: 'grass',
                    riverBank: { bankWidth: 5, type: 'mud' },
                    pondEdge: { bankWidth: 3, type: 'mud' },
                    hillTop: { radius: 4, type: 'sand' },
                    basin: { radius: 3, type: 'sand' },
                    bridgeSurface: { type: 'asphalt' }
                },
                waters: { pond: { waterLevel: -1 }, river: { waterLevel: -1 } },
                bridges: [{ cx: 0, halfW: 4, deckH: 0.35 }],
                obstacles: { count: 350, minDist: 6, safeRadius: 10, spawnRadius: 98 }
            },
            'test_map_01b': {
                version: '1.0', name: '测试地图01b', size: 200, type: 'versus', flat: true,
                desc: '双人对战平坦大平原',
                spawnPoints: { p1: [-15, 0, 1.57], p2: [15, 0, -1.57] },
                terrainTypes: { default: 'grass' },
                obstacles: { count: 350, minDist: 6, safeRadius: 10, spawnRadius: 98 }
            },
            'test_map_02a': {
                version: '1.0', name: '测试地图02a (草丛)', size: 200, type: 'single',
                desc: '01a地形+程序化草丛覆盖（InstancedMesh优化）',
                spawnPoints: { p1: [0, 0, 1.57] },
                terrain: {
                    pond: { cx: 0, cz: 50, rx: 4.5, rz: 6, depth: 5 },
                    river: { zc: -60, amp: 8, period: 30, hwBase: 6.25, hwVar: 1.25, hwPeriod: 20, hwPhase: 1.5, depth: 5 },
                    hill: { cx: 40, cz: -30, height: 4, radius: 8 },
                    basin: { cx: 48, cz: -25, depth: 3, radius: 5 }
                },
                terrainTypes: {
                    default: 'grass',
                    riverBank: { bankWidth: 5, type: 'mud' },
                    pondEdge: { bankWidth: 3, type: 'mud' },
                    hillTop: { radius: 4, type: 'sand' },
                    basin: { radius: 3, type: 'sand' },
                    bridgeSurface: { type: 'asphalt' }
                },
                waters: { pond: { waterLevel: -1 }, river: { waterLevel: -1 } },
                bridges: [{ cx: 0, halfW: 4, deckH: 0.35 }],
                obstacles: { count: 350, minDist: 6, safeRadius: 10, spawnRadius: 98 },
                grassCover: {
                    enabled: true,
                    spacing: 1.8,
                    density: 0.80,
                    edgeFade: 4.0
                }
            }
        };
        let currentMapData = null;
        const TERRAIN_TYPE_NAMES = ['grass', 'mud', 'sand', 'concrete', 'asphalt', 'brick'];
        const TERRAIN_TYPE_INDEX = { grass: 0, mud: 1, sand: 2, concrete: 3, asphalt: 4, brick: 5 };

        function loadMapConfig(mapId) {
            currentMapData = MAP_CONFIGS[mapId];
            if (!currentMapData) return false;
            // 根据地图类型设置全局标志
            isVersusMap = (currentMapData.type === 'versus' || currentMapData.flat);
            return true;
        }

        // 简单 FBM 噪声（用于生成自然地形斑块）
        function noise2D(x, z, seed) {
            const n = Math.sin(x * 12.9898 + z * 78.233 + seed) * 43758.5453;
            return n - Math.floor(n);
        }
        function smoothNoise(x, z, seed) {
            const ix = Math.floor(x), iz = Math.floor(z);
            const fx = x - ix, fz = z - iz;
            const sx = fx * fx * (3 - 2 * fx); // smoothstep
            const sz = fz * fz * (3 - 2 * fz);
            const v00 = noise2D(ix, iz, seed), v10 = noise2D(ix + 1, iz, seed);
            const v01 = noise2D(ix, iz + 1, seed), v11 = noise2D(ix + 1, iz + 1, seed);
            const a = v00 + (v10 - v00) * sx;
            const b = v01 + (v11 - v01) * sx;
            return a + (b - a) * sz;
        }
        function fbmNoise(x, z, seed) {
            let v = 0, amp = 0.6, freq = 1, total = 0;
            for (let o = 0; o < 4; o++) {
                v += smoothNoise(x * freq, z * freq, seed + o * 17) * amp;
                total += amp;
                amp *= 0.5;
                freq *= 2.3;
            }
            return v / total;
        }

        // splat map：256x256，每像素编码地貌类型(0~5)
        function generateSplatMap() {
            const md = currentMapData;
            const size = 256;
            const data = new Uint8Array(size * size);
            const defaultType = TERRAIN_TYPE_INDEX[md.terrainTypes.default] || 0;
            for (let i = 0; i < size * size; i++) data[i] = defaultType;

            if (!md.terrainTypes || isVersusMap) return data;

            const tt = md.terrainTypes, t = md.terrain;
            const half = md.size / 2;
            const scale = md.size / size; // world units per pixel

            // 辅助：世界坐标→splat坐标
            function w2s(w) { return Math.round((w + half) / scale); }

            for (let sy = 0; sy < size; sy++) {
                const wz = -half + sy * scale; // world Z
                for (let sx = 0; sx < size; sx++) {
                    const wx = -half + sx * scale; // world X
                    const idx = sy * size + sx;

                    // 河流岸边+河床→泥地（河床覆盖泥地，避免草地透过河水）
                    if (t && t.river && tt.riverBank) {
                        const rzc = t.river.zc + t.river.amp * Math.sin(wx / t.river.period);
                        const rhw = t.river.hwBase + t.river.hwVar * Math.sin(wx / t.river.hwPeriod + t.river.hwPhase);
                        const dist = Math.abs(wz - rzc);
                        if (dist <= rhw + tt.riverBank.bankWidth) {
                            data[idx] = TERRAIN_TYPE_INDEX[tt.riverBank.type] || 1; // mud
                        }
                    }

                    // 池塘边缘→泥地
                    if (t && t.pond && tt.pondEdge) {
                        const px = wx - t.pond.cx, pz = wz - t.pond.cz;
                        const ed = Math.sqrt((px*px)/(t.pond.rx*t.pond.rx) + (pz*pz)/(t.pond.rz*t.pond.rz));
                        if (ed > 1.0 && ed <= 1.0 + tt.pondEdge.bankWidth / Math.max(t.pond.rx, t.pond.rz)) {
                            data[idx] = TERRAIN_TYPE_INDEX[tt.pondEdge.type] || 1;
                        }
                    }

                    // 桥梁表面→柏油路
                    if (tt.bridgeSurface && t && t.river) {
                        const rzc2 = t.river.zc + t.river.amp * Math.sin(wx / t.river.period);
                        const rhw2 = t.river.hwBase + t.river.hwVar * Math.sin(wx / t.river.hwPeriod + t.river.hwPhase);
                        if (Math.abs(wx) <= 4 && Math.abs(wz - rzc2) <= rhw2 + 0.8) {
                            data[idx] = TERRAIN_TYPE_INDEX[tt.bridgeSurface.type] || 4;
                        }
                    }

                    // 山丘顶部→沙地
                    if (t && t.hill && tt.hillTop) {
                        const hx = wx - t.hill.cx, hz2 = wz - t.hill.cz;
                        const d2 = hx*hx + hz2*hz2;
                        if (d2 <= tt.hillTop.radius * tt.hillTop.radius) {
                            data[idx] = TERRAIN_TYPE_INDEX[tt.hillTop.type] || 2;
                        }
                    }

                    // 盆地→沙地
                    if (t && t.basin && tt.basin) {
                        const bx2 = wx - t.basin.cx, bz2 = wz - t.basin.cz;
                        const bd2 = bx2*bx2 + bz2*bz2;
                        if (bd2 <= tt.basin.radius * tt.basin.radius) {
                            data[idx] = TERRAIN_TYPE_INDEX[tt.basin.type] || 2;
                        }
                    }

                    // ── 噪声地形斑块：将部分草地替换为泥地/沙地（草地占比≈50%）──
                    if (data[idx] === defaultType) { // 仅转换未被特殊地形覆盖的草地像素
                        const n = fbmNoise(wx * 0.06, wz * 0.06, 42);
                        if (n > 0.78) {
                            data[idx] = TERRAIN_TYPE_INDEX['sand'];    // ~22% 沙地斑块
                        } else if (n > 0.50) {
                            data[idx] = TERRAIN_TYPE_INDEX['mud'];    // ~28% 泥地斑块
                        }
                        // n <= 0.50 → 保持草地 (~50%)
                    }
                }
            }
            return data;
        }

        // 根据 splat map 生成复合地面纹理（2048x2048）
        function generateCompositeGroundTexture() {
            const splat = generateSplatMap();
            const splatSize = 256;
            const outSize = 2048;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = outSize;
            const ctx = canvas.getContext('2d');

            // 预生成6种纹理
            const texCanvases = TERRAIN_TYPE_NAMES.map((name, idx) => {
                try { return TerrainTextures[name](); } catch(e) {
                    // 回退纯色
                    const fc = document.createElement('canvas'); fc.width=fc.height=256;
                    const fcx=fc.getContext('2d'); fcx.fillStyle=['#4a8c3f','#6b4a2e','#c4a860','#b0b0b0','#4a4a4a','#a05a3c'][idx];
                    fcx.fillRect(0,0,256,256); return fc;
                }
            });

            const half = currentMapData.size / 2;
            const sw = currentMapData.size / outSize; // world units per output pixel

            // 分块绘制，每个输出像素采样对应纹理
            const blockSize = 8;
            for (let by = 0; by < outSize; by += blockSize) {
                for (let bx = 0; bx < outSize; bx += blockSize) {
                    const wx = -half + bx * sw;
                    const wz = -half + by * sw;
                    // 查找 splat map 中的地形类型
                    const sx = Math.floor((wx + half) / (currentMapData.size / splatSize));
                    const sy = Math.floor((wz + half) / (currentMapData.size / splatSize));
                    const typeIdx = (sx >= 0 && sx < splatSize && sy >= 0 && sy < splatSize)
                        ? splat[sy * splatSize + sx] : 0;
                    const texCanvas = texCanvases[Math.min(typeIdx, 5)];

                    // 从纹理中采样对应区域绘制到输出
                    const texX = ((wx % (currentMapData.size / 8)) / (currentMapData.size / 8) * 256 + 256) % 256;
                    const texY = ((wz % (currentMapData.size / 8)) / (currentMapData.size / 8) * 256 + 256) % 256;
                    ctx.drawImage(texCanvas,
                        texX, texY, blockSize * sw / (currentMapData.size / 8) * 256, blockSize * sw / (currentMapData.size / 8) * 256,
                        bx, by, blockSize, blockSize
                    );
                }
            }

            return canvas;
        }

        // 获取世界坐标处的地貌类型名称
        function getTerrainTypeAt(x, z) {
            if (!currentMapData || isVersusMap) return 'grass';
            const half = currentMapData.size / 2;
            const s = currentMapData.size / 256;
            const sx = Math.floor((x + half) / s);
            const sy = Math.floor((z + half) / s);
            if (sx < 0 || sx >= 256 || sy < 0 || sy >= 256) return currentMapData.terrainTypes.default || 'grass';
            const splat = generateSplatMap();
            const idx = splat[sy * 256 + sx];
            return TERRAIN_TYPE_NAMES[Math.min(idx, 5)];
        }

        function initAudio() {

        function startEngineSound() {
            ensureAudio();
            if (engineNodes) return;
            // 低频引擎轰鸣（锯齿波 + 次谐波）
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'sawtooth'; osc1.frequency.value = 35;
            osc2.type = 'sawtooth'; osc2.frequency.value = 70;
            gain.gain.value = 0;
            osc1.connect(gain); osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(); osc2.start();

            // 履带咔嗒声（白噪声 → 带通滤波）
            const bufSize = audioCtx.sampleRate * 2;
            const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noiseSrc = audioCtx.createBufferSource();
            noiseSrc.buffer = noiseBuf;
            noiseSrc.loop = true;
            const bpFilter = audioCtx.createBiquadFilter();
            bpFilter.type = 'bandpass';
            bpFilter.frequency.value = 600;
            bpFilter.Q.value = 2;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0;
            noiseSrc.connect(bpFilter);
            bpFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseSrc.start();

            engineNodes = { osc1, osc2, gain, noiseGain, bpFilter };
        }

        function updateEngineSound(speed) {
            if (!engineNodes) return;
            const absSpeed = Math.abs(speed);
            const vol = Math.min(0.1, absSpeed * 0.025);
            engineNodes.gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1);
            const freq = 30 + absSpeed * 6;
            engineNodes.osc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            engineNodes.osc2.frequency.setTargetAtTime(freq * 2, audioCtx.currentTime, 0.1);
            // 履带声
            engineNodes.noiseGain.gain.setTargetAtTime(
                Math.min(0.06, absSpeed * 0.015), audioCtx.currentTime, 0.08);
            engineNodes.bpFilter.frequency.setTargetAtTime(
                400 + absSpeed * 80, audioCtx.currentTime, 0.08);
        }

        function stopEngineSound() {
            if (!engineNodes) return;
            engineNodes.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
            engineNodes.noiseGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
            setTimeout(() => {
                if (engineNodes) {
                    try { engineNodes.osc1.stop(); } catch(e){}
                    try { engineNodes.osc2.stop(); } catch(e){}
                    engineNodes = null;
                }
            }, 500);
        }

            const src = audioCtx.createBufferSource(); src.buffer = buf;

        // 地形参数访问器（优先从 currentMapData 读取，回退到默认值）
        function _t(key, fallback) {
            if (!currentMapData || !currentMapData.terrain) return fallback;
            return currentMapData.terrain[key] || fallback;
        }
        function _getPond() { return _t('pond', null); }
        function _getRiver() { return _t('river', null); }
        function _getHill() { return _t('hill', null); }
        function _getBasin() { return _t('basin', null); }
        function _getBridge() {
            if (currentMapData && currentMapData.bridges) return currentMapData.bridges[0];
            return { cx: 0, halfW: 4, deckH: 0.35 };
        }
        function _getWaterLevel(type) {
            if (currentMapData && currentMapData.waters && currentMapData.waters[type])
                return currentMapData.waters[type].waterLevel || -1;
            return -1;
        }

        function riverCenterZ(x) {
            const r = _getRiver(); if (!r) return -60;
            return r.zc + r.amp * Math.sin(x / r.period);
        }
        function riverHalfWidth(x) {
            const r = _getRiver(); if (!r) return 6.25;
            return r.hwBase + r.hwVar * Math.sin(x / r.hwPeriod + r.hwPhase);
        }
        function isOnBridge(x) {
            const b = _getBridge(); return x >= b.cx - b.halfW && x <= b.cx + b.halfW;
        }
        function isOnBridgeSurface(x, z) {
            if (!isOnBridge(x)) return false;
            const rzc = riverCenterZ(x), rhw = riverHalfWidth(x) + 0.8;
            return Math.abs(z - rzc) <= rhw;
        }

        function getGroundHeight(x, z) {
            if (isVersusMap) return 0;
            return isOnBridgeSurface(x, z) ? BRIDGE_SURFACE_Y : getTerrainHeight(x, z);
        }

        function getTerrainHeight(x, z) {
            if (isVersusMap) return 0;
            let y = 0;
            // ── 池塘 ──
            const pond = _getPond();
            if (pond) {
                const px = x - pond.cx, pz = z - pond.cz;
                const eggDist = Math.sqrt((px*px)/(pond.rx*pond.rx) + (pz*pz)/(pond.rz*pond.rz));
                if (eggDist < 1.0) {
                    const tt = 1.0 - eggDist;
                    y -= pond.depth * tt * tt * (3.0 - 2.0 * tt);
                }
            }
            // ── 河流 ──
            const river = _getRiver();
            if (river) {
                const rzc = riverCenterZ(x), rhw = riverHalfWidth(x);
                const rnd = Math.abs(z - rzc) / Math.max(rhw, 0.1);
                if (rnd < 1.0) {
                    const tt = 1.0 - rnd;
                    y -= river.depth * tt * tt * (3.0 - 2.0 * tt);
                }
            }
            // ── 高地 ──
            const hill = _getHill();
            if (hill) {
                const hx = x - hill.cx, hz = z - hill.cz;
                const hd2 = hx*hx + hz*hz;
                const r2 = hill.radius * hill.radius;
                if (hd2 < r2 * 4) y += hill.height * Math.exp(-hd2 / r2);
            }
            // ── 盆地 ──
            const basin = _getBasin();
            if (basin) {
                const bx = x - basin.cx, bz = z - basin.cz;
                const bd2 = bx*bx + bz*bz;
                const r2 = basin.radius * basin.radius;
                if (bd2 < r2 * 4) y -= basin.depth * Math.exp(-bd2 / r2);
            }
            return y;
        }

        function isInPond(x, z) {
            const pond = _getPond(); if (!pond) return false;
            const px = x - pond.cx, pz = z - pond.cz;
            const margin = TANK_HALF_W + 0.3;
            const erx = pond.rx + margin, erz = pond.rz + margin;
            return Math.sqrt((px*px)/(erx*erx) + (pz*pz)/(erz*erz)) < 1.0;
        }
        function isInRiver(x, z) {
            if (!_getRiver()) return false;
            const margin = TANK_HALF_W + 0.3;
            const rzc = riverCenterZ(x), rhw = riverHalfWidth(x) + margin;
            return Math.abs(z - rzc) < rhw;
        }

            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            gameContainer.appendChild(renderer.domElement);

            // --- 共享光照添加到场景 ---
            function addLightingTo(trg) {
                trg.background = new THREE.Color('#7a9ab4');  // 天空底色（与天空穹顶地平线色匹配）
                trg.fog = new THREE.Fog('#5a7a9a', 80, 120);  // 雾色与天空融合
                trg.add(new THREE.AmbientLight('#ffffff', 0.6));
                trg.add(new THREE.HemisphereLight('#ffeeb1', '#446633', 0.5));
                const sun = new THREE.DirectionalLight('#fffef0', 2.5);
                sun.position.set(30, 40, 20);
                sun.castShadow = true;
                sun.shadow.mapSize.width = 2048;
                sun.shadow.mapSize.height = 2048;
                sun.shadow.camera.near = 0.5;
                sun.shadow.camera.far = 120;
                sun.shadow.camera.left = -60;
                sun.shadow.camera.right = 60;
                sun.shadow.camera.top = 60;
                sun.shadow.camera.bottom = -60;
                sun.shadow.bias = -0.0002;
                trg.add(sun);
            }

            // --- 主场景（统一使用 scene1，不再预建 scene2） ---
            // 双人模式通过 rebuildMap() 动态重建为平地地图
            scene1 = new THREE.Scene();
            addLightingTo(scene1);
            createSkyDome(scene1);
            createDistantMountains(scene1);
            createGround(scene1);
            createObstacles(scene1);

            // --- 默认活跃场景 ---
            scene = scene1;

            // --- 草丛覆盖（仅maps带grassCover的地图）---
            placeGrass();

            // --- 水面（池塘）—仅单人模式 ---
            if (!isVersusMap) createWaterSurface();

            // --- 河流（蛇形水面+桥梁）—仅单人模式 ---
            if (!isVersusMap) { createRiverWater(); createBridge(); }

            // --- 坦克 ---
            createTank();
            if (player1) {
                reloadBarGroup = player1.reloadBarGroup;
                reloadBarFill = player1.reloadBarFill;
            }

            // --- 摄像机 ---
            camera = new THREE.PerspectiveCamera(40, renderer.domElement.width / renderer.domElement.height, 0.5, 300);
            placeCamera();
        }

        // ==================== 地图重建（切换单人/双人场景） ====================
        function rebuildMap() {
            // 移除地面
            if (groundPlane) { scene.remove(groundPlane); groundPlane.geometry.dispose(); groundPlane.material.dispose(); }
            if (groundEdgeLine) { scene.remove(groundEdgeLine); groundEdgeLine.geometry.dispose(); groundEdgeLine.material.dispose(); groundEdgeLine = null; }
            // 移除水面
            if (waterPlane) { scene.remove(waterPlane); waterPlane.geometry.dispose(); waterPlane.material.dispose(); waterPlane = null; }
            // 移除河流
            if (riverWater) { scene.remove(riverWater); riverWater.geometry.dispose(); riverWater.material.dispose(); riverWater = null; }
            // 移除桥梁
            if (bridgeGroup) { bridgeGroup.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); }); scene.remove(bridgeGroup); bridgeGroup = null; }
            // 清除障碍物
            obstacleMeshes.forEach(g => {
                if (g.parent) g.parent.remove(g);
                g.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
            });
            obstacleMeshes = []; obstacleData = [];
            // 清除草丛
            clearGrass();
            // 重建地面
            createGround();
            // 重建草丛（仅带grassCover的地图）
            placeGrass();
            // 重建水景（仅单人模式）
            if (!isVersusMap) { createWaterSurface(); createRiverWater(); createBridge(); }
            // 重建障碍物
            createObstacles();
        }

        // ==================== 地面（200×200 = 1km²，分段地形+地貌纹理混合） ====================
        function createGround(targetScene = scene) {
            const SIZE = currentMapData ? currentMapData.size : WORLD_HALF * 2;
            const SEGS = 200;

            // ── 生成复合地貌纹理（splat map + 程序化纹理混合） ──
            let texture;
            try {
                const compCanvas = generateCompositeGroundTexture();
                texture = new THREE.CanvasTexture(compCanvas);
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                texture.repeat.set(1, 1);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.magFilter = THREE.LinearFilter;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.generateMipmaps = true;
            } catch (e) {
                // 纹理生成失败时回退到纯色
                console.warn('地貌纹理生成失败，回退纯色:', e);
                const fbCanvas = document.createElement('canvas');
                fbCanvas.width = fbCanvas.height = 256;
                const fbCtx = fbCanvas.getContext('2d');
                fbCtx.fillStyle = '#62994a';
                fbCtx.fillRect(0, 0, 256, 256);
                texture = new THREE.CanvasTexture(fbCanvas);
                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(SIZE / 5, SIZE / 5);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.magFilter = THREE.LinearFilter;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.generateMipmaps = true;
            }

            // ── 地形几何 ──
            let groundGeo;
            if (isVersusMap) {
                groundGeo = new THREE.PlaneGeometry(SIZE, SIZE);
            } else {
                groundGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEGS, SEGS);
                const pos = groundGeo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const gx = pos.getX(i);
                    const gy = pos.getY(i);
                    const wz = -gy;
                    const h = getTerrainHeight(gx, wz);
                    pos.setZ(i, h);
                }
                groundGeo.computeVertexNormals();
            }

            const groundMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.9,
                metalness: 0.0,
            });

            groundPlane = new THREE.Mesh(groundGeo, groundMat);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.position.y = isVersusMap ? -0.01 : 0;
            groundPlane.receiveShadow = true;
            groundPlane.name = 'ground';
            targetScene.add(groundPlane);

            // 边界线框
            const edgeGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(SIZE, SIZE));
            groundEdgeLine = new THREE.LineSegments(
                edgeGeo,
                new THREE.LineBasicMaterial({ color: '#c8e0b0', transparent: true, opacity: 0.4 })
            );
            groundEdgeLine.rotation.x = -Math.PI / 2;
            groundEdgeLine.position.y = 0.03;
            targetScene.add(groundEdgeLine);
        }

        // ==================== 程序化草丛覆盖系统（InstancedMesh 性能优化） ====================
        let grassInstances = [];  // { low, mid, high } → THREE.InstancedMesh

        // 合并多个几何体为单个 BufferGeometry
        function mergeGeometries(geos) {
            if (geos.length === 1) return geos[0].clone();
            let totalVerts = 0, totalIdx = 0;
            geos.forEach(g => { totalVerts += g.attributes.position.count; totalIdx += (g.index ? g.index.count : g.attributes.position.count); });
            const posArr = new Float32Array(totalVerts * 3);
            const normArr = new Float32Array(totalVerts * 3);
            const idxArr = new Uint32Array(totalIdx);
            let vo = 0, io = 0, bv = 0;
            geos.forEach(g => {
                const gp = g.attributes.position.array;
                const gn = g.attributes.normal ? g.attributes.normal.array : new Float32Array(g.attributes.position.count * 3);
                const gi = g.index ? g.index.array : null;
                posArr.set(gp, vo * 3);
                normArr.set(gn, vo * 3);
                if (gi) {
                    for (let i = 0; i < gi.length; i++) idxArr[io + i] = gi[i] + bv;
                    io += gi.length;
                } else {
                    for (let i = 0; i < gp.length / 3; i++) idxArr[io + i] = bv + i;
                    io += gp.length / 3;
                }
                bv += g.attributes.position.count;
                vo += g.attributes.position.count;
            });
            const merged = new THREE.BufferGeometry();
            merged.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            merged.setAttribute('normal', new THREE.BufferAttribute(normArr, 3));
            merged.setIndex(new THREE.BufferAttribute(idxArr, 1));
            return merged;
        }

        // 创建弯曲草叶几何体（与 grass.js 相同算法，返回单个几何体）
        function createBladeGeo(startX, startZ, tipX, tipH, tipZ, baseR, tipR, curveSegs, radialSegs) {
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(startX, 0, startZ),
                new THREE.Vector3(tipX, tipH, tipZ),
                new THREE.Vector3(startX + (tipX - startX) * 0.7, tipH * 0.5, startZ + (tipZ - startZ) * 0.7)
            );
            const verts = [];
            for (let i = 0; i <= curveSegs; i++) {
                const t = i / curveSegs;
                const pt = curve.getPoint(t);
                const r = baseR + (tipR - baseR) * t;
                const tan = curve.getTangent(t).normalize();
                const up = new THREE.Vector3(0, 1, 0);
                const ax = new THREE.Vector3().crossVectors(up, tan).normalize();
                if (ax.length() < 0.01) ax.set(1, 0, 0);
                const ay = new THREE.Vector3().crossVectors(tan, ax).normalize();
                for (let j = 0; j < radialSegs; j++) {
                    const a = (j / radialSegs) * Math.PI * 2;
                    verts.push(pt.x + (Math.cos(a) * ax.x + Math.sin(a) * ay.x) * r,
                              pt.y + (Math.cos(a) * ax.y + Math.sin(a) * ay.y) * r,
                              pt.z + (Math.cos(a) * ax.z + Math.sin(a) * ay.z) * r);
                }
            }
            const idxs = [];
            for (let i = 0; i < curveSegs; i++) {
                for (let j = 0; j < radialSegs; j++) {
                    const a = i * radialSegs + j, b = i * radialSegs + (j+1) % radialSegs;
                    const c = (i+1) * radialSegs + j, d = (i+1) * radialSegs + (j+1) % radialSegs;
                    idxs.push(a,b,d, a,d,c);
                }
            }
            const tipV = curveSegs * radialSegs;
            const tp = curve.getPoint(1);
            verts.push(tp.x, tp.y, tp.z);
            for (let j = 0; j < radialSegs; j++) {
                idxs.push(tipV, ((curveSegs) * radialSegs + (j+1) % radialSegs), (curveSegs) * radialSegs + j);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(idxs);
            geo.computeVertexNormals();
            return geo;
        }

        // 创建合并后的草丛几何体（所有叶片合并为一个 Geometry）
        function createMergedBushGeo(config) {
            const { bladeCount, minH, maxH, clusterR, spreadA, baseR, tipR, curveSegs, radialSegs, seed } = config;
            const geos = [];
            function srand(s) { let x = Math.sin(s*127.1+311.7)*43758.5453; return x-Math.floor(x); }
            for (let i = 0; i < bladeCount; i++) {
                const s = seed + i * 0.618;
                const angle = srand(s) * Math.PI * 2;
                const dist = clusterR * Math.pow(srand(s+0.1), 0.55);
                const bx = Math.cos(angle) * dist, bz = Math.sin(angle) * dist;
                const h = minH + srand(s+0.2) * (maxH - minH);
                const ta = srand(s+0.3) * spreadA;
                const td = srand(s+0.4) * Math.PI * 2;
                const tx = bx + Math.cos(td) * Math.sin(ta) * h * 0.7;
                const tz = bz + Math.sin(td) * Math.sin(ta) * h * 0.7;
                const br = baseR * (0.8 + srand(s+0.5) * 0.4);
                const tr = tipR * (0.6 + srand(s+0.6) * 0.8);
                const g = createBladeGeo(bx, bz, tx, h, tz, br, tr, curveSegs, radialSegs);
                geos.push(g);
            }
            return mergeGeometries(geos);
        }

        // 判断某点应放置的草丛类型（基于上下文：距离水/泥/沙等非草地区域的距离）
        function determineGrassType(wx, wz, md, splat, half, splatSize) {
            const sx = Math.floor((wx + half) / (md.size / splatSize));
            const sy = Math.floor((wz + half) / (md.size / splatSize));
            if (sx < 0 || sx >= splatSize || sy < 0 || sy >= splatSize) return null;
            const idx = sy * splatSize + sx;
            const terrainIdx = splat[idx];
            // 只覆盖草地（index 0）
            if (terrainIdx !== 0) return null;

            // 检查周围是否有非草地地形（水域、泥地、沙地等）
            let minNonGrassDist = Infinity;

            // 检查附近是否有池塘（水面空气墙）
            if (md.terrain && md.terrain.pond) {
                const p = md.terrain.pond;
                const prx = p.rx + 3, prz = p.rz + 3;
                const dx = (wx - p.cx) / prx, dz = (wz - p.cz) / prz;
                const d = Math.sqrt(dx*dx + dz*dz);
                if (d < 1.0) return 'low'; // 池塘边缘只放低草
                minNonGrassDist = Math.min(minNonGrassDist, (d - 1) * Math.max(prx, prz));
            }

            // 检查附近是否有河流
            if (md.terrain && md.terrain.river) {
                const r = md.terrain.river;
                const rzc = r.zc + r.amp * Math.sin(wx / r.period);
                const rhw = r.hwBase + r.hwVar * Math.sin(wx / r.hwPeriod + r.hwPhase);
                const rDist = Math.abs(wz - rzc) - rhw;
                if (rDist < 2) return 'low'; // 河岸边只放低草
                minNonGrassDist = Math.min(minNonGrassDist, rDist);
            }

            // 扫描周围 splat 像素有无非草地
            const scanR = Math.ceil(4 / (md.size / splatSize)); // 扫描约4m范围
            let hasNonGrass = false;
            for (let dy = -scanR; dy <= scanR && !hasNonGrass; dy++) {
                for (let dx = -scanR; dx <= scanR; dx++) {
                    const nsx = sx + dx, nsy = sy + dy;
                    if (nsx >= 0 && nsx < splatSize && nsy >= 0 && nsy < splatSize) {
                        if (splat[nsy * splatSize + nsx] !== 0) {
                            hasNonGrass = true;
                            const d = Math.sqrt(dx*dx + dy*dy) * (md.size / splatSize);
                            minNonGrassDist = Math.min(minNonGrassDist, d);
                        }
                    }
                }
            }

            // 基于距离和其他因素决定草丛类型
            // 噪声值用于添加自然变化
            const noiseVal = Math.sin(wx * 0.73 + wz * 0.37) * 0.5 + Math.sin(wx * 0.19 - wz * 0.53) * 0.3 +
                             Math.sin((wx + wz) * 0.41) * 0.2;

            if (minNonGrassDist < 5) {
                // 靠近非草地：低草为主
                const t = minNonGrassDist / 5;
                return noiseVal + t > 0.3 ? 'low' : 'mid';
            } else if (minNonGrassDist < 12) {
                // 过渡带：混合低中高
                const t = (minNonGrassDist - 5) / 7;
                if (noiseVal < -0.3 + t * 0.3) return 'low';
                if (noiseVal > 0.4 - t * 0.2) return 'high';
                return 'mid';
            } else {
                // 开阔草地：中草为主，混高低
                if (noiseVal < -0.4) return 'low';
                if (noiseVal > 0.5) return 'high';
                return 'mid';
            }
        }

        function placeGrass() {
            const md = currentMapData;
            if (!md || !md.grassCover || !md.grassCover.enabled || isVersusMap) return;

            const gc = md.grassCover;
            const spacing = gc.spacing || 2.8;
            const half = md.size / 2;
            const splatSize = 256;
            const splat = generateSplatMap();

            // --- 预生成三种合并后的草丛几何体 ---
            const bushGeos = {
                low: createMergedBushGeo({
                    bladeCount: 10, minH: 0.2, maxH: 0.4,
                    clusterR: 0.30, spreadA: 0.35,
                    baseR: 0.012, tipR: 0.002,
                    curveSegs: 5, radialSegs: 5, seed: 100
                }),
                mid: createMergedBushGeo({
                    bladeCount: 15, minH: 0.4, maxH: 0.7,
                    clusterR: 0.45, spreadA: 0.45,
                    baseR: 0.016, tipR: 0.003,
                    curveSegs: 6, radialSegs: 5, seed: 200
                }),
                high: createMergedBushGeo({
                    bladeCount: 22, minH: 0.7, maxH: 1.0,
                    clusterR: 0.60, spreadA: 0.55,
                    baseR: 0.020, tipR: 0.004,
                    curveSegs: 7, radialSegs: 5, seed: 300
                })
            };

            // --- 材质 ---
            const mats = {
                low: new THREE.MeshStandardMaterial({
                    color: new THREE.Color('#5a8a3c'),
                    roughness: 0.75, metalness: 0.02,
                    flatShading: true, side: THREE.DoubleSide
                }),
                mid: new THREE.MeshStandardMaterial({
                    color: new THREE.Color('#6b9b4a'),
                    roughness: 0.75, metalness: 0.02,
                    flatShading: true, side: THREE.DoubleSide
                }),
                high: new THREE.MeshStandardMaterial({
                    color: new THREE.Color('#4a7a2e'),
                    roughness: 0.75, metalness: 0.02,
                    flatShading: true, side: THREE.DoubleSide
                })
            };

            // --- 收集实例变换 ---
            const instances = { low: [], mid: [], high: [] };
            const matrix = new THREE.Matrix4();
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();

            // 使用伪随机决定哪些位置放置草丛
            const density = gc.density || 0.65;
            let totalSampled = 0, totalPlaced = 0;

            for (let x = -half + spacing * 0.5; x < half; x += spacing) {
                for (let z = -half + spacing * 0.5; z < half; z += spacing) {
                    totalSampled++;
                    // 密度随机：不是所有格点都放草
                    const rnd = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
                    if ((rnd - Math.floor(rnd)) > density) continue;

                    const type = determineGrassType(x, z, md, splat, half, splatSize);
                    if (!type) continue;

                    totalPlaced++;

                    // 微调位置（±30cm随机偏移，避免网格感）
                    const jitterX = (Math.sin(x * 89.7 + z * 43.1) * 43758.5453 % 1 - 0.5) * spacing * 0.4;
                    const jitterZ = (Math.sin(x * 73.3 - z * 97.7) * 43758.5453 % 1 - 0.5) * spacing * 0.4;

                    // 获取地形高度
                    const h = getTerrainHeight(x + jitterX, z + jitterZ);

                    pos.set(x + jitterX, h, z + jitterZ);
                    // 随机 Y 旋转
                    const rotY = Math.sin(x * 53.7 + z * 37.1) * Math.PI; // 伪随机 0~2π
                    quat.setFromEuler(new THREE.Euler(0, rotY, 0));
                    matrix.compose(pos, quat, new THREE.Vector3(1, 1, 1));

                    instances[type].push(matrix.clone());
                }
            }

            // --- 按空间分块创建 InstancedMesh（支持距离剔除） ---
            const cellInstances = {}; // { 'cx_cz': {low:[], mid:[], high:[]} }
            const cellCenters = {};   // { 'cx_cz': {cx, cz} }
            const cellsX = Math.ceil(currentMapData.size / GRASS_CELL_SIZE);
            const cellsZ = Math.ceil(currentMapData.size / GRASS_CELL_SIZE);

            for (const [type, arr] of Object.entries(instances)) {
                for (const m of arr) {
                    const x = m.elements[12], z = m.elements[14];
                    const cx = Math.floor((x + half) / GRASS_CELL_SIZE);
                    const cz = Math.floor((z + half) / GRASS_CELL_SIZE);
                    const key = cx + '_' + cz;
                    if (!cellInstances[key]) {
                        cellInstances[key] = { low: [], mid: [], high: [] };
                        cellCenters[key] = { cx: (cx + 0.5) * GRASS_CELL_SIZE - half, cz: (cz + 0.5) * GRASS_CELL_SIZE - half };
                    }
                    cellInstances[key][type].push(m);
                }
            }

            for (const [key, cell] of Object.entries(cellInstances)) {
                for (const [type, arr] of Object.entries(cell)) {
                    if (arr.length === 0) continue;
                    const im = new THREE.InstancedMesh(bushGeos[type], mats[type], arr.length);
                    im.castShadow = true;
                    im.receiveShadow = true;
                    im.name = 'grass_' + type + '_' + key;
                    im.userData.cx = cellCenters[key].cx;
                    im.userData.cz = cellCenters[key].cz;
                    arr.forEach((m, i) => { im.setMatrixAt(i, m); });
                    im.instanceMatrix.needsUpdate = true;

                    // 随机颜色变化（每实例）
                    const color = new THREE.Color();
                    const baseColors = {
                        low: [[0.35, 0.54, 0.24], [0.30, 0.48, 0.20], [0.40, 0.58, 0.28]],
                        mid: [[0.42, 0.61, 0.29], [0.36, 0.54, 0.24], [0.34, 0.50, 0.22]],
                        high: [[0.29, 0.44, 0.18], [0.24, 0.38, 0.15], [0.32, 0.48, 0.20]]
                    };
                    const bc = baseColors[type];
                    for (let i = 0; i < arr.length; i++) {
                        const pick = bc[i % bc.length];
                        const r = pick[0] + (Math.sin(i * 0.73) * 0.5 + 0.5) * 0.06;
                        const g = pick[1] + (Math.sin(i * 0.97) * 0.5 + 0.5) * 0.06;
                        const b = pick[2] + (Math.sin(i * 0.53) * 0.5 + 0.5) * 0.04;
                        color.setRGB(r, g, b);
                        im.setColorAt(i, color);
                    }
                    im.instanceColor.needsUpdate = true;

                    scene.add(im);
                    grassInstances.push(im);
                }
            }

            // 清理不再需要的原始几何体（已拷贝到 InstancedMesh 中）
            Object.values(bushGeos).forEach(g => g.dispose());

            console.log('🌿 草丛覆盖完成: 采样' + totalSampled + '格点, 放置' + totalPlaced +
                '簇 (低' + (instances.low.length) + ' 中' + (instances.mid.length) +
                ' 高' + (instances.high.length) + '), 共' + grassInstances.length + ' draw calls ('
                + Object.keys(cellInstances).length + '个分块)');
        }

        // 清理草丛
        function clearGrass() {
            grassInstances.forEach(im => {
                if (im.parent) im.parent.remove(im);
                im.geometry.dispose();
                im.material.dispose();
            });
            grassInstances = [];
            grassTriCount = 0;
        }

        // ==================== 水面 ====================
        let waterPlane = null, groundEdgeLine = null;
        function createWaterSurface() {
            const pond = _getPond(); if (!pond) return;
            const wrx = pond.rx - 0.8, wrz = pond.rz - 0.8;
            const wGeo = new THREE.PlaneGeometry(wrx * 2, wrz * 2);
            const wMat = new THREE.MeshStandardMaterial({
                color: '#3388bb', roughness: 0.15, metalness: 0.1,
                transparent: true, opacity: 0.55, depthWrite: false,
            });
            waterPlane = new THREE.Mesh(wGeo, wMat);
            waterPlane.rotation.x = -Math.PI / 2;
            waterPlane.position.set(pond.cx, _getWaterLevel('pond'), pond.cz);
            waterPlane.name = 'water';
            waterPlane.receiveShadow = true;
            scene.add(waterPlane);
        }

        // ==================== 河流（蛇形水面+桥梁） ====================
        let riverWater = null, bridgeGroup = null;
        function createRiverWater() {
            if (!_getRiver()) return;  // 地图没有河流则不创建
            const segs = 200;
            const len = (currentMapData ? currentMapData.size : WORLD_HALF * 2);
            const half = len / 2;
            const verts = [];
            const indices = [];
            for (let i = 0; i <= segs; i++) {
                const x = -half + i * len / segs;
                const zc = riverCenterZ(x), hw = riverHalfWidth(x) - 0.5;
                verts.push(x, RIVER_WATER_LEVEL, zc + hw);
                verts.push(x, RIVER_WATER_LEVEL, zc - hw);
            }
            for (let i = 0; i < segs; i++) {
                const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
                indices.push(a, c, b, b, c, d);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({
                color: '#3388bb', roughness: 0.12, metalness: 0.05,
                transparent: true, opacity: 0.6, depthWrite: false,
            });
            riverWater = new THREE.Mesh(geo, mat);
            riverWater.name = 'riverWater';
            riverWater.receiveShadow = true;
            scene.add(riverWater);
        }
        // 河流碰撞体（桥所在位置除外）
        let riverColliders = [];

        function createBridge() {
            if (!_getRiver()) return;
            const b = _getBridge();
            const r = _getRiver();
            const bCX = b.cx, bHW = b.halfW;
            bridgeGroup = new THREE.Group();
            riverColliders = []; // 每次创建桥时重置碰撞体
            const bz = riverCenterZ(bCX);
            const bhw = riverHalfWidth(bCX);
            const spanZ = (bhw + 0.8) * 2;
            const matDeck = new THREE.MeshStandardMaterial({ color: '#8B7355', roughness: 0.7, metalness: 0.1 });
            const matRail = new THREE.MeshStandardMaterial({ color: '#6B5340', roughness: 0.6, metalness: 0.2 });
            const deck = new THREE.Mesh(new THREE.BoxGeometry(bHW * 2, BRIDGE_DECK_H, spanZ), matDeck);
            deck.position.set(bCX, 0, bz);
            deck.receiveShadow = true; deck.castShadow = true;
            bridgeGroup.add(deck);
            for (const side of [-1, 1]) {
                const rx = bCX + side * (bHW - 0.25);
                const railTop = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, spanZ - 0.6), matRail);
                railTop.position.set(rx, BRIDGE_SURFACE_Y + 0.525, bz);
                railTop.receiveShadow = true; railTop.castShadow = true;
                bridgeGroup.add(railTop);
                const railMid = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, spanZ - 0.6), matRail);
                railMid.position.set(rx, BRIDGE_SURFACE_Y + 0.175, bz);
                bridgeGroup.add(railMid);
                for (let pz = bz - spanZ / 2 + 0.8; pz <= bz + spanZ / 2 - 0.8; pz += 2) {
                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), matRail);
                    post.position.set(rx, BRIDGE_SURFACE_Y + 0.225, pz);
                    bridgeGroup.add(post);
                }
            }
            const matPier = new THREE.MeshStandardMaterial({ color: '#9B9B9B', roughness: 0.5, metalness: 0.1 });
            const rDepth = r.depth || 5;
            const pierH = rDepth + Math.abs(RIVER_WATER_LEVEL) - BRIDGE_DECK_H / 2;
            for (const pz of [bz - bhw * 0.5, bz + bhw * 0.5]) {
                for (const px of [bCX - bHW + 2, bCX + bHW - 2]) {
                    const pier = new THREE.Mesh(new THREE.BoxGeometry(0.5, pierH, 0.5), matPier);
                    pier.position.set(px, RIVER_WATER_LEVEL - rDepth + pierH / 2, pz);
                    pier.castShadow = true; pier.receiveShadow = true;
                    bridgeGroup.add(pier);
                }
            }
            bridgeGroup.name = 'bridge';
            scene.add(bridgeGroup);

            // 定义河岸碰撞体（桥两端阻止坦克掉入河流）
            const shoreRadius = bHW * 1.2;
            // 桥前的河岸碰撞点
            riverColliders.push({ x: bCX, z: bz - bhw - 1, radius: shoreRadius });
            // 桥后的河岸碰撞点
            riverColliders.push({ x: bCX, z: bz + bhw + 1, radius: shoreRadius });
        }

        // ==================== 坦克模型（双 GLB：1P绿色 + 2P黄色，程序化回退） ====================
        // 两个独立的 GLB 缓存（分别加载绿色和黄色模型）
        const _glbCaches = {
            green: { key: 'green', path: 'models/glb/t34-85_textured.glb', cache: {}, pending: [] },
            yellow: { key: 'yellow', path: 'models/glb/t34-85_textured_yellow.glb', cache: {}, pending: [] }
        };

        function createPlayerTank(player) {
            const group = new THREE.Group();
            group.rotation.order = 'YXZ'; // 先偏航再俯仰，确保坡度俯仰跟随坦克朝向
            group.position.set(player.state.x, 0, player.state.z);
            group.rotation.y = player.state.yaw;
            player.group = group;
            player.hull = group; // GLB 无独立 hull，整体 pitch 用 group 代替
            player.leftWheels = [];
            player.rightWheels = [];
            scene.add(group);

            // 1P 绿色，2P 黄色
            const is1P = (player === player1);
            const bag = is1P ? _glbCaches.green : _glbCaches.yellow;
            const label = bag.key;

            // file:// 协议下浏览器禁止跨源加载外部文件，直接回退程序化模型
            if (document.location.protocol === 'file:') {
                console.log('📄 file:// 协议，跳过 GLB 加载，使用程序化模型');
                fallbackProgrammatic(player, group);
                return;
            }

            // 已缓存 → 直接克隆
            if (bag.cache.model) {
                spawnFromCache(player, group, bag);
                return;
            }

            // 正在加载中 → 加入等待队列
            bag.pending.push({ player, group });

            // 首次加载（通过 pending.length === 1 防重复触发）
            if (bag.pending.length === 1) {
                const loader = new THREE.GLTFLoader();
                loader.load(bag.path,
                    (gltf) => {
                        bag.cache.model = gltf.scene;
                        bag.cache.bbox = new THREE.Box3().setFromObject(gltf.scene);
                        const sz = new THREE.Vector3();
                        bag.cache.bbox.getSize(sz);
                        bag.cache.center = new THREE.Vector3();
                        bag.cache.bbox.getCenter(bag.cache.center);

                        // 目标：模型长度(Z) = HULL_L 1.70（与碰撞体系一致）
                        const targetLen = 1.70;
                        bag.cache.baseScale = targetLen / sz.z;
                        console.log('✅ GLB(' + label + ') 加载成功 | 原始:',
                            sz.x.toFixed(3), '×', sz.y.toFixed(3), '×', sz.z.toFixed(3),
                            '| 缩放: ×' + bag.cache.baseScale.toFixed(4),
                            '| TANK_HALF_W=' + TANK_HALF_W.toFixed(2));

                        bag.pending.forEach(p => spawnFromCache(p.player, p.group, bag));
                        bag.pending.length = 0;
                    },
                    (p) => { /* 进度回调已屏蔽，减少控制台输出 */ },
                    (err) => {
                        console.warn('⚠️ GLB(' + label + ') 加载失败，回退程序化:', err.message);
                        bag.pending.forEach(p => fallbackProgrammatic(p.player, p.group));
                        bag.pending.length = 0;
                    }
                );
            }
        }

        function spawnFromCache(player, group, bag) {
            const model = bag.cache.model.clone(true);
            const s = bag.cache.baseScale;

            // 缩放 + 居中 + 阴影
            model.scale.setScalar(s);
            model.position.set(
                -bag.cache.center.x * s,
                -bag.cache.bbox.min.y * s,
                -bag.cache.center.z * s
            );

            // 遍历所有网格：开启阴影投射与接收
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            group.add(model);

            if (player === player1) {
                tankGroup = player1.group;
                tankHull = player1.hull;
                leftWheels = player1.leftWheels;
                rightWheels = player1.rightWheels;
            }
        }

        function fallbackProgrammatic(player, group) {
            const camo = player.camoColor === 'desert' ? 't34-85-desert' : 't34-85-green';
            const tankGroup = window.ModelRegistry.getModel('tanks', camo)({
                camoColor: player.camoColor,
                position: { x: player.state.x, y: 0, z: player.state.z },
                yaw: player.state.yaw
            });
            while (tankGroup.children.length > 0) {
                group.add(tankGroup.children[0]);
            }
            player.hull = tankGroup.userData.hull || group;
            player.leftWheels = tankGroup.userData.leftWheels || [];
            player.rightWheels = tankGroup.userData.rightWheels || [];
            group.position.copy(tankGroup.position);
            group.rotation.copy(tankGroup.rotation);
            if (tankGroup.userData.hull) {
                player.hull = tankGroup.userData.hull;
            }
            console.log('🔄 已回退到程序化 T-34/85 模型');
        }

        // 创建单人模式坦克（T-34/85 模型）
        function createTank() {
            const p = createPlayer('green', 0, 0, Math.PI/2, true);
            createPlayerTank(p);  // 创建 3D 模型（设置 p.group）
            // 把 player 的属性映射到全局变量

            player1 = p;
