        }

        // ==================== 泊松盘采样 ====================
        function poissonDiskSampling(cx, cz, totalRadius, minDist, safeRadius, maxPoints, excludeFn) {
            const cellSize = minDist / Math.sqrt(2);
            const gridSize = Math.ceil(2 * totalRadius / cellSize) + 1;
            const grid = new Array(gridSize * gridSize).fill(-1);
            const points = [];
            const active = [];

            function worldToGrid(x, z) {
                const gx = Math.floor((x - cx + totalRadius) / cellSize);
                const gz = Math.floor((z - cz + totalRadius) / cellSize);
                return { gx, gz };
            }
            function gridIdx(gx, gz) {
                return gz * gridSize + gx;
            }
            function inSafeZone(x, z) {
                return (x - cx) ** 2 + (z - cz) ** 2 < safeRadius ** 2;
            }
            function inExcluded(x, z) {
                return excludeFn ? excludeFn(x, z) : false;
            }
            function inBounds(x, z) {
                return Math.abs(x - cx) < totalRadius && Math.abs(z - cz) < totalRadius;
            }
            function hasConflict(x, z, gx, gz) {
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        const nx = gx + dx, nz = gz + dz;
                        if (nx < 0 || nx >= gridSize || nz < 0 || nz >= gridSize) continue;
                        const idx = grid[gridIdx(nx, nz)];
                        if (idx === -1) continue;
                        const p = points[idx];
                        if ((x - p.x) ** 2 + (z - p.z) ** 2 < minDist ** 2) return true;
                    }
                }
                return false;
            }

            // 第一个点
            let first = null;
            for (let a = 0; a < 200; a++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = safeRadius + minDist + Math.random() * (totalRadius - safeRadius - minDist);
                const tx = cx + Math.cos(angle) * dist;
                const tz = cz + Math.sin(angle) * dist;
                if (inBounds(tx, tz) && !inSafeZone(tx, tz) && !inExcluded(tx, tz)) {
                    first = { x: tx, z: tz };
                    break;
                }
            }
            if (!first) {
                first = { x: cx + safeRadius + minDist, z: cz };
            }

            points.push(first);
            active.push(0);
            const { gx: fgx, gz: fgz } = worldToGrid(first.x, first.z);
            grid[gridIdx(fgx, fgz)] = 0;

            while (active.length > 0 && points.length < maxPoints) {
                const ai = Math.floor(Math.random() * active.length);
                const bi = active[ai];
                const base = points[bi];
                let found = false;

                for (let k = 0; k < 30; k++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = minDist + Math.random() * minDist;
                    const nx = base.x + Math.cos(angle) * dist;
                    const nz = base.z + Math.sin(angle) * dist;

                    if (!inBounds(nx, nz) || inSafeZone(nx, nz) || inExcluded(nx, nz)) continue;
                    const { gx, gz } = worldToGrid(nx, nz);
                    if (hasConflict(nx, nz, gx, gz)) continue;

                    const np = { x: nx, z: nz };
                    points.push(np);
                    const ni = points.length - 1;
                    active.push(ni);
                    grid[gridIdx(gx, gz)] = ni;
                    found = true;
                    break;
                }
                if (!found) active.splice(ai, 1);
            }

            return points;
        }

        // ==================== 障碍物生成（使用模型注册表） ====================

        // ==================== 障碍物遮挡物的动态可见更新 ====================
        function updateObstacleVisibility(extraPositions) {
            const r2 = OBS_VISIBLE_RADIUS * OBS_VISIBLE_RADIUS;
            for (let i = 0; i < obstacleMeshes.length; i++) {
                const o = obstacleData[i];
                let visible = false;
                // 主坦克位置
                const dx0 = tankState.x - o.x, dz0 = tankState.z - o.z;
                if ((dx0 * dx0 + dz0 * dz0) < r2) visible = true;
                // 额外位置（对战模式中的其他玩家）
                if (!visible && extraPositions) {
                    for (const ep of extraPositions) {
                        const dx = ep.x - o.x, dz = ep.z - o.z;
                        if ((dx * dx + dz * dz) < r2) { visible = true; break; }
                    }
                }
                if (obstacleMeshes[i].visible !== visible) {
                    obstacleMeshes[i].visible = visible;
                }
            }
        }

        // ==================== 草丛距离剔除 ====================
        function updateGrassVisibility(extraPositions) {
            if (grassInstances.length === 0) return;
            const r2 = GRASS_VISIBLE_RADIUS * GRASS_VISIBLE_RADIUS;
            for (const im of grassInstances) {
                const cx = im.userData.cx, cz = im.userData.cz;
                let visible = false;
                // 主坦克
                const dx0 = tankState.x - cx, dz0 = tankState.z - cz;
                if ((dx0 * dx0 + dz0 * dz0) < r2) visible = true;
                // 额外位置（对战模式中的其他玩家）
                if (!visible && extraPositions) {
                    for (const ep of extraPositions) {
                        const dx = ep.x - cx, dz = ep.z - cz;
                        if ((dx * dx + dz * dz) < r2) { visible = true; break; }
                    }
                }
                if (im.visible !== visible) im.visible = visible;
            }
        }

        function createObstacles(targetScene = scene) {
            obstacleMeshes.forEach(g => {
                if (g.parent) g.parent.remove(g);
                g.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
            });
            obstacleMeshes = [];
            obstacleData = [];

            const obsCfg = currentMapData && currentMapData.obstacles ? currentMapData.obstacles : { count: OBSTACLE_COUNT, minDist: POISSON_MIN_DIST, safeRadius: SAFE_ZONE_RADIUS, spawnRadius: SPAWN_RADIUS };
            const points = poissonDiskSampling(0, 0, obsCfg.spawnRadius || SPAWN_RADIUS, obsCfg.minDist || POISSON_MIN_DIST, obsCfg.safeRadius || SAFE_ZONE_RADIUS, obsCfg.count || OBSTACLE_COUNT);

            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                if (!isVersusMap) {
                    const pond = _getPond();
                    if (pond) {
                        const pxPond = p.x - pond.cx, pzPond = p.z - pond.cz;
                        const pondClear = pond.rx + 2.0, pondClearZ = pond.rz + 2.0;
                        if (Math.sqrt((pxPond*pxPond)/(pondClear*pondClear) + (pzPond*pzPond)/(pondClearZ*pondClearZ)) < 1.0) continue;
                    }
                    if (isInRiver(p.x, p.z)) continue;
                }
                const makeFn = window.ModelRegistry.randomObstacleMaker();
                const group = makeFn();
                const ud = group.userData;
                const baseHeightM = ud.height * METERS_PER_UNIT;
                const targetHeightM = ud.targetHeightMinM + Math.random() * (ud.targetHeightMaxM - ud.targetHeightMinM);
                const s = targetHeightM / baseHeightM;
                group.scale.setScalar(s);
                const obsY = isVersusMap ? 0 : getTerrainHeight(p.x, p.z);
                group.position.set(p.x, obsY, p.z);
                group.rotation.y = Math.random() * Math.PI * 2;
                group.visible = false;
                group.name = `obs-${i}`;
                targetScene.add(group);
                obstacleMeshes.push(group);
                obstacleData.push({ x: p.x, z: p.z, radius: ud.radius * s, height: ud.height * s, color: ud.color, blades: ud.blades || null });
            }

            updateObstacleVisibility();
            updateGrassVisibility();
        }

        // ==================== 运动状态 ====================
        const tankState = {
            x: 0,
            z: 0,
            yaw: Math.PI / 2,  // 朝向 +Z，与 player1 初始方向一致
        };
        let leftWheelAngle = 0;    // 左履带轮累积转动角
        let rightWheelAngle = 0;   // 右履带轮累积转动角

        // 缓动状态（平滑履带速度 + 俯仰）
        let currentLeftSpeed  = 0;
        let currentRightSpeed = 0;
        let prevForwardSpeed  = 0;
        let tankPitch         = 0;

        function moveToward(current, target, maxDelta) {
            if (Math.abs(target - current) <= maxDelta) return target;
            return current + Math.sign(target - current) * maxDelta;
        }

        function resetTank() {
            tankState.x = POINT_A_X;
            tankState.z = POINT_A_Z;
            tankState.yaw = Math.PI / 4; // 面向东北（朝桥梁/地图中心方向）
            leftWheelAngle = 0;
            rightWheelAngle = 0;
            currentLeftSpeed = 0;
            currentRightSpeed = 0;
            prevForwardSpeed = 0;
            tankPitch = 0;
            reloadTimer = 0;
            if (player1) player1.reloadTimer = 0;  // 同步玩家对象
            // 清除所有炮弹
            shells.forEach(s => { scene.remove(s.mesh); disposeShellMesh(s.mesh); if(s.tracerLight)scene.remove(s.tracerLight); if(s.glowTail){scene.remove(s.glowTail);s.glowTail.geometry.dispose();s.glowTail.material.dispose();} });
            shells = [];
            // 清除所有碎块
            fragments.forEach(f => { scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); });
            fragments = [];
            // 清除炮口焰
            muzzleLights.forEach(ml => { scene.remove(ml.light); if (ml.light.geometry) ml.light.geometry.dispose(); if (ml.light.material) ml.light.material.dispose(); });
            muzzleLights = [];
            // 清除所有爆炸效果
            explosions.forEach(e => { e.dispose(); });
            explosions = [];
            // 重置装填条（PlaneGeometry: scale.y=1, 底部对齐）
            if (reloadBarFill) {
                reloadBarFill.scale.y = 1;
                reloadBarFill.position.y = -0.36 + 0.33; // = -0.03, 满条中心偏下
                reloadBarFill.material.color.setRGB(1, 1, 0);
            }
            if (reloadBarGroup) reloadBarGroup.visible = false;
            tankGroup.position.set(0, 0, 0);
            tankGroup.rotation.set(0, 0, 0);
            // 隐藏损毁效果（血量重置）
            if (player1 && player1.damageEffects) player1.damageEffects.hide();
        }

        // ==================== 碰撞检测 ====================
        function checkCollision(x, z) {
            // 障碍物碰撞
            for (const obs of obstacleData) {
                const dx = x - obs.x;
                const dz = z - obs.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                const minDist = TANK_HALF_W + obs.radius;
                if (dist < minDist) {
                    const nx = dx / (dist || 0.001);
                    const nz = dz / (dist || 0.001);
                    const pushX = nx * (minDist - dist);
                    const pushZ = nz * (minDist - dist);
                    return { hit: true, pushX, pushZ };
                }
            }
            // 河流碰撞（桥面及桥头引道不阻挡，允许坦克驶上桥梁）
            if (!isOnBridgeSurface(x, z) && !isOnBridge(x)) for (const rc of riverColliders) {
                const rdx = x - rc.x;
                const rdz = z - rc.z;
                const rDist = Math.sqrt(rdx * rdx + rdz * rdz);
                const rMinDist = TANK_HALF_W + rc.radius;
                if (rDist < rMinDist) {
                    const rnx = rdx / (rDist || 0.001);
                    const rnz = rdz / (rDist || 0.001);
                    const pushX = rnx * (rMinDist - rDist);
                    const pushZ = rnz * (rMinDist - rDist);
                    return { hit: true, pushX, pushZ };
                }
            }
            return { hit: false, pushX: 0, pushZ: 0 };
        }

        // ==================== 火炮系统 ====================
        // 炮弹清理辅助：兼容 Mesh 和 Group
        function disposeShellMesh(mesh) {
            mesh.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            });
        }
        function fireShell(player) {
            if (!player && player1) player = player1; // 单人模式向后兼容
            if (player.reloadTimer > 0 || player.dead) return;
            player.reloadTimer = RELOAD_TIME;
            player.recoilPitch = RECOIL_PITCH; // 后坐力：车体后仰
            playFireSound();

            const barrelTipLocal = new THREE.Vector3(0, 0.58, 1.1);
            const barrelTipWorld = barrelTipLocal.clone().applyMatrix4(player.group.matrixWorld);
            const fx = Math.cos(player.state.yaw);
            const fz = Math.sin(player.state.yaw);

            const flashLight = new THREE.PointLight('#ffcc44', 15, 8, 2);
            flashLight.position.copy(barrelTipWorld); scene.add(flashLight);
            muzzleLights.push({ light: flashLight, life: 0.15 });

            const f1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color:'#ffaa00', transparent:true, opacity:0.9 }));
            f1.position.copy(barrelTipWorld); scene.add(f1); muzzleLights.push({ light: f1, life: 0.25 });

            const f2 = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 6), new THREE.MeshBasicMaterial({ color:'#ff6600', transparent:true, opacity:0.7 }));
            f2.position.copy(barrelTipWorld); scene.add(f2); muzzleLights.push({ light: f2, life: 0.35 });

            // ── 曳光弹：炮弹主体(圆柱身+锥形弹头) + 拖尾光球 ──
            const shellGroup = new THREE.Group();
            const shellMat = new THREE.MeshStandardMaterial({ color:'#ffcc00', roughness:0.05, metalness:0.3, emissive:'#ff9900', emissiveIntensity:2.5 });
            // 弹体：圆柱
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.18, 8), shellMat);
            body.rotation.x = Math.PI/2; body.castShadow = true;
            shellGroup.add(body);
            // 弹头：锥体
            const tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.08, 8), shellMat);
            tip.rotation.x = Math.PI/2; tip.position.z = 0.13; tip.castShadow = true;
            shellGroup.add(tip);
            shellGroup.position.copy(barrelTipWorld);
            scene.add(shellGroup);

            // 拖尾光球（在炮弹后方，模拟曳光弹尾迹）
            const glowTail = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 8, 8),
                new THREE.MeshBasicMaterial({ color:'#ff8800', transparent:true, opacity:0.60, depthWrite:false })
            );
            glowTail.position.copy(barrelTipWorld);
            glowTail.renderOrder = 999;
            glowTail.material.depthTest = true;
            scene.add(glowTail);

            const vel = new THREE.Vector3(fx * SHELL_SPEED, 0.3, fz * SHELL_SPEED);
            shells.push({ mesh: shellGroup, vel, owner: player, glowTail });
        }

        function spawnFragments(pos, color) {
            playDebrisSound();
            const fragMat = new THREE.MeshStandardMaterial({
                color, roughness: 0.6, metalness: 0.1
            });

            for (let i = 0; i < FRAG_COUNT; i++) {
                const size = 0.08 + Math.random() * 0.2;
                const geo = new THREE.BoxGeometry(
                    size * (0.5 + Math.random()),
                    size * (0.5 + Math.random()),
                    size * (0.5 + Math.random())
                );
                const mesh = new THREE.Mesh(geo, fragMat);
                mesh.position.copy(pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const upBias = 0.3 + Math.random() * 0.7;
                const speed = FRAG_SPEED * (0.4 + Math.random() * 0.6);
                const vel = new THREE.Vector3(
                    Math.cos(angle) * speed * (1 - upBias),
                    speed * upBias * 1.5,
                    Math.sin(angle) * speed * (1 - upBias)
                );

                fragments.push({
                    mesh,
                    vel,
                    life: FRAG_LIFE * (0.7 + Math.random() * 0.3),
                    rotSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10
                    )
                });
            }
        }

        // ==================== 坦克爆炸效果 & 殉爆系统 ====================
        const EXPLOSION_RADIUS = 3.5;  // 殉爆半径（米）
        const EXPLOSION_COLOR_TANK = '#ff6600';

        // 生成坦克死亡时的大型爆炸火焰烟雾
        // skipChain=true 时不触发连锁爆炸，防止无限递归
        function spawnExplosion(pos, skipChain) {
            const effect = new window.ExplosionEffects();
            scene.add(effect.firePoints);
            scene.add(effect.smokePoints);
            effect.trigger(pos.clone());
            explosions.push(effect);

            // 只有初始爆炸（非殉爆连锁的爆炸）才触发殉爆检查，防止无限递归
            if (!skipChain) {
                checkChainExplosion(pos);
            }
        }

        // 殉爆系统：坦克爆炸时引爆近距离的树木/建筑物，但不会伤害敌方坦克
        function checkChainExplosion(explosionPos) {
            const chainRadius = EXPLOSION_RADIUS;
            const chainRadiusSq = chainRadius * chainRadius;

            // 从后往前遍历，避免删除时索引问题
            for (let i = obstacleMeshes.length - 1; i >= 0; i--) {
                const obs = obstacleMeshes[i];
                const obsData = obstacleData[i];
                if (!obs.visible) continue;

                const dx = explosionPos.x - obsData.x;
                const dz = explosionPos.z - obsData.z;
                const distSq = dx * dx + dz * dz;

                // 在殉爆半径内，障碍物被引爆
                if (distSq < chainRadiusSq) {
                    // 获取障碍物中心点
                    const obsCenter = obs.position.clone();
                    obsCenter.y += (obsData.height || 1.5) / 2;

                    // 障碍物被殉爆：只产生碎块效果，不需要爆炸火焰
                    // 移除障碍物
                    obs.parent.remove(obs);
                    obs.traverse(c => {
                        if (c.geometry) c.geometry.dispose();
                        if (c.material) c.material.dispose();
                    });
                    obstacleMeshes.splice(i, 1);
                    obstacleData.splice(i, 1);
                }
            }
        }

        // ==================== 游戏循环 ====================
        const clock = new THREE.Clock();
        // FPS 计数器
        let fpsFrames = 0, fpsTime = 0, fpsCurrent = 0;
        let grassTriCount = 0; // 草丛三角面统计
        let visibilityTimer = 0;

        // ── 手柄 ──
        let gamepadFireReady = true; // 扳机松开后才允许再次开炮

        function getGamepad() {
            const gps = navigator.getGamepads();
            for (const gp of gps) {
                if (gp && gp.connected) return gp;
            }
            return null;
        }

        function stickToTarget(value) {
            // 摇杆推到底 → 全速；中等 → 2/3速；轻推 → 1/3速
            const abs = Math.abs(value);
            const sign = Math.sign(value);
            if (abs > 0.8) return sign;        // 3档 = 100%
            if (abs > 0.5) return sign * 0.66; // 2档 = 66%
            if (abs > 0.2) return sign * 0.33; // 1档 = 33%
            return 0;
        }

        function getTrackInput() {
            let left = 0, right = 0;

            // 键盘：W/S 左履带  ↑/↓ 右履带
            if (keys['KeyW']) left += 1;
            if (keys['KeyS']) left -= 1;
            if (keys['ArrowUp']) right += 1;
            if (keys['ArrowDown']) right -= 1;

            // 手柄：左摇杆Y→左履带  右摇杆Y→右履带  取摇杆/键盘中绝对值大者
            const gp = getGamepad();
            if (gp) {
                const gpLeft  = stickToTarget(-gp.axes[1]); // Y轴向上为负
                const gpRight = stickToTarget(-gp.axes[3]);
                if (Math.abs(gpLeft)  > Math.abs(left))  left  = gpLeft;
                if (Math.abs(gpRight) > Math.abs(right)) right = gpRight;
            }

            return { left, right };
        }

        function isFirePressed() {
            // 键盘空格
            if (keys['Space']) return true;
            // 手柄 RT扳机 (buttons[7] 模拟值 0~1)
            const gp = getGamepad();
            if (gp && gp.buttons[7] && gp.buttons[7].value > 0.3) return true;
            return false;
        }

        function gameLoop() {
            try {
            // 强制全屏渲染（防止之前双人模式残留 viewport/scissor 状态）
            renderer.setScissorTest(false);
            const cssW = window.innerWidth, cssH = window.innerHeight;
            renderer.setViewport(0, 0, cssW, cssH);
            camera.aspect = cssW / cssH;
            camera.updateProjectionMatrix();

            const dt = Math.min(clock.getDelta(), 0.1); // 防止大帧间隔
            visibilityTimer += dt;

            const { left: targetLeft, right: targetRight } = getTrackInput();

            // ── 履带速度缓动（加速 / 制动 / 惯性滑行） ──
            // 左履带
            if (targetLeft !== 0) {
                const tgt = targetLeft * MAX_SPEED;
                const sameDir = Math.sign(tgt) === Math.sign(currentLeftSpeed) || currentLeftSpeed === 0;
                const rate = sameDir ? TRACK_ACCEL * dt : TRACK_DECEL * dt; // 换向时先急刹
                currentLeftSpeed = moveToward(currentLeftSpeed, tgt, rate);
            } else {
                currentLeftSpeed = moveToward(currentLeftSpeed, 0, TRACK_COAST * dt);
            }
            // 右履带
            if (targetRight !== 0) {
                const tgt = targetRight * MAX_SPEED;
                const sameDir = Math.sign(tgt) === Math.sign(currentRightSpeed) || currentRightSpeed === 0;
                const rate = sameDir ? TRACK_ACCEL * dt : TRACK_DECEL * dt;
                currentRightSpeed = moveToward(currentRightSpeed, tgt, rate);
            } else {
                currentRightSpeed = moveToward(currentRightSpeed, 0, TRACK_COAST * dt);
            }

            // ── 差速驱动 ──
            const v     = (currentLeftSpeed + currentRightSpeed) / 2;
            const omega = (currentLeftSpeed - currentRightSpeed) / TRACK_SPACING;

            // 引擎/履带音效（用最快履带速度，确保原地旋转也有音效）
            updateEngineSound(Math.max(Math.abs(currentLeftSpeed), Math.abs(currentRightSpeed)));

            tankState.yaw += omega * dt;

            const forwardX = Math.cos(tankState.yaw);
            const forwardZ = Math.sin(tankState.yaw);
            let newX = tankState.x + forwardX * v * dt;
            let newZ = tankState.z + forwardZ * v * dt;

            for (let iter = 0; iter < 3; iter++) {
                const result = checkCollision(newX, newZ);
                if (result.hit) { newX += result.pushX; newZ += result.pushZ; } else break;
            }
            // 空气墙（世界边界）
            const wallMargin = TANK_HALF_W;
            newX = Math.max(-WORLD_HALF + wallMargin, Math.min(WORLD_HALF - wallMargin, newX));
            newZ = Math.max(-WORLD_HALF + wallMargin, Math.min(WORLD_HALF - wallMargin, newZ));
            // 池塘空气墙（阻止坦克驶入池塘）
            if (isInPond(newX, newZ)) {
                // 推回池塘边缘
                const px = newX - POND_CX, pz = newZ - POND_CZ;
                const margin = TANK_HALF_W + 0.3;
                const erx = POND_RX + margin, erz = POND_RZ + margin;
                const angle = Math.atan2(pz / erz, px / erx);
                newX = POND_CX + erx * Math.cos(angle);
                newZ = POND_CZ + erz * Math.sin(angle);
            }
            // 河流空气墙（桥梁区域可通过）
            if (isInRiver(newX, newZ) && !isOnBridge(newX)) {
                const rzc = riverCenterZ(newX), rhw = riverHalfWidth(newX) + TANK_HALF_W + 0.3;
                newZ = (newZ < rzc) ? rzc - rhw : rzc + rhw;
            }
            // 桥梁护栏碰撞（桥面上防止坦克侧向坠河）
            if (isOnBridgeSurface(newX, newZ)) {
                const b = _getBridge();
                const railLimit = b.halfW - 0.25;
                newX = Math.max(-railLimit + TANK_HALF_W, Math.min(railLimit - TANK_HALF_W, newX));
            }
            tankState.x = newX;
            tankState.z = newZ;

            // ── 俯仰效果（加减速时车体前倾/后仰） ──
            const forwardAccel = (v - prevForwardSpeed) / Math.max(dt, 0.001);
            const accelPitchTarget = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, forwardAccel * PITCH_GAIN));
            tankPitch += (accelPitchTarget - tankPitch) * Math.min(PITCH_SMOOTH * dt, 1);
            // 后坐力衰减（开炮时车体后仰，逐渐回正）
            let recoilP = 0;
            if (player1 && player1.recoilPitch !== 0) {
                player1.recoilPitch += (0 - player1.recoilPitch) * Math.min(RECOIL_DECAY * dt, 1);
                if (Math.abs(player1.recoilPitch) < 0.0005) player1.recoilPitch = 0;
                recoilP = player1.recoilPitch;
            }
            // 地形坡度俯仰（采样前后1m高度差）
            const sampleDist = 1.0;
            const frontH = getGroundHeight(newX + forwardX * sampleDist, newZ + forwardZ * sampleDist);
            const backH  = getGroundHeight(newX - forwardX * sampleDist, newZ - forwardZ * sampleDist);
            const terrainPitch = Math.atan2(frontH - backH, sampleDist * 2);
            // 地形坡度侧倾（采样左右1.5m高度差）
            const rxDir = Math.cos(tankState.yaw + Math.PI / 2);
            const rzDir = Math.sin(tankState.yaw + Math.PI / 2);
            const sideDist = 1.5;
            const leftH  = getGroundHeight(newX - rxDir * sideDist, newZ - rzDir * sideDist);
            const rightH = getGroundHeight(newX + rxDir * sideDist, newZ + rzDir * sideDist);
            const terrainRoll = Math.atan2(rightH - leftH, sideDist * 2);
            prevForwardSpeed = v;

            // ── 坦克3D更新 ──
            const groundY = getGroundHeight(tankState.x, tankState.z);
            tankGroup.position.set(tankState.x, groundY, tankState.z);
            tankGroup.rotation.set(-(tankPitch + terrainPitch + recoilP), Math.PI / 2 - tankState.yaw, -terrainRoll);
            // 同步 player1.state，fireShell 依赖它
            if (player1) {
                player1.state.x = tankState.x;
                player1.state.z = tankState.z;
                player1.state.yaw = tankState.yaw;
            }

            // ── 履带轮动画（使用当前实际速度驱动） ──
            const WHEEL_R = 0.13;
            leftWheelAngle  += currentLeftSpeed  * dt / WHEEL_R;
            rightWheelAngle += currentRightSpeed * dt / WHEEL_R;
            leftWheels.forEach(w => { w.rotation.x = leftWheelAngle; });
            rightWheels.forEach(w => { w.rotation.x = rightWheelAngle; });

            // ── 开炮（键盘空格 / 手柄RT扳机） ──
            const fireNow = isFirePressed();
            if (fireNow && gameMode === 'single' && gamepadFireReady) {
                fireShell();
                gamepadFireReady = false;
                keys['Space'] = false;
            }
            if (!fireNow) {
                gamepadFireReady = true;
            }

            // ── 炮弹更新 ──
            for (let i = shells.length - 1; i >= 0; i--) {
                const s = shells[i];
                // 保存上一帧位置用于扫掠碰撞检测
                const prevPos = s.prevPos || s.mesh.position.clone();
                s.vel.y -= SHELL_GRAVITY * dt;
                s.mesh.position.x += s.vel.x * dt;
                s.mesh.position.y += s.vel.y * dt;
                s.mesh.position.z += s.vel.z * dt;
                s.prevPos = s.mesh.position.clone();
                if (s.vel.lengthSq() > 0.01) {
                    s.mesh.lookAt(s.mesh.position.clone().add(s.vel));
                }
                // 曳光弹：光源跟随炮弹，拖尾光球略落后方
                if (s.tracerLight) s.tracerLight.position.copy(s.mesh.position);
                if (s.glowTail) {
                    const velDir = s.vel.clone().normalize();
                    s.glowTail.position.copy(s.mesh.position).addScaledVector(velDir, -0.18);
                }

                // 碰撞检测：炮弹 vs 障碍物（扫掠检测防穿越）
                let hit = false;
                const shellR = 0.18;
                const moveVec = new THREE.Vector3().subVectors(s.mesh.position, prevPos);
                const moveLen = moveVec.length();
                for (let j = obstacleMeshes.length - 1; j >= 0; j--) {
                    const obs = obstacleMeshes[j];
                    if (!obs.visible) continue;
                    const obsData = obstacleData[j];
                    const obsRadius = obsData.radius || 0.55;
                    const combinedR = shellR + obsRadius;
                    const obsCenter = new THREE.Vector3(obs.position.x, obs.position.y, obs.position.z);
                    const obsTop = obsData.height || 1.5;

                    // 垂直方向：炮弹必须经过障碍物高度范围
                    const prevY = prevPos.y, currY = s.mesh.position.y;
                    // 不检测下方（炮弹从地面发射，障碍物也在地面），仅做上方快速剔除优化
                    const obsTopLimit = obs.position.y + obsTop + 0.3;
                    if (currY > obsTopLimit && prevY > obsTopLimit) continue;

                    // 水平扫掠检测：炮弹移动路径 vs 障碍物圆柱
                    let horizHit = false;
                    if (moveLen < 0.0001) {
                        // 静止：直接检测当前位置
                        const dx = s.mesh.position.x - obs.position.x;
                        const dz = s.mesh.position.z - obs.position.z;
                        horizHit = (dx * dx + dz * dz) < combinedR * combinedR;
                    } else {
                        // 扫掠检测：从prevPos到currentPos的线段 vs 障碍物圆盘
                        const ox = obs.position.x, oz = obs.position.z;
                        const px = prevPos.x, pz = prevPos.z;
                        const vx = s.mesh.position.x - px, vz = s.mesh.position.z - pz;

                        // 求解：|P + t*V - O| = R, 0 <= t <= 1
                        const dx0 = px - ox, dz0 = pz - oz;
                        const a = vx * vx + vz * vz;
                        const b = 2 * (dx0 * vx + dz0 * vz);
                        const c = dx0 * dx0 + dz0 * dz0 - combinedR * combinedR;

                        const disc = b * b - 4 * a * c;
                        if (disc >= 0) {
                            const sqrtDisc = Math.sqrt(disc);
                            const t1 = (-b - sqrtDisc) / (2 * a);
                            const t2 = (-b + sqrtDisc) / (2 * a);
                            if ((t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1) || (t1 < 0 && t2 > 1)) {
                                horizHit = true;
                            }
                        }
                    }

                    if (horizHit) {
                        const obsWorldPos = obs.position.clone(); obsWorldPos.y += obsTop/2;
                        spawnFragments(obsWorldPos, obsData.color);
                        playExplosionSound();
                        if (obs.parent) {
                            obs.parent.remove(obs);
                            obs.traverse(c => { if(c.geometry)c.geometry.dispose(); if(c.material)c.material.dispose(); });
                        }
                        obstacleMeshes.splice(j,1); obstacleData.splice(j,1);
                        hit = true; break;
                    }
                }

                // 双人模式：炮弹 vs 敌方坦克
                if (!hit && gameMode === 'versus' && s.owner) {
                    const enemy = s.owner === player1 ? player2 : player1;
                    if (enemy && !enemy.dead) {
                        const edx = s.mesh.position.x - enemy.state.x;
                        const edz = s.mesh.position.z - enemy.state.z;
                        const eDist = Math.sqrt(edx*edx + edz*edz);
                        if (eDist < TANK_HALF_W + 0.2 && s.mesh.position.y < 1.0) {
                            enemy.hp -= SHELL_DAMAGE;
                            if (enemy.hp < 0) enemy.hp = 0;
                            hit = true;
                            if (enemy.hp <= 0) {
                                enemy.dead = true;
                                const ep = enemy.group.position.clone(); ep.y += 0.5;
                                spawnFragments(ep, enemy.camoColor==='desert'?'#8b7d4a':'#4a5c2e');
                                playExplosionSound();
                                enemy.group.visible = false;
                                setTimeout(() => showVersusResult(s.owner), 2000);
                            } else {
                                // 受伤但不致命：火花 + 命中音效
                                const hitPos = s.mesh.position.clone();
                                spawnHitSparks(hitPos);
                            }
                        }
                    }
                }

                // 删除条件
                const distRef = gameMode === 'versus' && s.owner ? s.owner : { state: tankState };
                const refX = distRef.state ? distRef.state.x : tankState.x;
                const refZ = distRef.state ? distRef.state.z : tankState.z;
                const distToTank = Math.sqrt((s.mesh.position.x-refX)**2 + (s.mesh.position.z-refZ)**2);
                const shellGroundY = getGroundHeight(s.mesh.position.x, s.mesh.position.z);
                if (hit || s.mesh.position.y < shellGroundY || distToTank > SHELL_MAX_DIST ||
                    Math.abs(s.mesh.position.x) > WORLD_HALF+50 || Math.abs(s.mesh.position.z) > WORLD_HALF+50) {
                    scene.remove(s.mesh); disposeShellMesh(s.mesh);
                    if (s.tracerLight) { scene.remove(s.tracerLight); }
                    if (s.glowTail) { scene.remove(s.glowTail); s.glowTail.geometry.dispose(); s.glowTail.material.dispose(); }
                    shells.splice(i, 1);
                }
            }

            // ── 碎块更新 ──
            for (let i = fragments.length - 1; i >= 0; i--) {
                const f = fragments[i];
                f.life -= dt;
                f.vel.y -= SHELL_GRAVITY * dt;
                f.mesh.position.x += f.vel.x * dt;
                f.mesh.position.y += f.vel.y * dt;
                f.mesh.position.z += f.vel.z * dt;
                f.mesh.rotation.x += f.rotSpeed.x * dt;
                f.mesh.rotation.y += f.rotSpeed.y * dt;
                f.mesh.rotation.z += f.rotSpeed.z * dt;

                // 落地后停在地面
                const fragGroundY = getGroundHeight(f.mesh.position.x, f.mesh.position.z) + 0.05;
                if (f.mesh.position.y < fragGroundY) {
                    f.mesh.position.y = fragGroundY;
                    f.vel.set(0, 0, 0);
                }

                // 渐隐
                const alpha = Math.max(0, f.life / FRAG_LIFE);
                f.mesh.material.opacity = alpha;
                f.mesh.material.transparent = alpha < 1;

                if (f.life <= 0) {
                    scene.remove(f.mesh);
                    f.mesh.geometry.dispose();
                    f.mesh.material.dispose();
                    fragments.splice(i, 1);
                }
            }

            // ── 炮口焰更新 ──
            for (let i = muzzleLights.length - 1; i >= 0; i--) {
                const ml = muzzleLights[i];
                ml.life -= dt;
                if (ml.light.isPointLight) {
                    ml.light.intensity = Math.max(0, ml.light.intensity * (1 - dt * 10));
                } else if (ml.light.isMesh) {
                    ml.light.scale.multiplyScalar(1 + dt * 8);
                    ml.light.material.opacity = Math.max(0, ml.life / 0.35);
                }
                if (ml.life <= 0) {
                    scene.remove(ml.light);
                    if (ml.light.geometry) ml.light.geometry.dispose();
                    if (ml.light.material) ml.light.material.dispose();
                    muzzleLights.splice(i, 1);
                }
            }

            // ── 装填计时器 + 进度条 ──
            if (player1 && player1.reloadTimer > 0) {
                player1.reloadTimer -= dt;
                if (player1.reloadTimer < 0) player1.reloadTimer = 0;
            }
            // 同步全局引用（向后兼容）
            reloadTimer = player1 ? player1.reloadTimer : 0;
            if (reloadBarGroup && reloadBarFill) {
                const rightX = Math.cos(tankState.yaw + Math.PI / 2);
                const rightZ = Math.sin(tankState.yaw + Math.PI / 2);
                reloadBarGroup.position.set(
                    tankState.x + rightX * 0.8,
                    groundY + 0.7,
                    tankState.z + rightZ * 0.8
                );
                reloadBarGroup.lookAt(camera.position);
                const progress = Math.max(0.01, 1 - reloadTimer / RELOAD_TIME);
                reloadBarFill.scale.y = progress;
                reloadBarFill.position.y = -0.36 + 0.33 * progress;
                reloadBarFill.material.color.setRGB(1, progress >= 1 ? 1 : 0, 0);
            }

            // 障碍物动态可见性 + 草丛距离剔除 + 风车叶片旋转
            if (visibilityTimer > 0.3) {
                updateObstacleVisibility();
                updateGrassVisibility();
                visibilityTimer = 0;
            }
            // 风车叶片持续旋转
            for (const od of obstacleData) {
                if (od.blades) {
                    od.blades.rotation.x += 1.5 * dt;
                }
            }
            // 河水流动 UV 动画
            if (scene === scene1) {
                const waterMesh = scene1.getObjectByName('riverWater');
                if (waterMesh && waterMesh.userData.waterMat && waterMesh.userData.waterMat.map) {
                    waterMesh.userData.waterMat.map.offset.y += 0.3 * dt;
                }
            }

            // 摄像机
            placeCamera();

            // 水面波动动画（池塘）
            if (waterPlane) {
                waterPlane.position.y = WATER_LEVEL + Math.sin(Date.now() * 0.002) * 0.08;
            }
            // 河流水面流动波动
            if (riverWater) {
                const rpos = riverWater.geometry.attributes.position;
                const t = Date.now() * 0.002;
                for (let i = 0; i < rpos.count; i++) {
                    rpos.setY(i, RIVER_WATER_LEVEL + Math.sin(rpos.getX(i) * 0.35 + t * 1.8) * 0.1);
                }
                rpos.needsUpdate = true;
            }
            // 影子
            const shadow = tankGroup.getObjectByName('shadow');
            if (shadow) { shadow.position.y = 0.02; }

            // ── 坦克损毁效果（血量 < 50 时显示火焰和烟雾） ──
            if (player1 && player1.damageEffects) {
                if (!player1.dead && player1.hp < 50) {
                    if (!player1.damageEffects.active) player1.damageEffects.show();
                    // 传入包含 y 坐标的位置对象
                    player1.damageEffects.update(dt, { x: player1.state.x, y: getGroundHeight(player1.state.x, player1.state.z), z: player1.state.z });
                } else {
                    if (player1.damageEffects.active) player1.damageEffects.hide();
                }
            }

            // ── 爆炸效果更新（坦克死亡时触发的大型火焰烟雾） ──
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update(dt);
                if (!explosions[i].active) {
                    explosions[i].dispose();
                    explosions.splice(i, 1);
                }
            }

            // FPS 统计
            fpsFrames++;
            fpsTime += dt;
            if (fpsTime >= 0.5) { fpsCurrent = Math.round(fpsFrames / fpsTime); fpsFrames = 0; fpsTime = 0; updateDebugInfo(); }

            renderer.render(scene, camera);
            } catch(e) { console.warn('gameLoop error:', e.message); }
            animationId = requestAnimationFrame(gameLoop);
        }

        // ==================== 摄像机 ====================
        // 摄像机始终锁定在坦克正后方（前进方向即视角正前方）
        // 摄像机参数（单人模式×0.5，双人模式×0.7）
        const CAMERA_BEHIND = 10;    // 摄像机在球后方距离（原7→10，更远视野）
        const CAMERA_ABOVE = 4.0;    // 摄像机在球上方高度（原3→4，压低天空比例）
        const CAMERA_BEHIND_VS = 12; // 双人模式后方距离（原10→12）
        const CAMERA_ABOVE_VS = 5.0;  // 双人模式上方高度（原4→5）
        const CAMERA_LOOK_Y = 1.0;      // lookAt 高度-单人模式（原1.5→1.0，降低视角）
        const CAMERA_LOOK_Y_VS = 1.5;    // lookAt 高度-双人模式（原2.0→1.5）

        function placeCamera() {
            const fx = Math.cos(tankState.yaw);
            const fz = Math.sin(tankState.yaw);
            const groundY = getGroundHeight(tankGroup.position.x, tankGroup.position.z);
            camera.position.set(
                tankGroup.position.x - fx * CAMERA_BEHIND,
                groundY + CAMERA_ABOVE,
                tankGroup.position.z - fz * CAMERA_BEHIND
            );
            camera.lookAt(tankGroup.position.x, groundY + CAMERA_LOOK_Y, tankGroup.position.z);
        }

        function getInputForPlayer(pNum) {
            let l=0,r=0;
            if (pNum===1) {
                if (keys['KeyW']) l=1; if (keys['KeyS']) l=-1;
                if (keys['ArrowUp']) r=1; if (keys['ArrowDown']) r=-1;
            } else {
                const gp=getGamepad();
                if (gp) { l=stickToTarget(-gp.axes[1]); r=stickToTarget(-gp.axes[3]); }
            }
            return {left:l, right:r};
        }

        function updatePlayerPhysics(p, dt, tL, tR) {
            if (p.dead) return;
            const mt=moveToward;
            if (tL!==0){const tg=tL*MAX_SPEED;const sd=Math.sign(tg)===Math.sign(p.currentLeftSpeed)||p.currentLeftSpeed===0;
                p.currentLeftSpeed=mt(p.currentLeftSpeed,tg,(sd?TRACK_ACCEL:TRACK_DECEL)*dt);}
            else p.currentLeftSpeed=mt(p.currentLeftSpeed,0,TRACK_COAST*dt);
            if (tR!==0){const tg=tR*MAX_SPEED;const sd=Math.sign(tg)===Math.sign(p.currentRightSpeed)||p.currentRightSpeed===0;
                p.currentRightSpeed=mt(p.currentRightSpeed,tg,(sd?TRACK_ACCEL:TRACK_DECEL)*dt);}
            else p.currentRightSpeed=mt(p.currentRightSpeed,0,TRACK_COAST*dt);
            const v=(p.currentLeftSpeed+p.currentRightSpeed)/2;
            const om=(p.currentLeftSpeed-p.currentRightSpeed)/TRACK_SPACING;
            p.state.yaw+=om*dt;
            const fx=Math.cos(p.state.yaw),fz=Math.sin(p.state.yaw);
            let nx=p.state.x+fx*v*dt,nz=p.state.z+fz*v*dt;
            for(let it=0;it<3;it++){const cr=checkCollision(nx,nz);if(cr.hit){nx+=cr.pushX;nz+=cr.pushZ;}else break;}
            if(gameMode==='versus'){const o=p===player1?player2:player1;
                if(o&&!o.dead){const tdx=nx-o.state.x,tdz=nz-o.state.z,td=Math.sqrt(tdx*tdx+tdz*tdz);
                    if(td<TANK_HALF_W*2){const pu=(TANK_HALF_W*2-td)/Math.max(td,.001);nx+=tdx*pu*.5;nz+=tdz*pu*.5;}}}
            const wm=TANK_HALF_W;
            p.state.x=Math.max(-WORLD_HALF+wm,Math.min(WORLD_HALF-wm,nx));
            p.state.z=Math.max(-WORLD_HALF+wm,Math.min(WORLD_HALF-wm,nz));
            // 池塘/河流空气墙 + 桥梁护栏（仅单人地图）
            if(!isVersusMap){
                if(isInPond(p.state.x,p.state.z)){
                    const ppx=p.state.x-POND_CX,ppz=p.state.z-POND_CZ;
                    const margin=TANK_HALF_W+0.3,erx=POND_RX+margin,erz=POND_RZ+margin;
                    const angle=Math.atan2(ppz/erz,ppx/erx);
                    p.state.x=POND_CX+erx*Math.cos(angle);
                    p.state.z=POND_CZ+erz*Math.sin(angle);
                }
                if(isInRiver(p.state.x,p.state.z)&&!isOnBridge(p.state.x)){
                    const rzc=riverCenterZ(p.state.x),rhw=riverHalfWidth(p.state.x)+TANK_HALF_W+0.3;
                    p.state.z=(p.state.z<rzc)?rzc-rhw:rzc+rhw;
                }
                if(isOnBridgeSurface(p.state.x,p.state.z)){
                    const b=_getBridge();const railLimit=b.halfW-0.25;
                    p.state.x=Math.max(-railLimit+TANK_HALF_W,Math.min(railLimit-TANK_HALF_W,p.state.x));
                }
            }
            const acc=(v-p.prevForwardSpeed)/Math.max(dt,.001);
            const pt=Math.max(-PITCH_MAX,Math.min(PITCH_MAX,acc*PITCH_GAIN));
            p.pitch+=(pt-p.pitch)*Math.min(PITCH_SMOOTH*dt,1);
            // 后坐力衰减
            if(p.recoilPitch!==0){p.recoilPitch+=(0-p.recoilPitch)*Math.min(RECOIL_DECAY*dt,1);if(Math.abs(p.recoilPitch)<.0005)p.recoilPitch=0;}
            const recoilP=p.recoilPitch||0;
            // 地形坡度俯仰
            const sd=1.0;
            const fh=getGroundHeight(p.state.x+fx*sd,p.state.z+fz*sd);
            const bh=getGroundHeight(p.state.x-fx*sd,p.state.z-fz*sd);
            const tPitch=Math.atan2(fh-bh,sd*2);
            // 地形坡度侧倾
            const trxDir=Math.cos(p.state.yaw+Math.PI/2);
            const trzDir=Math.sin(p.state.yaw+Math.PI/2);
            const tsd=1.5;
            const tlh=getGroundHeight(p.state.x-trxDir*tsd,p.state.z-trzDir*tsd);
            const trh=getGroundHeight(p.state.x+trxDir*tsd,p.state.z+trzDir*tsd);
            const tRoll=Math.atan2(trh-tlh,tsd*2);
            p.prevForwardSpeed=v;
            const pgY=getGroundHeight(p.state.x,p.state.z);
            p.group.position.set(p.state.x,pgY,p.state.z);
            p.group.rotation.set(-(p.pitch+tPitch+recoilP),Math.PI/2-p.state.yaw,-tRoll);
            const WR=.13;
            p.leftWheelAngle+=p.currentLeftSpeed*dt/WR;p.rightWheelAngle+=p.currentRightSpeed*dt/WR;
            p.leftWheels.forEach(w=>w.rotation.x=p.leftWheelAngle);
            p.rightWheels.forEach(w=>w.rotation.x=p.rightWheelAngle);
            if(p.reloadTimer>0){p.reloadTimer-=dt;if(p.reloadTimer<0)p.reloadTimer=0;}
        }

        function togglePlayerBars(p, visible) {

        function updateBarsForCamera(p, cam) {

                p.reloadBarGroup.position.set(p.state.x+rx*bo,by,p.state.z+rz*bo);p.reloadBarGroup.lookAt(cam.position);
                const pg=Math.max(.01,1-p.reloadTimer/RELOAD_TIME);
                p.reloadBarFill.scale.y=pg;p.reloadBarFill.position.y=-.36+.33*pg;
                p.reloadBarFill.material.color.setRGB(1,pg>=1?1:0,0);}
            if(p.hpBarGroup){const lx=Math.cos(p.state.yaw-Math.PI/2),lz=Math.sin(p.state.yaw-Math.PI/2);
                p.hpBarGroup.position.set(p.state.x+lx*bo,by,p.state.z+lz*bo);p.hpBarGroup.lookAt(cam.position);
                const hr=Math.max(.01,p.hp/p.maxHp);
                p.hpBarFill.scale.y=hr;p.hpBarFill.position.y=-.36+.33*hr;

        }

        // ==================== 指向箭头系统 ====================
        const ARROW_SHOW_DIST = 25; // 超过此距离显示箭头
        const ARROW_HIDE_DIST = 20; // 进入此距离隐藏箭头（滞后避免闪烁）

        function projectToScreen(worldPos, cam, vpW, vpH) {
            const v = worldPos.clone().project(cam);
            return {
                x: (v.x * 0.5 + 0.5) * vpW,
                y: (-v.y * 0.5 + 0.5) * vpH,
                behind: v.z > 1
            };
        }

        function updateArrows(dpr, halfW, rightW, fbH) {
            if (!player1 || !player2 || player1.dead || player2.dead) {
                arrowP1.style.display = 'none';
                arrowP2.style.display = 'none';
                return;
            }
            const dx = player1.state.x - player2.state.x;
            const dz = player1.state.z - player2.state.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            if (dist > ARROW_SHOW_DIST) {
                const p1wp = new THREE.Vector3(player1.state.x, 0.4, player1.state.z);
                const p2wp = new THREE.Vector3(player2.state.x, 0.4, player2.state.z);

                // === P1 箭头（投影到左半屏） ===
                const p1s = projectToScreen(p1wp, camera, halfW, fbH);
                let p2s = projectToScreen(p2wp, camera, halfW, fbH);
                let dsx = p2s.x - p1s.x, dsy = p2s.y - p1s.y;
                if (p2s.behind) {
                    // 目标在摄像机后方时投影坐标反转，需翻转方向并钳制位置
                    dsx = -(p2s.x - p1s.x);
                    dsy = -(p2s.y - p1s.y);
                    // 把箭头位置钳制到屏幕边缘
                    const cssW = halfW / dpr, cssH = fbH / dpr;
                    const arrowCssX = THREE.MathUtils.clamp(p1s.x / dpr, 20, cssW - 20);
                    const arrowCssY = THREE.MathUtils.clamp(p1s.y / dpr + 38, 60, cssH - 20);
                    arrowP1.style.left = arrowCssX + 'px';
                    arrowP1.style.top = arrowCssY + 'px';
                } else {
                    arrowP1.style.left = (p1s.x / dpr) + 'px';
                    arrowP1.style.top = (p1s.y / dpr + 38) + 'px';
                }
                const angle1 = Math.atan2(dsy, dsx);
                arrowP1.style.display = 'block';
                arrowP1.style.transform = `rotate(${angle1 * 180 / Math.PI - 90}deg)`;

                // === P2 箭头（投影到右半屏） ===
                let p1s2 = projectToScreen(p1wp, camera2, rightW, fbH);
                const p2s2 = projectToScreen(p2wp, camera2, rightW, fbH);
                let dsx2 = p1s2.x - p2s2.x, dsy2 = p1s2.y - p2s2.y;
                if (p1s2.behind) {
                    dsx2 = -(p1s2.x - p2s2.x);
                    dsy2 = -(p1s2.y - p2s2.y);
                    const cssW = rightW / dpr, cssH = fbH / dpr;
                    const arrowCssX = THREE.MathUtils.clamp((halfW + p2s2.x) / dpr, halfW/dpr + 20, halfW/dpr + cssW - 20);
                    const arrowCssY = THREE.MathUtils.clamp(p2s2.y / dpr + 38, 60, cssH - 20);
                    arrowP2.style.left = arrowCssX + 'px';
                    arrowP2.style.top = arrowCssY + 'px';
                } else {
                    arrowP2.style.left = ((halfW + p2s2.x) / dpr) + 'px';
                    arrowP2.style.top = (p2s2.y / dpr + 38) + 'px';
                }
                const angle2 = Math.atan2(dsy2, dsx2);
                arrowP2.style.display = 'block';
                arrowP2.style.transform = `rotate(${angle2 * 180 / Math.PI - 90}deg)`;
            } else if (dist < ARROW_HIDE_DIST) {
                arrowP1.style.display = 'none';
                arrowP2.style.display = 'none';
            }
        }

        function versusGameLoop() {
            // 先复位为全屏（清除上一帧的 scissor/viewport 残留）
            const dpr = renderer.getPixelRatio();
            const cssW = window.innerWidth, cssH = window.innerHeight;
            const fbW = cssW * dpr, fbH = cssH * dpr;
            renderer.setScissorTest(false);
            renderer.setViewport(0, 0, cssW, cssH);

            const dt=Math.min(clock.getDelta(),.1);visibilityTimer+=dt;
            const p1i=getInputForPlayer(1),p2i=getInputForPlayer(2);
            updatePlayerPhysics(player1,dt,p1i.left,p1i.right);updatePlayerPhysics(player2,dt,p2i.left,p2i.right);
            // 同步 tankState 到 player1（供 updateObstacleVisibility 主逻辑使用）
            tankState.x = player1.state.x; tankState.z = player1.state.z;
            updateEngineSound(Math.max(Math.abs(player1.currentLeftSpeed),Math.abs(player1.currentRightSpeed),Math.abs(player2.currentLeftSpeed),Math.abs(player2.currentRightSpeed)));
            const p1fire=keys['Space'];
            if(p1fire&&player1.fireReady){fireShell(player1);player1.fireReady=false;keys['Space']=false;}
            if(!p1fire)player1.fireReady=true;
            const gp=getGamepad();const p2fire=gp&&gp.buttons[7]&&gp.buttons[7].value>.3;
            if(p2fire&&player2.fireReady){fireShell(player2);player2.fireReady=false;}
            if(!p2fire)player2.fireReady=true;
            updateShellsFragsMuzzle(dt);
            if(visibilityTimer>.3){updateObstacleVisibility([player2.state]);updateGrassVisibility([player2.state]);visibilityTimer=0;}
            for(const od of obstacleData){if(od.blades)od.blades.rotation.x+=1.5*dt;}
            // 水面波动
            if(waterPlane)waterPlane.position.y=WATER_LEVEL+Math.sin(Date.now()*.002)*.08;
            // 河流水面流动波动
            if(riverWater){const rpos=riverWater.geometry.attributes.position;const t=Date.now()*.002;
                for(let i=0;i<rpos.count;i++)rpos.setY(i,RIVER_WATER_LEVEL+Math.sin(rpos.getX(i)*.35+t*1.8)*.1);
                rpos.needsUpdate=true;}
            // ── 坦克损毁效果（血量 < 50 时显示火焰和烟雾） ──
            for (const p of [player1, player2]) {
                if (p && p.damageEffects) {
                    if (!p.dead && p.hp < 50) {
                        if (!p.damageEffects.active) p.damageEffects.show();
                        // 传入包含 y 坐标的位置对象
                        p.damageEffects.update(dt, { x: p.state.x, y: getGroundHeight(p.state.x, p.state.z), z: p.state.z });
                    } else {
                        if (p.damageEffects.active) p.damageEffects.hide();
                    }
                }
            }
            // ── 爆炸效果更新（坦克死亡时触发的大型火焰烟雾） ──
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].update(dt);
                if (!explosions[i].active) {
                    explosions[i].dispose();
                    explosions.splice(i, 1);
                }
            }
            // 分屏尺寸
            const halfCssW = Math.floor(cssW / 2), rightCssW = cssW - halfCssW;
            const halfW = Math.floor(fbW / 2), rightW = fbW - halfW;
            splitLine.style.left = halfCssW + 'px';
            // 先全屏清空一次（scissor 关闭），然后两半屏叠加渲染
            renderer.setScissorTest(false);
            renderer.setViewport(0, 0, cssW, cssH);
            renderer.clear();
            renderer.autoClear = false;
            // 左半屏 (P1)
            togglePlayerBars(player1, true); togglePlayerBars(player2, false);
            renderer.setScissorTest(true);
            renderer.setViewport(0, 0, halfCssW, cssH); renderer.setScissor(0, 0, halfCssW, cssH);
            camera.aspect = halfCssW / cssH; camera.updateProjectionMatrix();
            placeCameraFor(player1, camera, true); updateBarsForCamera(player1, camera);
            renderer.render(scene, camera);
            // 右半屏 (P2)
            togglePlayerBars(player1, false); togglePlayerBars(player2, true);
            renderer.setViewport(halfCssW, 0, rightCssW, cssH); renderer.setScissor(halfCssW, 0, rightCssW, cssH);
            camera2.aspect = rightCssW / cssH; camera2.updateProjectionMatrix();
            placeCameraFor(player2, camera2, true); updateBarsForCamera(player2, camera2);
            renderer.render(scene, camera2);
            renderer.setScissorTest(false);
            renderer.autoClear = true;
            togglePlayerBars(player1, true); togglePlayerBars(player2, true);
            // 指向箭头（传入 framebuffer 坐标）
            updateArrows(dpr, halfW, rightW, fbH);
            updateDebugInfo();
            animationId=requestAnimationFrame(versusGameLoop);
        }

        function placeCameraFor(p,cam){const fx=Math.cos(p.state.yaw),fz=Math.sin(p.state.yaw);const gy=getGroundHeight(p.state.x,p.state.z);cam.position.set(p.state.x-fx*CAMERA_BEHIND_VS,gy+CAMERA_ABOVE_VS,p.state.z-fz*CAMERA_BEHIND_VS);cam.lookAt(p.state.x,gy+CAMERA_LOOK_Y_VS,p.state.z);}

        function updateShellsFragsMuzzle(dt) {
            for(let i=shells.length-1;i>=0;i--){const s=shells[i];
                const prevPos=s.prevPos||s.mesh.position.clone();
                s.vel.y-=SHELL_GRAVITY*dt;
                s.mesh.position.x+=s.vel.x*dt;s.mesh.position.y+=s.vel.y*dt;s.mesh.position.z+=s.vel.z*dt;
                s.prevPos=s.mesh.position.clone();
                if(s.vel.lengthSq()>.01)s.mesh.lookAt(s.mesh.position.clone().add(s.vel));
                if(s.tracerLight)s.tracerLight.position.copy(s.mesh.position);
                if(s.glowTail){const vd=s.vel.clone().normalize();s.glowTail.position.copy(s.mesh.position).addScaledVector(vd,-0.18);}
                let hit=false;const sR=.18, mv=new THREE.Vector3().subVectors(s.mesh.position,prevPos), mvL=mv.length();
                for(let j=obstacleMeshes.length-1;j>=0;j--){const obs=obstacleMeshes[j];if(!obs.visible)continue;
                    const od2=obstacleData[j];const oR=od2.radius||.55, cR=sR+oR, oT=od2.height||1.5;
                    // 垂直方向快速剔除（仅上方优化，不剔除下方）
                    const prevY=prevPos.y,currY=s.mesh.position.y,oTL=obs.position.y+oT+.3;
                    if(currY>oTL&&prevY>oTL)continue;
                    // 水平扫掠检测
                    let hh=false;
                    if(mvL<.0001){const dx=s.mesh.position.x-obs.position.x,dz=s.mesh.position.z-obs.position.z;hh=dx*dx+dz*dz<cR*cR;}
                    else{const ox=obs.position.x,oz=obs.position.z;const px=prevPos.x,pz=prevPos.z;
                        const vx=s.mesh.position.x-px,vz=s.mesh.position.z-pz;
                        const dx0=px-ox,dz0=pz-oz;const a=vx*vx+vz*vz,b=2*(dx0*vx+dz0*vz),c=dx0*dx0+dz0*dz0-cR*cR;
                        const disc=b*b-4*a*c;if(disc>=0){const sq=Math.sqrt(disc),t1=(-b-sq)/(2*a),t2=(-b+sq)/(2*a);
                            if((t1>=0&&t1<=1)||(t2>=0&&t2<=1)||(t1<0&&t2>1))hh=true;}}
                    if(hh){const op=obs.position.clone();op.y+=oT/2;spawnFragments(op,od2.color);playExplosionSound();
                        if(obs.parent){obs.parent.remove(obs);obs.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});}
                        obstacleMeshes.splice(j,1);obstacleData.splice(j,1);hit=true;break;}}
                if(!hit&&gameMode==='versus'&&s.owner){const en=s.owner===player1?player2:player1;
                    if(en&&!en.dead){const edx=s.mesh.position.x-en.state.x,edz=s.mesh.position.z-en.state.z;
                        if(Math.sqrt(edx*edx+edz*edz)<TANK_HALF_W+.2&&s.mesh.position.y<1.){en.hp-=SHELL_DAMAGE;if(en.hp<0)en.hp=0;hit=true;
                            if(en.hp<=0){en.dead=true;const ep=en.group.position.clone();ep.y+=.5;
                                spawnFragments(ep,en.camoColor==='desert'?'#8b7d4a':'#4a5c2e');playExplosionSound();en.group.visible=false;
                                if(en.damageEffects)en.damageEffects.hide();
                                // 坦克死亡：触发大型爆炸火焰烟雾效果 + 殉爆检查
                                spawnExplosion(ep);
                                setTimeout(()=>showVersusResult(s.owner),2000);}
                            else{spawnHitSparks(s.mesh.position.clone());}}}}
                const ref=s.owner||{state:tankState};const rx=ref.state?ref.state.x:tankState.x,rz=ref.state?ref.state.z:tankState.z;
                const sgy=getGroundHeight(s.mesh.position.x,s.mesh.position.z);
                if(hit||s.mesh.position.y<sgy||Math.sqrt((s.mesh.position.x-rx)**2+(s.mesh.position.z-rz)**2)>SHELL_MAX_DIST||Math.abs(s.mesh.position.x)>WORLD_HALF+50||Math.abs(s.mesh.position.z)>WORLD_HALF+50)
                {scene.remove(s.mesh);disposeShellMesh(s.mesh);if(s.tracerLight){scene.remove(s.tracerLight);}if(s.glowTail){scene.remove(s.glowTail);s.glowTail.geometry.dispose();s.glowTail.material.dispose();}shells.splice(i,1);}}
            for(let i=fragments.length-1;i>=0;i--){const f=fragments[i];f.life-=dt;f.vel.y-=SHELL_GRAVITY*dt;
                f.mesh.position.x+=f.vel.x*dt;f.mesh.position.y+=f.vel.y*dt;f.mesh.position.z+=f.vel.z*dt;
                f.mesh.rotation.x+=f.rotSpeed.x*dt;f.mesh.rotation.y+=f.rotSpeed.y*dt;f.mesh.rotation.z+=f.rotSpeed.z*dt;
                const fgy=getGroundHeight(f.mesh.position.x,f.mesh.position.z)+.05;
                if(f.mesh.position.y<fgy){f.mesh.position.y=fgy;f.vel.set(0,0,0);}
                f.mesh.material.opacity=Math.max(0,f.life/FRAG_LIFE);f.mesh.material.transparent=f.life/FRAG_LIFE<1;
                if(f.life<=0){scene.remove(f.mesh);f.mesh.geometry.dispose();f.mesh.material.dispose();fragments.splice(i,1);}}
            for(let i=muzzleLights.length-1;i>=0;i--){const ml=muzzleLights[i];ml.life-=dt;
                if(ml.light.isPointLight)ml.light.intensity=Math.max(0,ml.light.intensity*(1-dt*10));
                else if(ml.light.isMesh){ml.light.scale.multiplyScalar(1+dt*8);ml.light.material.opacity=Math.max(0,ml.life/.35);}
                if(ml.life<=0){scene.remove(ml.light);if(ml.light.geometry)ml.light.geometry.dispose();if(ml.light.material)ml.light.material.dispose();muzzleLights.splice(i,1);}}
        }

        function updateDebugInfo() {

            if (grassInstances.length > 0 && grassTriCount === 0) {
                grassTriCount = grassInstances.reduce((sum, im) => {
                    const geo = im.geometry;
                    if (geo.index) return sum + geo.index.count / 3 * im.count;
                    return sum + (geo.attributes.position.count / 3) * im.count;
                }, 0);
            }

            const mapName = currentMapData ? currentMapData.name : '-';
            const grassInfo = grassInstances.length > 0
                ? ' | 草丛:' + grassInstances.length + 'DC/' + (grassTriCount/1000).toFixed(0) + 'kΔ'
                : '';
            el.textContent =
                'v0.22.1  ' + mapName + '  FPS:' + fpsCurrent +
                '\n草丛实例:' + grassInstances.reduce((s, im) => s + im.count, 0) + '簇' + grassInfo;
        }

            if (previewModel && previewModel.parent) {
                previewModel.parent.remove(previewModel);
                previewModel.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                });
            }
            previewModel = null;

            // GLB 模型分支
            if (m.cat === 'glb') {
                const glbPath = m.name === 't34-yellow'
                    ? 'models/glb/t34-85_textured_yellow.glb'
                    : 'models/glb/t34-85_textured.glb';

                const loader = new THREE.GLTFLoader();
                loader.load(glbPath, (gltf) => {
                    const model = gltf.scene;
                    const bbox = new THREE.Box3().setFromObject(model);
                    const sz = new THREE.Vector3(); bbox.getSize(sz);
                    const targetH = 3.5;
                    const s = targetH / Math.max(sz.x, sz.y, sz.z);
                    model.scale.setScalar(s);
                    const center = new THREE.Vector3(); bbox.getCenter(center);
                    model.position.set(-center.x * s, -bbox.min.y * s, -center.z * s);
                    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
                    previewModel = model;
                    previewScene.add(model);
                    previewLabel.textContent = '拖拽鼠标旋转模型 | 滚轮缩放 | 当前: GLB ' + m.name;
                }, undefined, (err) => {
                    console.warn('预览GLB加载失败:', err.message);
                    previewLabel.textContent = 'GLB 模型加载失败';
                });
                return;
            }

            // 程序化模型分支
            const fn = window.ModelRegistry.getModel(m.cat, m.name);
            if (!fn) return;

            const detectedCamo = m.name.includes('desert') ? 'desert' : 'green';
            previewModel = fn({ camoColor: detectedCamo });
            previewScene.add(previewModel);
            previewLabel.textContent = '拖拽鼠标旋转模型 | 滚轮缩放 | 当前: ' + m.cat + '/' + m.name;
        }

        function updatePreviewCamera() {
            const x = previewRadius * Math.sin(previewPhi) * Math.cos(previewTheta);
            const y = previewRadius * Math.cos(previewPhi);
            const z = previewRadius * Math.sin(previewPhi) * Math.sin(previewTheta);
            previewCamera.position.set(x, y, z);
            previewCamera.lookAt(0, 1, 0);
        }

        function onPreviewMouseDown(e) {
            previewIsDragging = true;
            previewPrevMouse.x = e.clientX;
            previewPrevMouse.y = e.clientY;
        }

        function onPreviewMouseMove(e) {
            if (!previewIsDragging) return;
            const dx = e.clientX - previewPrevMouse.x;
            const dy = e.clientY - previewPrevMouse.y;
            previewTheta -= dx * PREVIEW_ROTATE_SPEED;
            previewPhi -= dy * PREVIEW_ROTATE_SPEED;
            previewPhi = Math.max(0.1, Math.min(Math.PI - 0.1, previewPhi));
            previewPrevMouse.x = e.clientX;
            previewPrevMouse.y = e.clientY;
        }

        function onPreviewMouseUp(e) {
            previewIsDragging = false;
        }

        function onPreviewWheel(e) {
            e.preventDefault();
            previewRadius += e.deltaY * PREVIEW_ZOOM_SPEED * 0.01;
            previewRadius = Math.max(PREVIEW_MIN_RADIUS, Math.min(PREVIEW_MAX_RADIUS, previewRadius));
        }

        function exitPreviewMode() {
            if (previewAnimId) { cancelAnimationFrame(previewAnimId); previewAnimId = null; }
            if (previewRenderer && previewRenderer.domElement) {
                previewRenderer.domElement.removeEventListener('mousedown', onPreviewMouseDown);
                previewRenderer.domElement.removeEventListener('wheel', onPreviewWheel);
            }
            window.removeEventListener('mousemove', onPreviewMouseMove);
            window.removeEventListener('mouseup', onPreviewMouseUp);
            if (previewModel && previewModel.parent) {
                previewModel.parent.remove(previewModel);
                previewModel.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                });
                previewModel = null;
            }
            if (previewRenderer) {
                if (previewRenderer.domElement && previewRenderer.domElement.parentNode) {
                    previewRenderer.domElement.parentNode.removeChild(previewRenderer.domElement);
                }
                previewRenderer.dispose(); previewRenderer = null;
            }
            previewContainer.classList.remove('active');
            menuOverlay.classList.remove('hidden');
        }

        // ==================== 事件绑定 ====================
        btnEnter.addEventListener('click',showMapSelector);btnVersus.addEventListener('click',enterVersusMode);
        btnPreview.addEventListener('click', enterPreviewMode);
        btnExit.addEventListener('click',exitGame);btnBack.addEventListener('click',returnToMenu);
        btnPreviewBack.addEventListener('click', exitPreviewMode);
        btnStartGame.addEventListener('click', enterGame);
        btnCancelMap.addEventListener('click', hideMapSelector);
        window.addEventListener('resize',()=>{
            // 游戏渲染器
            if(camera&&renderer){
                const cssW=window.innerWidth, cssH=window.innerHeight;
                renderer.setSize(cssW, cssH);
                if(gameMode==='versus'){
                    camera.aspect=0.5*cssW/cssH; camera.updateProjectionMatrix();
                    if(camera2){camera2.aspect=0.5*cssW/cssH; camera2.updateProjectionMatrix();}}
                else{camera.aspect=cssW/cssH; camera.updateProjectionMatrix();}
            }
            // 预览渲染器
            if (previewRenderer && previewCamera) {
                previewRenderer.setSize(window.innerWidth, window.innerHeight);
                previewCamera.aspect = window.innerWidth / window.innerHeight;
                previewCamera.updateProjectionMatrix();
            }
        });

        // ==================== 初始化 ====================
        loadMapConfig('test_map_01a'); // 默认加载单人地图
        initScene();placeCamera();renderer.render(scene,camera);
        console.log('🎮 坦克运动demo v0.22.1 | 炮弹外形(圆柱+锥头) | 天空穹顶+远山 | 蓝灰雾色');

        // ==================== FBX 模型诊断（仅在 FBXLoader 可用时运行）====================
        if (typeof THREE.FBXLoader !== 'undefined') {
            console.log('🔬 开始加载 FBX 模型以检查层级结构...');
            const fbxLoader = new THREE.FBXLoader();
            fbxLoader.load('models/fbx/t34-85_textured.fbx', function(fbxGroup) {
                console.log('✅ FBX 加载成功！层级结构如下：');
                fbxGroup.name = 'fbx-root';
                function printHierarchy(obj, depth) {
                    const indent = '  '.repeat(depth);
                    const name = obj.name || '[unnamed]';
                    const type = obj.type || 'unknown';
                    const pos = obj.position ? `pos=(${obj.position.x.toFixed(2)},${obj.position.y.toFixed(2)},${obj.position.z.toFixed(2)})` : '';
                    const children = obj.children ? obj.children.length : 0;
                    const meshInfo = obj.isMesh ? ` geo=${obj.geometry?.type||'?'} verts=${obj.geometry?.attributes?.position?.count||0}` : '';
                    console.log(`${indent}├─ "${name}" [${type}] ${pos} children=${children}${meshInfo}`);
                    if (obj.children) {
                        for (const child of obj.children) {
                            printHierarchy(child, depth + 1);
                        }
                    }
                }
                printHierarchy(fbxGroup, 0);
                const bbox = new THREE.Box3().setFromObject(fbxGroup);
                const size = new THREE.Vector3(); bbox.getSize(size);
                console.log(`📦 FBX 包围盒: min=(${bbox.min.x.toFixed(2)},${bbox.min.y.toFixed(2)},${bbox.min.z.toFixed(2)}) max=(${bbox.max.x.toFixed(2)},${bbox.max.y.toFixed(2)},${bbox.max.z.toFixed(2)})`);
                console.log(`📐 FBX 尺寸: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`);
                const meshes = [];
                fbxGroup.traverse(c => { if (c.isMesh && c.name) meshes.push(c.name); });
                console.log(`🎯 FBX 命名网格列表 (${meshes.length}个): ${meshes.join(', ')}`);
                console.log('🔬 FBX 诊断完成，请将以上层级信息贴给我');
            }, function(progress) {
                if (progress.total) console.log(`📥 FBX 加载进度: ${Math.round(progress.loaded/progress.total*100)}%`);
            }, function(err) {
                console.error('❌ FBX 加载失败:', err);
            });
        } else {
            console.log('⚠️ THREE.FBXLoader 不可用（CDN 可能被 Edge 追踪防护拦截），跳过 FBX 诊断');
        }
    </script>
</body>
</html>
